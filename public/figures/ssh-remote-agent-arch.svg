<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="'DM Sans Variable','PingFang SC','Microsoft YaHei',sans-serif">
  <title>远程 GPU 开发与 CLI AI 代理的三种部署架构</title>
  <desc>对比代理直接运行在远程 GPU 服务器、代理在本地配合文件同步、以及远程启动 Headless HTTP 服务供多端接入三种模式。</desc>
  <defs>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#57575e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-sa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#2f5268" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="258" rx="12" fill="#faf9f6" stroke="#e4e2db" stroke-width="1"/>

  <!-- Column headers -->
  <text x="28" y="34" font-size="12.5" font-weight="600" fill="#2f5268">模式 A · 代理在远程</text>
  <text x="292" y="34" font-size="12.5" font-weight="600" fill="#18181b">模式 B · 代理在本地</text>
  <text x="556" y="34" font-size="12.5" font-weight="600" fill="#18181b">模式 C · 远程服务共享</text>

  <line x1="268" y1="24" x2="268" y2="232" stroke="#e4e2db" stroke-width="1"/>
  <line x1="532" y1="24" x2="532" y2="232" stroke="#e4e2db" stroke-width="1"/>

  <!-- Mode A: Local SSH -> Remote GPU (Agent + Code + API) -->
  <rect x="28" y="64" width="66" height="44" rx="6" fill="#ffffff" stroke="#d4d1c8" stroke-width="1.2"/>
  <text x="40" y="90" font-size="10.5" fill="#18181b">本地终端</text>
  <path d="M 94 86 L 122 86" fill="none" stroke="#2f5268" stroke-width="1.6" marker-end="url(#arr-sa)" marker-start="url(#arr-sa)"/>
  <text x="96" y="76" font-size="9.5" fill="#2f5268">SSH</text>

  <rect x="124" y="54" width="122" height="118" rx="8" fill="#eaf0f4" stroke="#2f5268" stroke-width="1.5"/>
  <text x="136" y="74" font-size="10.5" font-weight="600" fill="#2f5268">远程 GPU</text>
  <text x="136" y="98" font-size="9.5" fill="#18181b">CLI AI 代理</text>
  <text x="136" y="118" font-size="9.5" fill="#18181b">项目代码与环境</text>
  <text x="136" y="138" font-size="9.5" fill="#18181b">MCP + LLM API</text>
  <text x="28" y="198" font-size="9.5" font-weight="600" fill="#2f5268">默认推荐：环境零偏差</text>
  <text x="28" y="214" font-size="9.5" fill="#57575e">依赖与执行都在服务器完成</text>

  <!-- Mode B: Local (Agent + Editor) <-> rsync/sshfs <-> Remote GPU -->
  <rect x="292" y="54" width="104" height="118" rx="8" fill="#ffffff" stroke="#d4d1c8" stroke-width="1.2"/>
  <text x="304" y="74" font-size="10.5" font-weight="600" fill="#18181b">本地主机</text>
  <text x="304" y="98" font-size="9.5" fill="#18181b">编辑器 + 代理</text>
  <text x="304" y="118" font-size="9.5" fill="#18181b">LLM API 调用</text>
  <path d="M 396 106 L 424 106" fill="none" stroke="#57575e" stroke-width="1.4" marker-end="url(#arr-s)" marker-start="url(#arr-s)"/>
  <text x="394" y="94" font-size="9.5" fill="#57575e">同步</text>

  <rect x="426" y="64" width="84" height="90" rx="6" fill="#f4f3ef" stroke="#d4d1c8" stroke-width="1.2"/>
  <text x="438" y="92" font-size="10.5" font-weight="600" fill="#18181b">远程 GPU</text>
  <text x="438" y="116" font-size="9.5" fill="#57575e">代码 + 跑实验</text>
  <text x="292" y="198" font-size="9.5" fill="#18181b">适用：服务器无公网</text>
  <text x="292" y="214" font-size="9.5" fill="#57575e">代理快但需留心文件一致</text>

  <!-- Mode C: Headless server <- HTTP/Tunnel <- Multi clients -->
  <rect x="556" y="60" width="96" height="104" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="1.3"/>
  <text x="568" y="82" font-size="10.5" font-weight="600" fill="#18181b">服务节点</text>
  <text x="568" y="104" font-size="9.5" font-family="'JetBrains Mono Variable',monospace" fill="#2f5268">serve</text>
  <text x="568" y="122" font-size="9.5" font-family="'JetBrains Mono Variable',monospace" fill="#57575e">:4096</text>

  <path d="M 692 78 L 654 78" fill="none" stroke="#57575e" stroke-width="1.3" marker-end="url(#arr-s)"/>
  <path d="M 692 112 L 654 112" fill="none" stroke="#57575e" stroke-width="1.3" marker-end="url(#arr-s)"/>
  <path d="M 692 146 L 654 146" fill="none" stroke="#57575e" stroke-width="1.3" marker-end="url(#arr-s)"/>

  <text x="698" y="82" font-size="9.5" fill="#18181b">IDE 插件</text>
  <text x="698" y="116" font-size="9.5" fill="#18181b">终端 attach</text>
  <text x="698" y="150" font-size="9.5" fill="#18181b">CI 脚本</text>
  <text x="556" y="198" font-size="9.5" fill="#18181b">适用：多人协同复用会话</text>
  <text x="556" y="214" font-size="9.5" fill="#57575e">走 SSH 隧道隔离外部访问</text>
</svg>
