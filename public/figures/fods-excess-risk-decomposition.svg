<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="'DM Sans Variable','PingFang SC','Microsoft YaHei',sans-serif">
  <title>超额风险的几何三项分解</title>
  <desc>整个矩形为全可测函数空间，椭圆区域为限定模型类 F；全局最优 f* 在类外，类内最优 f_bar、经验风险最小元 f_hat 与算法输出 f_A 构成逼近、统计与优化三项误差。</desc>
  <defs>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#57575e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#2f5268" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="278" rx="12" fill="#faf9f6" stroke="#e4e2db" stroke-width="1"/>

  <text x="28" y="34" font-size="12.5" font-weight="600" fill="#18181b">函数空间中的三项超额风险</text>

  <!-- Hypothesis class F (smooth blob/ellipse on left-center) -->
  <path d="M 96 150 C 96 86, 176 58, 300 58 C 414 58, 480 96, 480 156 C 480 218, 404 246, 286 246 C 174 246, 96 212, 96 150 Z" fill="#ffffff" stroke="#2f5268" stroke-width="1.5"/>
  <text x="122" y="96" font-size="10.5" font-weight="600" fill="#2f5268">函数类 F</text>
  <text x="536" y="70" font-size="10.5" fill="#57575e">全部可测函数</text>

  <!-- f* outside F -->
  <circle cx="624" cy="148" r="5.5" fill="#18181b"/>
  <text x="636" y="144" font-size="10.5" font-weight="600" fill="#18181b">f*（贝叶斯最优）</text>
  <text x="636" y="160" font-size="9.5" fill="#57575e">全局风险下界 L(f*)</text>

  <!-- f_bar on boundary of F (closest to f*) -->
  <circle cx="478" cy="148" r="5.5" fill="#2f5268"/>
  <text x="412" y="132" font-size="10.5" font-weight="600" fill="#2f5268">f̄（F 中最优）</text>

  <!-- f_hat (ERM) inside F -->
  <circle cx="314" cy="116" r="5" fill="#18181b"/>
  <text x="292" y="102" font-size="10.5" font-weight="600" fill="#18181b">f̂（经验风险最小）</text>

  <!-- f_A (Algorithm output) inside F -->
  <circle cx="204" cy="192" r="5.5" fill="#18181b"/>
  <text x="150" y="214" font-size="10.5" font-weight="600" fill="#18181b">f_A（算法输出）</text>

  <!-- Leg 1: Approximation error f* -> f_bar -->
  <path d="M 616 148 L 486 148" fill="none" stroke="#2f5268" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-b)"/>
  <text x="514" y="138" font-size="10.5" font-weight="600" fill="#2f5268">逼近误差 E_app</text>
  <text x="514" y="166" font-size="9.5" fill="#57575e">模型容量限制</text>

  <!-- Leg 2: Estimation / Statistical error f_bar <-> f_hat -->
  <path d="M 472 146 L 322 118" fill="none" stroke="#57575e" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="372" y="156" font-size="10.5" fill="#18181b">统计误差 E_gen</text>
  <text x="372" y="172" font-size="9.5" fill="#57575e">有限样本偏差</text>

  <!-- Leg 3: Optimization error f_hat -> f_A -->
  <path d="M 308 122 L 211 187" fill="none" stroke="#57575e" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="164" y="146" font-size="10.5" fill="#18181b">优化误差 E_opt</text>
  <text x="164" y="162" font-size="9.5" fill="#57575e">数值求解未收敛到底</text>
</svg>
