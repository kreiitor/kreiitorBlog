<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="'DM Sans Variable','PingFang SC','Microsoft YaHei',sans-serif">
  <title>超额风险的几何三项分解</title>
  <desc>整个矩形为全可测函数空间，椭圆区域为限定模型类 F；全局最优 f* 在类外，类内最优 f_bar、经验风险最小元 f_hat 与算法输出 f_A 构成逼近、统计与优化三项误差。</desc>
  <defs>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#57575e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#2f5268" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="278" rx="12" fill="#faf9f6" stroke="#e4e2db" stroke-width="1"/>

  <text x="28" y="34" font-size="12.5" font-weight="600" fill="#18181b">函数空间中的三项超额风险</text>

  <!-- Hypothesis class F (smooth ellipse shifted cleanly left-center) -->
  <path d="M 80 156 C 80 90, 168 58, 294 58 C 414 58, 480 98, 480 158 C 480 220, 404 248, 282 248 C 166 248, 80 218, 80 156 Z" fill="#ffffff" stroke="#2f5268" stroke-width="1.5"/>
  <text x="116" y="110" font-size="10.5" font-weight="600" fill="#2f5268">函数类 F</text>
  <text x="536" y="70" font-size="10.5" fill="#57575e">全部可测函数</text>

  <!-- f* outside F -->
  <circle cx="628" cy="158" r="5.5" fill="#18181b"/>
  <text x="642" y="154" font-size="10.5" font-weight="600" fill="#18181b">f*（贝叶斯最优）</text>
  <text x="642" y="170" font-size="9.5" fill="#57575e">全局风险下界 L(f*)</text>

  <!-- f_bar on boundary of F -->
  <circle cx="480" cy="158" r="5.5" fill="#2f5268"/>
  <text x="502" y="186" font-size="10.5" font-weight="600" fill="#2f5268">f̄（F 中最优）</text>

  <!-- f_hat (ERM) high inside F -->
  <circle cx="316" cy="100" r="5" fill="#18181b"/>
  <text x="292" y="84" font-size="10.5" font-weight="600" fill="#18181b">f̂（经验风险最小）</text>

  <!-- f_A (Algorithm output) bottom-left inside F -->
  <circle cx="236" cy="206" r="5.5" fill="#18181b"/>
  <text x="192" y="226" font-size="10.5" font-weight="600" fill="#18181b">f_A（算法输出）</text>

  <!-- Leg 1: Approximation error f* -> f_bar -->
  <path d="M 620 158 L 488 158" fill="none" stroke="#2f5268" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-b)"/>
  <text x="518" y="144" font-size="10.5" font-weight="600" fill="#2f5268">逼近误差 E_app</text>
  <text x="518" y="174" font-size="9.5" fill="#57575e">模型容量边界限制</text>

  <!-- Leg 2: Estimation / Statistical error f_bar -> f_hat -->
  <path d="M 474 156 L 324 103" fill="none" stroke="#57575e" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="368" y="160" font-size="10.5" fill="#18181b">统计误差 E_gen</text>
  <text x="368" y="176" font-size="9.5" fill="#57575e">有限样本偏差</text>

  <!-- Leg 3: Optimization error f_hat -> f_A (label placed completely clear to the LEFT) -->
  <path d="M 310 106 L 242 199" fill="none" stroke="#57575e" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="116" y="154" font-size="10.5" fill="#18181b">优化误差 E_opt</text>
  <text x="116" y="170" font-size="9.5" fill="#57575e">数值求解未收敛到底</text>
</svg>
