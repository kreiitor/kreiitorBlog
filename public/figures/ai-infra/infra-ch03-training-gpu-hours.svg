<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">训练用量的 A100 等效小时</title>
  <desc id="fig-desc">八根柱依次为 Llama 1 6.7B 0.08、Llama 1 65B 1.02、Llama 2 7B 0.18、Llama 2 70B 1.72、Llama 3.1 8B 4.63、Llama 3.1 70B 22.20、Llama 3.1 405B 97.80、DeepSeek-V3 预训练 8.45 百万 A100 等效 GPU 小时</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">训练用量的 A100 等效小时</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">统一折算后比较公开训练投入</text><line x1="74" y1="350.1768785175383" x2="750" y2="350.1768785175383" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="354.1768785175383" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0.1</text><line x1="74" y1="269.4512523450255" x2="750" y2="269.4512523450255" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="273.4512523450255" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">1</text><line x1="74" y1="188.7256261725128" x2="750" y2="188.7256261725128" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="192.7256261725128" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">100</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">模型与阶段</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">A100 等效百万 GPU 小时</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">训练用量</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">DeepSeek-V3 只计预训练阶段；折算假定各设备利用率相近，不表示效率或成本差异。</text>
</svg>