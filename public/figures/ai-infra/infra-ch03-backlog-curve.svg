<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">积压与排空曲线</title>
  <desc id="fig-desc">折线从 0 秒的 0 步线性升到 60 秒的约 112,792 步，维持到 120 秒，随后按处理率下降，在约 140.17 秒回到 0</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="268.7142857142857" x2="750" y2="268.7142857142857" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="272.7142857142857" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">50000</text><line x1="74" y1="179.42857142857142" x2="750" y2="179.42857142857142" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="183.42857142857142" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">100000</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">140000</text><polyline points="74,358 299.33333333333337,156.5857142857143 524.6666666666667,156.5857142857143 750,358" fill="none" stroke="var(--blue)" stroke-width="2.4"/><circle cx="74" cy="358" r="3.2" fill="var(--blue)"/><circle cx="299.33333333333337" cy="156.5857142857143" r="3.2" fill="var(--blue)"/><circle cx="524.6666666666667" cy="156.5857142857143" r="3.2" fill="var(--blue)"/><circle cx="750" cy="358" r="3.2" fill="var(--blue)"/><text x="74" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">0</text><text x="299.33333333333337" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">60</text><text x="524.6666666666667" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">120</text><text x="750" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">140.17</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">从开始到达计时 / s</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">待处理 decode 步</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">积压</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">纵轴为待处理 decode 步；处理率取两张 RTX PRO 6000 合计约 5,591 步/s。</text>
</svg>