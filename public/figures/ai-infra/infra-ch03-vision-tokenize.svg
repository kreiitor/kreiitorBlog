<svg xmlns="http://www.w3.org/2000/svg" width="800" height="368" viewBox="0 76 800 368" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">图像变成视觉 token</title>
  <desc id="fig-desc">流程从 640 × 640 像素图像开始，按 16 × 16 切成 40 × 40 个块，再合并相邻 2 × 2 块，得到 20 × 20 个视觉 token</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="45" y="104.5" width="153.5" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="121.75" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">图像</text>
  <text x="121.75" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">640 × 640 像素</text><rect x="230.5" y="104.5" width="153.5" height="112" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="307.25" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">切块</text>
  <text x="307.25" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">16 × 16 像素一块</text><rect x="416" y="104.5" width="153.5" height="112" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="492.75" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">块网格</text>
  <text x="492.75" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">40 × 40 个块</text><rect x="601.5" y="104.5" width="153.5" height="112" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="678.25" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">合并</text>
  <text x="678.25" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">相邻 2 × 2 块</text><rect x="45" y="267.5" width="153.5" height="112" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="121.75" y="320.25" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">视觉 token</text>
  <text x="121.75" y="336.5" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">20 × 20 个</text><path d="M198.5 160.5 L230.5 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 160.5 L416 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M569.5 160.5 L601.5 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M678.25 216.5 L678.25 242 L121.75 242 L121.75 267.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">640 × 640 = 409,600 像素；每个视觉 token 对应 1,024 个像素。</text>
</svg>