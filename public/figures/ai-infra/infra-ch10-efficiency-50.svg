<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">50% 效率所需卡数</title>
  <desc id="fig-desc">柱状图：4090、A100、H100、B200 的计算需求分别为 25、14、5、2 张；橙色菱形表示显存约束的卡数下限</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">50% 效率所需卡数</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">三档效率中计算需求最低的一组</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="258" x2="750" y2="258" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="262" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="158" x2="750" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="162" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">40</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">50</text><rect x="123.5" y="233" width="68" height="125" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="158.5" y="227" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">25</text><text x="158.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">4090</text><rect x="292.5" y="288" width="68" height="70" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="327.5" y="282" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">14</text><text x="327.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">A100</text><rect x="461.5" y="333" width="68" height="25" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="496.5" y="327" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">5</text><text x="496.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">H100</text><rect x="630.5" y="348" width="68" height="10" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="665.5" y="342" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">2</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">B200</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">加速器型号</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">所需加速器数 / 张</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">计算需求</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">各下限均以卡数计量；容量项是显存约束要求的最少卡数。</text>
</svg>