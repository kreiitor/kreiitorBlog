<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">主机内存到显存的搬移路径</title>
  <desc id="fig-desc">主机侧普通内存经主机内复制进入锁页缓冲，再经 H2D 进入显存输入缓冲；权重与输入缓冲送入 GPU kernel，输出经 D2H 回到主机结果缓冲</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">主机内存到显存的搬移路径</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">数据先进入锁页缓冲，复制引擎才能直接搬移</text><rect x="47.66666666666667" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="130.08333333333334" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">普通内存</text>
  <text x="152.66666666666669" y="146.33333333333334" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">页面可被换出</text><rect x="295.00000000000006" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="130.08333333333334" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">锁页缓冲</text>
  <text x="400.00000000000006" y="146.33333333333334" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">驻留，可直接搬移</text><rect x="542.3333333333334" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="130.08333333333334" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">权重</text>
  <text x="647.3333333333334" y="146.33333333333334" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">加载一次，长期驻留</text><rect x="47.66666666666667" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="238.75000000000003" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">输入缓冲</text>
  <text x="152.66666666666669" y="255.00000000000003" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">显存</text><rect x="295.00000000000006" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="238.75000000000003" font-size="13" fill="var(--on-blue)" font-weight="700" text-anchor="middle">kernel</text>
  <text x="400.00000000000006" y="255.00000000000003" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">读输入与权重，写出输出</text><rect x="542.3333333333334" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="238.75000000000003" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">输出</text>
  <text x="647.3333333333334" y="255.00000000000003" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">显存</text><rect x="47.66666666666667" y="313.33333333333337" width="210" height="74.66666666666667" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="347.4166666666667" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">结果缓冲</text>
  <text x="152.66666666666669" y="363.6666666666667" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">主机侧目标</text><path d="M257.6666666666667 133.33333333333334 L295.00000000000006 133.33333333333334" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M400.00000000000006 170.66666666666669 L400.00000000000006 187.66666666666669 L152.66666666666669 187.66666666666669 L152.66666666666669 204.66666666666669" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 170.66666666666669 L647.3333333333334 187.66666666666669 L400.00000000000006 187.66666666666669 L400.00000000000006 204.66666666666669" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 242.00000000000003 L295.00000000000006 242.00000000000003" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 242.00000000000003 L542.3333333333334 242.00000000000003" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 279.33333333333337 L647.3333333333334 296.33333333333337 L152.66666666666669 296.33333333333337 L152.66666666666669 313.33333333333337" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">锁页缓冲与结果缓冲驻留主机内存，显存侧的权重长期驻留。</text>
</svg>