<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">缓冲耗尽的两条路径</title>
  <desc id="fig-desc">两条下降直线：初始 60 ms 音频从 15.36 kbit 开始，约 0.12 秒耗尽；初始 120 ms 音频从 30.72 kbit 开始，约 0.24 秒耗尽；两条线斜率均为每秒 126 kbit</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="279.875" x2="750" y2="279.875" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="283.875" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="201.75" x2="750" y2="201.75" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="205.75" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="123.625" x2="750" y2="123.625" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="127.625" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">30</text><polyline points="74,238 412,358 750,358" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.4"/><circle cx="74" cy="238" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="412" cy="358" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="750" cy="358" r="3.2" fill="var(--blue,#466b3f)"/><polyline points="74,118 412,238 750,358" fill="none" stroke="var(--yellow,#f5d75f)" stroke-width="2.4"/><circle cx="74" cy="118" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="412" cy="238" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="750" cy="358" r="3.2" fill="var(--yellow,#f5d75f)"/><text x="74" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">0</text><text x="412" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">0.12</text><text x="750" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">0.24</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">播放开始后的时间 / s</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">尚未播放的数据 / kbit</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">初始 60 ms</text><rect x="153.1" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="168.1" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">初始 120 ms</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">PCM 播放需要 256 kbit/s，接收只有 130 kbit/s，净流出 126 kbit/s；曲线画到各自第一次耗尽为止。</text>
</svg>