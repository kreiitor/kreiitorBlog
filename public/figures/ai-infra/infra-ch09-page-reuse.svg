<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">读入 64 页，复用前 63 页</title>
  <desc id="fig-desc">堆叠条：读入 64 页，其中前 63 页可连续复用，对应 1008 个 token；最右第 64 页为 16 个 token，仍需处理；每页 2.25 MiB</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="279.875" x2="750" y2="279.875" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="283.875" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="201.75" x2="750" y2="201.75" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="205.75" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">40</text><line x1="74" y1="123.625" x2="750" y2="123.625" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="127.625" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">60</text><rect x="377" y="111.90625" width="70" height="246.09375" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue-soft,#e8f0e2)"/><rect x="377" y="108" width="70" height="3.90625" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="412" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">读入 64 页</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">页</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">页数</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue-soft,#e8f0e2)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">可连续复用 63 页（1008 token）</text><rect x="225.90000000000003" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="240.90000000000003" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">末页 16 token 需处理</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">读取量 64 × 2.25 MiB = 144 MiB，有效复用量 63 × 2.25 MiB = 141.75 MiB。</text>
</svg>