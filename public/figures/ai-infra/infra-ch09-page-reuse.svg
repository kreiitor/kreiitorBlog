<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">读入 64 页，复用前 63 页</title>
  <desc id="fig-desc">堆叠条：读入 64 页，其中前 63 页可连续复用，对应 1008 个 token；最右第 64 页为 16 个 token，仍需处理；每页 2.25 MiB</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="279.875" x2="750" y2="279.875" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="283.875" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="201.75" x2="750" y2="201.75" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="205.75" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">40</text><line x1="74" y1="123.625" x2="750" y2="123.625" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="127.625" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">60</text><rect x="377" y="111.90625" width="70" height="246.09375" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue-soft,#f2f5fc)"/><rect x="377" y="108" width="70" height="3.90625" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="412" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">读入 64 页</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">页</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">页数</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue-soft,#f2f5fc)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">可连续复用 63 页（1008 token）</text><rect x="225.90000000000003" y="86" width="10" height="10" fill="var(--yellow,#ffe04b)"/><text x="240.90000000000003" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">末页 16 token 需处理</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">读取量 64 × 2.25 MiB = 144 MiB，有效复用量 63 × 2.25 MiB = 141.75 MiB。</text>
</svg>