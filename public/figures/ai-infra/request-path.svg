<svg xmlns="http://www.w3.org/2000/svg" width="800" height="396" viewBox="0 54 800 396" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">一次生成请求的执行路径</title>
  <desc id="fig-desc">应用把输入交给服务入口，路由器在实例之间选择一个实例；实例内部由调度器组 batch，CPU 提交 kernel，GPU 执行算子并流式返回 token。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:12px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:11px;fill:var(--muted,#5f4f3c)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <rect x="24" y="184" width="104" height="72" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.8"/>
  <text x="76" y="210" text-anchor="middle" class="b">应用</text>
  <text x="76" y="232" text-anchor="middle" class="tiny">组织上下文</text>

  <rect x="152" y="184" width="110" height="72" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.8"/>
  <text x="207" y="210" text-anchor="middle" class="b">服务入口</text>
  <text x="207" y="232" text-anchor="middle" class="tiny">鉴权 · 配额</text>

  <rect x="286" y="184" width="110" height="72" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.8"/>
  <text x="341" y="210" text-anchor="middle" class="b">路由器</text>
  <text x="341" y="232" text-anchor="middle" class="tiny">按模型与负载选实例</text>

  <rect x="430" y="82" width="330" height="300" rx="10" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="595" y="106" text-anchor="middle" class="b">被选中的推理实例</text>

  <rect x="452" y="120" width="286" height="64" rx="7" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="595" y="145" text-anchor="middle" class="b">实例调度器</text>
  <text x="595" y="166" text-anchor="middle" class="tiny">排队 · 组 batch · 分配 KV 空间</text>

  <rect x="452" y="214" width="122" height="64" rx="7" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="513" y="239" text-anchor="middle" class="b">CPU 运行时</text>
  <text x="513" y="260" text-anchor="middle" class="tiny">提交 kernel</text>

  <rect x="616" y="214" width="122" height="64" rx="7" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.8"/>
  <text x="677" y="239" text-anchor="middle" class="b">GPU</text>
  <text x="677" y="260" text-anchor="middle" class="tiny">执行算子</text>

  <rect x="452" y="310" width="286" height="44" rx="7" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>
  <text x="595" y="337" text-anchor="middle" class="tiny">输出 token，流式返回应用</text>

  <path d="M128 220 L152 220" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M262 220 L286 220" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M396 220 L430 220" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="413" y="202" text-anchor="middle" class="tiny">选定</text>

  <path d="M595 184 L595 214" stroke="var(--blue,#466b3f)" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M574 246 L616 246" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M677 278 L677 310" stroke="var(--blue,#466b3f)" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>

  <text x="310" y="162" text-anchor="middle" class="s">实例之间：路由</text>
  <text x="595" y="404" text-anchor="middle" class="s">实例内部：调度与卡间协作由实例自己安排</text>

  <text x="400" y="438" text-anchor="middle" class="tiny">prefill 一次处理已有输入，decode 逐步生成；前一步输出成为下一步输入，后续步骤复用已保存的 KV 状态。</text>
</svg>
