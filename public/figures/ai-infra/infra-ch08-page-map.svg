<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">逻辑块到物理块的映射</title>
  <desc id="fig-desc">映射表：逻辑块 0 指向物理块 2，逻辑块 1 指向物理块 0，逻辑块 2 指向物理块 3；物理块 1 空闲</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">逻辑块到物理块的映射</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">逻辑顺序连续，物理位置可以分散</text><rect x="38" y="92" width="362" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.2"/><text x="219" y="112" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">逻辑块</text><rect x="400" y="92" width="362" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.2"/><text x="581" y="112" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">物理块</text><rect x="38" y="126" width="362" height="42" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="219" y="150" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">0</text><rect x="400" y="126" width="362" height="42" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="581" y="150" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">2</text><rect x="38" y="168" width="362" height="42" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="219" y="192" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">1</text><rect x="400" y="168" width="362" height="42" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="581" y="192" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">0</text><rect x="38" y="210" width="362" height="42" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="219" y="234" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">2</text><rect x="400" y="210" width="362" height="42" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="581" y="234" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">3</text><rect x="38" y="252" width="362" height="42" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="219" y="276" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">—</text><rect x="400" y="252" width="362" height="42" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="581" y="276" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">1（空闲）</text></svg>