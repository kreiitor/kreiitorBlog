<svg xmlns="http://www.w3.org/2000/svg" width="800" height="406" viewBox="0 42 800 406" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">GPU 存储层次</title>
  <desc id="fig-desc">从显存到寄存器，越靠近计算单元，容量越小、带宽越高、每字节能耗越低。HBM 容量最大，L2 缓存由硬件管理，共享内存由软件管理，寄存器最靠近计算单元。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:28px;font-weight:700;fill:var(--ink,#3b3024)}
    .label{font-size:22px;font-weight:600;fill:var(--ink,#3b3024)}
    .small{font-size:15px;fill:var(--muted,#5f4f3c)}
    .on-blue{fill:var(--on-blue,#fffcf5)}
    .on-yellow{fill:var(--on-yellow,#3b3024)}
  </style>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <rect x="110" y="70" width="580" height="70" rx="10" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="2"/>
  <text x="400" y="101" text-anchor="middle" class="label">HBM / 显存</text>
  <text x="400" y="124" text-anchor="middle" class="small">容量最大 · 带宽较低 · 延迟最高</text>

  <rect x="170" y="158" width="460" height="60" rx="10" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="2"/>
  <text x="400" y="184" text-anchor="middle" class="label">L2 缓存</text>
  <text x="400" y="206" text-anchor="middle" class="small">硬件自动管理 · 多 SM 共享</text>

  <rect x="230" y="236" width="340" height="60" rx="10" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="2"/>
  <text x="400" y="262" text-anchor="middle" class="label on-yellow">共享内存 / SRAM</text>
  <text x="400" y="284" text-anchor="middle" class="small on-yellow">软件显式管理 · 片上缓冲</text>

  <rect x="290" y="314" width="220" height="60" rx="10" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="2"/>
  <text x="400" y="340" text-anchor="middle" class="label on-blue">寄存器 / TMEM</text>
  <text x="400" y="362" text-anchor="middle" class="small on-blue">最靠近计算单元</text>

  <path d="M725 90 V350" stroke="var(--blue,#466b3f)" stroke-width="3" fill="none"/>
  <path d="M715 100 725 82 735 100" fill="var(--blue,#466b3f)"/>
  <path d="M715 340 725 358 735 340" fill="var(--blue,#466b3f)"/>
  <text x="758" y="190" text-anchor="middle" class="small" transform="rotate(90 758 190)">容量更大 · 更慢</text>
  <text x="758" y="300" text-anchor="middle" class="small" transform="rotate(90 758 300)">更近 · 更快 · 更贵</text>

  <text x="400" y="420" text-anchor="middle" class="small">越靠近计算单元，容量越小，带宽越高，每字节能耗越低。</text>
</svg>
