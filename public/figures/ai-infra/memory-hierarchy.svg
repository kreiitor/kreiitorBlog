<svg xmlns="http://www.w3.org/2000/svg" width="800" height="406" viewBox="0 42 800 406" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">GPU 存储层次</title>
  <desc id="fig-desc">从显存到寄存器，越靠近计算单元，容量越小、带宽越高、每字节能耗越低。HBM 容量最大，L2 缓存由硬件管理，共享内存由软件管理，寄存器最靠近计算单元。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .title{font-size:28px;font-weight:700;fill:var(--ink,#202735)}
    .label{font-size:22px;font-weight:600;fill:var(--ink,#202735)}
    .small{font-size:15px;fill:var(--muted,#596171)}
    .on-blue{fill:var(--on-blue,#fffefa)}
    .on-yellow{fill:var(--on-yellow,#202735)}
  </style>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/>

  <rect x="110" y="70" width="580" height="70" rx="10" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="2"/>
  <text x="400" y="101" text-anchor="middle" class="label">HBM / 显存</text>
  <text x="400" y="124" text-anchor="middle" class="small">容量最大 · 带宽较低 · 延迟最高</text>

  <rect x="170" y="158" width="460" height="60" rx="10" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="2"/>
  <text x="400" y="184" text-anchor="middle" class="label">L2 缓存</text>
  <text x="400" y="206" text-anchor="middle" class="small">硬件自动管理 · 多 SM 共享</text>

  <rect x="230" y="236" width="340" height="60" rx="10" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="2"/>
  <text x="400" y="262" text-anchor="middle" class="label on-yellow">共享内存 / SRAM</text>
  <text x="400" y="284" text-anchor="middle" class="small on-yellow">软件显式管理 · 片上缓冲</text>

  <rect x="290" y="314" width="220" height="60" rx="10" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="2"/>
  <text x="400" y="340" text-anchor="middle" class="label on-blue">寄存器 / TMEM</text>
  <text x="400" y="362" text-anchor="middle" class="small on-blue">最靠近计算单元</text>

  <path d="M725 90 V350" stroke="var(--blue,#2647d7)" stroke-width="3" fill="none"/>
  <path d="M715 100 725 82 735 100" fill="var(--blue,#2647d7)"/>
  <path d="M715 340 725 358 735 340" fill="var(--blue,#2647d7)"/>
  <text x="758" y="190" text-anchor="middle" class="small" transform="rotate(90 758 190)">容量更大 · 更慢</text>
  <text x="758" y="300" text-anchor="middle" class="small" transform="rotate(90 758 300)">更近 · 更快 · 更贵</text>

  <text x="400" y="420" text-anchor="middle" class="small">越靠近计算单元，容量越小，带宽越高，每字节能耗越低。</text>
</svg>
