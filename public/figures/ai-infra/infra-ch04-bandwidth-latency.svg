<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">在途请求数与带宽上界</title>
  <desc id="fig-desc">两条曲线在少量未完成请求时重合上升，斜率为每事务 128 bytes、延迟 500 ns；之后 RTX 4090 在约 1.008 TB/s 趋平，RTX 5090 在约 1.792 TB/s 趋平</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">0.5</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">1</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">1.5</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">2</text><polyline points="74,354.8 243,326 412,232 581,232 750,232" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.4"/><circle cx="74" cy="354.8" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="243" cy="326" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="412" cy="232" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="581" cy="232" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="750" cy="232" r="3.2" fill="var(--blue,#2647d7)"/><polyline points="74,354.8 243,326 412,230 581,134 750,134" fill="none" stroke="var(--yellow,#ffe04b)" stroke-width="2.4"/><circle cx="74" cy="354.8" r="3.2" fill="var(--yellow,#ffe04b)"/><circle cx="243" cy="326" r="3.2" fill="var(--yellow,#ffe04b)"/><circle cx="412" cy="230" r="3.2" fill="var(--yellow,#ffe04b)"/><circle cx="581" cy="134" r="3.2" fill="var(--yellow,#ffe04b)"/><circle cx="750" cy="134" r="3.2" fill="var(--yellow,#ffe04b)"/><text x="74" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">100</text><text x="243" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">1000</text><text x="412" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">4000</text><text x="581" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">7000</text><text x="750" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">10000</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">同时未完成请求数</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">带宽上界 / TB/s</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#2647d7)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">RTX 4090：1008 GB/s</text><rect x="188.45000000000002" y="86" width="10" height="10" fill="var(--yellow,#ffe04b)"/><text x="203.45000000000002" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">RTX 5090：1792 GB/s</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">曲线按 N × 128 bytes ÷ 500 ns 与接口速率取最小值绘制。</text>
</svg>