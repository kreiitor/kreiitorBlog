<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">三档设备的每步读取下界</title>
  <desc id="fig-desc">四根柱子：RTX PRO 6000 为 9.12 ms、109.6 token/s；M3 Ultra 为 19.96 ms、50.1 token/s；手机 q4_0 为 63.8 ms、15.7 token/s；手机 BF16 为 191 ms、5.2 token/s</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">三档设备的每步读取下界</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">Qwen3-8B 单请求 8K decode 的主要载荷</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="274.6666666666667" x2="750" y2="274.6666666666667" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="278.6666666666667" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">100</text><line x1="74" y1="191.33333333333334" x2="750" y2="191.33333333333334" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="195.33333333333334" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">200</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">300</text><rect x="123.5" y="350.4" width="68" height="7.599999999999999" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="158.5" y="344.4" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">9.12</text><text x="158.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">RTX PRO 6000</text><rect x="292.5" y="341.3666666666667" width="68" height="16.633333333333333" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="327.5" y="335.3666666666667" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">19.96</text><text x="327.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">M3 Ultra</text><rect x="461.5" y="304.8333333333333" width="68" height="53.166666666666664" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="496.5" y="298.8333333333333" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">63.8</text><text x="496.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">手机 q4_0</text><rect x="630.5" y="198.83333333333331" width="68" height="159.16666666666669" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="665.5" y="192.83333333333331" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">191</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">手机 BF16</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">设备与权重</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">每步读取时间下界 / ms</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">每步时间</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">读取量 16.345 GB；手机按四条 x16 LPDDR5X 通道计，合计 84.8 GB/s；柱端同时标注对应的 token/s 上限。</text>
</svg>