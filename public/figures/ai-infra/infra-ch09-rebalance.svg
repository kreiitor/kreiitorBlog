<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">请求组成改变最优配比</title>
  <desc id="fig-desc">三组配比对照：原始 8192 输入、1025 输出用 4 张 A100 做 P、4 张 H20 做 D，上限 4.55/s；前缀命中 6144 个 token 后用 2 张 A100 做 P、2 张 A100 加 4 张 H20 做 D，上限 5.69/s；输出减至 129 个 token 后用 4 张 A100 加 3 张 H20 做 P、1 张 H20 做 D，上限 6.33/s</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="34" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="151.33333333333331" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">原始请求</text><text x="151.33333333333331" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">4 A100 做 P，4 H20 做 D</text><text x="46" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">输入 8192</text><text x="46" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">输出 1025</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">上限 4.55/s</text><rect x="282.66666666666663" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/><text x="399.99999999999994" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">前缀命中 6144</text><text x="399.99999999999994" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">2 A100 做 P，2 A100 加 4 H20 做 D</text><text x="294.66666666666663" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">新输入 2048</text><text x="294.66666666666663" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">P 能力 8.41/s</text><text x="294.66666666666663" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">上限 5.69/s</text><rect x="531.3333333333333" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="648.6666666666666" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">输出 129</text><text x="648.6666666666666" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">4 A100 加 3 H20 做 P，1 H20 做 D</text><text x="543.3333333333333" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">decode 128 次</text><text x="543.3333333333333" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">P 能力 6.33/s</text><text x="543.3333333333333" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">上限 6.33/s</text></svg>