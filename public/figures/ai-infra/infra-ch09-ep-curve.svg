<svg xmlns="http://www.w3.org/2000/svg" width="800" height="248" viewBox="0 64 800 248" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">最忙卡比值随 EP 规模变化</title>
  <desc id="fig-desc">对照表：EP8 时热点卡为平均的 1.08 倍，随机路由为 1.04 倍；EP32 时热点卡为 1.36 倍；EP256 时热点卡为 4.0 倍，随机路由为 1.52 倍</desc>
