aper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="400" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">4.0</text><rect x="520.6666666666666" y="210" width="241.33333333333331" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="641.3333333333333" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">1.52</text><text x="400" y="286" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">热点情形为精确分数；随机情形为固定种子模拟 1000 批的平均值。每卡专家数为 256 除以 EP 卡数。</text>
