<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">循环神经网络的位置依赖</title>
  <desc id="fig-desc">网格横轴是 token 1 到 token 4，纵轴是输入、第 1 层、第 2 层；每个交点有一个圆点，同一 token 位置的点颜色相同，同层沿横向依次推进</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><text x="195.5" y="112" font-size="10.5" fill="var(--muted)" font-weight="700" text-anchor="middle">token 1</text><text x="358.5" y="112" font-size="10.5" fill="var(--muted)" font-weight="700" text-anchor="middle">token 2</text><text x="521.5" y="112" font-size="10.5" fill="var(--muted)" font-weight="700" text-anchor="middle">token 3</text><text x="684.5" y="112" font-size="10.5" fill="var(--muted)" font-weight="700" text-anchor="middle">token 4</text><text x="74" y="149" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">输入</text><rect x="117" y="129" width="157" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.1"/><text x="195.5" y="149" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">●</text><rect x="280" y="129" width="157" height="34" rx="4" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.1"/><text x="358.5" y="149" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">●</text><rect x="443" y="129" width="157" height="34" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1.1"/><text x="521.5" y="149" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">●</text><rect x="606" y="129" width="157" height="34" rx="4" fill="var(--line-soft)" stroke="var(--line)" stroke-width="1.1"/><text x="684.5" y="149" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">●</text><text x="74" y="189" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">第 1 层</text><rect x="117" y="169" width="157" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.1"/><text x="195.5" y="189" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">●</text><rect x="280" y="169" width="157" height="34" rx="4" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.1"/><text x="358.5" y="189" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">●</text><rect x="443" y="169" width="157" height="34" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1.1"/><text x="521.5" y="189" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">●</text><rect x="606" y="169" width="157" height="34" rx="4" fill="var(--line-soft)" stroke="var(--line)" stroke-width="1.1"/><text x="684.5" y="189" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">●</text><text x="74" y="229" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">第 2 层</text><rect x="117" y="209" width="157" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.1"/><text x="195.5" y="229" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">●</text><rect x="280" y="209" width="157" height="34" rx="4" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.1"/><text x="358.5" y="229" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">●</text><rect x="443" y="209" width="157" height="34" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1.1"/><text x="521.5" y="229" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">●</text><rect x="606" y="209" width="157" height="34" rx="4" fill="var(--line-soft)" stroke="var(--line)" stroke-width="1.1"/><text x="684.5" y="229" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">●</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">网格交点表示一次计算。</text>
</svg>