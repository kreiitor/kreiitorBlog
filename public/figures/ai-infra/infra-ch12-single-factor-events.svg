<svg xmlns="http://www.w3.org/2000/svg" width="800" height="248" viewBox="0 64 800 248" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">单因素实验的设置与事件</title>
  <desc id="fig-desc">三行配对：连接复用对应握手与首字节时刻，窗口设置对应在途量与确认时刻，发送节奏对应出口空闲与完成时刻</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="38" y="92" width="241.33333333333331" height="34" rx="4" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.2"/><text x="158.66666666666666" y="112" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">设置</text><rect x="279.3333333333333" y="92" width="482.66666666666663" height="34" rx="4" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.2"/><text x="520.6666666666666" y="112" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">对应事件</text><rect x="38" y="126" width="241.33333333333331" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="158.66666666666666" y="150" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">连接复用</text><rect x="279.3333333333333" y="126" width="482.66666666666663" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="520.6666666666666" y="150" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">握手与首字节时刻</text><rect x="38" y="168" width="241.33333333333331" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="158.66666666666666" y="192" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">窗口设置</text><rect x="279.3333333333333" y="168" width="482.66666666666663" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="520.6666666666666" y="192" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">在途量与确认时刻</text><rect x="38" y="210" width="241.33333333333331" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="158.66666666666666" y="234" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">发送节奏</text><rect x="279.3333333333333" y="210" width="482.66666666666663" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="520.6666666666666" y="234" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">出口空闲与完成时刻</text><text x="400" y="286" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">固定文件、路径和其他设置。</text>
</svg>