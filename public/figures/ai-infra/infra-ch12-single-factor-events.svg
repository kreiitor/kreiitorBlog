<svg xmlns="http://www.w3.org/2000/svg" width="800" height="248" viewBox="0 64 800 248" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">单因素实验的设置与事件</title>
  <desc id="fig-desc">三行配对：连接复用对应握手与首字节时刻，窗口设置对应在途量与确认时刻，发送节奏对应出口空闲与完成时刻</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="38" y="92" width="241.33333333333331" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.2"/><text x="158.66666666666666" y="112" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">设置</text><rect x="279.3333333333333" y="92" width="482.66666666666663" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.2"/><text x="520.6666666666666" y="112" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">对应事件</text><rect x="38" y="126" width="241.33333333333331" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="158.66666666666666" y="150" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">连接复用</text><rect x="279.3333333333333" y="126" width="482.66666666666663" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="520.6666666666666" y="150" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">握手与首字节时刻</text><rect x="38" y="168" width="241.33333333333331" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="158.66666666666666" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">窗口设置</text><rect x="279.3333333333333" y="168" width="482.66666666666663" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="520.6666666666666" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">在途量与确认时刻</text><rect x="38" y="210" width="241.33333333333331" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="158.66666666666666" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">发送节奏</text><rect x="279.3333333333333" y="210" width="482.66666666666663" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="520.6666666666666" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">出口空闲与完成时刻</text><text x="400" y="286" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">固定文件、路径和其他设置。</text>
</svg>