<svg xmlns="http://www.w3.org/2000/svg" width="800" height="327" viewBox="0 76 800 327" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">读后写竞争的时间顺序</title>
  <desc id="fig-desc">时间顺序：1 μs 提前读取得到旧值，2 μs 生产者写入新值，3 μs 就绪标志可见，4 μs 消费者读到就绪标志，5 μs 返回先前读到的旧值，6 μs 若重读得到新值</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="47.66666666666667" y="104.5" width="210" height="112" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">1 μs 提前读取</text>
  <text x="152.66666666666669" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">得到旧值</text><rect x="295.00000000000006" y="104.5" width="210" height="112" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="157.25" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">2 μs 写入新值</text>
  <text x="400.00000000000006" y="173.5" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">生产者</text><rect x="542.3333333333334" y="104.5" width="210" height="112" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">3 μs 标志可见</text>
  <text x="647.3333333333334" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">就绪标志</text><rect x="47.66666666666667" y="267.5" width="210" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="320.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">4 μs 读到标志</text>
  <text x="152.66666666666669" y="336.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">发现冲突</text><rect x="295.00000000000006" y="267.5" width="210" height="112" rx="8" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="320.25" font-size="13" fill="var(--on-yellow,#202735)" font-weight="700" text-anchor="middle">5 μs 返回旧值</text>
  <text x="400.00000000000006" y="336.5" font-size="12" fill="var(--on-yellow,#202735)" font-weight="400" text-anchor="middle">未重读</text><rect x="542.3333333333334" y="267.5" width="210" height="112" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="320.25" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">6 μs 重读得新值</text>
  <text x="647.3333333333334" y="336.5" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">在 4 μs 重读</text><path d="M257.6666666666667 160.5 L295.00000000000006 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 160.5 L542.3333333333334 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 216.5 L647.3333333333334 242 L152.66666666666669 242 L152.66666666666669 267.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 323.5 L295.00000000000006 323.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 323.5 L542.3333333333334 323.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/></svg>