<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 64 800 386" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">配对计时下的替换收益</title>
  <desc id="fig-desc">11 组配对柱状图，纵轴为原请求减新请求的耗时，范围 −3 到 5 ms；虚线标出中位数约 1.3 ms，0 线以上表示替换后更快</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="34" y="92" width="359" height="3" fill="var(--blue,#466b3f)"/><rect x="34" y="92" width="359" height="300" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="213.5" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">测量结果</text><text x="213.5" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">11 组交错配对</text><text x="46" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">纵轴为原请求减新请求耗时</text><text x="46" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">范围 −3 到 5 ms</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">中位数约 1.3 ms</text><text x="46" y="239.84999999999997" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="239.84999999999997" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">0 线以上表示替换后更快</text><rect x="407" y="92" width="359" height="300" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="586.5" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">实验条件</text><text x="586.5" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">RTX PRO 6000 · Qwen3-8B</text><text x="419" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">7239 个 token 输入</text><text x="419" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="431" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">强制 32 个 token 输出</text><text x="419" y="217.89999999999998" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="431" y="217.89999999999998" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">并发 1，BF16，eager</text><text x="419" y="239.84999999999997" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="431" y="239.84999999999997" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">关闭前缀缓存</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line,#c9b49c)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">原请求</text><text x="730" y="400" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">新请求</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">RTX PRO 6000 上的 Qwen3-8B，7239 个 token 输入、强制 32 个 token 输出，并发 1，BF16、eager，关闭前缀缓存；期间有其他驻留服务。阶段表来自单独采集的性</text><text x="400" y="429.4" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">能分析记录。</text>
</svg>