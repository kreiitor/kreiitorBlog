<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">配对计时下的替换收益</title>
  <desc id="fig-desc">11 组配对柱状图，纵轴为原请求减新请求的耗时，范围 −3 到 5 ms；虚线标出中位数约 1.3 ms，0 线以上表示替换后更快</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="34" y="92" width="359" height="300" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="213.5" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">测量结果</text><text x="213.5" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">11 组交错配对</text><text x="46" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">纵轴为原请求减新请求耗时</text><text x="46" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">范围 −3 到 5 ms</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">中位数约 1.3 ms</text><text x="46" y="239.84999999999997" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="239.84999999999997" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">0 线以上表示替换后更快</text><rect x="407" y="92" width="359" height="300" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="586.5" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">实验条件</text><text x="586.5" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">RTX PRO 6000 · Qwen3-8B</text><text x="419" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">7239 个 token 输入</text><text x="419" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">强制 32 个 token 输出</text><text x="419" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">并发 1，BF16，eager</text><text x="419" y="239.84999999999997" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="239.84999999999997" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">关闭前缀缓存</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">原请求</text><text x="730" y="400" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="end">新请求</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">RTX PRO 6000 上的 Qwen3-8B，7239 个 token 输入、强制 32 个 token 输出，并发 1，BF16、eager，关闭前缀缓存；期间有其他驻留服务。阶段表来自单独采集的性</text><text x="400" y="429.4" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">能分析记录。</text>
</svg>