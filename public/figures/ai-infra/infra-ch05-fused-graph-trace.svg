<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">先融合再重放</title>
  <desc id="fig-desc">先融合再重放时，主机发起 3 次图执行，加速器执行 15 个 kernel；融合减少 kernel 数，图重放减少主机提交次数</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">先融合再重放</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">3 次图执行对应 15 个加速器 kernel</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="274.6666666666667" x2="750" y2="274.6666666666667" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="278.6666666666667" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">5</text><line x1="74" y1="191.33333333333334" x2="750" y2="191.33333333333334" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="195.33333333333334" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">15</text><rect x="208" y="308" width="68" height="50" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="243" y="302" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">3</text><text x="243" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">主机图执行</text><rect x="546" y="108" width="68" height="250" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="581" y="102" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">15</text><text x="581" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">加速器 kernel</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">事件类型</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">次数</text></g><rect x="82" y="86" width="10" height="10" fill="var(--yellow)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">事件数</text></svg>