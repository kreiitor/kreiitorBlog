<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 158 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">整行量化与反量化</title>
  <desc id="fig-desc">流程：先读完整行，块 0 最大值 1、块 1 最大值 10，整行最大值 10；第一项 1 按 scale 映射为 44.8，舍入为 44，再反量化为 44×10/448 = 55/56</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="45" y="186" width="153.5" height="112" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="121.75" y="230.625" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">读完整行</text>
  <text x="121.75" y="246.875" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">块 0 最大 1，块 1 最大</text><text x="121.75" y="263.075" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">10，整行 10</text><rect x="230.5" y="186" width="153.5" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="307.25" y="238.75" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">映射第一项</text>
  <text x="307.25" y="255" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">1 → 44.8</text><rect x="416" y="186" width="153.5" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="492.75" y="238.75" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">舍入</text>
  <text x="492.75" y="255" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">44.8 → 44</text><rect x="601.5" y="186" width="153.5" height="112" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="678.25" y="238.75" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">反量化</text>
  <text x="678.25" y="255" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">44 × 10/448 = 55/56</text><path d="M198.5 242 L230.5 242" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 242 L416 242" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M569.5 242 L601.5 242" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/></svg>