<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 158 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">整行量化与反量化</title>
  <desc id="fig-desc">流程：先读完整行，块 0 最大值 1、块 1 最大值 10，整行最大值 10；第一项 1 按 scale 映射为 44.8，舍入为 44，再反量化为 44×10/448 = 55/56</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="45" y="186" width="153.5" height="112" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="121.75" y="230.625" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">读完整行</text>
  <text x="121.75" y="246.875" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">块 0 最大 1，块 1 最大</text><text x="121.75" y="263.075" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">10，整行 10</text><rect x="230.5" y="186" width="153.5" height="112" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="307.25" y="238.75" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">映射第一项</text>
  <text x="307.25" y="255" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">1 → 44.8</text><rect x="416" y="186" width="153.5" height="112" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="492.75" y="238.75" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">舍入</text>
  <text x="492.75" y="255" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">44.8 → 44</text><rect x="601.5" y="186" width="153.5" height="112" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="678.25" y="238.75" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">反量化</text>
  <text x="678.25" y="255" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">44 × 10/448 = 55/56</text><path d="M198.5 242 L230.5 242" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 242 L416 242" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M569.5 242 L601.5 242" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/></svg>