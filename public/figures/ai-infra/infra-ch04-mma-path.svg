<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">一次矩阵乘法的硬件路径</title>
  <desc id="fig-desc">三层结构从上到下依次为主机 CPU 提交任务、片外显存保存输入和权重、加速器芯片内部依次包含共享缓存与数据搬移、局部缓冲、矩阵单元和累加存储</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="40" y="147" width="720" height="58" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="179" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">主机 CPU</text><rect x="254" y="156" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="329" y="179" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">提交任务</text><rect x="532" y="156" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="607" y="179" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">准备输入与执行参数</text><rect x="40" y="213" width="720" height="58" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="54" y="245" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">片外显存</text><rect x="254" y="222" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="329" y="245" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">保存输入</text><rect x="532" y="222" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="607" y="245" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">保存权重</text><rect x="40" y="279" width="720" height="58" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="311" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">加速器芯片内部</text><rect x="194" y="288" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="259.5" y="311" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">共享缓存与数据搬移</text><rect x="333" y="288" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="398.5" y="311" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">局部缓冲</text><rect x="472" y="288" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="537.5" y="311" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">矩阵单元</text><rect x="611" y="288" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="676.5" y="311" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">累加存储</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">共享缓存对应 L2，局部缓冲对应共享内存，累加存储对应寄存器或专用累加存储。</text>
</svg>