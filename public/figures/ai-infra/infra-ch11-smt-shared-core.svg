<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">SMT 打开后的物理核</title>
  <desc id="fig-desc">一个物理核包含硬件线程 0 与硬件线程 1，分别运行 LS 任务与 BE 任务；两个线程共享执行单元与一级缓存</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="109.5" y="104.5" width="210" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="214.5" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">一个物理核</text>
  <text x="214.5" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">共享执行单元与一级缓存</text><rect x="480.5" y="104.5" width="210" height="112" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="585.5" y="157.25" font-size="13" fill="var(--on-blue)" font-weight="700" text-anchor="middle">硬件线程 0</text>
  <text x="585.5" y="173.5" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">LS 任务</text><rect x="109.5" y="267.5" width="210" height="112" rx="8" fill="var(--yellow)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="214.5" y="320.25" font-size="13" fill="var(--on-yellow)" font-weight="700" text-anchor="middle">硬件线程 1</text>
  <text x="214.5" y="336.5" font-size="12" fill="var(--on-yellow)" font-weight="400" text-anchor="middle">BE 任务</text><path d="M319.5 160.5 L480.5 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M214.5 216.5 L214.5 242 L214.5 242 L214.5 267.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/></svg>