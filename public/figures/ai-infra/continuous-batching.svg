<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 50 800 400" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">固定批处理与连续批处理</title>
  <desc id="fig-desc">固定批处理按整组接收、整组结束，短请求结束后执行位置仍然闲置；连续批处理在迭代边界接纳新请求，但长 prefill 会拉长已有请求的输出间隔。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#202735)}
    .sub{font-size:14px;fill:var(--muted,#596171)}
    .h{font-size:15px;font-weight:700;fill:var(--ink,#202735)}
    .b{font-size:12px;font-weight:600;fill:var(--ink,#202735)}
    .s{font-size:11px;fill:var(--muted,#596171)}
    .tiny{font-size:10px;fill:var(--muted,#596171)}
    .onblue{fill:var(--on-blue,#fffefa)}
    .onyellow{fill:var(--on-yellow,#202735)}
  </style>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/>

  <rect x="40" y="78" width="720" height="150" rx="9" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="2"/>
  <text x="58" y="102" class="h">固定 batch</text>
  <text x="58" y="118" class="tiny">整组进、整组出</text>

  <g class="b" text-anchor="end">
    <text x="132" y="136">r0</text><text x="132" y="164">r1</text>
    <text x="132" y="192">r2</text><text x="132" y="220">r3</text>
  </g>
  <line x1="150" y1="126" x2="710" y2="126" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/>

  <rect x="150" y="126" width="70" height="16" rx="3" fill="var(--blue,#2647d7)"/>
  <rect x="220" y="126" width="280" height="16" rx="3" fill="var(--yellow,#ffe04b)"/>
  <rect x="150" y="154" width="30" height="16" rx="3" fill="var(--blue,#2647d7)"/>
  <rect x="180" y="154" width="30" height="16" rx="3" fill="var(--yellow,#ffe04b)"/>
  <rect x="500" y="182" width="60" height="16" rx="3" fill="var(--blue,#2647d7)"/>
  <rect x="560" y="182" width="60" height="16" rx="3" fill="var(--yellow,#ffe04b)"/>
  <rect x="500" y="210" width="60" height="16" rx="3" fill="var(--blue,#2647d7)"/>
  <rect x="560" y="210" width="60" height="16" rx="3" fill="var(--yellow,#ffe04b)"/>

  <path d="M214 160 V172 H496 V160" stroke="var(--line,#a2aec1)" stroke-width="1.5" fill="none"/>
  <text x="355" y="188" text-anchor="middle" class="tiny">短请求结束，位置闲置到整组结束</text>

  <rect x="40" y="244" width="720" height="150" rx="9" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="2"/>
  <text x="58" y="268" class="h">连续批处理</text>
  <text x="58" y="284" class="tiny">迭代边界重新安排</text>

  <g class="b" text-anchor="end">
    <text x="132" y="302">r0</text><text x="132" y="330">r1</text>
    <text x="132" y="358">r2</text><text x="132" y="386">r3</text>
  </g>

  <rect x="150" y="292" width="70" height="16" rx="3" fill="var(--blue,#2647d7)"/>
  <rect x="220" y="292" width="60" height="16" rx="3" fill="var(--yellow,#ffe04b)"/>
  <rect x="280" y="292" width="220" height="16" rx="3" fill="var(--paper,#f9faf7)" stroke="var(--line,#a2aec1)" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="500" y="292" width="210" height="16" rx="3" fill="var(--yellow,#ffe04b)"/>
  <text x="390" y="304" text-anchor="middle" class="tiny">等待长 prefill</text>

  <rect x="150" y="320" width="30" height="16" rx="3" fill="var(--blue,#2647d7)"/>
  <rect x="180" y="320" width="30" height="16" rx="3" fill="var(--yellow,#ffe04b)"/>

  <rect x="280" y="348" width="220" height="16" rx="3" fill="var(--blue,#2647d7)"/>
  <rect x="500" y="348" width="50" height="16" rx="3" fill="var(--yellow,#ffe04b)"/>

  <rect x="500" y="376" width="50" height="16" rx="3" fill="var(--blue,#2647d7)"/>
  <rect x="550" y="376" width="110" height="16" rx="3" fill="var(--yellow,#ffe04b)"/>


  <g class="tiny" text-anchor="middle">
    <text x="150" y="414">0</text><text x="290" y="414">200</text><text x="430" y="414">400</text>
    <text x="570" y="414">600</text><text x="710" y="414">800 ms</text>
  </g>

  <text x="400" y="438" text-anchor="middle" class="tiny">连续批处理提升吞吐，但长 prefill 会让已有请求多等；分块 prefill 用来压回抖动。</text>
</svg>
