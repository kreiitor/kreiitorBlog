<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 50 800 400" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">固定批处理与连续批处理</title>
  <desc id="fig-desc">固定批处理按整组接收、整组结束，短请求结束后执行位置仍然闲置；连续批处理在迭代边界接纳新请求，但长 prefill 会拉长已有请求的输出间隔。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:15px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:12px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:11px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:10px;fill:var(--muted,#5f4f3c)}
    .onblue{fill:var(--on-blue,#fffcf5)}
    .onyellow{fill:var(--on-yellow,#3b3024)}
  </style>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <rect x="40" y="78" width="720" height="150" rx="9" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="2"/>
  <text x="58" y="102" class="h">固定 batch</text>
  <text x="58" y="118" class="tiny">整组进、整组出</text>

  <g class="b" text-anchor="end">
    <text x="132" y="136">r0</text><text x="132" y="164">r1</text>
    <text x="132" y="192">r2</text><text x="132" y="220">r3</text>
  </g>
  <line x1="150" y1="126" x2="710" y2="126" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>

  <rect x="150" y="126" width="70" height="16" rx="3" fill="var(--blue,#466b3f)"/>
  <rect x="220" y="126" width="280" height="16" rx="3" fill="var(--yellow,#f5d75f)"/>
  <rect x="150" y="154" width="30" height="16" rx="3" fill="var(--blue,#466b3f)"/>
  <rect x="180" y="154" width="30" height="16" rx="3" fill="var(--yellow,#f5d75f)"/>
  <rect x="500" y="182" width="60" height="16" rx="3" fill="var(--blue,#466b3f)"/>
  <rect x="560" y="182" width="60" height="16" rx="3" fill="var(--yellow,#f5d75f)"/>
  <rect x="500" y="210" width="60" height="16" rx="3" fill="var(--blue,#466b3f)"/>
  <rect x="560" y="210" width="60" height="16" rx="3" fill="var(--yellow,#f5d75f)"/>

  <path d="M214 160 V172 H496 V160" stroke="var(--line,#c9b49c)" stroke-width="1.5" fill="none"/>
  <text x="355" y="188" text-anchor="middle" class="tiny">短请求结束，位置闲置到整组结束</text>

  <rect x="40" y="244" width="720" height="150" rx="9" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="2"/>
  <text x="58" y="268" class="h">连续批处理</text>
  <text x="58" y="284" class="tiny">迭代边界重新安排</text>

  <g class="b" text-anchor="end">
    <text x="132" y="302">r0</text><text x="132" y="330">r1</text>
    <text x="132" y="358">r2</text><text x="132" y="386">r3</text>
  </g>

  <rect x="150" y="292" width="70" height="16" rx="3" fill="var(--blue,#466b3f)"/>
  <rect x="220" y="292" width="60" height="16" rx="3" fill="var(--yellow,#f5d75f)"/>
  <rect x="280" y="292" width="220" height="16" rx="3" fill="var(--paper,#faf6f0)" stroke="var(--line,#c9b49c)" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="500" y="292" width="210" height="16" rx="3" fill="var(--yellow,#f5d75f)"/>
  <text x="390" y="304" text-anchor="middle" class="tiny">等待长 prefill</text>

  <rect x="150" y="320" width="30" height="16" rx="3" fill="var(--blue,#466b3f)"/>
  <rect x="180" y="320" width="30" height="16" rx="3" fill="var(--yellow,#f5d75f)"/>

  <rect x="280" y="348" width="220" height="16" rx="3" fill="var(--blue,#466b3f)"/>
  <rect x="500" y="348" width="50" height="16" rx="3" fill="var(--yellow,#f5d75f)"/>

  <rect x="500" y="376" width="50" height="16" rx="3" fill="var(--blue,#466b3f)"/>
  <rect x="550" y="376" width="110" height="16" rx="3" fill="var(--yellow,#f5d75f)"/>


  <g class="tiny" text-anchor="middle">
    <text x="150" y="414">0</text><text x="290" y="414">200</text><text x="430" y="414">400</text>
    <text x="570" y="414">600</text><text x="710" y="414">800 ms</text>
  </g>

  <text x="400" y="438" text-anchor="middle" class="tiny">连续批处理提升吞吐，但长 prefill 会让已有请求多等；分块 prefill 用来压回抖动。</text>
</svg>
