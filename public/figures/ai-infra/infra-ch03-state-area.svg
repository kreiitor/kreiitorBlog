<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 68 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">状态占用的面积账</title>
  <desc id="fig-desc">一条高度为 1 GiB 的水平占用带从 0 秒延续到 10 秒，在 12 秒的横轴上形成矩形，面积为 10 GiB·s</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="126" y1="96" x2="126" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="126" y="174" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0</text><line x1="256.4166666666667" y1="96" x2="256.4166666666667" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="256.4166666666667" y="174" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">2.5</text><line x1="386.83333333333337" y1="96" x2="386.83333333333337" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="386.83333333333337" y="174" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">5</text><line x1="517.25" y1="96" x2="517.25" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="517.25" y="174" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">7.5</text><line x1="647.6666666666667" y1="96" x2="647.6666666666667" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="647.6666666666667" y="174" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">10</text><line x1="752" y1="96" x2="752" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="752" y="174" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">12</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">占用空间</text><rect x="126" y="115" width="521.6666666666667" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="386.83333333333337" y="134" font-size="9.5" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">1 GiB × 10 s = 10 GiB·s</text><line x1="126" y1="158" x2="752" y2="158" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="194" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">状态驻留时间 / s</text><text x="400" y="231" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">阴影矩形代表 1 GiB × 10 s；面积单位为 GiB·s。</text>
</svg>