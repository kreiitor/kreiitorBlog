<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">状态占用的面积账</title>
  <desc id="fig-desc">一条高度为 1 GiB 的水平占用带从 0 秒延续到 10 秒，在 12 秒的横轴上形成矩形，面积为 10 GiB·s</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="126" y1="96" x2="126" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="256.4166666666667" y1="96" x2="256.4166666666667" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="256.4166666666667" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">2.5</text><line x1="386.83333333333337" y1="96" x2="386.83333333333337" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="386.83333333333337" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">5</text><line x1="517.25" y1="96" x2="517.25" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="517.25" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">7.5</text><line x1="647.6666666666667" y1="96" x2="647.6666666666667" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="647.6666666666667" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">10</text><line x1="752" y1="96" x2="752" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">12</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">占用空间</text><rect x="126" y="115" width="521.6666666666667" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="386.83333333333337" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">1 GiB × 10 s = 10 GiB·s</text><line x1="126" y1="158" x2="752" y2="158" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="194" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">状态驻留时间 / s</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">阴影矩形代表 1 GiB × 10 s；面积单位为 GiB·s。</text>
</svg>