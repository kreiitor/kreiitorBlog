<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">三种重叠方式的积压峰值</title>
  <desc id="fig-desc">三根柱表示积压峰值：重叠 20 ms 为 1000 MB，重叠 5 ms 为 250 MB，不重叠为 0 MB</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">250</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">500</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">750</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">1000</text><rect x="151.66666666666669" y="108" width="68" height="250" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="186.66666666666669" y="102" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">1000</text><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">重叠 20 ms</text><rect x="377.00000000000006" y="295.5" width="68" height="62.5" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="412.00000000000006" y="289.5" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">250</text><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">重叠 5 ms</text><rect x="602.3333333333334" y="358" width="68" height="0" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="637.3333333333334" y="352" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">0</text><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">不重叠</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">两作业高峰的重叠方式</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">积压峰值 / MB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--yellow)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">积压峰值</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">本图按无限缓冲计算积压，不扣除丢弃造成的损失。</text>
</svg>