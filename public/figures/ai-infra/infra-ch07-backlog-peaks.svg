<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">三种重叠方式的积压峰值</title>
  <desc id="fig-desc">三根柱表示积压峰值：重叠 20 ms 为 1000 MB，重叠 5 ms 为 250 MB，不重叠为 0 MB</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">250</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">500</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">750</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">1000</text><rect x="151.66666666666669" y="108" width="68" height="250" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="186.66666666666669" y="102" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">1000</text><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">重叠 20 ms</text><rect x="377.00000000000006" y="295.5" width="68" height="62.5" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="412.00000000000006" y="289.5" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">250</text><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">重叠 5 ms</text><rect x="602.3333333333334" y="358" width="68" height="0" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="637.3333333333334" y="352" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">0</text><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">不重叠</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">两作业高峰的重叠方式</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">积压峰值 / MB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">积压峰值</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">本图按无限缓冲计算积压，不扣除丢弃造成的损失。</text>
</svg>