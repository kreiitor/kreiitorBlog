<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">容量因子的两种代价</title>
  <desc id="fig-desc">折线图：容量因子为 1.0、1.25、1.5、2.0 时，丢弃的 dispatch 占比从 25% 降到 12.5% 再降到 0；补零行占执行量从 25% 升到 30%、33%、50%</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">容量因子的两种代价</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">丢弃比例下降，补零比例上升</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="258" x2="750" y2="258" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="262" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="158" x2="750" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="162" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">40</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">50</text><polyline points="74,233 299.33333333333337,295.5 524.6666666666667,358 750,358" fill="none" stroke="var(--blue)" stroke-width="2.4"/><circle cx="74" cy="233" r="3.2" fill="var(--blue)"/><circle cx="299.33333333333337" cy="295.5" r="3.2" fill="var(--blue)"/><circle cx="524.6666666666667" cy="358" r="3.2" fill="var(--blue)"/><circle cx="750" cy="358" r="3.2" fill="var(--blue)"/><polyline points="74,233 299.33333333333337,208 524.6666666666667,193 750,108" fill="none" stroke="var(--yellow)" stroke-width="2.4"/><circle cx="74" cy="233" r="3.2" fill="var(--yellow)"/><circle cx="299.33333333333337" cy="208" r="3.2" fill="var(--yellow)"/><circle cx="524.6666666666667" cy="193" r="3.2" fill="var(--yellow)"/><circle cx="750" cy="108" r="3.2" fill="var(--yellow)"/><text x="74" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">1.0</text><text x="299.33333333333337" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">1.25</text><text x="524.6666666666667" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">1.5</text><text x="750" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">2.0</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">容量因子 c</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">占比 / %</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">丢弃的 dispatch 占比</text><rect x="189.5" y="86" width="10" height="10" fill="var(--yellow)"/><text x="204.5" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">补零行占执行量</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">路由形状为 E = 128、k = 8、8,192 个 token、一半专家为 1.5 倍热。两个百分比的口径不同：一个以总 dispatch 为分母，一个以执行行数为分母。</text>
</svg>