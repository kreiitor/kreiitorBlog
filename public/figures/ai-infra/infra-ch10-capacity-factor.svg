nt-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">1.5</text><text x="750" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">2.0</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">容量因子 c</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">占比 / %</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">丢弃的 dispatch 占比</text><rect x="189.5" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="204.5" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">补零行占执行量</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">路由形状为 E = 128、k = 8、8,192 个 token、一半专家为 1.5 倍热。两个百分比的口径不同：一个以总 dispatch 为分母，一个以执行行数为分母。</text>
</svg>