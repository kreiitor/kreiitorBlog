<svg xmlns="http://www.w3.org/2000/svg" width="800" height="379" viewBox="0 71 800 379" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">一次请求的三个时间指标</title>
  <desc id="fig-desc">请求到达、首个输出与末个输出把时间线切成 TTFT、输出间隔与完整请求时间三个区间。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:12px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:11px;fill:var(--muted,#5f4f3c)}
    .onblue{fill:var(--on-blue,#fffcf5)}
    .onyellow{fill:var(--on-yellow,#3b3024)}
  </style>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <line x1="90" y1="212" x2="720" y2="212" stroke="var(--ink,#3b3024)" stroke-width="2"/>

  <circle cx="110" cy="212" r="7" fill="var(--blue,#466b3f)"/>
  <circle cx="330" cy="212" r="7" fill="var(--yellow,#f5d75f)" stroke="var(--ink,#3b3024)" stroke-width="1.5"/>
  <circle cx="680" cy="212" r="7" fill="var(--blue,#466b3f)"/>

  <g fill="var(--yellow,#f5d75f)" stroke="var(--ink,#3b3024)" stroke-width="1.2">
    <circle cx="355" cy="212" r="4"/><circle cx="380" cy="212" r="4"/><circle cx="405" cy="212" r="4"/>
    <circle cx="430" cy="212" r="4"/><circle cx="455" cy="212" r="4"/><circle cx="480" cy="212" r="4"/>
    <circle cx="505" cy="212" r="4"/><circle cx="530" cy="212" r="4"/><circle cx="555" cy="212" r="4"/>
    <circle cx="580" cy="212" r="4"/><circle cx="605" cy="212" r="4"/><circle cx="630" cy="212" r="4"/>
    <circle cx="655" cy="212" r="4"/>
  </g>

  <path d="M110 122 V132 H680 V122" stroke="var(--blue,#466b3f)" stroke-width="2" fill="none"/>
  <text x="395" y="112" text-anchor="middle" class="b">完整请求时间 T_request</text>

  <path d="M110 162 V172 H330 V162" stroke="var(--yellow,#f5d75f)" stroke-width="2" fill="none"/>
  <text x="220" y="152" text-anchor="middle" class="b">TTFT 首响应</text>

  <path d="M330 262 V272 H680 V262" stroke="var(--blue,#466b3f)" stroke-width="2" fill="none"/>
  <text x="505" y="294" text-anchor="middle" class="b">输出间隔 T_token = (t_G − t_1) / (G − 1)</text>

  <text x="110" y="240" text-anchor="middle" class="s">请求到达 t_a</text>
  <text x="330" y="240" text-anchor="middle" class="s">首个输出 t_1</text>
  <text x="680" y="240" text-anchor="middle" class="s">末个输出 t_G</text>

  <rect x="90" y="330" width="300" height="70" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>
  <text x="110" y="356" class="b">TTFT 包含</text>
  <text x="110" y="378" class="s">排队 · 输入准备 · 首轮计算 · 返回</text>
  <text x="110" y="394" class="tiny">缩短排队只直接改善 TTFT</text>

  <rect x="410" y="330" width="300" height="70" rx="8" fill="var(--surface,#fffcf5)" stroke="#e4d6c5" stroke-width="1.5"/>
  <text x="430" y="356" class="b">输出间隔只看生成过程</text>
  <text x="430" y="378" class="s">从首个输出到末个输出</text>
  <text x="430" y="394" class="tiny">reasoning 模型另记首个有用输出</text>

  <text x="400" y="434" text-anchor="middle" class="tiny">三个区间共享起点，但回答的是不同问题。</text>
</svg>
