<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">TP2×EP4 的设备布局</title>
  <desc id="fig-desc">八张卡排成两行四列：组 0 到组 3 各占一列，组内两张卡分别负责专家中间维的左 768 维和右 768 维；偶数卡保存 KV 头 0、1，奇数卡保存 KV 头 2、3，同一列的注意力头与 KV 重复四份</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">TP2×EP4 的设备布局</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">四个专家组各两卡，同列重复保存 KV</text><text x="230.5" y="112" font-size="10.5" fill="var(--muted)" font-weight="700" text-anchor="middle">组 0</text><text x="383.5" y="112" font-size="10.5" fill="var(--muted)" font-weight="700" text-anchor="middle">组 1</text><text x="536.5" y="112" font-size="10.5" fill="var(--muted)" font-weight="700" text-anchor="middle">组 2</text><text x="689.5" y="112" font-size="10.5" fill="var(--muted)" font-weight="700" text-anchor="middle">组 3</text><text x="94" y="143.225" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">偶数卡（左 768 维</text><text x="94" y="157.4" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">）</text><rect x="157" y="129" width="147" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.1"/><text x="230.5" y="149" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">卡 0 · KV 头 0,1</text><rect x="310" y="129" width="147" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.1"/><text x="383.5" y="149" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">卡 2 · KV 头 0,1</text><rect x="463" y="129" width="147" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.1"/><text x="536.5" y="149" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">卡 4 · KV 头 0,1</text><rect x="616" y="129" width="147" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.1"/><text x="689.5" y="149" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">卡 6 · KV 头 0,1</text><text x="94" y="183.225" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">奇数卡（右 768 维</text><text x="94" y="197.4" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">）</text><rect x="157" y="169" width="147" height="34" rx="4" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.1"/><text x="230.5" y="189" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">卡 1 · KV 头 2,3</text><rect x="310" y="169" width="147" height="34" rx="4" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.1"/><text x="383.5" y="189" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">卡 3 · KV 头 2,3</text><rect x="463" y="169" width="147" height="34" rx="4" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.1"/><text x="536.5" y="189" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">卡 5 · KV 头 2,3</text><rect x="616" y="169" width="147" height="34" rx="4" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.1"/><text x="689.5" y="189" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">卡 7 · KV 头 2,3</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">专家编号 0–31、32–63、64–95、96–127 分属四组；每卡专家中间维为 768。</text>
</svg>