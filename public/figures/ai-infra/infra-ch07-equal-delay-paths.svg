<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">两路径时延相等时的到齐</title>
  <desc id="fig-desc">两条路径都在 0–1 μs 传播，报文到达后没有缺口等待，八个报文约在 1.33 μs 全部交付给应用</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="126" y1="96" x2="126" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="321.625" y1="96" x2="321.625" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="321.625" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0.5</text><line x1="517.25" y1="96" x2="517.25" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="517.25" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">1</text><line x1="712.875" y1="96" x2="712.875" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="712.875" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">1.5</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">路径 A</text><rect x="126" y="115" width="391.25" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="321.625" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">传播 1 μs</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">路径 B</text><rect x="126" y="157" width="391.25" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="321.625" y="176" font-size="9.5" fill="var(--on-yellow)" font-weight="600" text-anchor="middle">传播 1 μs</text><text x="116" y="219" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">应用交付</text><rect x="517.25" y="199" width="129.11250000000004" height="32" rx="3" fill="var(--surface)" stroke="var(--line)"/><text x="581.80625" y="218" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">全部到齐</text><line x1="126" y1="242" x2="752" y2="242" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="278" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">时间 / μs</text></svg>