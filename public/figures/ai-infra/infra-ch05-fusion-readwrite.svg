<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">算子融合减少中间读写</title>
  <desc id="fig-desc">三根堆叠柱：全部分开为 156 MiB，融合前两步为 108 MiB，三步融合为 60 MiB；每根柱的底部是 60 MiB 必要读写，中间 T 与顶部 Z 各 48 MiB</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="279.875" x2="750" y2="279.875" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="283.875" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">50</text><line x1="74" y1="201.75" x2="750" y2="201.75" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="205.75" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">100</text><line x1="74" y1="123.625" x2="750" y2="123.625" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="127.625" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">150</text><rect x="151.66666666666669" y="264.25" width="70" height="93.75" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="151.66666666666669" y="189.25" width="70" height="75" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><rect x="151.66666666666669" y="114.25" width="70" height="75" fill="var(--muted,#5f4f3c)" stroke="var(--muted,#5f4f3c)"/><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">全部分开</text><rect x="377.00000000000006" y="264.25" width="70" height="93.75" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="377.00000000000006" y="189.25" width="70" height="75" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><rect x="377.00000000000006" y="189.25" width="70" height="0" fill="var(--muted,#5f4f3c)" stroke="var(--muted,#5f4f3c)"/><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">融合前两步</text><rect x="602.3333333333334" y="264.25" width="70" height="93.75" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="602.3333333333334" y="264.25" width="70" height="0" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><rect x="602.3333333333334" y="264.25" width="70" height="0" fill="var(--muted,#5f4f3c)" stroke="var(--muted,#5f4f3c)"/><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">三步融合</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">融合程度</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">读写量 / MiB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">必要读写</text><rect x="144" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="159" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">中间 T</text><rect x="199.7" y="86" width="10" height="10" fill="var(--muted,#5f4f3c)"/><text x="214.7" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">中间 Z</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">G、U 为 BF16，最终输出占 1 byte/元素，量化 scale 预先给定；各方案采用相同的运算与舍入顺序。</text>
</svg>