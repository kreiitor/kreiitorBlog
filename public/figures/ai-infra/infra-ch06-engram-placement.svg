<svg xmlns="http://www.w3.org/2000/svg" width="800" height="352" viewBox="0 64 800 352" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Engram 表的三种放置</title>
  <desc id="fig-desc">三栏对比：主机内存方案用 DDR 存放两张表共 203 GB，经 PCIe 或 RDMA 往返取回；超节点各卡 HBM 方案把表分片到每卡，经一轮 NVLink 交换取回；掩模 ROM 方案把表放在约半片晶圆上，片内读取</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="34" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/><text x="151.33333333333331" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">主机内存</text><text x="151.33333333333331" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">两张表 203 GB</text><text x="46" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">token 序列 → 哈希 → 地址</text><text x="46" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">DDR 存放</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">PCIe／RDMA 往返</text><rect x="282.66666666666663" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="399.99999999999994" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">超节点各卡 HBM</text><text x="399.99999999999994" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">每卡分片</text><text x="294.66666666666663" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">同样的地址箭头</text><text x="294.66666666666663" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">HBM 分片</text><text x="294.66666666666663" y="217.89999999999998" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="217.89999999999998" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">NVLink 交换一轮</text><rect x="531.3333333333333" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="648.6666666666666" y="118" font-size="14" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">掩模 ROM</text><text x="648.6666666666666" y="136" font-size="10.5" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">约半片晶圆</text><text x="543.3333333333333" y="174" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="174" font-size="11.5" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="start">同样的地址箭头</text><text x="543.3333333333333" y="195.95" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="195.95" font-size="11.5" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="start">ROM 存放</text><text x="543.3333333333333" y="217.89999999999998" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="217.89999999999998" font-size="11.5" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="start">片内读取</text></svg>