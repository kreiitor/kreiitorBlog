<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">三方案的逻辑发送总量</title>
  <desc id="fig-desc">三根堆叠柱分别对应连续环、交错环、分层归约，总量都为 5760 MiB；连续环的跨服务器段为 720 MiB，交错环为 5760 MiB，分层归约为 384 MiB</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="274.6666666666667" x2="750" y2="274.6666666666667" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="278.6666666666667" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">2000</text><line x1="74" y1="191.33333333333334" x2="750" y2="191.33333333333334" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="195.33333333333334" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">4000</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">6000</text><rect x="151.66666666666669" y="148" width="70" height="210" fill="var(--blue)" stroke="var(--blue)"/><rect x="151.66666666666669" y="118" width="70" height="30" fill="var(--yellow)" stroke="var(--yellow)"/><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">连续环</text><rect x="377.00000000000006" y="358" width="70" height="0" fill="var(--blue)" stroke="var(--blue)"/><rect x="377.00000000000006" y="118" width="70" height="240" fill="var(--yellow)" stroke="var(--yellow)"/><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">交错环</text><rect x="602.3333333333334" y="134" width="70" height="224" fill="var(--blue)" stroke="var(--blue)"/><rect x="602.3333333333334" y="118" width="70" height="16" fill="var(--yellow)" stroke="var(--yellow)"/><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">分层归约</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">两方向合计</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">逻辑发送量 / MiB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">本地</text><rect x="130" y="86" width="10" height="10" fill="var(--yellow)"/><text x="145" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">跨服务器</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">数值为两个方向的合计；蓝色为本地段，橙色为跨服务器段。</text>
</svg>