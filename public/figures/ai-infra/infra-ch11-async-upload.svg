<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 73 800 230" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">异步上传后的连续进度</title>
  <desc id="fig-desc">三行三列表格：本地记录三轮都已保存；云端记录第 1、3 轮已保存，第 2 轮上传失败；云端进度只到第 1 轮，注明第 2 轮缺失、不能跳到第 3 轮</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><text x="239.33333333333331" y="112" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="700" text-anchor="middle">第 1 轮</text><text x="449.99999999999994" y="112" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="700" text-anchor="middle">第 2 轮</text><text x="660.6666666666666" y="112" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="700" text-anchor="middle">第 3 轮</text><text x="84" y="149" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">本地记录</text><rect x="137" y="129" width="204.66666666666666" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.1"/><text x="239.33333333333331" y="149" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">已保存</text><rect x="347.66666666666663" y="129" width="204.66666666666666" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.1"/><text x="449.99999999999994" y="149" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">已保存</text><rect x="558.3333333333333" y="129" width="204.66666666666666" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.1"/><text x="660.6666666666666" y="149" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">已保存</text><text x="84" y="189" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">云端记录</text><rect x="137" y="169" width="204.66666666666666" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.1"/><text x="239.33333333333331" y="189" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">已保存</text><rect x="347.66666666666663" y="169" width="204.66666666666666" height="34" rx="4" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.1"/><text x="449.99999999999994" y="189" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">上传失败</text><rect x="558.3333333333333" y="169" width="204.66666666666666" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.1"/><text x="660.6666666666666" y="189" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">已保存</text><text x="84" y="229" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">云端进度</text><rect x="137" y="209" width="204.66666666666666" height="34" rx="4" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.1"/><text x="239.33333333333331" y="229" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">到第 1 轮</text><rect x="347.66666666666663" y="209" width="204.66666666666666" height="34" rx="4" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.1"/><text x="449.99999999999994" y="229" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">缺少第 2 轮</text><rect x="558.3333333333333" y="209" width="204.66666666666666" height="34" rx="4" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.1"/><text x="660.6666666666666" y="229" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">不能跳到第 3 轮</text><text x="400" y="277" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">初始状态已在本地和云端保存；每列是一个 ReAct 轮次，横向排列不表示耗时。</text>
</svg>