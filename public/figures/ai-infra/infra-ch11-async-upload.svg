<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 73 800 230" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">异步上传后的连续进度</title>
  <desc id="fig-desc">三行三列表格：本地记录三轮都已保存；云端记录第 1、3 轮已保存，第 2 轮上传失败；云端进度只到第 1 轮，注明第 2 轮缺失、不能跳到第 3 轮</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><text x="239.33333333333331" y="112" font-size="10.5" fill="var(--muted,#596171)" font-weight="700" text-anchor="middle">第 1 轮</text><text x="449.99999999999994" y="112" font-size="10.5" fill="var(--muted,#596171)" font-weight="700" text-anchor="middle">第 2 轮</text><text x="660.6666666666666" y="112" font-size="10.5" fill="var(--muted,#596171)" font-weight="700" text-anchor="middle">第 3 轮</text><text x="84" y="149" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">本地记录</text><rect x="137" y="129" width="204.66666666666666" height="34" rx="4" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.1"/><text x="239.33333333333331" y="149" font-size="10.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">已保存</text><rect x="347.66666666666663" y="129" width="204.66666666666666" height="34" rx="4" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.1"/><text x="449.99999999999994" y="149" font-size="10.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">已保存</text><rect x="558.3333333333333" y="129" width="204.66666666666666" height="34" rx="4" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.1"/><text x="660.6666666666666" y="149" font-size="10.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">已保存</text><text x="84" y="189" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">云端记录</text><rect x="137" y="169" width="204.66666666666666" height="34" rx="4" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.1"/><text x="239.33333333333331" y="189" font-size="10.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">已保存</text><rect x="347.66666666666663" y="169" width="204.66666666666666" height="34" rx="4" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.1"/><text x="449.99999999999994" y="189" font-size="10.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">上传失败</text><rect x="558.3333333333333" y="169" width="204.66666666666666" height="34" rx="4" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.1"/><text x="660.6666666666666" y="189" font-size="10.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">已保存</text><text x="84" y="229" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">云端进度</text><rect x="137" y="209" width="204.66666666666666" height="34" rx="4" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.1"/><text x="239.33333333333331" y="229" font-size="10.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">到第 1 轮</text><rect x="347.66666666666663" y="209" width="204.66666666666666" height="34" rx="4" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.1"/><text x="449.99999999999994" y="229" font-size="10.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">缺少第 2 轮</text><rect x="558.3333333333333" y="209" width="204.66666666666666" height="34" rx="4" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.1"/><text x="660.6666666666666" y="229" font-size="10.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">不能跳到第 3 轮</text><text x="400" y="277" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">初始状态已在本地和云端保存；每列是一个 ReAct 轮次，横向排列不表示耗时。</text>
</svg>