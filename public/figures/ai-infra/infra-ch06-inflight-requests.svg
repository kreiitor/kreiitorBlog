<svg xmlns="http://www.w3.org/2000/svg" width="800" height="315" viewBox="0 68 800 315" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">在途请求的流水线</title>
  <desc id="fig-desc">四个请求沿时间轴依次排队，每个返回 256 字节；右侧标注往返 7.52 μs、允许 128 个请求同时在途。请求像流水线在制品一样，每个都要走完一个来回才返回</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="126" y1="96" x2="126" y2="284" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="126" y="300" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0</text><line x1="292.48936170212767" y1="96" x2="292.48936170212767" y2="284" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="292.48936170212767" y="300" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">2</text><line x1="458.97872340425533" y1="96" x2="458.97872340425533" y2="284" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="458.97872340425533" y="300" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">4</text><line x1="625.4680851063831" y1="96" x2="625.4680851063831" y2="284" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="625.4680851063831" y="300" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">6</text><line x1="752" y1="96" x2="752" y2="284" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="752" y="300" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">7.52</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">请求 0</text><rect x="126" y="115" width="626" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="439" y="134" font-size="9.5" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">256 B</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">请求 1</text><rect x="126" y="157" width="626" height="32" rx="3" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)"/><text x="439" y="176" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">256 B</text><text x="116" y="219" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">请求 2</text><rect x="126" y="199" width="626" height="32" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)"/><text x="439" y="218" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">256 B</text><text x="116" y="261" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">请求 3</text><rect x="126" y="241" width="626" height="32" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="439" y="260" font-size="9.5" fill="var(--on-yellow,#3b3024)" font-weight="600" text-anchor="middle">256 B</text><line x1="126" y1="284" x2="752" y2="284" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="320" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">往返时间（μs）</text><text x="400" y="357" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">图中四个请求仅用于展示过程；正文算例采用 128 个请求、每个 256 字节、往返 7.52 μs。</text>
</svg>