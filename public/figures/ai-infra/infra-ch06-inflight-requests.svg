<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">在途请求的流水线</title>
  <desc id="fig-desc">四个请求沿时间轴依次排队，每个返回 256 字节；右侧标注往返 7.52 μs、允许 128 个请求同时在途。请求像流水线在制品一样，每个都要走完一个来回才返回</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">在途请求的流水线</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">每个请求 256 字节，往返 7.52 μs，最多 128 个在途</text><line x1="126" y1="96" x2="126" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="292.48936170212767" y1="96" x2="292.48936170212767" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="292.48936170212767" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">2</text><line x1="458.97872340425533" y1="96" x2="458.97872340425533" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="458.97872340425533" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">4</text><line x1="625.4680851063831" y1="96" x2="625.4680851063831" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="625.4680851063831" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">6</text><line x1="752" y1="96" x2="752" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">7.52</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">请求 0</text><rect x="126" y="115" width="626" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="439" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">256 B</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">请求 1</text><rect x="126" y="157" width="626" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="439" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">256 B</text><text x="116" y="219" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">请求 2</text><rect x="126" y="199" width="626" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="439" y="218" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">256 B</text><text x="116" y="261" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">请求 3</text><rect x="126" y="241" width="626" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="439" y="260" font-size="9.5" fill="var(--on-yellow)" font-weight="600" text-anchor="middle">256 B</text><line x1="126" y1="284" x2="752" y2="284" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="320" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">往返时间（μs）</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">图中四个请求仅用于展示过程；正文算例采用 128 个请求、每个 256 字节、往返 7.52 μs。</text>
</svg>