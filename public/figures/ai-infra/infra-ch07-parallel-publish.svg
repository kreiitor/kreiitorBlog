<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 68 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">独立传输与发布并行</title>
  <desc id="fig-desc">两条并行条带：上面是写入 0–20 μs、恢复 20–100 μs、通知 100–102 μs；下面独立传输从 0 到 10 μs</desc>
