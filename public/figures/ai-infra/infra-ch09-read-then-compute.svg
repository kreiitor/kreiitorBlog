<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 68 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">先整份读入再开始计算</title>
  <desc id="fig-desc">时间线：PCIe 读取从 0 到 48.3 ms 连续进行，把整份 1.125 GiB 读入；GPU 计算在 48.3 ms 之后才开始，持续到 79.2 ms</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">0</text><line x1="284.0808080808081" y1="96" x2="284.0808080808081" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="284.0808080808081" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">20</text><line x1="442.16161616161617" y1="96" x2="442.16161616161617" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="442.16161616161617" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">40</text><line x1="600.2424242424242" y1="96" x2="600.2424242424242" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="600.2424242424242" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">60</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">79.2</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">PCIe 读取</text><rect x="126" y="115" width="381.76515151515144" height="32" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="316.88257575757575" y="134" font-size="9.5" fill="var(--on-yellow,#202735)" font-weight="600" text-anchor="middle">整份 1.125 GiB</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">GPU 计算</text><rect x="507.76515151515144" y="157" width="244.2348484848485" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="629.8825757575758" y="176" font-size="9.5" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">新 token 计算 30.9 ms</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">从开始执行计时 / ms</text></svg>