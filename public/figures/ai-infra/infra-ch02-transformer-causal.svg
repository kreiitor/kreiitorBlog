<svg xmlns="http://www.w3.org/2000/svg" width="800" height="356" viewBox="0 58 800 356" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">因果 Transformer 的层间依赖</title>
  <desc id="fig-desc">上下两排各有四个 token 位置；每个本层位置接收来自上一层同位置及更早位置的全部箭头，不再沿同一层横向传递</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="80" y1="110" x2="80" y2="330" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="110" x2="280" y2="330" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="110" x2="480" y2="330" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="110" x2="680" y2="330" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="280" y1="110" x2="280" y2="330" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="280" y1="110" x2="480" y2="330" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="280" y1="110" x2="680" y2="330" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="480" y1="110" x2="480" y2="330" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="480" y1="110" x2="680" y2="330" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="680" y1="110" x2="680" y2="330" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="80" y="114.125" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">上层 t1</text>
  <rect x="230" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="280" y="114.125" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">上层 t2</text>
  <rect x="430" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="480" y="114.125" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">上层 t3</text>
  <rect x="630" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="680" y="114.125" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">上层 t4</text>
  <rect x="30" y="306" width="100" height="48" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="80" y="334.125" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">本层 t1</text>
  <rect x="230" y="306" width="100" height="48" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="280" y="334.125" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">本层 t2</text>
  <rect x="430" y="306" width="100" height="48" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="480" y="334.125" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">本层 t3</text>
  <rect x="630" y="306" width="100" height="48" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="680" y="334.125" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">本层 t4</text>
  <text x="400" y="388" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">箭头从上一层的位置指向下一层的位置。</text>
</svg>