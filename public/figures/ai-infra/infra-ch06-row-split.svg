<svg xmlns="http://www.w3.org/2000/svg" width="800" height="327" viewBox="0 76 800 327" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">按行切分：部分和相加</title>
  <desc id="fig-desc">输入 [2,3] 的两个元素分别送入两张卡；卡 0 计算 2×[1,4]=[2,8]，卡 1 计算 3×[2,5]=[6,15]；两个部分和逐元素相加得到 [8,23]</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="109.5" y="104.5" width="210" height="112" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="214.5" y="165.375" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">输入 [2,3]</text>
  <rect x="480.5" y="104.5" width="210" height="112" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="585.5" y="157.25" font-size="13" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">卡 0</text>
  <text x="585.5" y="173.5" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">2 × [1,4] = [2,8]</text><rect x="109.5" y="267.5" width="210" height="112" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="214.5" y="320.25" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">卡 1</text>
  <text x="214.5" y="336.5" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">3 × [2,5] = [6,15]</text><rect x="480.5" y="267.5" width="210" height="112" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="585.5" y="320.25" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">逐元素求和</text>
  <text x="585.5" y="336.5" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">[8,23]</text><path d="M319.5 160.5 L480.5 160.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M214.5 216.5 L214.5 242 L214.5 242 L214.5 267.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M585.5 216.5 L585.5 242 L585.5 242 L585.5 267.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M319.5 323.5 L480.5 323.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/></svg>