<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">按行切分：部分和相加</title>
  <desc id="fig-desc">输入 [2,3] 的两个元素分别送入两张卡；卡 0 计算 2×[1,4]=[2,8]，卡 1 计算 3×[2,5]=[6,15]；两个部分和逐元素相加得到 [8,23]</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="109.5" y="104.5" width="210" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="214.5" y="165.375" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">输入 [2,3]</text>
  <rect x="480.5" y="104.5" width="210" height="112" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="585.5" y="157.25" font-size="13" fill="var(--on-blue)" font-weight="700" text-anchor="middle">卡 0</text>
  <text x="585.5" y="173.5" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">2 × [1,4] = [2,8]</text><rect x="109.5" y="267.5" width="210" height="112" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="214.5" y="320.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">卡 1</text>
  <text x="214.5" y="336.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">3 × [2,5] = [6,15]</text><rect x="480.5" y="267.5" width="210" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="585.5" y="320.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">逐元素求和</text>
  <text x="585.5" y="336.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">[8,23]</text><path d="M319.5 160.5 L480.5 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M214.5 216.5 L214.5 242 L214.5 242 L214.5 267.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M585.5 216.5 L585.5 242 L585.5 242 L585.5 267.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M319.5 323.5 L480.5 323.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/></svg>