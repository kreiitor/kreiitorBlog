<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 58 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">统一互联连接设备</title>
  <desc id="fig-desc">设备 0 与设备 1 各自包含计算与存储资源，中间由统一互联直接相连，箭头表示传递数据，不必先绕到主机再出去</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="80" y1="110" x2="500" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="80" y="114.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">设备 0</text>
  <rect x="450" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="500" y="114.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">设备 1</text>
  <text x="400" y="168" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">设备各自带有自己的计算与存储资源。</text>
</svg>