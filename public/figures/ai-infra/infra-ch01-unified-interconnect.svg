<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">统一互联连接设备</title>
  <desc id="fig-desc">设备 0 与设备 1 各自包含计算与存储资源，中间由统一互联直接相连，箭头表示传递数据，不必先绕到主机再出去</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="80" y1="110" x2="500" y2="110" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="86" width="100" height="48" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="80" y="114.125" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">设备 0</text>
  <rect x="450" y="86" width="100" height="48" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="500" y="114.125" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">设备 1</text>
  <text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">设备各自带有自己的计算与存储资源。</text>
</svg>