<svg xmlns="http://www.w3.org/2000/svg" width="800" height="376" viewBox="0 68 800 376" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">八块音频的播放时间线</title>
  <desc id="fig-desc">八条泳道对应块 1 至块 8；每块播放 20 毫秒，第三块比原定时刻晚到 5 毫秒，之后的播放依次顺延</desc>
