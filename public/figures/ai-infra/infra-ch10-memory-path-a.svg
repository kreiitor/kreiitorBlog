<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">先分配 KV 的显存峰值</title>
  <desc id="fig-desc">折线图：按训练结束、加载权重、分配 KV、释放训练状态、开始生成的顺序，显存占用从约 44 GiB 升到 59.3 GiB，再升到峰值 83.3 GiB，随后降到 43.3 GiB；74.5 GiB 为 H100 SXM 容量线</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">25</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">50</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">75</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">100</text><polyline points="74,248 243,209.75 412,149.75 581,249.75 750,249.75" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.4"/><circle cx="74" cy="248" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="243" cy="209.75" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="412" cy="149.75" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="581" cy="249.75" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="750" cy="249.75" r="3.2" fill="var(--blue,#466b3f)"/><polyline points="74,171.75 243,171.75 412,171.75 581,171.75 750,171.75" fill="none" stroke="var(--yellow,#f5d75f)" stroke-width="2.4"/><circle cx="74" cy="171.75" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="243" cy="171.75" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="412" cy="171.75" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="581" cy="171.75" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="750" cy="171.75" r="3.2" fill="var(--yellow,#f5d75f)"/><text x="74" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">训练结束</text><text x="243" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">加载权重</text><text x="412" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">分配 KV</text><text x="581" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">释放训练状态</text><text x="750" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">开始生成</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">操作顺序</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">显存占用 / GiB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">显存占用</text><rect x="144" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="159" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">H100 SXM 74.5 GiB</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">训练状态 40 GiB、生成权重 15.3 GiB、KV 池 24 GiB、共用开销 4 GiB；训练独占约 44 GiB，生成独占约 43.3 GiB。</text>
</svg>