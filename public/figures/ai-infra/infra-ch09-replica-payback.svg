w)"/><circle cx="299.33333333333337" cy="406.5833333333333" r="3.2" fill="var(--yellow)"/><circle cx="412" cy="382.53333333333336" r="3.2" fill="var(--yellow)"/><circle cx="524.6666666666667" cy="354.48333333333335" r="3.2" fill="var(--yellow)"/><circle cx="637.3333333333334" cy="286.35" r="3.2" fill="var(--yellow)"/><circle cx="750" cy="206.2" r="3.2" fill="var(--yellow)"/><text x="74" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">0</text><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">3</text><text x="299.33333333333337" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">10</text><text x="412" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">16</text><text x="524.6666666666667" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">23</text><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">40</text><text x="750" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">60</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">热点持续的批数</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">累计净节省 / ms</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">同一台 HGX 内经 NVLink</text><rect x="197.20000000000002" y="86" width="10" height="10" fill="var(--yellow)"/><text x="212.20000000000002" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">跨服务器经 ConnectX-7</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">七张接收卡各需额外 36 MiB；曲线使用未四舍五入的复制与每批节省时间，并假设热点不变。</text>
</svg>