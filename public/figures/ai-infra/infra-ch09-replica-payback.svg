="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">同一台 HGX 内经 NVLink</text><rect x="197.20000000000002" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="212.20000000000002" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">跨服务器经 ConnectX-7</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">七张接收卡各需额外 36 MiB；曲线使用未四舍五入的复制与每批节省时间，并假设热点不变。</text>
