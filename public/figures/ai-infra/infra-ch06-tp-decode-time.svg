"30.583333333333332" fill="var(--blue)" stroke="var(--blue)"/><rect x="630.5" y="315.0833333333333" width="70" height="12.333333333333334" fill="var(--yellow)" stroke="var(--yellow)"/><text x="665.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">TP8</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">一次 decode 的时间（ms）</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">本地</text><rect x="130" y="86" width="10" height="10" fill="var(--yellow)"/><text x="145" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">归约</text></svg>