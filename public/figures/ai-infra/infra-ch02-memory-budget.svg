rt">•</text><text x="306.66666666666663" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">工作区预留</text><text x="294.66666666666663" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">单请求 KV（8K）</text><rect x="531.3333333333333" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="648.6666666666666" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">70B 4-bit</text><text x="648.6666666666666" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">H100 SXM · 80 GB</text><text x="543.3333333333333" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">权重段</text><text x="543.3333333333333" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">工作区预留</text><text x="543.3333333333333" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">单请求 KV（8K）</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">KV 采用 BF16，上下文长度 8192；固定预留为 2 GiB。</text>
</svg>