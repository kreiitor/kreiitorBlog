<svg xmlns="http://www.w3.org/2000/svg" width="800" height="366" viewBox="0 58 800 366" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">按队列预取与换出</title>
  <desc id="fig-desc">界面分三块：左侧等待队列 J1 执行中，J2 到 J6 排队；中间主机内存四个位置放 KV J2、KV J4、空位、KV J6；右侧本地 SSD 放 KV J5、KV J8、KV J3 和一个空位；动作是从 SSD 读入 J3、把 J6 换出到 SSD</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="36" y="86" width="728" height="314" rx="10" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.8"/><rect x="36" y="86" width="728" height="30" rx="10" fill="var(--line-soft,#dce1e8)" stroke="var(--line,#a2aec1)" stroke-width="1.2"/><rect x="36" y="106" width="728" height="10" fill="var(--line-soft,#dce1e8)"/><text x="50" y="106" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="start">缓存调度</text><rect x="50.56" y="145.6" width="203.84000000000003" height="226.79999999999998" rx="6" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.4"/><text x="152.48000000000002" y="255.95" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">等待队列 J1 执行中 J2 · J3 · J4</text><text x="152.48000000000002" y="270.8" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">J5 · J6</text><rect x="283.52" y="145.6" width="218.4" height="226.79999999999998" rx="6" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="392.71999999999997" y="255.95" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">主机内存 KV J2 · KV J4 · 空位 · KV</text><text x="392.71999999999997" y="270.8" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">J6</text><rect x="531.04" y="145.6" width="218.4" height="226.79999999999998" rx="6" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.4"/><text x="640.24" y="255.95" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">本地 SSD KV J5 · KV J8 · KV J3 ·</text><text x="640.24" y="270.8" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">空位 读入 J3 ← · → 换出 J6</text></svg>