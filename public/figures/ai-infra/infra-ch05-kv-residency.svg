<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">KV 驻留与读取的变化</title>
  <desc id="fig-desc">两栏柱状对比：8K 全局 KV 驻留中 V4-Flash 为 27.455 MiB，V4.1 Flash 为 6.953 MiB；8K 注意力 KV 与索引读取中 V4-Flash 为 12.556 MiB，V4.1 Flash 为 11.375 MiB</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="274.6666666666667" x2="750" y2="274.6666666666667" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="278.6666666666667" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="191.33333333333334" x2="750" y2="191.33333333333334" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="195.33333333333334" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">30</text><rect x="209" y="129.20833333333334" width="32" height="228.79166666666666" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="226" y="123.20833333333334" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">27.455</text><rect x="243" y="300.05833333333334" width="32" height="57.94166666666667" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="260" y="294.05833333333334" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">6.953</text><text x="243" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">8K 全局 KV 驻留</text><rect x="547" y="253.36666666666667" width="32" height="104.63333333333333" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="564" y="247.36666666666667" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">12.556</text><rect x="581" y="263.20833333333337" width="32" height="94.79166666666666" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="598" y="257.20833333333337" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">11.375</text><text x="581" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">8K 注意力 KV 与索引读取</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">指标</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">容量 / MiB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--yellow,#ffe04b)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">V4-Flash</text><rect x="146.8" y="86" width="10" height="10" fill="var(--blue,#2647d7)"/><text x="161.8" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">V4.1 Flash</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">全局驻留与逐层逻辑读取分开比较；上方仅计全局 KV 容量，下方读取包含全局条目、局部窗口和索引；数值按生产布局计算。</text>
</svg>