<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">图重放的 3 次 FFN</title>
  <desc id="fig-desc">3 次 graph launch 对应 18 个加速器 kernel；主机提交次数降到 3，加速器仍执行原图的 18 个节点</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="288.55555555555554" x2="750" y2="288.55555555555554" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="292.55555555555554" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">5</text><line x1="74" y1="219.11111111111111" x2="750" y2="219.11111111111111" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="223.11111111111111" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="149.66666666666666" x2="750" y2="149.66666666666666" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="153.66666666666666" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">15</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">18</text><rect x="208" y="316.3333333333333" width="68" height="41.666666666666664" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="243" y="310.3333333333333" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">3</text><text x="243" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">主机 graph launch</text><rect x="546" y="108" width="68" height="250" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="581" y="102" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">18</text><text x="581" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">加速器 kernel</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">事件类型</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">次数</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">事件数</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">本图按自身采集范围标出真实时间。</text>
</svg>