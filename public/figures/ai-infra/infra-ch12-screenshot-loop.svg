<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">截图 Agent 的逐轮闭环</title>
  <desc id="fig-desc">截图 v、上传与模型判断、执行操作、更新界面 v+1 四个环节首尾相连；更新界面后返回截图，进入下一轮</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><path d="M400 130 Q525 190 650 250" fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><path d="M650 250 Q525 310 400 370" fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 370 Q275 310 150 250.00000000000003" fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><path d="M150 250.00000000000003 Q275 190 400 130" fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="102" width="132" height="56" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="400" y="127.25" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">① 截图 v</text>
  <text x="400" y="141" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">读取当前界面</text><rect x="584" y="222" width="132" height="56" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="650" y="247.25" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">② 上传与判断</text>
  <text x="650" y="261" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">模型决定动作</text><rect x="334" y="342" width="132" height="56" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="400" y="367.25" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">③ 执行操作</text>
  <text x="400" y="381" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">点击或输入</text><rect x="84" y="222.00000000000003" width="132" height="56" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="150" y="247.25000000000003" font-size="11" fill="var(--on-blue)" font-weight="700" text-anchor="middle">④ 更新界面 v+1</text>
  <text x="150" y="261" font-size="10" fill="var(--on-blue)" font-weight="400" text-anchor="middle">产生下一轮输入</text><text x="400" y="250" font-size="12" fill="var(--muted)" font-weight="600" text-anchor="middle">下一轮从新截图开始</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">方框宽度不表示耗时；操作与界面更新在终端完成，模型判断在远端完成。</text>
</svg>