(--yellow,#f5d75f)"/><text x="598" y="326.1666666666667" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">0.31</text><text x="581" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">阶段 3</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">流水阶段</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">激活与收发缓冲峰值 / GB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">填满排空</text><rect x="144" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="159" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">1F1B</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">图面列出有明确数值的阶段 0 与阶段 3；阶段 1、2 的逐阶段数值未给出。最大值按 2.57 GB 与 0.97 GB 计。</text>
</svg>