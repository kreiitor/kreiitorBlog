<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">两种调度的激活峰值</title>
  <desc id="fig-desc">分组柱状图：阶段 0 的峰值在填满排空下为 1,840 MiB、1F1B 下为 921 MiB；阶段 3 分别为 2,448 MiB 与 308 MiB；整体最大值从约 2.57 GB 降到 0.97 GB</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="274.6666666666667" x2="750" y2="274.6666666666667" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="278.6666666666667" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">1</text><line x1="74" y1="191.33333333333334" x2="750" y2="191.33333333333334" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="195.33333333333334" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">2</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">3</text><rect x="209" y="204.66666666666666" width="32" height="153.33333333333334" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="226" y="198.66666666666666" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">1.84</text><rect x="243" y="281.3333333333333" width="32" height="76.66666666666667" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="260" y="275.3333333333333" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">0.92</text><text x="243" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">阶段 0</text><rect x="547" y="153.83333333333331" width="32" height="204.16666666666669" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="564" y="147.83333333333331" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">2.45</text><rect x="581" y="332.1666666666667" width="32" height="25.833333333333332" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="598" y="326.1666666666667" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">0.31</text><text x="581" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">阶段 3</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">流水阶段</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">激活与收发缓冲峰值 / GB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">填满排空</text><rect x="144" y="86" width="10" height="10" fill="var(--yellow)"/><text x="159" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">1F1B</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">图面列出有明确数值的阶段 0 与阶段 3；阶段 1、2 的逐阶段数值未给出。最大值按 2.57 GB 与 0.97 GB 计。</text>
</svg>