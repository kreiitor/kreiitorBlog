<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">交错环的跨服务器边</title>
  <desc id="fig-desc">参与者按服务器 A、服务器 B 交替排列为 0、8、1、9、2、10 等，任意相邻两点都分属不同服务器，因此十六条有向边全部跨服务器，十六张网卡都在发送</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">交错环的跨服务器边</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">0、8、1、9 交替排列，十六张网卡全部工作</text><rect x="109.5" y="186" width="210" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="214.5" y="238.75" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">服务器 A</text>
  <text x="214.5" y="255" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">0、1、2 … 交错</text><rect x="480.5" y="186" width="210" height="112" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="585.5" y="238.75" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">服务器 B</text>
  <text x="585.5" y="255" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">8、9、10 … 交错</text><path d="M319.5 242 L480.5 242" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M480.5 242 L319.5 242" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">交错排列不改变总发送量，改变的是流量在网卡之间的分布。</text>
</svg>