<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">提前读入前 14 层后的执行</title>
  <desc id="fig-desc">时间线：在开始执行前先读入前 14 层共 448 MiB；执行开始后只剩少量读取，GPU 计算连续进行 30.9 ms</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">提前读入前 14 层后的执行</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">448 MiB 预读，其余 22 层读取被计算掩盖</text><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="265.1111111111111" y1="96" x2="265.1111111111111" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="265.1111111111111" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">10</text><line x1="404.22222222222223" y1="96" x2="404.22222222222223" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="404.22222222222223" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">20</text><line x1="543.3333333333333" y1="96" x2="543.3333333333333" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="543.3333333333333" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">30</text><line x1="682.4444444444445" y1="96" x2="682.4444444444445" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="682.4444444444445" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">40</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">45</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">上一批预读</text><rect x="126" y="115" width="194.75555555555556" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="223.3777777777778" y="134" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">前 14 层 448 MiB</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">GPU 计算</text><rect x="320.7555555555556" y="157" width="429.8533333333333" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="535.6822222222222" y="176" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">连续计算 30.9 ms</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">从开始执行计时 / ms（预读在 0 之前）</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">三幅预热图使用相同横轴；缓冲区按整层向上取整为 14 层。</text>
</svg>