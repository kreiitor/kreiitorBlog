<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Kimi K3 的 MLA 状态容量</title>
  <desc id="fig-desc">两根柱：紧凑潜变量 216.00 MiB，展开各头 KV 11,520.00 MiB；后者约为前者的 53 倍</desc>
  <style>
