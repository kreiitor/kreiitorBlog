<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 64 800 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">环形与树形归约的取舍</title>
  <desc id="fig-desc">双对数坐标下比较两种算法：环形每轮传 M/n、共 2(n−1) 轮，树形每轮传完整 M、共 2log2 n 轮；两条曲线在约 680 KiB 处相交，10 KiB 的 decode 输入落在左侧，80 MiB 的 prefill 输入落在右侧</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="34" y="92" width="359" height="3" fill="var(--blue,#2647d7)"/><rect x="34" y="92" width="359" height="300" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="213.5" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">环形</text><text x="213.5" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">2(n−1) 轮，每轮 M/n</text><text x="46" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">每卡发送 2(n−1)M/n</text><text x="46" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">小消息受启动开销主导</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">适合 80 MiB 的 prefill</text><rect x="407" y="92" width="359" height="3" fill="var(--yellow,#ffe04b)"/><rect x="407" y="92" width="359" height="300" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="586.5" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">二项树</text><text x="586.5" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">2log2 n 轮，每轮 M</text><text x="419" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">轮数少，关键路径短</text><text x="419" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">小消息时更快</text><text x="419" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">大消息时反复传完整张量</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line,#a2aec1)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">小消息</text><text x="730" y="400" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">大消息</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">每轮启动开销 0.822 μs，每方向带宽 450 GB/s；交点约 680 KiB。</text>
</svg>