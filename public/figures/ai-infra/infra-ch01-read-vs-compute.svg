<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 64 800 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">读取下界与计算下界的对比</title>
  <desc id="fig-desc">三组条件对比：原加速器读取下界 20.90 ms、计算下界很小；算力翻倍后读取仍 20.90 ms、计算更小；带宽翻倍后读取降到 10.45 ms、计算仍很小</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="34" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/><text x="151.33333333333331" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">原加速器</text><text x="151.33333333333331" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">读取主导</text><text x="46" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">权重读取 20.90 ms</text><text x="46" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">矩阵计算很小，贴近 0</text><rect x="282.66666666666663" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="399.99999999999994" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">算力翻倍</text><text x="399.99999999999994" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">读取不变</text><text x="294.66666666666663" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">权重读取 20.90 ms</text><text x="294.66666666666663" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">矩阵计算更小</text><rect x="531.3333333333333" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/><text x="648.6666666666666" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">带宽翻倍</text><text x="648.6666666666666" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">读取减半</text><text x="543.3333333333333" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">权重读取 10.45 ms</text><text x="543.3333333333333" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">矩阵计算仍很小</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">各柱表示计算或数据读取的时间下界，完整执行仍须满足依赖关系。</text>
</svg>