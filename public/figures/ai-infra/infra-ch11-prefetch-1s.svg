<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 68 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">预测正确并提前 1 秒</title>
  <desc id="fig-desc">横轴 0–6 秒，环境准备占第 3–5 秒；调用在第 4 秒到达，环境第 5 秒就绪，仍需等待 1 秒</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0</text><line x1="334.66666666666663" y1="96" x2="334.66666666666663" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="334.66666666666663" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">2</text><line x1="543.3333333333333" y1="96" x2="543.3333333333333" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="543.3333333333333" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">4</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">6</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">环境准备</text><rect x="439" y="115" width="208.66666666666666" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="543.3333333333334" y="134" font-size="9.5" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">准备 2 s</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">调用等待</text><rect x="543.3333333333333" y="157" width="104.33333333333333" height="32" rx="3" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)"/><text x="595.4999999999999" y="176" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">1 s</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">时间 / s</text></svg>