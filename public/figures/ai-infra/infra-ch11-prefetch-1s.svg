<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">预测正确并提前 1 秒</title>
  <desc id="fig-desc">横轴 0–6 秒，环境准备占第 3–5 秒；调用在第 4 秒到达，环境第 5 秒就绪，仍需等待 1 秒</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">预测正确并提前 1 秒</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">第 3 秒准备，调用到达后仍等 1 秒</text><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="334.66666666666663" y1="96" x2="334.66666666666663" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="334.66666666666663" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">2</text><line x1="543.3333333333333" y1="96" x2="543.3333333333333" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="543.3333333333333" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">4</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">6</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">环境准备</text><rect x="439" y="115" width="208.66666666666666" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="543.3333333333334" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">准备 2 s</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">调用等待</text><rect x="543.3333333333333" y="157" width="104.33333333333333" height="32" rx="3" fill="var(--surface)" stroke="var(--line)"/><text x="595.4999999999999" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">1 s</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">时间 / s</text></svg>