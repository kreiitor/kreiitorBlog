<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">物理连接的两层视图</title>
  <desc id="fig-desc">上层是数据中心网络，连接入口与共享存储、其他超节点；下层放大一个超节点，内部包含 CPU 与主存、网卡、两个 GPU 与显存，由内部互联连接</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">物理连接的两层视图</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">数据中心网络连接服务与超节点，超节点内部由内部互联连接</text><rect x="40" y="180" width="720" height="58" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="212" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">数据中心网络</text><rect x="254" y="189" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="329" y="212" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">入口与共享存储</text><rect x="532" y="189" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="607" y="212" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">其他超节点</text><rect x="40" y="246" width="720" height="58" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="54" y="278" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">超节点内部</text><rect x="194" y="255" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="259.5" y="278" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">CPU 与主存</text><rect x="333" y="255" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="398.5" y="278" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">网卡</text><rect x="472" y="255" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="537.5" y="278" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">GPU 与显存 ×2</text><rect x="611" y="255" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="676.5" y="278" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">内部互联</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">线条表示数据路径，设备数量仅用于示意。</text>
</svg>