<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">迁移收益的回本点</title>
  <desc id="fig-desc">两条直线斜率均为每轮 0.4 秒：恢复 1 秒从约 −7.7 秒开始，第 20 轮穿过零线；恢复 2 秒从约 −8.7 秒开始，第 22 轮穿过零线</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">迁移收益的回本点</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">每轮节省 0.4 秒，恢复时间不同则截距不同</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="289.5443592552026" x2="750" y2="289.5443592552026" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="293.5443592552026" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">2.5</text><line x1="74" y1="221.08871851040527" x2="750" y2="221.08871851040527" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="225.08871851040527" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">5</text><line x1="74" y1="152.6330777656079" x2="750" y2="152.6330777656079" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="156.6330777656079" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">7.5</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">9.13</text><polyline points="74,568.8433734939758 209.2,459.3143483023001 344.4,349.7853231106243 479.59999999999997,327.87951807228916 614.8,240.25629791894852 750,130.72727272727275" fill="none" stroke="var(--blue)" stroke-width="2.4"/><circle cx="74" cy="568.8433734939758" r="3.2" fill="var(--blue)"/><circle cx="209.2" cy="459.3143483023001" r="3.2" fill="var(--blue)"/><circle cx="344.4" cy="349.7853231106243" r="3.2" fill="var(--blue)"/><circle cx="479.59999999999997" cy="327.87951807228916" r="3.2" fill="var(--blue)"/><circle cx="614.8" cy="240.25629791894852" r="3.2" fill="var(--blue)"/><circle cx="750" cy="130.72727272727275" r="3.2" fill="var(--blue)"/><polyline points="74,596.2256297918948 209.2,486.6966046002191 344.4,377.16757940854325 479.59999999999997,355.2617743702081 614.8,267.6385542168675 750,158.1095290251917" fill="none" stroke="var(--yellow)" stroke-width="2.4"/><circle cx="74" cy="596.2256297918948" r="3.2" fill="var(--yellow)"/><circle cx="209.2" cy="486.6966046002191" r="3.2" fill="var(--yellow)"/><circle cx="344.4" cy="377.16757940854325" r="3.2" fill="var(--yellow)"/><circle cx="479.59999999999997" cy="355.2617743702081" r="3.2" fill="var(--yellow)"/><circle cx="614.8" cy="267.6385542168675" r="3.2" fill="var(--yellow)"/><circle cx="750" cy="158.1095290251917" r="3.2" fill="var(--yellow)"/><text x="74" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">0</text><text x="209.2" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">10</text><text x="344.4" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">20</text><text x="479.59999999999997" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">22</text><text x="614.8" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">30</text><text x="750" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">40</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">迁移后完成轮数</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">累计净节省 / s</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">恢复 1 s</text><rect x="145.39999999999998" y="86" width="10" height="10" fill="var(--yellow)"/><text x="160.39999999999998" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">恢复 2 s</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">迁移 64 MiB 状态，链路 80 Mbit/s；净节省为 N×0.4 减去传输与恢复时间。</text>
