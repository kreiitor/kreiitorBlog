lue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="165.125" y="218" font-size="9.5" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">1 s</text><text x="116" y="261" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">加速模型 · 环境</text><rect x="126" y="241" width="211.275" height="32" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="231.6375" y="260" font-size="9.5" fill="var(--on-yellow,#3b3024)" font-weight="600" text-anchor="middle">2.7 s</text><text x="116" y="303" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">加速模型 · 额外等待</text><rect x="204.25" y="283" width="133.025" height="32" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)"/><text x="270.7625" y="302" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">约 1.7 s</text><line x1="126" y1="326" x2="752" y2="326" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="362" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">从模型开始计时 / s</text></svg>