<svg xmlns="http://www.w3.org/2000/svg" width="800" height="321" viewBox="0 68 800 321" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">环境创建成为新的等待来源</title>
  <desc id="fig-desc">横轴 0–8 秒，两组时间条：快速服务下模型 0–6 秒与环境创建 0–2.7 秒并行；加速模型下模型 0–1 秒与环境创建 0–2.7 秒并行，模型结束后多出 1.7 秒额外等待</desc>
