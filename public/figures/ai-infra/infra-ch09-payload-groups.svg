yellow,#f5d75f)"/><text x="344.5" y="302" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">8</text><text x="327.5" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">组 1</text><rect x="462.5" y="258" width="32" height="100" rx="3" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue-soft,#e8f0e2)"/><text x="479.5" y="252" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">16</text><rect x="496.5" y="308" width="32" height="50" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="513.5" y="302" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">8</text><text x="496.5" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">组 2</text><rect x="631.5" y="258" width="32" height="100" rx="3" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue-soft,#e8f0e2)"/><text x="648.5" y="252" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">16</text><rect x="665.5" y="308" width="32" height="50" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="682.5" y="302" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">8</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">组 3</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">专家组</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">每组每方向载荷 / MiB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue-soft,#e8f0e2)"/><text x="97" y="95" font-size="10" fill="var(--mu