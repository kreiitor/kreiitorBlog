<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 57 800 370" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">四个专家组的每方向载荷</title>
  <desc id="fig-desc">分组柱状图：均衡分布下四个专家组各接收 16 MiB；热点分布下组 0 为 40 MiB，其余三组各 8 MiB；两种分布总计都是每方向 64 MiB</desc>
  <style>
