<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">逐层预加载仍由读取决定</title>
  <desc id="fig-desc">时间线：36 层逐层读取，每层读取 1.34 ms，计算 0.857 ms；每层计算都要等该层读取完成，整条时间线到约 49.2 ms 结束</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">逐层预加载仍由读取决定</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">每层读取 1.34 ms，计算 0.857 ms</text><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="253.2357723577236" y1="96" x2="253.2357723577236" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="253.2357723577236" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">10</text><line x1="380.4715447154472" y1="96" x2="380.4715447154472" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="380.4715447154472" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">20</text><line x1="507.7073170731707" y1="96" x2="507.7073170731707" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="507.7073170731707" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">30</text><line x1="634.9430894308944" y1="96" x2="634.9430894308944" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="634.9430894308944" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">40</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">49.2</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">PCIe 读取</text><rect x="126" y="115" width="614.5487804878048" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="433.2743902439024" y="134" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">36 层 × 1.34 ms</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">GPU 计算</text><rect x="143.0750406504065" y="157" width="10.904105691056907" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><rect x="431.3658536585366" y="157" width="10.904105691056902" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><rect x="740.5487804878048" y="157" width="10.904105691056902" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">从开始执行计时 / ms</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">36 层，每层历史 KV 32 MiB；读取总量 48.3 ms，计算总量 30.9 ms。</text>
</svg>