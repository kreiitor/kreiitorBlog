<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">同一历史的三种更新方式</title>
  <desc id="fig-desc">三种更新方式对照：追加复用原 8K 并新增 1K；改写开头使 9K 全部重新处理；总结历史把历史压成 2K 摘要再加 1K 新增，并另计总结工作</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">同一历史的三种更新方式</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">追加、改写开头、总结历史各自付不同的代价</text><rect x="34" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="151.33333333333331" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">追加</text><text x="151.33333333333331" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">新内容接在末尾</text><text x="46" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">复用原 8K</text><text x="46" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">新增 1K</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">无额外准备</text><rect x="282.66666666666663" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/><text x="399.99999999999994" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">改写开头</text><text x="399.99999999999994" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">改动最前面的指令</text><text x="294.66666666666663" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">无可复用前缀</text><text x="294.66666666666663" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">重新处理 9K</text><text x="294.66666666666663" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">算力代价最高</text><rect x="531.3333333333333" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="648.6666666666666" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">总结历史</text><text x="648.6666666666666" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">把历史压成摘要</text><text x="543.3333333333333" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">摘要 2K 加新增 1K</text><text x="543.3333333333333" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">另计一次总结</text><text x="543.3333333333333" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">内存占用最低</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">长度以 K token 示意；总结方式的可复用前缀为 0，因为摘要本身已经改变。</text>
</svg>