<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">三种机器的单用户每 token 时间</title>
  <desc id="fig-desc">三根横向堆叠条对应 8 张 H100、58 张 B200 和两片 ROM 晶圆；存储与计算段分别为 2689、165、77 μs，集合通信段分别为 76、562、159 μs；条右端速度分别为 362、1357、4070 token/s</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="286.57142857142856" x2="750" y2="286.57142857142856" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="290.57142857142856" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">1000</text><line x1="74" y1="215.14285714285714" x2="750" y2="215.14285714285714" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="219.14285714285714" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">2000</text><line x1="74" y1="143.71428571428572" x2="750" y2="143.71428571428572" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="147.71428571428572" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">3000</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">3500</text><rect x="151.66666666666669" y="165.92857142857144" width="70" height="192.07142857142856" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><rect x="151.66666666666669" y="160.5" width="70" height="5.428571428571429" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">8 张 H100／权重在 HBM</text><rect x="377.00000000000006" y="346.2142857142857" width="70" height="11.785714285714286" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><rect x="377.00000000000006" y="306.07142857142856" width="70" height="40.14285714285714" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">58 张 B200／权重在 HBM</text><rect x="602.3333333333334" y="352.5" width="70" height="5.5" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><rect x="602.3333333333334" y="341.14285714285717" width="70" height="11.357142857142858" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">两片 ROM 晶圆／权重在 ROM</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">单用户每 token 时间（μs）</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#2647d7)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">存储与计算</text><rect x="151" y="86" width="10" height="10" fill="var(--yellow,#ffe04b)"/><text x="166" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">集合通信</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">固定延迟未在图中单独列出；速度按条右端标出。</text>
</svg>