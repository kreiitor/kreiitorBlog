<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">三种机器的单用户每 token 时间</title>
  <desc id="fig-desc">三根横向堆叠条对应 8 张 H100、58 张 B200 和两片 ROM 晶圆；存储与计算段分别为 2689、165、77 μs，集合通信段分别为 76、562、159 μs；条右端速度分别为 362、1357、4070 token/s</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="286.57142857142856" x2="750" y2="286.57142857142856" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="290.57142857142856" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">1000</text><line x1="74" y1="215.14285714285714" x2="750" y2="215.14285714285714" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="219.14285714285714" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">2000</text><line x1="74" y1="143.71428571428572" x2="750" y2="143.71428571428572" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="147.71428571428572" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">3000</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">3500</text><rect x="151.66666666666669" y="165.92857142857144" width="70" height="192.07142857142856" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="151.66666666666669" y="160.5" width="70" height="5.428571428571429" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">8 张 H100／权重在 HBM</text><rect x="377.00000000000006" y="346.2142857142857" width="70" height="11.785714285714286" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="377.00000000000006" y="306.07142857142856" width="70" height="40.14285714285714" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">58 张 B200／权重在 HBM</text><rect x="602.3333333333334" y="352.5" width="70" height="5.5" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="602.3333333333334" y="341.14285714285717" width="70" height="11.357142857142858" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">两片 ROM 晶圆／权重在 ROM</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">单用户每 token 时间（μs）</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">存储与计算</text><rect x="151" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="166" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">集合通信</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">固定延迟未在图中单独列出；速度按条右端标出。</text>
</svg>