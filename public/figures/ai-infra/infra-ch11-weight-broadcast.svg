<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 58 800 386" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">六实例共用 200 Gbit/s 出口</title>
  <desc id="fig-desc">左侧发送端为 200 Gbit/s，向右侧六个接收实例各发一份 16.38 GB 权重；每个接收实例接口为 50 Gbit/s，六路共传 98.3 GB，单份至少 2.62 秒，全部至少 3.93 秒</desc>
