<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">数据路径与控制路径的三种组织方式</title>
  <desc id="fig-desc">普通路径的载荷经过主机内存；GPUDirect RDMA 让网卡直接读写 GPU 内存但仍由 CPU 提交；设备发起则让 GPU 自己提交请求并检查完成。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink)}
    .sub{font-size:14px;fill:var(--muted)}
    .h{font-size:16px;font-weight:700;fill:var(--ink)}
    .b{font-size:13px;font-weight:600;fill:var(--ink)}
    .s{font-size:12px;fill:var(--muted)}
    .tiny{font-size:11px;fill:var(--muted)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
    <marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--muted)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="36" text-anchor="middle" class="title">分开数据路径与控制路径</text>
  <text x="400" y="62" text-anchor="middle" class="sub">GPUDirect RDMA 让载荷绕过主机内存；设备发起让 GPU 自己提交请求与读取完成状态</text>

  <line x1="640" y1="80" x2="680" y2="80" stroke="var(--blue)" stroke-width="2.4"/>
  <text x="688" y="84" class="tiny">数据</text>
  <line x1="640" y1="96" x2="680" y2="96" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="688" y="100" class="tiny">控制</text>

  <text x="28" y="128" class="b">① CPU 提交：载荷经主机内存</text>
  <rect x="28" y="140" width="100" height="48" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="78" y="170" text-anchor="middle" class="tiny">GPU A</text>
  <rect x="158" y="140" width="120" height="48" rx="7" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="218" y="162" text-anchor="middle" class="tiny">主机内存</text>
  <text x="218" y="180" text-anchor="middle" class="tiny">（中转）</text>
  <rect x="308" y="140" width="90" height="48" rx="7" fill="var(--surface)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="353" y="170" text-anchor="middle" class="tiny">网卡 A</text>
  <rect x="428" y="140" width="90" height="48" rx="7" fill="var(--surface)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="473" y="170" text-anchor="middle" class="tiny">网卡 B</text>
  <rect x="548" y="140" width="100" height="48" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="598" y="170" text-anchor="middle" class="tiny">GPU B</text>

  <path d="M128 164 L158 164" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M278 164 L308 164" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M398 164 L428 164" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M518 164 L548 164" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M353 118 L353 140" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="353" y="112" text-anchor="middle" class="tiny">CPU 提交</text>

  <text x="28" y="230" class="b">② GPUDirect RDMA：载荷绕过主机内存，仍由 CPU 提交</text>
  <rect x="28" y="242" width="100" height="48" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="78" y="272" text-anchor="middle" class="tiny">GPU A</text>
  <rect x="198" y="242" width="90" height="48" rx="7" fill="var(--surface)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="243" y="272" text-anchor="middle" class="tiny">网卡 A</text>
  <rect x="368" y="242" width="90" height="48" rx="7" fill="var(--surface)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="413" y="272" text-anchor="middle" class="tiny">网卡 B</text>
  <rect x="538" y="242" width="100" height="48" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="588" y="272" text-anchor="middle" class="tiny">GPU B</text>

  <path d="M128 266 L198 266" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M288 266 L368 266" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M458 266 L538 266" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M243 220 L243 242" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="243" y="214" text-anchor="middle" class="tiny">CPU 提交</text>
  <text x="700" y="270" class="tiny">无主机内存中转</text>

  <text x="28" y="334" class="b">③ 设备发起：控制也绕过 CPU</text>
  <rect x="28" y="346" width="100" height="48" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="78" y="376" text-anchor="middle" class="tiny">GPU A</text>
  <rect x="228" y="346" width="90" height="48" rx="7" fill="var(--surface)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="273" y="376" text-anchor="middle" class="tiny">网卡 A</text>
  <rect x="408" y="346" width="90" height="48" rx="7" fill="var(--surface)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="453" y="376" text-anchor="middle" class="tiny">网卡 B</text>
  <rect x="588" y="346" width="100" height="48" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="638" y="376" text-anchor="middle" class="tiny">GPU B</text>

  <path d="M128 370 L228 370" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M318 370 L408 370" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M498 370 L588 370" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M78 346 L78 324 L273 324 L273 346" stroke="var(--muted)" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="176" y="318" text-anchor="middle" class="tiny">GPU 自己提交、查完成</text>

  <rect x="30" y="410" width="740" height="30" rx="6" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1.2"/>
  <text x="400" y="430" text-anchor="middle" class="tiny">收益取决于启动开销 α 在 T = α + M/B 中的占比：小消息显著，大载荷主要看带宽。</text>
</svg>
