<svg xmlns="http://www.w3.org/2000/svg" width="800" height="405" viewBox="0 45 800 405" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">数据路径与控制路径的三种组织方式</title>
  <desc id="fig-desc">普通路径的载荷经过主机内存；GPUDirect RDMA 让网卡直接读写 GPU 内存但仍由 CPU 提交；设备发起则让 GPU 自己提交请求并检查完成。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:12px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:11px;fill:var(--muted,#5f4f3c)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
    <marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--muted,#5f4f3c)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <line x1="640" y1="80" x2="680" y2="80" stroke="var(--blue,#466b3f)" stroke-width="2.4"/>
  <text x="688" y="84" class="tiny">数据</text>
  <line x1="640" y1="96" x2="680" y2="96" stroke="var(--muted,#5f4f3c)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="688" y="100" class="tiny">控制</text>

  <text x="28" y="128" class="b">① CPU 提交：载荷经主机内存</text>
  <rect x="28" y="140" width="100" height="48" rx="7" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="78" y="170" text-anchor="middle" class="tiny">GPU A</text>
  <rect x="158" y="140" width="120" height="48" rx="7" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="218" y="162" text-anchor="middle" class="tiny">主机内存</text>
  <text x="218" y="180" text-anchor="middle" class="tiny">（中转）</text>
  <rect x="308" y="140" width="90" height="48" rx="7" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="353" y="170" text-anchor="middle" class="tiny">网卡 A</text>
  <rect x="428" y="140" width="90" height="48" rx="7" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="473" y="170" text-anchor="middle" class="tiny">网卡 B</text>
  <rect x="548" y="140" width="100" height="48" rx="7" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="598" y="170" text-anchor="middle" class="tiny">GPU B</text>

  <path d="M128 164 L158 164" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M278 164 L308 164" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M398 164 L428 164" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M518 164 L548 164" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M353 118 L353 140" stroke="var(--muted,#5f4f3c)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="353" y="112" text-anchor="middle" class="tiny">CPU 提交</text>

  <text x="28" y="230" class="b">② GPUDirect RDMA：载荷绕过主机内存，仍由 CPU 提交</text>
  <rect x="28" y="242" width="100" height="48" rx="7" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="78" y="272" text-anchor="middle" class="tiny">GPU A</text>
  <rect x="198" y="242" width="90" height="48" rx="7" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="243" y="272" text-anchor="middle" class="tiny">网卡 A</text>
  <rect x="368" y="242" width="90" height="48" rx="7" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="413" y="272" text-anchor="middle" class="tiny">网卡 B</text>
  <rect x="538" y="242" width="100" height="48" rx="7" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="588" y="272" text-anchor="middle" class="tiny">GPU B</text>

  <path d="M128 266 L198 266" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M288 266 L368 266" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M458 266 L538 266" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M243 220 L243 242" stroke="var(--muted,#5f4f3c)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="243" y="214" text-anchor="middle" class="tiny">CPU 提交</text>
  <text x="700" y="270" class="tiny">无主机内存中转</text>

  <text x="28" y="334" class="b">③ 设备发起：控制也绕过 CPU</text>
  <rect x="28" y="346" width="100" height="48" rx="7" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="78" y="376" text-anchor="middle" class="tiny">GPU A</text>
  <rect x="228" y="346" width="90" height="48" rx="7" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="273" y="376" text-anchor="middle" class="tiny">网卡 A</text>
  <rect x="408" y="346" width="90" height="48" rx="7" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="453" y="376" text-anchor="middle" class="tiny">网卡 B</text>
  <rect x="588" y="346" width="100" height="48" rx="7" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="638" y="376" text-anchor="middle" class="tiny">GPU B</text>

  <path d="M128 370 L228 370" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M318 370 L408 370" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M498 370 L588 370" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M78 346 L78 324 L273 324 L273 346" stroke="var(--muted,#5f4f3c)" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="176" y="318" text-anchor="middle" class="tiny">GPU 自己提交、查完成</text>

  <rect x="30" y="410" width="740" height="30" rx="6" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.2"/>
  <text x="400" y="430" text-anchor="middle" class="tiny">收益取决于启动开销 α 在 T = α + M/B 中的占比：小消息显著，大载荷主要看带宽。</text>
</svg>
