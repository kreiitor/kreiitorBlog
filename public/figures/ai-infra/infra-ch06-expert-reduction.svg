<svg xmlns="http://www.w3.org/2000/svg" width="800" height="384" viewBox="0 60 800 384" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">先组内、再跨组的归约</title>
  <desc id="fig-desc">四组各含两张卡：组 0 的卡 0、卡 1 标组贡献 1，组 1 标 2，组 2 标 3，组 3 标 4；横向箭头先把每组两卡求和，纵向箭头再把四个组相加，两列各得到 1+2+3+4=10</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="80" y1="110" x2="460" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="178.75" x2="460" y2="178.75" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="247.5" x2="460" y2="247.5" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="316.25" x2="460" y2="316.25" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="110" x2="80" y2="178.75" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="178.75" x2="80" y2="247.5" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="247.5" x2="80" y2="316.25" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="316.25" x2="80" y2="385" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="460" y1="110" x2="460" y2="178.75" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="460" y1="178.75" x2="460" y2="247.5" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="460" y1="247.5" x2="460" y2="316.25" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="460" y1="316.25" x2="460" y2="385" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><rect x="42" y="88" width="76" height="44" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="80" y="107.5" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">组0 卡0 贡献</text><text x="80" y="121" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">1</text>
  <rect x="422" y="88" width="76" height="44" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="460" y="107.5" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">组0 卡1 贡献</text><text x="460" y="121" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">1</text>
  <rect x="42" y="156.75" width="76" height="44" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="80" y="176.25" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">组1 卡2 贡献</text><text x="80" y="189.75" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">2</text>
  <rect x="422" y="156.75" width="76" height="44" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="460" y="176.25" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">组1 卡3 贡献</text><text x="460" y="189.75" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">2</text>
  <rect x="42" y="225.5" width="76" height="44" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="80" y="245" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">组2 卡4 贡献</text><text x="80" y="258.5" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">3</text>
  <rect x="422" y="225.5" width="76" height="44" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="460" y="245" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">组2 卡5 贡献</text><text x="460" y="258.5" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">3</text>
  <rect x="42" y="294.25" width="76" height="44" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="80" y="313.75" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">组3 卡6 贡献</text><text x="80" y="327.25" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">4</text>
  <rect x="422" y="294.25" width="76" height="44" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="460" y="313.75" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">组3 卡7 贡献</text><text x="460" y="327.25" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">4</text>
  <rect x="42" y="363" width="76" height="44" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="80" y="388.75" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">完整输出 10</text>
  <rect x="422" y="363" width="76" height="44" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="460" y="388.75" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">完整输出 10</text>
  <text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">格内数字是某个输出元素经组内求和后的值。</text>
</svg>