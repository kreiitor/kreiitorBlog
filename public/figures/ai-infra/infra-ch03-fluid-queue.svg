<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">流体队列模型</title>
  <desc id="fig-desc">新到工作流入待处理队列，再由处理资源完成并流出；到达速度超过处理速度时队列增长，处理快于到达时已有积压被逐步消化</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">流体队列模型</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">到达与处理的差额决定积压增减</text><rect x="45" y="186" width="153.5" height="112" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="121.75" y="238.75" font-size="13" fill="var(--on-blue)" font-weight="700" text-anchor="middle">新到工作</text>
  <text x="121.75" y="255" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">按窗口到达</text><rect x="230.5" y="186" width="153.5" height="112" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="307.25" y="238.75" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">待处理队列</text>
  <text x="307.25" y="255" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">未完成 decode 步</text><rect x="416" y="186" width="153.5" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="492.75" y="238.75" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">处理资源</text>
  <text x="492.75" y="255" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">固定处理率 μ</text><rect x="601.5" y="186" width="153.5" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="678.25" y="238.75" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">完成工作</text>
  <text x="678.25" y="255" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">流出队列</text><path d="M198.5 242 L230.5 242" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 242 L416 242" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M569.5 242 L601.5 242" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">概念模型，不含坐标轴。</text>
</svg>