<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">权重与 KV 的三种放置</title>
  <desc id="fig-desc">三列并排：GPU 超节点的计算单元旁是 HBM，权重与 KV 同放；ROM 晶圆加 HBM 的方案把权重放 ROM、KV 放 HBM；ROM 晶圆加 SRAM 的方案把权重放 ROM、KV 放片上 SRAM，SRAM 方框明显更小</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">权重与 KV 的三种放置</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">GPU 全放 HBM，或把权重与 KV 分到 ROM、HBM、SRAM</text><rect x="34" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="151.33333333333331" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">GPU 超节点</text><text x="151.33333333333331" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">HBM：权重 + KV</text><text x="46" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">权重与 KV 同放 HBM</text><text x="46" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">每步都要读权重</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">容量最大</text><rect x="282.66666666666663" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/><text x="399.99999999999994" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">ROM 晶圆 + HBM</text><text x="399.99999999999994" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">权重在 ROM，KV 在 HBM</text><text x="294.66666666666663" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">权重只读一次</text><text x="294.66666666666663" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">KV 仍可写</text><text x="294.66666666666663" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">两项读取可分开</text><rect x="531.3333333333333" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--yellow)" stroke="var(--yellow)" stroke-width="1.6"/><text x="648.6666666666666" y="118" font-size="14" fill="var(--on-yellow)" font-weight="700" text-anchor="middle">ROM 晶圆 + SRAM</text><text x="648.6666666666666" y="136" font-size="10.5" fill="var(--on-yellow)" font-weight="400" text-anchor="middle">权重在 ROM，KV 在 SRAM</text><text x="543.3333333333333" y="174" font-size="12" fill="var(--on-yellow)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="174" font-size="11.5" fill="var(--on-yellow)" font-weight="400" text-anchor="start">KV 容量最小</text><text x="543.3333333333333" y="195.95" font-size="12" fill="var(--on-yellow)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="195.95" font-size="11.5" fill="var(--on-yellow)" font-weight="400" text-anchor="start">片内读取更快</text><text x="543.3333333333333" y="217.89999999999998" font-size="12" fill="var(--on-yellow)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="217.89999999999998" font-size="11.5" fill="var(--on-yellow)" font-weight="400" text-anchor="start">只够保存一个会话</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">容量大</text><text x="730" y="400" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="end">离计算更近</text></svg>