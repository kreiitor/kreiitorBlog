xt><rect x="651.0053333333333" y="199" width="64.47800000000001" height="32" rx="3" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)"/><text x="683.2443333333333" y="218" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">30.9 ms</text><line x1="126" y1="242" x2="752" y2="242" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="278" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">从请求到达起计时 / ms</text></svg>