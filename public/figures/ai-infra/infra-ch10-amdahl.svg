<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">带宽变化对耗时的杠杆</title>
  <desc id="fig-desc">折线图：新带宽与原带宽之比从 0.25 到 1.4 时，原通信占比 5%、20%、50% 的三条曲线分别从约 1.15、1.6、2.5 下降到 1 以下；占比越大曲线越陡</desc>
