<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">生成加速只缩短其中一段</title>
  <desc id="fig-desc">两条泳道：原配置为生成 0–40 秒、验证 40–50 秒、更新 50–80 秒、发布 80–85 秒；生成加速后为 0–20、20–30、30–60、60–65 秒</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">生成加速只缩短其中一段</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">四阶段由 85 秒降到 65 秒，上限约 1.9 倍</text><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="265.1111111111111" y1="96" x2="265.1111111111111" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="265.1111111111111" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">20</text><line x1="404.22222222222223" y1="96" x2="404.22222222222223" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="404.22222222222223" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">40</text><line x1="543.3333333333333" y1="96" x2="543.3333333333333" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="543.3333333333333" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">60</text><line x1="682.4444444444445" y1="96" x2="682.4444444444445" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="682.4444444444445" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">80</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">90</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">原配置</text><rect x="126" y="115" width="278.22222222222223" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="265.1111111111111" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">生成 40 s</text><rect x="404.22222222222223" y="115" width="69.55555555555556" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="439" y="134" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">验证 10 s</text><rect x="473.77777777777777" y="115" width="208.66666666666666" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="578.1111111111111" y="134" font-size="9.5" fill="var(--on-yellow)" font-weight="600" text-anchor="middle">更新 30 s</text><rect x="682.4444444444445" y="115" width="34.77777777777778" height="32" rx="3" fill="var(--surface)" stroke="var(--line)"/><text x="699.8333333333334" y="134" font-size="8" fill="var(--ink)" font-weight="600" text-anchor="middle">发布 …</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">生成加速</text><rect x="126" y="157" width="139.11111111111111" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="195.55555555555554" y="176" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">生成 20 s</text><rect x="265.1111111111111" y="157" width="69.55555555555556" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="299.88888888888886" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">验证 10 s</text><rect x="334.66666666666663" y="157" width="208.66666666666666" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="438.99999999999994" y="176" font-size="9.5" fill="var(--on-yellow)" font-weight="600" text-anchor="middle">更新 30 s</text><rect x="543.3333333333333" y="157" width="34.77777777777778" height="32" rx="3" fill="var(--surface)" stroke="var(--line)"/><text x="560.7222222222222" y="176" font-size="8" fill="var(--ink)" font-weight="600" text-anchor="middle">发布 …</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">迭代时间 / s</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">条形长度按时间比例绘制；生成归零时总时间也不会低于其余三段之和。</text>
</svg>