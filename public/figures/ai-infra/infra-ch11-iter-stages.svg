<svg xmlns="http://www.w3.org/2000/svg" width="800" height="231" viewBox="0 68 800 231" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">生成加速只缩短其中一段</title>
  <desc id="fig-desc">两条泳道：原配置为生成 0–40 秒、验证 40–50 秒、更新 50–80 秒、发布 80–85 秒；生成加速后为 0–20、20–30、30–60、60–65 秒</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0</text><line x1="265.1111111111111" y1="96" x2="265.1111111111111" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="265.1111111111111" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">20</text><line x1="404.22222222222223" y1="96" x2="404.22222222222223" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="404.22222222222223" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">40</text><line x1="543.3333333333333" y1="96" x2="543.3333333333333" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="543.3333333333333" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">60</text><line x1="682.4444444444445" y1="96" x2="682.4444444444445" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="682.4444444444445" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">80</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">90</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">原配置</text><rect x="126" y="115" width="278.22222222222223" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="265.1111111111111" y="134" font-size="9.5" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">生成 40 s</text><rect x="404.22222222222223" y="115" width="69.55555555555556" height="32" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)"/><text x="439" y="134" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">验证 10 s</text><rect x="473.77777777777777" y="115" width="208.66666666666666" height="32" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="578.1111111111111" y="134" font-size="9.5" fill="var(--on-yellow,#3b3024)" font-weight="600" text-anchor="middle">更新 30 s</text><rect x="682.4444444444445" y="115" width="34.77777777777778" height="32" rx="3" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)"/><text x="699.8333333333334" y="134" font-size="8" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">发布 …</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">生成加速</text><rect x="126" y="157" width="139.11111111111111" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="195.55555555555554" y="176" font-size="9.5" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">生成 20 s</text><rect x="265.1111111111111" y="157" width="69.55555555555556" height="32" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)"/><text x="299.88888888888886" y="176" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">验证 10 s</text><rect x="334.66666666666663" y="157" width="208.66666666666666" height="32" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="438.99999999999994" y="176" font-size="9.5" fill="var(--on-yellow,#3b3024)" font-weight="600" text-anchor="middle">更新 30 s</text><rect x="543.3333333333333" y="157" width="34.77777777777778" height="32" rx="3" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)"/><text x="560.7222222222222" y="176" font-size="8" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">发布 …</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">迭代时间 / s</text><text x="400" y="273" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">条形长度按时间比例绘制；生成归零时总时间也不会低于其余三段之和。</text>
</svg>