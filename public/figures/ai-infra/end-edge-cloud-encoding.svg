<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">编码器放在哪里</title>
  <desc id="fig-desc">同一张截图可以上传原图后在远端编码，也可以在端侧编码后上传特征；两条路径跨网络的对象不同，传输量与耗时也不同。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink)}
    .sub{font-size:14px;fill:var(--muted)}
    .h{font-size:15px;font-weight:700;fill:var(--ink)}
    .b{font-size:12px;font-weight:600;fill:var(--ink)}
    .s{font-size:11px;fill:var(--muted)}
    .tiny{font-size:10px;fill:var(--muted)}
    .onblue{fill:var(--on-blue)}
    .onyellow{fill:var(--on-yellow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
    <marker id="arrow-y" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--yellow)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" class="title">编码器放在哪：跨网络的对象不同</text>
  <text x="400" y="58" text-anchor="middle" class="sub">同样一张截图，可以传图片，也可以传特征</text>

  <line x1="400" y1="82" x2="400" y2="392" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="400" y="78" text-anchor="middle" class="tiny">部署边界 · 上行 6.4 Mbit/s</text>

  <text x="52" y="110" class="h">方案 A · 远端编码</text>
  <rect x="52" y="120" width="300" height="86" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="2"/>
  <text x="70" y="146" class="b">端侧</text>
  <text x="70" y="170" class="s">压缩截图 0.8 MB</text>
  <text x="70" y="190" class="tiny">只做采集与压缩</text>

  <rect x="448" y="120" width="300" height="86" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="466" y="146" class="b">远端</text>
  <text x="466" y="170" class="s">解码 → 视觉编码</text>
  <text x="466" y="190" class="s">→ 语言模型</text>

  <path d="M352 163 H444" stroke="var(--blue)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="748" y="232" text-anchor="end" class="b">上传图片 0.8 MB · 1.00 s</text>

  <text x="52" y="262" class="h">方案 B · 端侧编码</text>
  <rect x="52" y="272" width="300" height="86" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="2"/>
  <text x="70" y="298" class="b">端侧</text>
  <text x="70" y="322" class="s">视觉编码 → 完整特征</text>
  <text x="70" y="342" class="s">8.192 MB</text>

  <rect x="448" y="272" width="300" height="86" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="466" y="298" class="b">远端</text>
  <text x="466" y="322" class="s">还原四组特征</text>
  <text x="466" y="342" class="s">→ 语言模型</text>

  <path d="M352 315 H444" stroke="var(--yellow)" stroke-width="3" fill="none" marker-end="url(#arrow-y)"/>
  <text x="748" y="390" text-anchor="end" class="b">上传特征 8.192 MB · 10.24 s</text>

  <text x="400" y="414" text-anchor="middle" class="s">慢链路上先比传输量；快链路上更比编码与排队时间。</text>
  <text x="400" y="436" text-anchor="middle" class="tiny">端侧先算一步，并不保证上传量减少：压缩格式与计算格式的目标不同。</text>
</svg>
