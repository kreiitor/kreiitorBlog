<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">三种操作的延迟数量级</title>
  <desc id="fig-desc">对数刻度柱状图：主存访问 100 ns，机房内往返 500,000 ns，磁盘寻道 10,000,000 ns；三者依次相差约 5000 倍和 20 倍</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">100</text><line x1="74" y1="316.3333333333333" x2="750" y2="316.3333333333333" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="320.3333333333333" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">1k</text><line x1="74" y1="274.6666666666667" x2="750" y2="274.6666666666667" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="278.6666666666667" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">10k</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">100k</text><line x1="74" y1="191.33333333333334" x2="750" y2="191.33333333333334" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="195.33333333333334" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">1000k</text><line x1="74" y1="149.66666666666666" x2="750" y2="149.66666666666666" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="153.66666666666666" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">10000k</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">100000k</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">操作</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">时间（ns，对数刻度）</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">延迟</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">横轴为时间（ns，对数刻度），刻度从 10^1 到 10^8。</text>
</svg>