<svg xmlns="http://www.w3.org/2000/svg" width="800" height="231" viewBox="0 68 800 231" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">本地打断的 7 毫秒</title>
  <desc id="fig-desc">时间轴上 123 毫秒处发出打断，130 毫秒处本地设备静音；两者之间 7 毫秒里旧音频继续播放</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">0</text><line x1="349.57142857142856" y1="96" x2="349.57142857142856" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="349.57142857142856" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">50</text><line x1="573.1428571428571" y1="96" x2="573.1428571428571" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="573.1428571428571" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">100</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">140</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">控制路径</text><rect x="675.9857142857143" y="115" width="31.3" height="32" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="691.6357142857142" y="134" font-size="8" fill="var(--on-yellow,#202735)" font-weight="600" text-anchor="middle">发出打…</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">本地播放</text><rect x="675.9857142857143" y="157" width="31.3" height="32" rx="3" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)"/><text x="691.6357142857142" y="176" font-size="8" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">旧音频…</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">时间 / ms</text><text x="400" y="273" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">控制延迟 5 毫秒，设备每 10 毫秒检查并执行一次控制指令。</text>
</svg>