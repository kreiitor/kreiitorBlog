<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">卸载九份 FFN 后的净空间</title>
  <desc id="fig-desc">堆叠柱状图：卸载九份 FFN 共腾出 2592 MiB；使用一组 288 MiB 预取缓冲时净省 2304 MiB；使用两组 576 MiB 缓冲时净省 2016 MiB</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="261.54938271604937" x2="750" y2="261.54938271604937" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="265.54938271604937" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">1000</text><line x1="74" y1="165.09876543209876" x2="750" y2="165.09876543209876" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="169.09876543209876" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">2000</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">2592</text><rect x="208" y="135.7777777777778" width="70" height="222.2222222222222" fill="var(--blue-soft)" stroke="var(--blue-soft)"/><rect x="208" y="108" width="70" height="27.777777777777775" fill="var(--yellow)" stroke="var(--yellow)"/><text x="243" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">一组缓冲</text><rect x="546" y="163.55555555555554" width="70" height="194.44444444444446" fill="var(--blue-soft)" stroke="var(--blue-soft)"/><rect x="546" y="108" width="70" height="55.55555555555555" fill="var(--yellow)" stroke="var(--yellow)"/><text x="581" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">两组缓冲</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">预取缓冲方案</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">MiB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue-soft)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">可重新分配净空间</text><rect x="172" y="86" width="10" height="10" fill="var(--yellow)"/><text x="187" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">留在加速器上的缓冲</text></svg>