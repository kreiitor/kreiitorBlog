<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 57 800 370" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">卸载九份 FFN 后的净空间</title>
  <desc id="fig-desc">堆叠柱状图：卸载九份 FFN 共腾出 2592 MiB；使用一组 288 MiB 预取缓冲时净省 2304 MiB；使用两组 576 MiB 缓冲时净省 2016 MiB</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="261.54938271604937" x2="750" y2="261.54938271604937" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="265.54938271604937" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">1000</text><line x1="74" y1="165.09876543209876" x2="750" y2="165.09876543209876" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="169.09876543209876" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">2000</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">2592</text><rect x="208" y="135.7777777777778" width="70" height="222.2222222222222" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue-soft,#e8f0e2)"/><rect x="208" y="108" width="70" height="27.777777777777775" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="243" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">一组缓冲</text><rect x="546" y="163.55555555555554" width="70" height="194.44444444444446" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue-soft,#e8f0e2)"/><rect x="546" y="108" width="70" height="55.55555555555555" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="581" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">两组缓冲</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">预取缓冲方案</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">MiB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue-soft,#e8f0e2)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">可重新分配净空间</text><rect x="172" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="187" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">留在加速器上的缓冲</text></svg>