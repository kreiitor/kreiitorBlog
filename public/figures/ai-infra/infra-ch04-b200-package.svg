<svg xmlns="http://www.w3.org/2000/svg" width="800" height="278" viewBox="0 119 800 278" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">两颗 die 与八堆 HBM</title>
  <desc id="fig-desc">封装内两颗 die 并排，之间由 die 间链路连接；两颗 die 左右两侧各排列四堆 HBM，共八堆；整个结构放在中介层上；下方给出每堆带宽与每堆容量的公式</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="40" y="147" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="179" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">中介层</text><rect x="254" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="329" y="172.4" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">承载 die 与 HBM 之间的</text><text x="329" y="187.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">连线</text><rect x="532" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="607" y="172.4" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">承载 die 与 die 之间的</text><text x="607" y="187.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">连线</text><rect x="40" y="213" width="720" height="58" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="54" y="245" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">计算 die</text><rect x="194" y="222" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="259.5" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">die 0</text><rect x="333" y="222" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="398.5" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">die 1</text><rect x="472" y="222" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="537.5" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">die 间链路</text><rect x="611" y="222" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="676.5" y="238.4" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">每颗不超过光罩上限（</text><text x="676.5" y="253.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">H100：814 mm²）</text><rect x="40" y="279" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="311" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">HBM</text><rect x="194" y="288" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="259.5" y="311" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">左右各四堆，共八堆</text><rect x="333" y="288" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="398.5" y="311" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">每堆 1024 引脚</text><rect x="472" y="288" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="537.5" y="304.4" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">每堆带宽 = 1024 × 引</text><text x="537.5" y="319.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">脚速率</text><rect x="611" y="288" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="676.5" y="304.4" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">每堆容量 = 层数 × 每</text><text x="676.5" y="319.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">层容量</text><text x="400" y="371" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">H100 的 die 为 814 mm²；每堆带宽 = 1024 引脚 × 引脚速率，每堆容量 = 层数 × 每层容量。</text>
</svg>