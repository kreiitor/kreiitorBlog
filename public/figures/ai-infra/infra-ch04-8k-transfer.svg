<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">8 KiB 传输的启动与传输</title>
  <desc id="fig-desc">两根堆叠条形：A100 NVLink 300 GB/s 总计 2.027 μs，H100 NVLink 450 GB/s 总计 2.018 μs；两者启动开销都是 2 μs，H100 的传输项略薄</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="258" x2="750" y2="258" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="262" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">1</text><line x1="74" y1="158" x2="750" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="162" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">2</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">2.5</text><rect x="208" y="158" width="70" height="200" fill="var(--surface,#fffcf5)" stroke="var(--surface,#fffcf5)"/><rect x="208" y="155.29999999999998" width="70" height="2.7" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="243" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">A100 NVLink 300 GB/s</text><rect x="546" y="158" width="70" height="200" fill="var(--surface,#fffcf5)" stroke="var(--surface,#fffcf5)"/><rect x="546" y="156.20000000000002" width="70" height="1.8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="581" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">H100 NVLink 450 GB/s</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">链路</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">时间 / μs</text></g><rect x="82" y="86" width="10" height="10" fill="var(--surface,#fffcf5)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">启动</text><rect x="130" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="145" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">传输</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">传输时间为 8 KiB ÷ 对应单向带宽；启动开销取 2 μs。</text>
</svg>