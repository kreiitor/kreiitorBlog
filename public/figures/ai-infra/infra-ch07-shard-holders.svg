<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">跨服务器阶段的时间曲线</title>
  <desc id="fig-desc">横轴为持有同一分片的服务器数 2 到 32，纵轴为跨服务器阶段 0 到 1.2 ms；环形 AllReduce 从 0.505 ms 上升到 1.03 ms，在网归约始终为 0.50 ms</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="253.83333333333331" x2="750" y2="253.83333333333331" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="257.8333333333333" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">0.5</text><line x1="74" y1="149.66666666666666" x2="750" y2="149.66666666666666" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="153.66666666666666" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">1</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">1.2</text><polyline points="74,252.79166666666669 750,143.41666666666666" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.4"/><circle cx="74" cy="252.79166666666669" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="750" cy="143.41666666666666" r="3.2" fill="var(--blue,#2647d7)"/><polyline points="74,253.83333333333331 750,253.83333333333331" fill="none" stroke="var(--yellow,#ffe04b)" stroke-width="2.4"/><circle cx="74" cy="253.83333333333331" r="3.2" fill="var(--yellow,#ffe04b)"/><circle cx="750" cy="253.83333333333331" r="3.2" fill="var(--yellow,#ffe04b)"/><text x="74" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">2</text><text x="750" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">32</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">持有同一分片的服务器数</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">跨服务器阶段 / ms</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#2647d7)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">环形 AllReduce</text><rect x="168.5" y="86" width="10" height="10" fill="var(--yellow,#ffe04b)"/><text x="183.5" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">在网归约</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">横轴在 2、4、8、16、32 取值；图中只画出两端已知读数。环的轮数按 2(S−1) 增长；两台服务器时两者只差一次启动。</text>
</svg>