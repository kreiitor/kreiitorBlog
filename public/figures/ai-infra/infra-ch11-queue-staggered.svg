<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">错峰到达：每次都能立即开始</title>
  <desc id="fig-desc">十条工具调用泳道，横轴 0–10 秒；第 1 到第 10 次调用分别在第 0 到第 9 秒到达，每次到达后立即执行 1 秒，没有等待</desc>
