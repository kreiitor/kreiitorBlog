<svg xmlns="http://www.w3.org/2000/svg" width="800" height="278" viewBox="0 119 800 278" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Apple 的统一内存与 GPU 演进</title>
  <desc id="fig-desc">左上为统一内存，保存权重、KV 与中间数据，由 CPU、GPU 与独立 Neural Engine 共享；右下为 GPU 内部演进：M3/M4 为通用计算加 Dynamic Caching，M5 为通用计算加 Neural Accelerator，并带第二代 Dynamic Caching</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="40" y="147" width="720" height="58" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="54" y="179" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">统一内存</text><rect x="254" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="329" y="179" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">权重、KV 与中间数据</text><rect x="532" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="607" y="172.4" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">CPU / GPU / 独立</text><text x="607" y="187.25" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">Neural Engine 共享</text><rect x="40" y="213" width="720" height="58" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/><text x="54" y="245" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">M3 / M4 GPU</text><rect x="254" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="329" y="245" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">通用计算</text><rect x="532" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="607" y="245" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">Dynamic Caching</text><rect x="40" y="279" width="720" height="58" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="54" y="311" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">M5 GPU</text><rect x="207.66666666666669" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="282.6666666666667" y="311" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">通用计算</text><rect x="393.00000000000006" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="468.00000000000006" y="311" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">Neural Accelerator</text><rect x="578.3333333333334" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="653.3333333333334" y="311" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">第二代 Dynamic Caching</text><text x="400" y="371" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">三者分别进入容量、驻留和计算时间的分析。</text>
</svg>