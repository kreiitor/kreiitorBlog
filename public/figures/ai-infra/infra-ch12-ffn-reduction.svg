<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 58 800 386" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">前馈输出的两卡归约</title>
  <desc id="fig-desc">左卡计算 FFN 分片 0，右卡计算 FFN 分片 1；两卡把局部结果送到两卡归约输出，求和得到完整前馈输出后进入下一层</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="80" y1="110" x2="290" y2="245" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="500" y1="110" x2="290" y2="245" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="290" y1="245" x2="290" y2="360" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="80" y="114.125" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">FFN 分片 0</text>
  <rect x="450" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="500" y="114.125" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">FFN 分片 1</text>
  <rect x="240" y="221" width="100" height="48" rx="8" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="290" y="249.125" font-size="11" fill="var(--on-yellow,#202735)" font-weight="700" text-anchor="middle">两卡归约输出</text>
  <rect x="240" y="336" width="100" height="48" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="290" y="364.125" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">下一层</text>
  <text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">这一结构在 36 层中重复；每层注意力与 FFN 各一次归约。</text>
</svg>