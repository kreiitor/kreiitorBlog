<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">四个 TP2 实例的完成时刻</title>
  <desc id="fig-desc">四条轨道对应实例 0–3，每条轨道上有一个会话色块；四个色块同时开始、长度相同，都在约 119.1 ms 结束，完成期限为 130 ms</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">四个 TP2 实例的完成时刻</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">四个会话同时开始，约 119.1 ms 全部结束</text><line x1="126" y1="96" x2="126" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="299.8888888888889" y1="96" x2="299.8888888888889" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="299.8888888888889" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">50</text><line x1="473.77777777777777" y1="96" x2="473.77777777777777" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="473.77777777777777" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">100</text><line x1="647.6666666666667" y1="96" x2="647.6666666666667" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="647.6666666666667" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">150</text><line x1="752" y1="96" x2="752" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">180</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">实例 0</text><rect x="126" y="115" width="414.2033333333333" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="333.1016666666667" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">会话 0 · 119.1</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">实例 1</text><rect x="126" y="157" width="414.2033333333333" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="333.1016666666667" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">会话 1 · 119.1</text><text x="116" y="219" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">实例 2</text><rect x="126" y="199" width="414.2033333333333" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="333.1016666666667" y="218" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">会话 2 · 119.1</text><text x="116" y="261" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">实例 3</text><rect x="126" y="241" width="414.2033333333333" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="333.1016666666667" y="260" font-size="9.5" fill="var(--on-yellow)" font-weight="600" text-anchor="middle">会话 3 · 119.1</text><line x1="126" y1="284" x2="752" y2="284" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="320" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">从四会话到达起计时（ms）</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">每个会话续写八个 token；虚线为 130 ms 完成期限。</text>
</svg>