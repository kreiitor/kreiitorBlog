95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">4 条请求 KV</text><rect x="156.25" y="86" width="10" height="10" fill="var(--yellow-soft,#fdf9e8)"/><text x="171.25" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">工作区</text><rect x="211.25" y="86" width="10" height="10" fill="var(--yellow,#ffe04b)"/><text x="226.25" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">权重余量</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">图中容量均为十进制 GB。</text>
