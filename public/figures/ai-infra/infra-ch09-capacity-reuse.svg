7308153785" r="3.2" fill="var(--muted,#5f4f3c)"/><circle cx="750" cy="250.6037308153785" r="3.2" fill="var(--muted,#5f4f3c)"/><polyline points="74,209.32148204658856 243,209.32148204658856 412,209.32148204658856 581,209.32148204658856 750,209.32148204658856" fill="none" stroke="var(--muted,#5f4f3c)" stroke-width="2.4"/><circle cx="74" cy="209.32148204658856" r="3.2" fill="var(--muted,#5f4f3c)"/><circle cx="243" cy="209.32148204658856" r="3.2" fill="var(--muted,#5f4f3c)"/><circle cx="412" cy="209.32148204658856" r="3.2" fill="var(--muted,#5f4f3c)"/><circle cx="581" cy="209.32148204658856" r="3.2" fill="var(--muted,#5f4f3c)"/><circle cx="750" cy="209.32148204658856" r="3.2" fill="var(--muted,#5f4f3c)"/><polyline points="74,134.98600542285732 243,134.98600542285732 412,134.98600542285732 581,134.98600542285732 750,134.98600542285732" fill="none" stroke="var(--muted,#5f4f3c)" stroke-width="2.4"/><circle cx="74" cy="134.98600542285732" r="3.2" fill="var(--muted,#5f4f3c)"/><circle cx="243" cy="134.98600542285732" r="3.2" fill="var(--muted,#5f4f3c)"/><circle cx="412" cy="134.98600542285732" r="3.2" fill="var(--muted,#5f4f3c)"/><circle cx="581" cy="134.98600542285732" r="3.2" fill="var(--muted,#5f4f3c)"/><circle cx="750" cy="134.98600542285732" r="3.2" fill="var(--muted,#5f4f3c)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">同一前缀复用间隔 / s（对数）</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">所需容量 / GB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">C = rT</text><rect x="139.1" y="86" width="10" height="10" fill="var(--muted,#5f4f3c)"/><text x="154.1" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">HBM 63.6 GB</text><rect x="215.45" y="86" width="10" height="10" fill="var(--muted,#5f4f3c)"/><text x="230.45" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">主机内存 275 GB</text><rect x="304.4" y="86" width="10" height="10" fill="var(--muted,#5f4f3c)"/><text x="319.4" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">本地 SSD 3840 GB</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">r 约 1.41 GB/s；横轴与纵轴均按对数刻度理解。</text>
</svg>