="var(--muted,#596171)"/><text x="154.1" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">HBM 63.6 GB</text><rect x="215.45" y="86" width="10" height="10" fill="var(--muted,#596171)"/><text x="230.45" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">主机内存 275 GB</text><rect x="304.4" y="86" width="10" height="10" fill="var(--muted,#596171)"/><text x="319.4" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">本地 SSD 3840 GB</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">r 约 1.41 GB/s；横轴与纵轴均按对数刻度理解。</text>
</svg>