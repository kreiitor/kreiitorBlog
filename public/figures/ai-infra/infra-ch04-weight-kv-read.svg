"var(--yellow,#f5d75f)" stroke-width="2.4"/><circle cx="74" cy="320.1875" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="186.66666666666669" cy="282.375" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="299.33333333333337" cy="259.6875" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="412" cy="237" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="524.6666666666667" cy="206.75" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="637.3333333333334" cy="168.9375" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="750" cy="131.125" r="3.2" fill="var(--yellow,#f5d75f)"/><text x="74" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">5</text><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">10</text><text x="299.33333333333337" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">13</text><text x="412" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">16</text><text x="524.6666666666667" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">20</text><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">25</text><text x="750" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">30</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">批内请求数 B</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">每步读取 / GB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">每批权重</text><rect x="144" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="159" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">各请求 KV</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">每请求保留 8K 上下文，K = 1.21 GB；纵轴为每步读取量。</text>
</svg>