<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">每步读取随批内请求数变化</title>
  <desc id="fig-desc">一条水平线表示每批权重读取 15.1 GB；一条从原点上升的线表示各请求 KV，按每请求 1.21 GB 增长；在批内请求数约 12.5 处两条线相交，从 13 条起 KV 读取超过权重读取</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">每步读取随批内请求数变化</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">权重固定 15.1 GB，KV 从 13 条起超过权重</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">30</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">40</text><polyline points="74,263.625 186.66666666666669,263.625 299.33333333333337,263.625 412,263.625 524.6666666666667,263.625 637.3333333333334,263.625 750,263.625" fill="none" stroke="var(--blue)" stroke-width="2.4"/><circle cx="74" cy="263.625" r="3.2" fill="var(--blue)"/><circle cx="186.66666666666669" cy="263.625" r="3.2" fill="var(--blue)"/><circle cx="299.33333333333337" cy="263.625" r="3.2" fill="var(--blue)"/><circle cx="412" cy="263.625" r="3.2" fill="var(--blue)"/><circle cx="524.6666666666667" cy="263.625" r="3.2" fill="var(--blue)"/><circle cx="637.3333333333334" cy="263.625" r="3.2" fill="var(--blue)"/><circle cx="750" cy="263.625" r="3.2" fill="var(--blue)"/><polyline points="74,320.1875 186.66666666666669,282.375 299.33333333333337,259.6875 412,237 524.6666666666667,206.75 637.3333333333334,168.9375 750,131.125" fill="none" stroke="var(--yellow)" stroke-width="2.4"/><circle cx="74" cy="320.1875" r="3.2" fill="var(--yellow)"/><circle cx="186.66666666666669" cy="282.375" r="3.2" fill="var(--yellow)"/><circle cx="299.33333333333337" cy="259.6875" r="3.2" fill="var(--yellow)"/><circle cx="412" cy="237" r="3.2" fill="var(--yellow)"/><circle cx="524.6666666666667" cy="206.75" r="3.2" fill="var(--yellow)"/><circle cx="637.3333333333334" cy="168.9375" r="3.2" fill="var(--yellow)"/><circle cx="750" cy="131.125" r="3.2" fill="var(--yellow)"/><text x="74" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">5</text><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">10</text><text x="299.33333333333337" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">13</text><text x="412" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">16</text><text x="524.6666666666667" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">20</text><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">25</text><text x="750" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">30</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">批内请求数 B</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">每步读取 / GB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">每批权重</text><rect x="144" y="86" width="10" height="10" fill="var(--yellow)"/><text x="159" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">各请求 KV</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">每请求保留 8K 上下文，K = 1.21 GB；纵轴为每步读取量。</text>
</svg>