<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">固定 16 行块的有效与补零</title>
  <desc id="fig-desc">左侧每专家只有 2 行时，16 行块中 2 行有效、14 行补零；右侧每专家 64 行时可组成四个完整的 16 行块，图中只展示其中一块，全部有效</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">固定 16 行块的有效与补零</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">每专家 2 行时只有 2 行有效，64 行时组成四个满块</text><rect x="34" y="92" width="359" height="300" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/><text x="213.5" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">每专家 2 行</text><text x="213.5" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">行数不足</text><text x="46" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">16 行块中 2 行有效</text><text x="46" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">14 行填零</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">补零行仍参与执行</text><rect x="407" y="92" width="359" height="300" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="586.5" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">每专家 64 行</text><text x="586.5" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">行数充足</text><text x="419" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">组成 4 个 16 行块</text><text x="419" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">每块全部有效</text><text x="419" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">图中只展示一块</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">每块固定 16 行；每专家 64 行时正好是四个满块。</text>
</svg>