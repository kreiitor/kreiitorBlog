<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">分桶补齐的执行行数</title>
  <desc id="fig-desc">三组堆叠柱：256 行调用 8 次，实际 2048 行、补齐 2048 行；1536 行调用 1 次，实际 1536 行、补齐 512 行；2048 行调用 1 次，实际 2048 行、无需补齐</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="235.9296875" x2="750" y2="235.9296875" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="239.9296875" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">2000</text><line x1="74" y1="113.859375" x2="750" y2="113.859375" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="117.859375" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">4000</text><rect x="151.66666666666669" y="233" width="70" height="125" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="151.66666666666669" y="108" width="70" height="125" fill="var(--muted,#5f4f3c)" stroke="var(--muted,#5f4f3c)"/><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">256 行，8 次</text><rect x="377.00000000000006" y="264.25" width="70" height="93.75" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="377.00000000000006" y="233" width="70" height="31.25" fill="var(--muted,#5f4f3c)" stroke="var(--muted,#5f4f3c)"/><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">1536 行，1 次</text><rect x="602.3333333333334" y="233" width="70" height="125" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="602.3333333333334" y="233" width="70" height="0" fill="var(--muted,#5f4f3c)" stroke="var(--muted,#5f4f3c)"/><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">2048 行，1 次</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">调用类型</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">执行行数</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">实际行数</text><rect x="144" y="86" width="10" height="10" fill="var(--muted,#5f4f3c)"/><text x="159" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">补齐行数</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">256 行补齐到桶 512，1536 行补齐到桶 2048，2048 行恰好落在桶边界。</text>
</svg>