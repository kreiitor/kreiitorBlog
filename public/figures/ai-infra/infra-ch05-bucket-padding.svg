<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">分桶补齐的执行行数</title>
  <desc id="fig-desc">三组堆叠柱：256 行调用 8 次，实际 2048 行、补齐 2048 行；1536 行调用 1 次，实际 1536 行、补齐 512 行；2048 行调用 1 次，实际 2048 行、无需补齐</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="235.9296875" x2="750" y2="235.9296875" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="239.9296875" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">2000</text><line x1="74" y1="113.859375" x2="750" y2="113.859375" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="117.859375" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">4000</text><rect x="151.66666666666669" y="233" width="70" height="125" fill="var(--blue)" stroke="var(--blue)"/><rect x="151.66666666666669" y="108" width="70" height="125" fill="var(--muted)" stroke="var(--muted)"/><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">256 行，8 次</text><rect x="377.00000000000006" y="264.25" width="70" height="93.75" fill="var(--blue)" stroke="var(--blue)"/><rect x="377.00000000000006" y="233" width="70" height="31.25" fill="var(--muted)" stroke="var(--muted)"/><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">1536 行，1 次</text><rect x="602.3333333333334" y="233" width="70" height="125" fill="var(--blue)" stroke="var(--blue)"/><rect x="602.3333333333334" y="233" width="70" height="0" fill="var(--muted)" stroke="var(--muted)"/><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">2048 行，1 次</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">调用类型</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">执行行数</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">实际行数</text><rect x="144" y="86" width="10" height="10" fill="var(--muted)"/><text x="159" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">补齐行数</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">256 行补齐到桶 512，1536 行补齐到桶 2048，2048 行恰好落在桶边界。</text>
</svg>