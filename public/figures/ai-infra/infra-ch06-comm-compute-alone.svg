<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">通信与矩阵乘单独运行</title>
  <desc id="fig-desc">两组柱：4 MiB 时通信 2.67 ms、矩阵乘 11.53 ms；64 MiB 时通信 36.92 ms、矩阵乘 11.03 ms</desc>
