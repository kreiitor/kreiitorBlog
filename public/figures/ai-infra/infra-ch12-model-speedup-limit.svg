<svg xmlns="http://www.w3.org/2000/svg" width="800" height="273" viewBox="0 68 800 273" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">模型加速的任务级上限</title>
  <desc id="fig-desc">三条横条：原任务 10 秒，由模型 8 秒加其他 2 秒组成；模型快十倍 2.8 秒，由模型 0.8 秒加其他 2 秒组成；理想下界 2 秒，模型趋近于零，其他仍为 2 秒</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="126" y1="96" x2="126" y2="242" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="126" y="258" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">0</text><line x1="256.4166666666667" y1="96" x2="256.4166666666667" y2="242" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="256.4166666666667" y="258" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">2.5</text><line x1="386.83333333333337" y1="96" x2="386.83333333333337" y2="242" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="386.83333333333337" y="258" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">5</text><line x1="517.25" y1="96" x2="517.25" y2="242" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="517.25" y="258" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">7.5</text><line x1="647.6666666666667" y1="96" x2="647.6666666666667" y2="242" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="647.6666666666667" y="258" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">10</text><line x1="752" y1="96" x2="752" y2="242" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="752" y="258" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">12</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">原任务</text><rect x="126" y="115" width="417.3333333333333" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="334.66666666666663" y="134" font-size="9.5" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">模型 8 s</text><rect x="543.3333333333333" y="115" width="104.33333333333333" height="32" rx="3" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)"/><text x="595.4999999999999" y="134" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">其他 2 s</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">模型快 10 倍</text><rect x="126" y="157" width="41.733333333333334" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="146.86666666666667" y="176" font-size="8" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">模型…</text><rect x="167.73333333333335" y="157" width="104.33333333333333" height="32" rx="3" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)"/><text x="219.9" y="176" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">其他 2 s</text><text x="116" y="219" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">理想下界</text><rect x="126" y="199" width="104.33333333333333" height="32" rx="3" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)"/><text x="178.16666666666666" y="218" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">其他 2 s</text><line x1="126" y1="242" x2="752" y2="242" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="278" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">完整任务时间 / s</text><text x="400" y="315" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">加速比 10/2.8 ≈ 3.57；模型无限快时的加速比上限为 5。</text>
</svg>