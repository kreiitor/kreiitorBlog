<svg xmlns="http://www.w3.org/2000/svg" width="800" height="273" viewBox="0 68 800 273" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">模型加速的任务级上限</title>
  <desc id="fig-desc">三条横条：原任务 10 秒，由模型 8 秒加其他 2 秒组成；模型快十倍 2.8 秒，由模型 0.8 秒加其他 2 秒组成；理想下界 2 秒，模型趋近于零，其他仍为 2 秒</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="126" y1="96" x2="126" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="126" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0</text><line x1="256.4166666666667" y1="96" x2="256.4166666666667" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="256.4166666666667" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">2.5</text><line x1="386.83333333333337" y1="96" x2="386.83333333333337" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="386.83333333333337" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">5</text><line x1="517.25" y1="96" x2="517.25" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="517.25" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">7.5</text><line x1="647.6666666666667" y1="96" x2="647.6666666666667" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="647.6666666666667" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">10</text><line x1="752" y1="96" x2="752" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="752" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">12</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">原任务</text><rect x="126" y="115" width="417.3333333333333" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="334.66666666666663" y="134" font-size="9.5" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">模型 8 s</text><rect x="543.3333333333333" y="115" width="104.33333333333333" height="32" rx="3" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)"/><text x="595.4999999999999" y="134" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">其他 2 s</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">模型快 10 倍</text><rect x="126" y="157" width="41.733333333333334" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="146.86666666666667" y="176" font-size="8" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">模型…</text><rect x="167.73333333333335" y="157" width="104.33333333333333" height="32" rx="3" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)"/><text x="219.9" y="176" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">其他 2 s</text><text x="116" y="219" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">理想下界</text><rect x="126" y="199" width="104.33333333333333" height="32" rx="3" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)"/><text x="178.16666666666666" y="218" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">其他 2 s</text><line x1="126" y1="242" x2="752" y2="242" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="278" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">完整任务时间 / s</text><text x="400" y="315" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">加速比 10/2.8 ≈ 3.57；模型无限快时的加速比上限为 5。</text>
</svg>