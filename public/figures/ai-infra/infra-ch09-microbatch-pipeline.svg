<svg xmlns="http://www.w3.org/2000/svg" width="800" height="279" viewBox="0 68 800 279" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">四个 micro-batch 的串行与流水</title>
  <desc id="fig-desc">时间线对比：依次执行时，注意力与专家节点轮流工作，四个 micro-batch 共 20 ms；交错流水时，micro-batch 1 做专家计算时 micro-batch 2 做注意力，专家节点每 3 ms 完成一个，总时间 14 ms</desc>
