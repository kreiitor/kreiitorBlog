ted)" stroke-width="2.4"/><circle cx="74" cy="357.925" r="3.2" fill="var(--muted)"/><circle cx="243" cy="313" r="3.2" fill="var(--muted)"/><circle cx="412" cy="268" r="3.2" fill="var(--muted)"/><circle cx="581" cy="223" r="3.2" fill="var(--muted)"/><circle cx="750" cy="178" r="3.2" fill="var(--muted)"/><text x="74" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">0</text><text x="243" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">200</text><text x="412" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">400</text><text x="581" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">600</text><text x="750" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">800</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">每次启动开销 / μs</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">串行交接时间 / ms</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">PD · GQA 1.125 GiB</text><rect x="185.3" y="86" width="10" height="10" fill="var(--yellow)"/><text x="200.3" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">PD · 紧凑 MLA 549 MiB</text><rect x="298.75" y="86" width="10" height="10" fill="var(--muted)"/><text x="313.75" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">AF 一步 72 次启动</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">25 GB/s 链路；50 GB/s 下 GQA 与 MLA 的交点分别移到 340 与 162 μs。</text>
</svg>