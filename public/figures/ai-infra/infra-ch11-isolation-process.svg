<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 152 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">进程：私有地址空间</title>
  <desc id="fig-desc">上层是任务 0 与任务 1，各自拥有私有地址空间；两者直接落在同一层宿主操作系统内核上，通过权限限制访问</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="40" y="180" width="720" height="58" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="54" y="212" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">任务 0 · 任务 1</text><rect x="254" y="189" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="329" y="212" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">私有地址空间</text><rect x="532" y="189" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="607" y="212" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">权限限制</text><rect x="40" y="246" width="720" height="58" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/><text x="54" y="278" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">宿主操作系统内核</text><rect x="393" y="255" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="468" y="278" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">同一节点共享</text></svg>