ght="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="439" y="134" font-size="9.5" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">样本 3 · 10 s</text><line x1="126" y1="158" x2="752" y2="158" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="194" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">时间 / s</text></svg>