<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 68 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">到达即提交：整批 30 秒完成</title>
  <desc id="fig-desc">横轴 0–50 秒，验证进程连续工作：样本 1 在第 0 秒到达并执行 0–10 秒，样本 2 在第 10 秒到达并执行 10–20 秒，样本 3 在第 20 秒到达并执行 20–30 秒</desc>
  <style>
