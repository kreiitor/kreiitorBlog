<svg xmlns="http://www.w3.org/2000/svg" width="800" height="327" viewBox="0 76 800 327" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">两条服务路径的计费方式</title>
  <desc id="fig-desc">任务控制器进入统一服务入口，入口再分到外部 API 与自建副本；外部 API 按调用用量计费，自建副本按设备预留及运行支出计价，两条路径都把成本归到任务及尝试</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="47.66666666666667" y="104.5" width="210" height="112" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="157.25" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">任务控制器</text>
  <text x="152.66666666666669" y="173.5" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">提交与重试</text><rect x="295.00000000000006" y="104.5" width="210" height="112" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="157.25" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">服务入口</text>
  <text x="400.00000000000006" y="173.5" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">鉴权 · 路由 · 限流</text><rect x="542.3333333333334" y="104.5" width="210" height="112" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="157.25" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">外部 API</text>
  <text x="647.3333333333334" y="173.5" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">按调用用量计费</text><rect x="47.66666666666667" y="267.5" width="210" height="112" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="320.25" font-size="13" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">自建副本</text>
  <text x="152.66666666666669" y="336.5" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">按设备预留计费</text><path d="M257.6666666666667 160.5 L295.00000000000006 160.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 160.5 L542.3333333333334 160.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M400.00000000000006 216.5 L400.00000000000006 242 L152.66666666666669 242 L152.66666666666669 267.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/></svg>