<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">等齐再提交：整批 50 秒完成</title>
  <desc id="fig-desc">横轴同 0–50 秒；三条样本都等到第 20 秒才进入验证进程，随后依次执行第 20–30、30–40、40–50 秒，整批第 50 秒完成</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="126" y1="96" x2="126" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="251.2" y1="96" x2="251.2" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="251.2" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">10</text><line x1="376.4" y1="96" x2="376.4" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="376.4" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">20</text><line x1="501.59999999999997" y1="96" x2="501.59999999999997" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="501.59999999999997" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">30</text><line x1="626.8" y1="96" x2="626.8" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="626.8" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">40</text><line x1="752" y1="96" x2="752" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">50</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">验证进程</text><rect x="376.4" y="115" width="125.2" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="439" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">样本 1 · 10 s</text><rect x="501.59999999999997" y="115" width="125.2" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="564.1999999999999" y="134" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">样本 2 · 10 s</text><rect x="626.8" y="115" width="125.2" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="689.4" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">样本 3 · 10 s</text><line x1="126" y1="158" x2="752" y2="158" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="194" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">时间 / s</text></svg>