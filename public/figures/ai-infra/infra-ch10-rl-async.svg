<svg xmlns="http://www.w3.org/2000/svg" width="800" height="273" viewBox="0 68 800 273" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">异步 RL 循环的 44 s 周期</title>
  <desc id="fig-desc">三条泳道：生成从 0 到 40 s，学习从 0 到 16 s 后等待；权重同步在 40—44 s 阻塞两侧，周期为 44 s</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="126" y1="96" x2="126" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="126" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0</text><line x1="268.27272727272725" y1="96" x2="268.27272727272725" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="268.27272727272725" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">10</text><line x1="410.54545454545456" y1="96" x2="410.54545454545456" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="410.54545454545456" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">20</text><line x1="552.8181818181818" y1="96" x2="552.8181818181818" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="552.8181818181818" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">30</text><line x1="695.0909090909091" y1="96" x2="695.0909090909091" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="695.0909090909091" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">40</text><line x1="752" y1="96" x2="752" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="752" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">44</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">生成</text><rect x="126" y="115" width="569.0909090909091" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="410.54545454545456" y="134" font-size="9.5" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">40 s</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">学习</text><rect x="126" y="157" width="227.63636363636365" height="32" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="239.8181818181818" y="176" font-size="9.5" fill="var(--on-yellow,#3b3024)" font-weight="600" text-anchor="middle">16 s</text><rect x="353.6363636363636" y="157" width="341.45454545454544" height="32" rx="3" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)"/><text x="524.3636363636364" y="176" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">等待</text><text x="116" y="219" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">权重同步</text><rect x="695.0909090909091" y="199" width="56.909090909090914" height="32" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)"/><text x="723.5454545454546" y="218" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">4 s</text><line x1="126" y1="242" x2="752" y2="242" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="278" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">稳态周期内时间 / s</text><text x="400" y="315" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">异步周期为 max(40, 16) + 4 = 44 s；保留比例需高于 44/60 ≈ 73.3% 才比同步更快。</text>
</svg>