<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">异步 RL 循环的 44 s 周期</title>
  <desc id="fig-desc">三条泳道：生成从 0 到 40 s，学习从 0 到 16 s 后等待；权重同步在 40—44 s 阻塞两侧，周期为 44 s</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">异步 RL 循环的 44 s 周期</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">生成与学习重叠，权重同步阻塞两侧</text><line x1="126" y1="96" x2="126" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="268.27272727272725" y1="96" x2="268.27272727272725" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="268.27272727272725" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">10</text><line x1="410.54545454545456" y1="96" x2="410.54545454545456" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="410.54545454545456" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">20</text><line x1="552.8181818181818" y1="96" x2="552.8181818181818" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="552.8181818181818" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">30</text><line x1="695.0909090909091" y1="96" x2="695.0909090909091" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="695.0909090909091" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">40</text><line x1="752" y1="96" x2="752" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">44</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">生成</text><rect x="126" y="115" width="569.0909090909091" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="410.54545454545456" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">40 s</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">学习</text><rect x="126" y="157" width="227.63636363636365" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="239.8181818181818" y="176" font-size="9.5" fill="var(--on-yellow)" font-weight="600" text-anchor="middle">16 s</text><rect x="353.6363636363636" y="157" width="341.45454545454544" height="32" rx="3" fill="var(--line-soft)" stroke="var(--line)"/><text x="524.3636363636364" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">等待</text><text x="116" y="219" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">权重同步</text><rect x="695.0909090909091" y="199" width="56.909090909090914" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="723.5454545454546" y="218" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">4 s</text><line x1="126" y1="242" x2="752" y2="242" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="278" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">稳态周期内时间 / s</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">异步周期为 max(40, 16) + 4 = 44 s；保留比例需高于 44/60 ≈ 73.3% 才比同步更快。</text>
</svg>