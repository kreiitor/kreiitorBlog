<svg xmlns="http://www.w3.org/2000/svg" width="800" height="315" viewBox="0 68 800 315" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">三槽处理四块</title>
  <desc id="fig-desc">四条泳道对应块 0 至块 3；前三块在 0、64、128 tick 发起传输，分别在 192、256、320 tick 就绪并连续计算；块 3 在 320 tick 发起，512 tick 就绪，576 到 704 tick 计算，中途没有空闲</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="126" y1="96" x2="126" y2="284" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="126" y="300" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">0</text><line x1="370.53125" y1="96" x2="370.53125" y2="284" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="370.53125" y="300" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">500</text><line x1="615.0625" y1="96" x2="615.0625" y2="284" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="615.0625" y="300" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">1000</text><line x1="752" y1="96" x2="752" y2="284" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="752" y="300" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">1280</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">块 0</text><rect x="126" y="115" width="31.3" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="141.65" y="134" font-size="9.5" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">传输</text><rect x="157.3" y="115" width="62.6" height="32" rx="3" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)"/><text x="188.60000000000002" y="134" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">等待</text><rect x="219.89999999999998" y="115" width="62.6" height="32" rx="3" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)"/><text x="251.2" y="134" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">计算</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">块 1</text><rect x="157.3" y="157" width="31.3" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="172.9