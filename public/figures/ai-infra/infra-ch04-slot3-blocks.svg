 text-anchor="middle">等待</text><rect x="407.7" y="241" width="62.6" height="32" rx="3" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)"/><text x="439" y="260" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">计算</text><line x1="126" y1="284" x2="752" y2="284" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="320" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">时间 / tick</text><text x="400" y="357" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">块 0 在 320 tick 释放槽位后立即发起块 3 的读取。</text>
</svg>