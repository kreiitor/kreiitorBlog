<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">队列占用与排空</title>
  <desc id="fig-desc">队列占用从初始 256 KiB 上升，5.2 μs 时达到 512 KiB 并保持到 20 μs，期间持续丢弃超额数据；反馈生效后按约 10 GB/s 净速率下降，约 72 μs 归零</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">队列占用与排空</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">5.2 μs 填满 512 KiB，20 μs 后按 10 GB/s 排空</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="267.0909090909091" x2="750" y2="267.0909090909091" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="271.0909090909091" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">200</text><line x1="74" y1="176.1818181818182" x2="750" y2="176.1818181818182" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="180.1818181818182" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">400</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">550</text><polyline points="74,241.63636363636363 243,125.27272727272728 412,125.27272727272728 581,358 750,358" fill="none" stroke="var(--blue)" stroke-width="2.4"/><circle cx="74" cy="241.63636363636363" r="3.2" fill="var(--blue)"/><circle cx="243" cy="125.27272727272728" r="3.2" fill="var(--blue)"/><circle cx="412" cy="125.27272727272728" r="3.2" fill="var(--blue)"/><circle cx="581" cy="358" r="3.2" fill="var(--blue)"/><circle cx="750" cy="358" r="3.2" fill="var(--blue)"/><text x="74" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">0</text><text x="243" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">5.2</text><text x="412" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">20</text><text x="581" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">72</text><text x="750" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">120</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">时间 / μs</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">队列占用 / KiB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">队列占用</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">缓冲共 512 KiB，初始占用一半；5.2–20 μs 曲线保持在满值，表示持续丢弃超额到达的数据。</text>
</svg>