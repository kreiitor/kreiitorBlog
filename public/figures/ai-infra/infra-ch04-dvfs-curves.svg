<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">功率封顶下的持续频率</title>
  <desc id="fig-desc">两条下降曲线：电压不变时持续频率比为 b/e，在 e/b = 1.5 处降到 0.67；电压随频率同步下降时为 (b/e) 的三分之一次方，只降到 0.87</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">功率封顶下的持续频率</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">电压不变降到 0.67，电压同步下降只降到 0.87</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0.25</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0.5</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0.75</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">1</text><polyline points="74,108 299.33333333333337,190.5 524.6666666666667,233 750,274.75" fill="none" stroke="var(--yellow)" stroke-width="2.4"/><circle cx="74" cy="108" r="3.2" fill="var(--yellow)"/><circle cx="299.33333333333337" cy="190.5" r="3.2" fill="var(--yellow)"/><circle cx="524.6666666666667" cy="233" r="3.2" fill="var(--yellow)"/><circle cx="750" cy="274.75" r="3.2" fill="var(--yellow)"/><polyline points="74,108 299.33333333333337,140.5 524.6666666666667,159.5 750,184.75" fill="none" stroke="var(--blue)" stroke-width="2.4"/><circle cx="74" cy="108" r="3.2" fill="var(--blue)"/><circle cx="299.33333333333337" cy="140.5" r="3.2" fill="var(--blue)"/><circle cx="524.6666666666667" cy="159.5" r="3.2" fill="var(--blue)"/><circle cx="750" cy="184.75" r="3.2" fill="var(--blue)"/><text x="74" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">1.0</text><text x="299.33333333333337" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">1.5</text><text x="524.6666666666667" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">2.0</text><text x="750" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">3.0</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">e ÷ b</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">持续频率 ÷ 峰值频率</text></g><rect x="82" y="86" width="10" height="10" fill="var(--yellow)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">电压不变</text><rect x="144" y="86" width="10" height="10" fill="var(--blue)"/><text x="159" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">电压随频率下降</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">横轴为实际每 FLOP 能耗 e 与预算 b 之比；纵轴为持续频率与峰值频率之比。</text>
</svg>