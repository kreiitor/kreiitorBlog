<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 68 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">一个输入槽的生命周期</title>
  <desc id="fig-desc">输入槽从 0 到 64 tick 传输，64 到 192 tick 等待返回，192 到 320 tick 计算；数据在 192 tick 就绪，320 tick 用完后槽才能再次写入</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="126" y1="96" x2="126" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="126" y="174" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0</text><line x1="321.625" y1="96" x2="321.625" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="321.625" y="174" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">100</text><line x1="517.25" y1="96" x2="517.25" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="517.25" y="174" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">200</text><line x1="712.875" y1="96" x2="712.875" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="712.875" y="174" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">300</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">输入槽</text><rect x="126" y="115" width="125.2" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="188.6" y="134" font-size="9.5" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">传输</text><rect x="251.2" y="115" width="250.4" height="32" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)"/><text x="376.4" y="134" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">等待返回</text><rect x="501.59999999999997" y="115" width="250.4" height="32" rx="3" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)"/><text x="626.8" y="134" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">计算</text><line x1="126" y1="158" x2="752" y2="158" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="194" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">时间 / tick</text><text x="400" y="231" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">一个 tick 为 B200 SM 的一个时钟周期。</text>
</svg>