<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 68 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">一个输入槽的生命周期</title>
  <desc id="fig-desc">输入槽从 0 到 64 tick 传输，64 到 192 tick 等待返回，192 到 320 tick 计算；数据在 192 tick 就绪，320 tick 用完后槽才能再次写入</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="126" y1="96" x2="126" y2="158" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="126" y="174" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">0</text><line x1="321.625" y1="96" x2="321.625" y2="158" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="321.625" y="174" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">100</text><line x1="517.25" y1="96" x2="517.25" y2="158" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="517.25" y="174" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">200</text><line x1="712.875" y1="96" x2="712.875" y2="158" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="712.875" y="174" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">300</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">输入槽</text><rect x="126" y="115" width="125.2" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="188.6" y="134" font-size="9.5" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">传输</text><rect x="251.2" y="115" width="250.4" height="32" rx="3" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)"/><text x="376.4" y="134" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">等待返回</text><rect x="501.59999999999997" y="115" width="250.4" height="32" rx="3" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)"/><text x="626.8" y="134" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">计算</text><line x1="126" y1="158" x2="752" y2="158" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="194" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">时间 / tick</text><text x="400" y="231" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">一个 tick 为 B200 SM 的一个时钟周期。</text>
</svg>