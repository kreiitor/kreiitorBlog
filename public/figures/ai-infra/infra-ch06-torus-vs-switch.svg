<svg xmlns="http://www.w3.org/2000/svg" width="800" height="368" viewBox="0 64 800 368" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">三维环面与交换网络</title>
  <desc id="fig-desc">左侧是三维环面的一层：4×4 共 16 张卡，每卡与四个邻居直连，虚线表示每一维首尾相连；从角上的卡到中心的卡经过四跳，加上第三维最多六跳。右侧是交换网络：每张卡接到交换芯片，任意两卡之间是两条链路加一次交换</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="34" y="92" width="359" height="3" fill="var(--blue,#2647d7)"/><rect x="34" y="92" width="359" height="300" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="213.5" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">三维环面</text><text x="213.5" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">4×4 一层</text><text x="46" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">每卡与四个邻居直连</text><text x="46" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">虚线为每维首尾相连</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">角到中心四跳，加第三维最多六跳</text><rect x="407" y="92" width="359" height="3" fill="var(--yellow,#ffe04b)"/><rect x="407" y="92" width="359" height="300" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="586.5" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">交换网络</text><text x="586.5" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">每卡接交换芯片</text><text x="419" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">任意两卡两条链路</text><text x="419" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">加一次交换转发</text><text x="419" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">距离不随卡数增加而累加</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line,#a2aec1)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">邻居直连</text><text x="730" y="400" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">交换转发</text></svg>