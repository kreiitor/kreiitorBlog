<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">四轮模型调用的墙钟耗时</title>
  <desc id="fig-desc">四根柱依次表示第 1 轮截断 36.375 秒、第 2 轮写文件 26.428 秒、第 3 轮测试 10.034 秒、第 4 轮结束 3.456 秒，合计 76.293 秒</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">四轮模型调用的墙钟耗时</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">首轮截断占去 36.375 秒</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">30</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">40</text><rect x="123.5" y="130.65625" width="68" height="227.34375" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="158.5" y="124.65625" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">36.375</text><text x="158.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">第 1 轮 截断</text><rect x="292.5" y="192.825" width="68" height="165.175" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="327.5" y="186.825" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">26.428</text><text x="327.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">第 2 轮 写文件</text><rect x="461.5" y="295.2875" width="68" height="62.712500000000006" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="496.5" y="289.2875" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">10.034</text><text x="496.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">第 3 轮 测试</text><rect x="630.5" y="336.4" width="68" height="21.6" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="665.5" y="330.4" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">3.456</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">第 4 轮 结束</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">轮次</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">模型墙钟时间 / s</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">模型调用耗时</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">四轮相加 76.293 秒，与 76.294 秒的差来自取整；工具执行合计约 0.078 秒。</text>
</svg>