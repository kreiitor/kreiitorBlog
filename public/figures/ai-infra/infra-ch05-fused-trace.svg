<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">融合激活链后的 3 次 FFN</title>
  <desc id="fig-desc">融合激活链后的 3 次 FFN 实测中，主机 kernel launch 15 次，加速器执行 15 个 kernel</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="274.6666666666667" x2="750" y2="274.6666666666667" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="278.6666666666667" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">5</text><line x1="74" y1="191.33333333333334" x2="750" y2="191.33333333333334" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="195.33333333333334" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">15</text><rect x="208" y="108" width="68" height="250" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="243" y="102" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">15</text><text x="243" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">主机 launch</text><rect x="546" y="108" width="68" height="250" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="581" y="102" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">15</text><text x="581" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">加速器 kernel</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">事件类型</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">次数</text></g><rect x="82" y="86" width="10" height="10" fill="var(--yellow,#ffe04b)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">事件数</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">数据来自与普通提交相同的实验，单独标记采集区间。</text>
</svg>