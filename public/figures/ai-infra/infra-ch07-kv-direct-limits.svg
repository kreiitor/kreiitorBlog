<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">KV-Direct 随机读上限与实测</title>
  <desc id="fig-desc">四根柱分别表示链路带宽换算 123、报文头开销上限 87、在途标签上限 61、实测 60，单位为每秒百万次 64 B 随机 DMA 读</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="261.8461538461538" x2="750" y2="261.8461538461538" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="265.8461538461538" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">50</text><line x1="74" y1="165.69230769230768" x2="750" y2="165.69230769230768" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="169.69230769230768" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">100</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">130</text><rect x="123.5" y="121.46153846153848" width="68" height="236.53846153846152" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="158.5" y="115.46153846153848" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">123</text><text x="158.5" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">链路带宽换算</text><rect x="292.5" y="190.6923076923077" width="68" height="167.3076923076923" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="327.5" y="184.6923076923077" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">87</text><text x="327.5" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">报文头开销上限</text><rect x="461.5" y="240.69230769230768" width="68" height="117.3076923076923" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="496.5" y="234.69230769230768" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">61</text><text x="496.5" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">在途标签上限</text><rect x="630.5" y="242.6153846153846" width="68" height="115.38461538461539" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="665.5" y="236.6153846153846" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">60</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">实测</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">上限来源</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">64 B 随机读 / 百万次每秒</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">每秒百万次</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">在途标签上限按 64 个标签、1050 ns 往返计算；实测接近该上限，说明标签数是瓶颈。</text>
</svg>