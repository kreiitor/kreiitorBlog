<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">环形 AllReduce 的 ReduceScatter 与 AllGather</title>
  <desc id="fig-desc">四张卡组成有向环，块 0 依次经过卡 0 到卡 3 并累加，三轮完成 ReduceScatter，再经三轮 AllGather 让每张卡收齐所有块。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink)}
    .sub{font-size:14px;fill:var(--muted)}
    .h{font-size:16px;font-weight:700;fill:var(--ink)}
    .b{font-size:13px;font-weight:600;fill:var(--ink)}
    .s{font-size:12px;fill:var(--muted)}
    .tiny{font-size:11px;fill:var(--muted)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="36" text-anchor="middle" class="title">环形 AllReduce：先归约，再收集</text>
  <text x="400" y="62" text-anchor="middle" class="sub">四卡、每卡四块；块 0 沿环累加，三轮后得到完整和</text>

  <rect x="96" y="98" width="100" height="58" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.8"/>
  <text x="146" y="122" text-anchor="middle" class="b">卡 0</text>
  <text x="146" y="144" text-anchor="middle" class="tiny">1（起点）</text>

  <rect x="274" y="196" width="100" height="58" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.8"/>
  <text x="324" y="220" text-anchor="middle" class="b">卡 1</text>
  <text x="324" y="242" text-anchor="middle" class="tiny">11（+10）</text>

  <rect x="96" y="294" width="100" height="58" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.8"/>
  <text x="146" y="318" text-anchor="middle" class="b">卡 2</text>
  <text x="146" y="340" text-anchor="middle" class="tiny">111（+100）</text>

  <rect x="18" y="196" width="100" height="58" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="2"/>
  <text x="68" y="220" text-anchor="middle" class="b">卡 3</text>
  <text x="68" y="242" text-anchor="middle" class="tiny">1111（满）</text>

  <path d="M146 156 L146 226 L274 226" stroke="var(--blue)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M324 254 L324 323 L196 323" stroke="var(--blue)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M96 323 L68 323 L68 254" stroke="var(--blue)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M68 196 L68 156 L96 156" stroke="var(--blue)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <text x="205" y="216" text-anchor="middle" class="tiny">第 1 轮</text>
  <text x="350" y="300" text-anchor="start" class="tiny">第 2 轮</text>
  <text x="62" y="300" text-anchor="end" class="tiny">第 3 轮</text>
  <text x="62" y="176" text-anchor="end" class="tiny">AllGather</text>

  <rect x="410" y="92" width="360" height="300" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.8"/>
  <text x="430" y="118" class="b">两个阶段</text>
  <text x="430" y="148" class="b">① ReduceScatter（3 轮）</text>
  <text x="430" y="170" class="s">块 0 依次经过卡 0 → 1 → 2 → 3，</text>
  <text x="430" y="190" class="s">每经过一卡就加入该卡的贡献。</text>
  <text x="430" y="210" class="s">三轮后卡 3 持有块 0 的完整和。</text>

  <line x1="430" y1="226" x2="750" y2="226" stroke="var(--line-soft)" stroke-width="1"/>

  <text x="430" y="252" class="b">② AllGather（3 轮）</text>
  <text x="430" y="274" class="s">每卡把已完成的块继续向下一卡转发，</text>
  <text x="430" y="294" class="s">每轮多获得一块；三轮后每卡收齐四块。</text>

  <rect x="430" y="314" width="320" height="58" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.4"/>
  <text x="446" y="336" class="tiny">总轮数 2(n−1) = 6</text>
  <text x="446" y="358" class="tiny">每卡发送 2(n−1)M/n = 1.5M bytes（四卡）</text>

  <text x="400" y="424" text-anchor="middle" class="tiny">其他三个块同时沿环推进；每个块最终停在起点前一张卡，再由 AllGather 补齐到所有卡。</text>
  <text x="400" y="442" text-anchor="middle" class="tiny">小消息时每轮启动开销占主导；大消息时每轮传输的数据量占主导。</text>
</svg>
