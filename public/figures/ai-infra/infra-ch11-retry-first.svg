<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">首次尝试后的三个分支</title>
  <desc id="fig-desc">首次尝试在第 10 秒后分成三支：首次成功占 80%，局部修复占 12%，直接升级占 8%；比例均以全部提交为分母</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="109.5" y="104.5" width="210" height="112" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="214.5" y="157.25" font-size="13" fill="var(--on-blue)" font-weight="700" text-anchor="middle">首次尝试</text>
  <text x="214.5" y="173.5" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">10 s</text><rect x="480.5" y="104.5" width="210" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="585.5" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">首次成功</text>
  <text x="585.5" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">全部提交的 80%</text><rect x="109.5" y="267.5" width="210" height="112" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="214.5" y="320.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">局部修复</text>
  <text x="214.5" y="336.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">全部提交的 12%</text><rect x="480.5" y="267.5" width="210" height="112" rx="8" fill="var(--yellow)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="585.5" y="320.25" font-size="13" fill="var(--on-yellow)" font-weight="700" text-anchor="middle">直接升级</text>
  <text x="585.5" y="336.5" font-size="12" fill="var(--on-yellow)" font-weight="400" text-anchor="middle">全部提交的 8%</text><path d="M319.5 160.5 L480.5 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M214.5 216.5 L214.5 242 L214.5 242 L214.5 267.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M214.5 216.5 L214.5 242 L585.5 242 L585.5 267.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/></svg>