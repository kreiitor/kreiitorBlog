<svg xmlns="http://www.w3.org/2000/svg" width="800" height="327" viewBox="0 76 800 327" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">首次尝试后的三个分支</title>
  <desc id="fig-desc">首次尝试在第 10 秒后分成三支：首次成功占 80%，局部修复占 12%，直接升级占 8%；比例均以全部提交为分母</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="109.5" y="104.5" width="210" height="112" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="214.5" y="157.25" font-size="13" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">首次尝试</text>
  <text x="214.5" y="173.5" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">10 s</text><rect x="480.5" y="104.5" width="210" height="112" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="585.5" y="157.25" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">首次成功</text>
  <text x="585.5" y="173.5" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">全部提交的 80%</text><rect x="109.5" y="267.5" width="210" height="112" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="214.5" y="320.25" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">局部修复</text>
  <text x="214.5" y="336.5" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">全部提交的 12%</text><rect x="480.5" y="267.5" width="210" height="112" rx="8" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="585.5" y="320.25" font-size="13" fill="var(--on-yellow,#3b3024)" font-weight="700" text-anchor="middle">直接升级</text>
  <text x="585.5" y="336.5" font-size="12" fill="var(--on-yellow,#3b3024)" font-weight="400" text-anchor="middle">全部提交的 8%</text><path d="M319.5 160.5 L480.5 160.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M214.5 216.5 L214.5 242 L214.5 242 L214.5 267.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M214.5 216.5 L214.5 242 L585.5 242 L585.5 267.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/></svg>