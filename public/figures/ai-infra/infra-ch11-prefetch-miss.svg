<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 68 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">预测错误：取消后重新准备</title>
  <desc id="fig-desc">横轴 0–6 秒，第 2–4 秒准备了不需要的误选环境；调用第 4 秒到达后取消它，再从第 4 秒到第 6 秒准备实际所需环境</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">0</text><line x1="334.66666666666663" y1="96" x2="334.66666666666663" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="334.66666666666663" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">2</text><line x1="543.3333333333333" y1="96" x2="543.3333333333333" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="543.3333333333333" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">4</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">6</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">误选环境</text><rect x="334.66666666666663" y="115" width="208.66666666666666" height="32" rx="3" fill="var(--line-soft,#dce1e8)" stroke="var(--line,#a2aec1)"/><text x="438.99999999999994" y="134" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">不需要</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">实际所需环境</text><rect x="543.3333333333333" y="157" width="208.66666666666666" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="647.6666666666666" y="176" font-size="9.5" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">准备 2 s</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">时间 / s</text></svg>