<svg xmlns="http://www.w3.org/2000/svg" width="800" height="395" viewBox="0 44 800 395" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">工具环境的生命周期</title>
  <desc id="fig-desc">工具环境从创建、执行、暂停驻留、恢复到释放，不同阶段保留不同的文件、进程与内存状态；创建和释放策略决定启动开销与资源占用。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:12px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:11px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:10px;fill:var(--muted,#5f4f3c)}
    .onblue{fill:var(--on-blue,#fffcf5)}
    .onyellow{fill:var(--on-yellow,#3b3024)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <rect x="34" y="104" width="126" height="84" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="2"/>
  <text x="97" y="134" text-anchor="middle" class="h onblue">创建</text>
  <text x="97" y="158" text-anchor="middle" class="tiny onblue">模板 + 私有状态</text>

  <rect x="190" y="104" width="126" height="84" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="2"/>
  <text x="253" y="134" text-anchor="middle" class="h">执行</text>
  <text x="253" y="158" text-anchor="middle" class="tiny">文件 · 进程 · 网络</text>

  <rect x="346" y="104" width="126" height="84" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="2"/>
  <text x="409" y="134" text-anchor="middle" class="h">暂停 / 驻留</text>
  <text x="409" y="158" text-anchor="middle" class="tiny">停止计算，保留状态</text>

  <rect x="502" y="104" width="126" height="84" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="2"/>
  <text x="565" y="134" text-anchor="middle" class="h">恢复</text>
  <text x="565" y="158" text-anchor="middle" class="tiny">唤醒或重新载入</text>

  <rect x="658" y="104" width="108" height="84" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="2"/>
  <text x="712" y="134" text-anchor="middle" class="h">释放</text>
  <text x="712" y="158" text-anchor="middle" class="tiny">回收内存与进程</text>

  <path d="M162 146 H186" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M318 146 H342" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M474 146 H498" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M630 146 H654" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <text x="97" y="220" text-anchor="middle" class="s">分配 CPU</text>
  <text x="97" y="238" text-anchor="middle" class="s">内存 / GPU</text>
  <text x="253" y="220" text-anchor="middle" class="s">真正运行工具</text>
  <text x="253" y="238" text-anchor="middle" class="s">产生工作文件</text>
  <text x="409" y="220" text-anchor="middle" class="s">等待模型或用户</text>
  <text x="409" y="238" text-anchor="middle" class="s">文件与进程仍在</text>
  <text x="565" y="220" text-anchor="middle" class="s">沿用已有状态</text>
  <text x="565" y="238" text-anchor="middle" class="s">或从模板重建</text>
  <text x="712" y="220" text-anchor="middle" class="s">任务结束</text>
  <text x="712" y="238" text-anchor="middle" class="s">资源可复用</text>

  <path d="M472 132 C488 90 502 90 518 132" stroke="var(--line,#c9b49c)" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
  <text x="495" y="82" text-anchor="middle" class="tiny">下一轮再唤醒</text>

  <rect x="34" y="292" width="360" height="72" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="52" y="318" class="h">创建策略</text>
  <text x="52" y="342" class="s">始终驻留 · 按需创建 · 提前准备</text>
  <text x="52" y="358" class="tiny">启动开销与资源占用之间取舍</text>

  <rect x="410" y="292" width="356" height="72" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.5"/>
  <text x="428" y="318" class="h">释放策略</text>
  <text x="428" y="342" class="s">立即回收 · TTL · LRU</text>
  <text x="428" y="358" class="tiny">文件需要跨轮保留时另做持久化</text>

  <text x="400" y="412" text-anchor="middle" class="tiny">创建接口早返回不等于数据已就绪：按需加载把一部分等待推迟到首次访问。</text>
</svg>
