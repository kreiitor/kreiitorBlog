<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 64 800 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">计算集中在 die 0</title>
  <desc id="fig-desc">两组对照都画出 die 0 与 die 1 各含 32 GiB 权重，计算单元只在 die 0；箭头从 die 1 指向 die 0，标注跨 die 读 32 GiB；HGX B200 阶段约 8.6 ms，受 die 1 的 HBM 限制；昇腾 910C 阶段约 127.3 ms，受 die 间链路限制</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="34" y="92" width="359" height="3" fill="var(--blue,#466b3f)"/><rect x="34" y="92" width="359" height="300" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="213.5" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">HGX B200</text><text x="213.5" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">die 间链路 10 TB/s</text><text x="46" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">两颗 die 各 32 GiB 权重</text><text x="46" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">计算全在 die 0</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">跨 die 读 32 GiB</text><text x="46" y="239.84999999999997" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="239.84999999999997" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">阶段约 8.6 ms（受 die 1 HBM 限制）</text><rect x="407" y="92" width="359" height="3" fill="var(--yellow,#f5d75f)"/><rect x="407" y="92" width="359" height="300" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="586.5" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">昇腾 910C</text><text x="586.5" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">die 间链路 270 GB/s</text><text x="419" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">两颗 die 各 32 GiB 权重</text><text x="419" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="431" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">计算全在 die 0</text><text x="419" y="217.89999999999998" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="431" y="217.89999999999998" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">跨 die 读 32 GiB</text><text x="419" y="239.84999999999997" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="431" y="239.84999999999997" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">阶段约 127.3 ms（受链路限制）</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line,#c9b49c)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">跨 die 便宜</text><text x="730" y="400" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">跨 die 昂贵</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">两颗 die 各存 32 GiB 权重；32 GiB 折算为 34.36 GB。</text>
</svg>