<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">B 路径：经 200 GbE 远端取回</title>
  <desc id="fig-desc">时间线：B 路径先查找 10 ms；经 200 GbE 以 25 GB/s 读取 1.125 GiB 用 48.3 ms；再经 PCIe 搬到 GPU 用 48.3 ms；最后计算 30.9 ms；首 token 约 137 ms</desc>
