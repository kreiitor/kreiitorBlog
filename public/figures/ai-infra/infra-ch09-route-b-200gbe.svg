end">计算</text><rect x="543.0725" y="199" width="120.89625000000002" height="32" rx="3" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)"/><text x="603.520625" y="218" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">30.9 ms</text><line x1="126" y1="242" x2="752" y2="242" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="278" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">从请求到达起计时 / ms</text></svg>