<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">70B 模型的权重容量</title>
  <desc id="fig-desc">四根水平柱：BF16 单卡 141.11 GB，超过 80 GB 容量线；BF16 卡 0 与卡 1 各 70.55 GB，均在容量线下；8 比特单卡 73.73 GB，也在容量线下且高于两张分卡</desc>
