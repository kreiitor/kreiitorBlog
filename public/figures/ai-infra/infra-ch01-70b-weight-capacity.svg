middle">BF16 卡 1</text><rect x="630.5" y="242.796875" width="68" height="115.203125" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="665.5" y="236.796875" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">73.73</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">8 比特单卡</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">配置</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">权重及量化附加数据（GB）</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#2647d7)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">容量</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">虚线为单卡 H100 SXM 的 80 GB 名义容量；柱长只计权重及量化附加数据。</text>
