k,#202735)" font-weight="400" text-anchor="middle">8.75</text><rect x="342.0799999999999" y="126" width="159.27999999999997" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="421.7199999999999" y="150" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">1.10</text><rect x="501.3599999999999" y="126" width="159.27999999999997" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="580.9999999999999" y="150" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">0.112</text><rect x="660.6399999999999" y="126" width="101.35999999999997" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="711.3199999999998" y="150" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">ms</text><rect x="38" y="168" width="144.79999999999995" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="110.39999999999998" y="192" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">1 行</text><rect x="182.79999999999995" y="168" width="159.27999999999997" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="262.43999999999994" y="192" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">2.14</text><rect x="342.0799999999999" y="168" width="159.27999999999997" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="421.7199999999999" y="192" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">0.268</text><rect x="501.3599999999999" y="168" width="159.27999999999997" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="580.9999999999999" y="192" font-size="10.5" fill="var(--ink,#202735)" font-