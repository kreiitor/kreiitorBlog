<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 63 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">工具依赖决定任务的关键路径</title>
  <desc id="fig-desc">两个工具串行依赖时总耗时 21 秒；相互独立时同时执行，模型等待较慢的工具，总耗时 15 秒。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:12px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:11px;fill:var(--muted,#5f4f3c)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--line,#c9b49c)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <text x="28" y="104" class="b">工具 B 依赖 A</text>
  <text x="772" y="104" text-anchor="end" class="b">总计 21 s</text>

  <text x="28" y="135" class="tiny">模型</text>
  <text x="28" y="171" class="tiny">工具 A</text>
  <text x="28" y="207" class="tiny">工具 B</text>

  <rect x="120" y="116" width="56" height="26" rx="4" fill="var(--blue,#466b3f)"/>
  <text x="148" y="134" text-anchor="middle" class="tiny" fill="var(--on-blue,#fffcf5)">2 s</text>
  <rect x="176" y="152" width="169" height="26" rx="4" fill="var(--yellow,#f5d75f)"/>
  <text x="260" y="170" text-anchor="middle" class="tiny" fill="var(--on-yellow,#3b3024)">工具 A · 6 s</text>
  <rect x="345" y="188" width="282" height="26" rx="4" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.2"/>
  <text x="486" y="206" text-anchor="middle" class="tiny">工具 B · 10 s</text>
  <rect x="627" y="116" width="85" height="26" rx="4" fill="var(--blue,#466b3f)"/>
  <text x="669" y="134" text-anchor="middle" class="tiny" fill="var(--on-blue,#fffcf5)">3 s</text>

  <line x1="176" y1="104" x2="176" y2="222" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="345" y1="104" x2="345" y2="222" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.2" stroke-dasharray="4 4"/>

  <text x="28" y="270" class="b">两个工具独立</text>
  <text x="772" y="270" text-anchor="end" class="b">总计 15 s</text>

  <text x="28" y="301" class="tiny">模型</text>
  <text x="28" y="337" class="tiny">工具 A</text>
  <text x="28" y="373" class="tiny">工具 B</text>

  <rect x="120" y="282" width="56" height="26" rx="4" fill="var(--blue,#466b3f)"/>
  <text x="148" y="300" text-anchor="middle" class="tiny" fill="var(--on-blue,#fffcf5)">2 s</text>
  <rect x="176" y="318" width="169" height="26" rx="4" fill="var(--yellow,#f5d75f)"/>
  <text x="260" y="336" text-anchor="middle" class="tiny" fill="var(--on-yellow,#3b3024)">工具 A · 6 s</text>
  <rect x="176" y="354" width="282" height="26" rx="4" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.2"/>
  <text x="317" y="372" text-anchor="middle" class="tiny">工具 B · 10 s</text>
  <rect x="458" y="282" width="85" height="26" rx="4" fill="var(--blue,#466b3f)"/>
  <text x="500" y="300" text-anchor="middle" class="tiny" fill="var(--on-blue,#fffcf5)">3 s</text>

  <line x1="176" y1="270" x2="176" y2="388" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="458" y1="270" x2="458" y2="388" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.2" stroke-dasharray="4 4"/>

  <line x1="120" y1="400" x2="740" y2="400" stroke="var(--line,#c9b49c)" stroke-width="1.5"/>
  <line x1="120" y1="400" x2="120" y2="408" stroke="var(--line,#c9b49c)" stroke-width="1.2"/>
  <line x1="261" y1="400" x2="261" y2="408" stroke="var(--line,#c9b49c)" stroke-width="1.2"/>
  <line x1="402" y1="400" x2="402" y2="408" stroke="var(--line,#c9b49c)" stroke-width="1.2"/>
  <line x1="543" y1="400" x2="543" y2="408" stroke="var(--line,#c9b49c)" stroke-width="1.2"/>
  <line x1="684" y1="400" x2="684" y2="408" stroke="var(--line,#c9b49c)" stroke-width="1.2"/>
  <text x="120" y="422" text-anchor="middle" class="tiny">0</text>
  <text x="261" y="422" text-anchor="middle" class="tiny">5</text>
  <text x="402" y="422" text-anchor="middle" class="tiny">10</text>
  <text x="543" y="422" text-anchor="middle" class="tiny">15</text>
  <text x="684" y="422" text-anchor="middle" class="tiny">20 s</text>

  <text x="400" y="442" text-anchor="middle" class="tiny">并行减少 6 秒，但工具总工作量仍是 16 秒；等待期间，任务所需的 KV 状态仍按任务继续占用容量。</text>
</svg>
