<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 64 800 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">每字节能耗与一步 decode 的能量</title>
  <desc id="fig-desc">表格列出五级存储的每字节能耗：KB 级 SRAM 1.25 pJ、NVLink-C2C 10.4 pJ、MB 级 SRAM 12.5 pJ、HBM2 31.76 pJ、LPDDR 160 pJ；一步 8K decode 若全部取自对应层次，能量从 0.020 J 升到 0.519 J，实际分账为 0.534 J</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="38" y="92" width="266.7368421052631" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.2"/><text x="171.36842105263156" y="112" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">存储层次</text><rect x="304.7368421052631" y="92" width="228.6315789473684" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.2"/><text x="419.05263157894734" y="112" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">每 byte 能耗（pJ）</text><rect x="533.3684210526316" y="92" width="228.6315789473684" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.2"/><text x="647.6842105263157" y="112" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">一步 decode 能量（J）</text><rect x="38" y="126" width="266.7368421052631" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="171.36842105263156" y="150" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">KB 级局部 SRAM</text><rect x="304.7368421052631" y="126" width="228.6315789473684" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="419.05263157894734" y="150" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">1.25</text><rect x="533.3684210526316" y="126" width="228.6315789473684" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="647.6842105263157" y="150" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">0.020</text><rect x="38" y="168" width="266.7368421052631" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="171.36842105263156" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">NVLink-C2C 链路</text><rect x="304.7368421052631" y="168" width="228.6315789473684" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="419.05263157894734" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">10.4</text><rect x="533.3684210526316" y="168" width="228.6315789473684" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="647.6842105263157" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">0.170</text><rect x="38" y="210" width="266.7368421052631" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="171.36842105263156" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">MB 级片上 SRAM</text><rect x="304.7368421052631" y="210" width="228.6315789473684" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="419.05263157894734" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">12.5</text><rect x="533.3684210526316" y="210" width="228.6315789473684" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="647.6842105263157" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">0.204</text><rect x="38" y="252" width="266.7368421052631" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="171.36842105263156" y="276" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">HBM2</text><rect x="304.7368421052631" y="252" width="228.6315789473684" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="419.05263157894734" y="276" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">31.76</text><rect x="533.3684210526316" y="252" width="228.6315789473684" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="647.6842105263157" y="276" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">0.519</text><rect x="38" y="294" width="266.7368421052631" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="171.36842105263156" y="318" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">LPDDR DRAM</text><rect x="304.7368421052631" y="294" width="228.6315789473684" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="419.05263157894734" y="318" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">160</text><rect x="533.3684210526316" y="294" width="228.6315789473684" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="647.6842105263157" y="318" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">—</text><rect x="38" y="336" width="266.7368421052631" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="171.36842105263156" y="360" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">实际分账（HBM）</text><rect x="304.7368421052631" y="336" width="228.6315789473684" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="419.05263157894734" y="360" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">—</text><rect x="533.3684210526316" y="336" width="228.6315789473684" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="647.6842105263157" y="360" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">0.534</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">实际分账另含 KV 读取 0.038 J 与矩阵计算 0.015 J；HBM 行取 28 nm 的 HBM2 模型，计算行取 45 nm 的乘加能耗。</text>
</svg>