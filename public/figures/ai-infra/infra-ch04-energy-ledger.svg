rect x="38" y="294" width="266.7368421052631" height="42" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="171.36842105263156" y="318" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">LPDDR DRAM</text><rect x="304.7368421052631" y="294" width="228.6315789473684" height="42" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="419.05263157894734" y="318" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">160</text><rect x="533.3684210526316" y="294" width="228.6315789473684" height="42" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="647.6842105263157" y="318" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">—</text><rect x="38" y="336" width="266.7368421052631" height="42" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="171.36842105263156" y="360" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">实际分账（HBM）</text><rect x="304.7368421052631" y="336" width="228.6315789473684" height="42" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="419.05263157894734" y="360" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">—</text><rect x="533.3684210526316" y="336" width="228.6315789473684" height="42" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="647.6842105263157" y="360" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">0.534</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">实际分账另含 KV 读取 0.038 J 与矩阵计算 0.015 J；HBM 行取 28 nm 的 HBM2 模型，计算行取 45 nm 的乘加能耗。</text>
</svg>