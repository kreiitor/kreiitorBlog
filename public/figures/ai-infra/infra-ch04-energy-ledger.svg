<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">每字节能耗与一步 decode 的能量</title>
  <desc id="fig-desc">表格列出五级存储的每字节能耗：KB 级 SRAM 1.25 pJ、NVLink-C2C 10.4 pJ、MB 级 SRAM 12.5 pJ、HBM2 31.76 pJ、LPDDR 160 pJ；一步 8K decode 若全部取自对应层次，能量从 0.020 J 升到 0.519 J，实际分账为 0.534 J</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">每字节能耗与一步 decode 的能量</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">存储层次决定搬移代价，权重读取占九成</text><rect x="38" y="92" width="266.7368421052631" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.2"/><text x="171.36842105263156" y="112" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">存储层次</text><rect x="304.7368421052631" y="92" width="228.6315789473684" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.2"/><text x="419.05263157894734" y="112" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">每 byte 能耗（pJ）</text><rect x="533.3684210526316" y="92" width="228.6315789473684" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.2"/><text x="647.6842105263157" y="112" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">一步 decode 能量（J）</text><rect x="38" y="126" width="266.7368421052631" height="42" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="171.36842105263156" y="150" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">KB 级局部 SRAM</text><rect x="304.7368421052631" y="126" width="228.6315789473684" height="42" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="419.05263157894734" y="150" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">1.25</text><rect x="533.3684210526316" y="126" width="228.6315789473684" height="42" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="647.6842105263157" y="150" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">0.020</text><rect x="38" y="168" width="266.7368421052631" height="42" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="171.36842105263156" y="192" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">NVLink-C2C 链路</text><rect x="304.7368421052631" y="168" width="228.6315789473684" height=