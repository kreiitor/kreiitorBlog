<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">同一个 token 等最慢的分支</title>
  <desc id="fig-desc">两条专家轨道：快专家在 0.5 ms 完成分派、计算与返回；慢专家在 1.4 ms 完成；0.5 到 1.4 ms 之间是同一个 token 等待慢分支的时间</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="126" y1="96" x2="126" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="349.57142857142856" y1="96" x2="349.57142857142856" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="349.57142857142856" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0.5</text><line x1="573.1428571428571" y1="96" x2="573.1428571428571" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="573.1428571428571" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">1</text><line x1="752" y1="96" x2="752" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">1.4</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">快专家</text><rect x="126" y="115" width="44.71428571428572" height="32" rx="3" fill="var(--surface)" stroke="var(--line)"/><text x="148.35714285714286" y="134" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">分派</text><rect x="170.71428571428572" y="115" width="134.14285714285717" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="237.7857142857143" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">计算</text><rect x="304.8571428571429" y="115" width="44.7142857142857" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="327.2142857142857" y="134" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">返回</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">慢专家</text><rect x="126" y="157" width="44.71428571428572" height="32" rx="3" fill="var(--surface)" stroke="var(--line)"/><text x="148.35714285714286" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">分派</text><rect x="170.71428571428572" y="157" width="491.85714285714283" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="416.6428571428571" y="176" font-size="9.5" fill="var(--on-yellow)" font-weight="600" text-anchor="middle">计算</text><rect x="662.5714285714286" y="157" width="89.4285714285714" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="707.2857142857142" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">返回</text><text x="116" y="219" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">等待</text><rect x="349.57142857142856" y="199" width="402.4285714285714" height="32" rx="3" fill="var(--line-soft)" stroke="var(--line)"/><text x="550.7857142857142" y="218" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">等待慢分支</text><line x1="126" y1="242" x2="752" y2="242" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="278" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">从该层分派开始计时 / ms</text></svg>