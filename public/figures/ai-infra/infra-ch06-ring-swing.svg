<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 158 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Swing 第三轮的三跳</title>
  <desc id="fig-desc">同一张 16 卡物理环上，Swing 算法第三轮让卡 0 发往卡 3，路径为 0→1→2→3，共三条链路；每张卡这一轮仍发送 1 MiB</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="45" y="186" width="153.5" height="112" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="121.75" y="246.875" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">卡 0</text>
  <rect x="230.5" y="186" width="153.5" height="112" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="307.25" y="246.875" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">卡 1</text>
  <rect x="416" y="186" width="153.5" height="112" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="492.75" y="246.875" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">卡 2</text>
  <rect x="601.5" y="186" width="153.5" height="112" rx="8" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="678.25" y="246.875" font-size="13" fill="var(--on-yellow,#202735)" font-weight="700" text-anchor="middle">卡 3</text>
  <path d="M198.5 242 L230.5 242" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 242 L416 242" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M569.5 242 L601.5 242" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/></svg>