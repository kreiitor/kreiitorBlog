<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">六种安排的完成时间</title>
  <desc id="fig-desc">六根柱表示六种安排的完成时间：连续环串行 29.6 ms，分层归约串行 23.3 ms，分层并发不足 24.3 ms，连续环提前通信 26.6 ms，分层提前通信 22.0 ms，分层提前通信但只剩一张网卡 23.8 ms</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">六种安排的完成时间</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">提前通信把分层归约压到 22.0 ms，单网卡配置回到 23.8 ms</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="279.875" x2="750" y2="279.875" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="283.875" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="201.75" x2="750" y2="201.75" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="205.75" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="123.625" x2="750" y2="123.625" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="127.625" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">30</text><rect x="99.35000000000001" y="126.75" width="59.966666666666676" height="231.25" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="130.33333333333334" y="120.75" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">29.6</text><text x="130.33333333333334" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">连续环串行</text><rect x="212.01666666666668" y="175.96875" width="59.966666666666676" height="182.03125" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="243.00000000000003" y="169.96875" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">23.3</text><text x="243.00000000000003" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">分层归约串行</text><rect x="324.68333333333334" y="168.15625" width="59.966666666666676" height="189.84375" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="355.6666666666667" y="162.15625" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">24.3</text><text x="355.6666666666667" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">分层并发不足</text><rect x="437.34999999999997" y="150.1875" width="59.966666666666676" height="207.8125" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="468.3333333333333" y="144.1875" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">26.6</text><text x="468.3333333333333" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">连续环提前通信</text><rect x="550.0166666666668" y="186.125" width="59.966666666666676" height="171.875" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="581.0000000000001" y="180.125" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">22</text><text x="581.0000000000001" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">分层提前通信</text><rect x="662.6833333333334" y="172.0625" width="59.966666666666676" height="185.9375" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="693.6666666666667" y="166.0625" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">23.8</text><text x="693.6666666666667" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">单网卡提前通信</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">第 1–6 种安排</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">完成时间 / ms</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">完成时间</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">六图使用同一横轴范围；色带分别为计算、通信、更新，圆点表示通信数据就绪。</text>
</svg>