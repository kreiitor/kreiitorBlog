<svg xmlns="http://www.w3.org/2000/svg" width="800" height="315" viewBox="0 68 800 315" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">首块音频的四个时刻</title>
  <desc id="fig-desc">四行时间轴：采集在 20 ms 完成；模型处理 12 ms，到 32 ms 完成；发送 1 ms、传播 5 ms，38 ms 到达；初始缓冲 40 ms 后，78 ms 开始播放</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="126" y1="96" x2="126" y2="284" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="126" y="300" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">0</text><line x1="251.2" y1="96" x2="251.2" y2="284" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="251.2" y="300" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">20</text><line x1="376.4" y1="96" x2="376.4" y2="284" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="376.4" y="300" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">40</text><line x1="501.59999999999997" y1="96" x2="501.59999999999997" y2="284" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="501.59999999999997" y="300" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">60</text><line x1="626.8" y1="96" x2="626.8" y2="284" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="626.8" y="300" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">80</text><line x1="752" y1="96" x2="752" y2="284" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="752" y="300" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">100</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">采集</text><rect x="126" y="115" width="125.2" height="32" rx="3" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)"/><text x="188.6" y="134" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">块 1 就绪</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">模型处理</text><rect x="251.2" y="157" width="75.11999999999999" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="288.76" y="176" font-size="9.5" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">12 ms</text><text x="116" y="219" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">发送与传播</text><rect x="326.32" y="199" width="6.26" height="32" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><rect x="332.58000000000004" y="199" width="31.3" height="32" rx="3" fill="var(--line-soft,#dce1e8)" stroke="var(--line,#a2aec1)"/><text x="348.23" y="218" font-size="8" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">传播 …</text><text x="116" y="261" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">播放</text><rect x="614.28" y="241" width="125.2" height="32" rx="3" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)"/><text x="676.88" y="260" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">20 ms</text><line x1="126" y1="284" x2="752" y2="284" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="320" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">时间 / ms</text><text x="400" y="357" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">每块 20 ms，模型处理 12 ms、发送 1 ms、传播 5 ms；初始缓冲 40 ms。</text>
</svg>