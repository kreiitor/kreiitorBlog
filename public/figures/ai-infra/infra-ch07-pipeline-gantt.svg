<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">四阶段流水线甘特图</title>
  <desc id="fig-desc">四个阶段各占一行，横轴 0 到 11 ms；阶段 0 在 0–8 ms 处理 mb0–7，阶段 1 在 1–9 ms，阶段 2 在 2–10 ms，阶段 3 在 3–11 ms；左下和右上各留出 3 ms 空白</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="126" y1="96" x2="126" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="268.27272727272725" y1="96" x2="268.27272727272725" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="268.27272727272725" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">2.5</text><line x1="410.54545454545456" y1="96" x2="410.54545454545456" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="410.54545454545456" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">5</text><line x1="552.8181818181818" y1="96" x2="552.8181818181818" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="552.8181818181818" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">7.5</text><line x1="695.0909090909091" y1="96" x2="695.0909090909091" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="695.0909090909091" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">10</text><line x1="752" y1="96" x2="752" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">11</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">阶段 0</text><rect x="126" y="115" width="455.2727272727273" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="353.6363636363636" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">mb0–7</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">阶段 1</text><rect x="182.9090909090909" y="157" width="455.2727272727273" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="410.54545454545456" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">mb0–7</text><text x="116" y="219" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">阶段 2</text><rect x="239.8181818181818" y="199" width="455.2727272727273" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="467.4545454545455" y="218" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">mb0–7</text><text x="116" y="261" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">阶段 3</text><rect x="296.72727272727275" y="241" width="455.2727272727273" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="524.3636363636364" y="260" font-size="9.5" fill="var(--on-yellow)" font-weight="600" text-anchor="middle">mb0–7</text><line x1="126" y1="284" x2="752" y2="284" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="320" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">时间 / ms</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">每阶段计算 8 ms，总时间 11 ms，各空闲 3 ms；阶段耗时相同，图中忽略交接开销。</text>
</svg>