<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">四种加载方式的每环境内存</title>
  <desc id="fig-desc">四根柱：完整复制 2052 MiB、按需加载 516 MiB、仅私有页 132 MiB、保留热点页 388 MiB；横轴 0–2500 MiB</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">四种加载方式的每环境内存</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">完整复制 2052 MiB，只读共享 132 MiB</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="258" x2="750" y2="258" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="262" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">1000</text><line x1="74" y1="158" x2="750" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="162" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">2000</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">2500</text><rect x="123.5" y="152.8" width="68" height="205.2" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="158.5" y="146.8" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">2052</text><text x="158.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">完整复制</text><rect x="292.5" y="306.4" width="68" height="51.6" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="327.5" y="300.4" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">516</text><text x="327.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">按需加载</text><rect x="461.5" y="344.8" width="68" height="13.2" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="496.5" y="338.8" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">132</text><text x="496.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">仅私有页</text><rect x="630.5" y="319.2" width="68" height="38.800000000000004" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="665.5" y="313.2" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">388</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">保留热点页</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">加载方式</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">每环境本地内容（MiB）</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">本地内容</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">每个环境另有 4 MiB 管理开销；另有一份共享的 2 GiB 模板，不计入柱长。</text>
</svg>