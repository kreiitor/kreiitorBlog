" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="665.5" y="313.2" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">388</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">保留热点页</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">加载方式</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">每环境本地内容（MiB）</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">本地内容</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">每个环境另有 4 MiB 管理开销；另有一份共享的 2 GiB 模板，不计入柱长。</text>
</svg>