<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">权重读取的带宽下界</title>
  <desc id="fig-desc">显存中保存 70 GB 权重，计算单元完成乘加；两者之间只有一条读取路径，带宽 3350 GB/s，代入 70 GB 得到约 20.90 ms 的单步读取下界</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">权重读取的带宽下界</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">70 GB ÷ 3350 GB/s ≈ 20.90 ms</text><rect x="47.66666666666667" y="186" width="210" height="112" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="238.75" font-size="13" fill="var(--on-blue)" font-weight="700" text-anchor="middle">显存</text>
  <text x="152.66666666666669" y="255" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">70 GB 权重</text><rect x="295.00000000000006" y="186" width="210" height="112" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="238.75" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">读取路径</text>
  <text x="400.00000000000006" y="255" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">3350 GB/s</text><rect x="542.3333333333334" y="186" width="210" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="238.75" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">计算单元</text>
  <text x="647.3333333333334" y="255" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">每步读取一遍</text><path d="M257.6666666666667 242 L295.00000000000006 242" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 242 L542.3333333333334 242" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">按每参数一字节估算，完整执行仍须满足计算与依赖关系。</text>
</svg>