<svg xmlns="http://www.w3.org/2000/svg" width="800" height="273" viewBox="0 68 800 273" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">20 GB/s 下的快照提交</title>
  <desc id="fig-desc">两条泳道：快照 1 在 20 s 捕获、26.1 s 提交；快照 2 在 40 s 捕获、46.1 s 提交；50 s 故障时可以恢复到 40 s，只需重做 10 s</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="126" y1="96" x2="126" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="126" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0</text><line x1="334.66666666666663" y1="96" x2="334.66666666666663" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="334.66666666666663" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">20</text><line x1="543.3333333333333" y1="96" x2="543.3333333333333" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="543.3333333333333" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">40</text><line x1="752" y1="96" x2="752" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="752" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">60</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">快照 1</text><rect x="334.66666666666663" y="115" width="5.216666666666667" height="32" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)"/><rect x="339.8833333333333" y="115" width="58.42666666666668" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="369.0966666666667" y="134" font-size="8" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">上传 5.…</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">快照 2</text><rect x="543.3333333333333" y="157" width="5.216666666666667" height="32" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)"/><rect x="548.55" y="157" width="58.42666666666668" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="577.7633333333333" y="176" font-size="8" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">上传 5.…</text><text x="116" y="219" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">故障</text><rect x="647.6666666666667" y="199" width="2.086666666666696" height="32" rx="3" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)"/><line x1="126" y1="242" x2="752" y2="242" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="278" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">时间 / s</text><text x="400" y="315" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">每份快照上传 5.6 s；提交时刻为 26.1 s 与 46.1 s。</text>
</svg>