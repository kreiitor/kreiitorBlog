<svg xmlns="http://www.w3.org/2000/svg" width="800" height="368" viewBox="0 76 800 368" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">查询、键、值的投影</title>
  <desc id="fig-desc">当前 token 的隐藏向量分出三条投影，分别得到查询 Q、键 K、值 V；Q 与各位置的 K 匹配得到系数，再按系数汇总各位置的 V 形成输出</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="47.66666666666667" y="104.5" width="210" height="112" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="157.25" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">隐藏向量</text>
  <text x="152.66666666666669" y="173.5" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">当前 token</text><rect x="295.00000000000006" y="104.5" width="210" height="112" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="157.25" font-size="13" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">查询 Q</text>
  <text x="400.00000000000006" y="173.5" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">投影权重</text><rect x="542.3333333333334" y="104.5" width="210" height="112" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="157.25" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">键 K</text>
  <text x="647.3333333333334" y="173.5" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">投影权重</text><rect x="47.66666666666667" y="267.5" width="210" height="112" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="320.25" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">值 V</text>
  <text x="152.66666666666669" y="336.5" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">投影权重</text><rect x="295.00000000000006" y="267.5" width="210" height="112" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="320.25" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">匹配系数</text>
  <text x="400.00000000000006" y="336.5" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">Q 与各位置 K</text><rect x="542.3333333333334" y="267.5" width="210" height="112" rx="8" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="320.25" font-size="13" fill="var(--on-yellow,#3b3024)" font-weight="700" text-anchor="middle">输出</text>
  <text x="647.3333333333334" y="336.5" font-size="12" fill="var(--on-yellow,#3b3024)" font-weight="400" text-anchor="middle">按系数汇总 V</text><path d="M257.6666666666667 160.5 L295.00000000000006 160.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 160.5 L542.3333333333334 160.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M152.66666666666669 216.5 L152.66666666666669 242 L152.66666666666669 242 L152.66666666666669 267.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M400.00000000000006 216.5 L400.00000000000006 242 L400.00000000000006 242 L400.00000000000006 267.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 216.5 L647.3333333333334 242 L400.00000000000006 242 L400.00000000000006 267.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 323.5 L542.3333333333334 323.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 323.5 L542.3333333333334 323.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">三条投影使用三组不同的权重矩阵。</text>
</svg>