<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">剩余缓冲被填满的时刻</title>
  <desc id="fig-desc">三根柱表示 1 MiB 剩余缓冲被填满的时刻：N=8 为 3.50 μs，N=16 为 1.50 μs，N=64 为 0.34 μs；PFC 一跳反馈为 0.33 μs，端到端反馈 20 μs 在横轴之外</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">1</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">2</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">3</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">4</text><rect x="151.66666666666669" y="139.25" width="68" height="218.75" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="186.66666666666669" y="133.25" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">3.5</text><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">N=8</text><rect x="377.00000000000006" y="264.25" width="68" height="93.75" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="412.00000000000006" y="258.25" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">1.5</text><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">N=16</text><rect x="602.3333333333334" y="336.75" width="68" height="21.25" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="637.3333333333334" y="330.75" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">0.34</text><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">N=64</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">超额速率 300 / 700 / 3100 GB/s</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">填满 1 MiB 的时刻 / μs</text></g><rect x="82" y="86" width="10" height="10" fill="var(--yellow,#ffe04b)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">填满时刻</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">超额速率分别为 300、700、3100 GB/s；水平参考线为 1 MiB 剩余缓冲。</text>
</svg>