<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 68 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">环境内存贯穿整个任务</title>
  <desc id="fig-desc">横轴 0–30 秒，一条 2 GiB 的内存占用条从 0 延续到 30 秒；整条面积为 2 乘 30 等于 60 GiB·秒</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="126" y1="96" x2="126" y2="158" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="126" y="174" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">0</text><line x1="334.66666666666663" y1="96" x2="334.66666666666663" y2="158" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="334.66666666666663" y="174" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">10</text><line x1="543.3333333333333" y1="96" x2="543.3333333333333" y2="158" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="543.3333333333333" y="174" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">20</text><line x1="752" y1="96" x2="752" y2="158" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="752" y="174" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">30</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">环境内存 2 GiB</text><rect x="126" y="115" width="626" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="439" y="134" font-size="9.5" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">2 GiB · 60 GiB·秒</text><line x1="126" y1="158" x2="752" y2="158" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="194" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">任务时间 / s</text></svg>