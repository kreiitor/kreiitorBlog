<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">两种实现的分段性能</title>
  <desc id="fig-desc">折线图：原实现的平均执行时间恒为 10 μs；新实现从 A 占比 0 时的 20 μs 降到 1 时的 5 μs，两线在 p=2/3 处相交，交点执行时间为 10 μs</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">5</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">15</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">20</text><polyline points="74,233 412,233 750,233" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.4"/><circle cx="74" cy="233" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="412" cy="233" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="750" cy="233" r="3.2" fill="var(--blue,#2647d7)"/><polyline points="74,108 412,233 750,295.5" fill="none" stroke="var(--yellow,#ffe04b)" stroke-width="2.4"/><circle cx="74" cy="108" r="3.2" fill="var(--yellow,#ffe04b)"/><circle cx="412" cy="233" r="3.2" fill="var(--yellow,#ffe04b)"/><circle cx="750" cy="295.5" r="3.2" fill="var(--yellow,#ffe04b)"/><text x="74" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">0</text><text x="412" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">2/3</text><text x="750" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">1</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">形状 A 的调用比例</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">平均执行时间 / μs</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#2647d7)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">原实现</text><rect x="137" y="86" width="10" height="10" fill="var(--yellow,#ffe04b)"/><text x="152" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">新实现</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">调用串行，图中比较稳态执行；横轴 p 为形状 A 的调用比例。</text>
</svg>