<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">算子融合减少中间张量的读写</title>
  <desc id="fig-desc">分开执行时 SiLU 的完整结果 T 写回再读回，多出 48 MiB；融合后局部结果直接进入乘法，读写量从 120 MiB 降到 72 MiB。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink)}
    .sub{font-size:14px;fill:var(--muted)}
    .h{font-size:16px;font-weight:700;fill:var(--ink)}
    .b{font-size:13px;font-weight:600;fill:var(--ink)}
    .s{font-size:12px;fill:var(--muted)}
    .tiny{font-size:11px;fill:var(--muted)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>

  <text x="44" y="106" class="b">分开执行</text>
  <text x="756" y="106" text-anchor="end" class="h">读写 120 MiB</text>

  <rect x="44" y="132" width="90" height="52" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.5"/>
  <text x="89" y="154" text-anchor="middle" class="b">G</text>
  <text x="89" y="173" text-anchor="middle" class="tiny">24 MiB</text>

  <rect x="168" y="132" width="100" height="52" rx="7" fill="var(--surface)" stroke="var(--blue)" stroke-width="1.5"/>
  <text x="218" y="154" text-anchor="middle" class="b">SiLU</text>
  <text x="218" y="173" text-anchor="middle" class="tiny">逐元素</text>

  <rect x="302" y="132" width="90" height="52" rx="7" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="2"/>
  <text x="347" y="154" text-anchor="middle" class="b">T</text>
  <text x="347" y="173" text-anchor="middle" class="tiny">24 MiB · 落地</text>

  <circle cx="436" cy="158" r="18" fill="var(--surface)" stroke="var(--blue)" stroke-width="1.5"/>
  <text x="436" y="163" text-anchor="middle" class="b">⊙</text>

  <rect x="490" y="132" width="90" height="52" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.5"/>
  <text x="535" y="154" text-anchor="middle" class="b">Z</text>
  <text x="535" y="173" text-anchor="middle" class="tiny">24 MiB</text>

  <rect x="350" y="200" width="90" height="40" rx="7" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="395" y="225" text-anchor="middle" class="tiny">U · 24 MiB</text>

  <path d="M134 158 L168 158" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M268 158 L302 158" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M392 158 L418 158" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M454 158 L490 158" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M395 200 L424 174" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>

  <text x="347" y="122" text-anchor="middle" class="s">写回 24 + 读回 24 = 48 MiB</text>

  <text x="44" y="266" class="b">融合执行</text>
  <text x="756" y="266" text-anchor="end" class="h">读写 72 MiB</text>

  <rect x="44" y="292" width="90" height="48" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.5"/>
  <text x="89" y="313" text-anchor="middle" class="b">G</text>
  <text x="89" y="331" text-anchor="middle" class="tiny">24 MiB</text>

  <rect x="44" y="350" width="90" height="42" rx="7" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="89" y="376" text-anchor="middle" class="tiny">U · 24 MiB</text>

  <rect x="190" y="296" width="190" height="80" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="2"/>
  <text x="285" y="324" text-anchor="middle" class="b">SiLU + 逐元素乘</text>
  <text x="285" y="346" text-anchor="middle" class="tiny">局部 t 直接传给乘法</text>
  <text x="285" y="364" text-anchor="middle" class="tiny">中间结果不写回显存</text>

  <rect x="460" y="308" width="90" height="52" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.5"/>
  <text x="505" y="330" text-anchor="middle" class="b">Z</text>
  <text x="505" y="349" text-anchor="middle" class="tiny">24 MiB</text>

  <path d="M134 316 L190 320" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M134 371 L190 352" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M380 336 L460 336" stroke="var(--blue)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>

  <rect x="30" y="408" width="740" height="30" rx="6" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1.2"/>
  <text x="400" y="428" text-anchor="middle" class="tiny">融合不减少计算，只减少访存；例中 120 → 72 MiB，时间约为原来的 60%，峰值显存只从 72 降到 60 MiB。</text>
</svg>
