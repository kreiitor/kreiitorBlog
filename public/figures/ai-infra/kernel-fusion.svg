<svg xmlns="http://www.w3.org/2000/svg" width="800" height="388" viewBox="0 62 800 388" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">算子融合减少中间张量的读写</title>
  <desc id="fig-desc">分开执行时 SiLU 的完整结果 T 写回再读回，多出 48 MiB；融合后局部结果直接进入乘法，读写量从 120 MiB 降到 72 MiB。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:12px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:11px;fill:var(--muted,#5f4f3c)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <text x="44" y="106" class="b">分开执行</text>
  <text x="756" y="106" text-anchor="end" class="h">读写 120 MiB</text>

  <rect x="44" y="132" width="90" height="52" rx="7" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="89" y="154" text-anchor="middle" class="b">G</text>
  <text x="89" y="173" text-anchor="middle" class="tiny">24 MiB</text>

  <rect x="168" y="132" width="100" height="52" rx="7" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="218" y="154" text-anchor="middle" class="b">SiLU</text>
  <text x="218" y="173" text-anchor="middle" class="tiny">逐元素</text>

  <rect x="302" y="132" width="90" height="52" rx="7" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="2"/>
  <text x="347" y="154" text-anchor="middle" class="b">T</text>
  <text x="347" y="173" text-anchor="middle" class="tiny">24 MiB · 落地</text>

  <circle cx="436" cy="158" r="18" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="436" y="163" text-anchor="middle" class="b">⊙</text>

  <rect x="490" y="132" width="90" height="52" rx="7" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="535" y="154" text-anchor="middle" class="b">Z</text>
  <text x="535" y="173" text-anchor="middle" class="tiny">24 MiB</text>

  <rect x="350" y="200" width="90" height="40" rx="7" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.5"/>
  <text x="395" y="225" text-anchor="middle" class="tiny">U · 24 MiB</text>

  <path d="M134 158 L168 158" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M268 158 L302 158" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M392 158 L418 158" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M454 158 L490 158" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M395 200 L424 174" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>

  <text x="347" y="122" text-anchor="middle" class="s">写回 24 + 读回 24 = 48 MiB</text>

  <text x="44" y="266" class="b">融合执行</text>
  <text x="756" y="266" text-anchor="end" class="h">读写 72 MiB</text>

  <rect x="44" y="292" width="90" height="48" rx="7" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="89" y="313" text-anchor="middle" class="b">G</text>
  <text x="89" y="331" text-anchor="middle" class="tiny">24 MiB</text>

  <rect x="44" y="350" width="90" height="42" rx="7" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.5"/>
  <text x="89" y="376" text-anchor="middle" class="tiny">U · 24 MiB</text>

  <rect x="190" y="296" width="190" height="80" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="2"/>
  <text x="285" y="324" text-anchor="middle" class="b">SiLU + 逐元素乘</text>
  <text x="285" y="346" text-anchor="middle" class="tiny">局部 t 直接传给乘法</text>
  <text x="285" y="364" text-anchor="middle" class="tiny">中间结果不写回显存</text>

  <rect x="460" y="308" width="90" height="52" rx="7" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="505" y="330" text-anchor="middle" class="b">Z</text>
  <text x="505" y="349" text-anchor="middle" class="tiny">24 MiB</text>

  <path d="M134 316 L190 320" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M134 371 L190 352" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M380 336 L460 336" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>

  <rect x="30" y="408" width="740" height="30" rx="6" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.2"/>
  <text x="400" y="428" text-anchor="middle" class="tiny">融合不减少计算，只减少访存；例中 120 → 72 MiB，时间约为原来的 60%，峰值显存只从 72 降到 60 MiB。</text>
</svg>
