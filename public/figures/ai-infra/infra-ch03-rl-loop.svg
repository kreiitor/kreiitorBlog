<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 74 800 370" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">强化学习的闭环</title>
  <desc id="fig-desc">生成端产生回答，反馈环节用规则、模型或环境评价结果，筛选后组织训练输入，学习器计算梯度并更新策略，新权重回到生成端</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><path d="M400 130 Q525 190 650 250" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><path d="M650 250 Q525 310 400 370" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 370 Q275 310 150 250.00000000000003" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><path d="M150 250.00000000000003 Q275 190 400 130" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="102" width="132" height="56" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="400" y="127.25" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">生成</text>
  <text x="400" y="141" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">策略产生回答</text><rect x="584" y="222" width="132" height="56" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="650" y="247.25" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">反馈</text>
  <text x="650" y="261" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">规则、模型或环境</text><rect x="334" y="342" width="132" height="56" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="400" y="367.25" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">筛选</text>
  <text x="400" y="381" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">组织训练输入</text><rect x="84" y="222.00000000000003" width="132" height="56" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="150" y="247.25000000000003" font-size="11" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">学习</text>
  <text x="150" y="261" font-size="10" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">计算梯度并更新</text><text x="400" y="250" font-size="12" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">新权重交给下一批生成</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">生成、反馈和学习使用同一批轨迹；新权重通过同步回到生成副本。</text>
</svg>