<svg xmlns="http://www.w3.org/2000/svg" width="800" height="290" viewBox="0 64 800 290" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">四个条件的 DRAM 读取量</title>
  <desc id="fig-desc">表格列出四个条件的 DRAM 读取：1 行复用 32.0 MiB、1 行轮换 32.0 MiB、256 行复用 256 bytes、256 行轮换约 32.1 MiB</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="38" y="92" width="334.1538461538462" height="34" rx="4" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.2"/><text x="205.0769230769231" y="112" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">条件</text><rect x="372.1538461538462" y="92" width="389.8461538461539" height="34" rx="4" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.2"/><text x="567.0769230769231" y="112" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">DRAM 读取</text><rect x="38" y="126" width="334.1538461538462" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="205.0769230769231" y="150" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">1 行 复用</text><rect x="372.1538461538462" y="126" width="389.8461538461539" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="567.0769230769231" y="150" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">32.0 MiB</text><rect x="38" y="168" width="334.1538461538462" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="205.0769230769231" y="192" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">1 行 轮换</text><rect x="372.1538461538462" y="168" width="389.8461538461539" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="567.0769230769231" y="192" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">32.0 MiB</text><rect x="38" y="210" width="334.1538461538462" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="205.0769230769231" y="234" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">256 行 复用</text><rect x="372.1538461538462" y="210" width="389.8461538461539" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="567.0769230769231" y="234" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">256 bytes</text><rect x="38" y="252" width="334.1538461538462" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="205.0769230769231" y="276" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">256 行 轮换</text><rect x="372.1538461538462" y="252" width="389.8461538461539" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="567.0769230769231" y="276" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">约 32.1 MiB</text><text x="400" y="328" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">访问计数与常规计时分别测量；256 行两种方式的 L2 请求都约 147 MiB。</text>
</svg>