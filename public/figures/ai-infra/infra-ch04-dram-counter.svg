<svg xmlns="http://www.w3.org/2000/svg" width="800" height="290" viewBox="0 64 800 290" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">四个条件的 DRAM 读取量</title>
  <desc id="fig-desc">表格列出四个条件的 DRAM 读取：1 行复用 32.0 MiB、1 行轮换 32.0 MiB、256 行复用 256 bytes、256 行轮换约 32.1 MiB</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="38" y="92" width="334.1538461538462" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.2"/><text x="205.0769230769231" y="112" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">条件</text><rect x="372.1538461538462" y="92" width="389.8461538461539" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.2"/><text x="567.0769230769231" y="112" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">DRAM 读取</text><rect x="38" y="126" width="334.1538461538462" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="205.0769230769231" y="150" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">1 行 复用</text><rect x="372.1538461538462" y="126" width="389.8461538461539" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="567.0769230769231" y="150" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">32.0 MiB</text><rect x="38" y="168" width="334.1538461538462" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="205.0769230769231" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">1 行 轮换</text><rect x="372.1538461538462" y="168" width="389.8461538461539" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="567.0769230769231" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">32.0 MiB</text><rect x="38" y="210" width="334.1538461538462" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="205.0769230769231" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">256 行 复用</text><rect x="372.1538461538462" y="210" width="389.8461538461539" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="567.0769230769231" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">256 bytes</text><rect x="38" y="252" width="334.1538461538462" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="205.0769230769231" y="276" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">256 行 轮换</text><rect x="372.1538461538462" y="252" width="389.8461538461539" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="567.0769230769231" y="276" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">约 32.1 MiB</text><text x="400" y="328" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">访问计数与常规计时分别测量；256 行两种方式的 L2 请求都约 147 MiB。</text>
</svg>