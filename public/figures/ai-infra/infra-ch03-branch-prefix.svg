<svg xmlns="http://www.w3.org/2000/svg" width="800" height="201" viewBox="0 158 800 201" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">共享前缀与两个分支</title>
  <desc id="fig-desc">公共前缀分别被分支 A 尾部和分支 B 尾部引用，两个分支各自保存新增 token，共享前缀在容量中只计一份</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="47.66666666666667" y="186" width="210" height="112" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="238.75" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">公共前缀</text>
  <text x="152.66666666666669" y="255" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">只计一份容量</text><rect x="295.00000000000006" y="186" width="210" height="112" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="238.75" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">分支 A 尾部</text>
  <text x="400.00000000000006" y="255" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">新增 h_A 个 token</text><rect x="542.3333333333334" y="186" width="210" height="112" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="238.75" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">分支 B 尾部</text>
  <text x="647.3333333333334" y="255" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">新增 h_B 个 token</text><path d="M257.6666666666667 242 L295.00000000000006 242" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 242 L542.3333333333334 242" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="332" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">总状态为 c_KV × (H₀ + Σhᵢ)，H₀ 为共享前缀长度，hᵢ 为各分支新增长度。</text>
</svg>