<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 58 800 300" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">每台 microVM 各存一份镜像页</title>
  <desc id="fig-desc">三台 microVM 并排在上方，各自持有一份镜像页副本；下方的宿主机 page cache 保存镜像页，箭头表示经虚拟块设备复制到每台虚拟机</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="300" y1="310" x2="80" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="300" y1="310" x2="300" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="300" y1="310" x2="520" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="80" y="107.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">microVM 1</text>
  <text x="80" y="121" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">镜像页副本</text><rect x="250" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="300" y="107.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">microVM 2</text>
  <text x="300" y="121" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">镜像页副本</text><rect x="470" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="520" y="107.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">microVM 3</text>
  <text x="520" y="121" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">镜像页副本</text><rect x="250" y="286" width="100" height="48" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="300" y="300.375" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">宿主机 page</text><text x="300" y="315.225" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">cache</text>
  <text x="300" y="327.875" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">镜像页</text></svg>