<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 58 800 300" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">每台 microVM 各存一份镜像页</title>
  <desc id="fig-desc">三台 microVM 并排在上方，各自持有一份镜像页副本；下方的宿主机 page cache 保存镜像页，箭头表示经虚拟块设备复制到每台虚拟机</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="300" y1="310" x2="80" y2="110" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="300" y1="310" x2="300" y2="110" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="300" y1="310" x2="520" y2="110" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="80" y="107.25" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">microVM 1</text>
  <text x="80" y="121" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">镜像页副本</text><rect x="250" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="300" y="107.25" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">microVM 2</text>
  <text x="300" y="121" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">镜像页副本</text><rect x="470" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="520" y="107.25" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">microVM 3</text>
  <text x="520" y="121" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">镜像页副本</text><rect x="250" y="286" width="100" height="48" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="300" y="300.375" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">宿主机 page</text><text x="300" y="315.225" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">cache</text>
  <text x="300" y="327.875" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">镜像页</text></svg>