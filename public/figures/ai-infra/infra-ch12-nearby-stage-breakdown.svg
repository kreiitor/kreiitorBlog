<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">附近工作站的阶段耗时</title>
  <desc id="fig-desc">附近工作站横条：准备 0.27 秒、终端 6 秒、模型 2.7 秒、传播 0.4 秒、上传 1.6 秒，总长 11.0 秒，在 45 秒期限线内</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">附近工作站的阶段耗时</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">准备 0.27 秒、终端 6 秒、模型 2.7 秒、传播 0.4 秒、上传 1.6 秒</text><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="318.61538461538464" y1="96" x2="318.61538461538464" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="318.61538461538464" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">20</text><line x1="511.2307692307692" y1="96" x2="511.2307692307692" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="511.2307692307692" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">40</text><line x1="703.8461538461539" y1="96" x2="703.8461538461539" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="703.8461538461539" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">60</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">附近</text><rect x="126" y="115" width="2.6003076923076924" height="32" rx="3" fill="var(--surface)" stroke="var(--line)"/><rect x="128.6003076923077" y="115" width="57.784615384615385" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="157.4926153846154" y="134" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">终端 6 s</text><rect x="186.3849230769231" y="115" width="26.003076923076932" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="199.38646153846156" y="134" font-size="8" fill="var(--on-blue)" font-weight="600" text-anchor="middle">模型…</text><rect x="212.388" y="115" width="3.852307692307679" height="32" rx="3" fill="var(--line-soft)" stroke="var(--line)"/><rect x="216.24030769230768" y="115" width="15.409230769230783" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">期限</text><rect x="126" y="157" width="433.38461538461536" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="342.6923076923077" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">45 s 期限</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">二十轮完成时间 / s</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">三图共用同一横轴与 45 秒期限线；每段是二十轮同类工作的合计。</text>
</svg>