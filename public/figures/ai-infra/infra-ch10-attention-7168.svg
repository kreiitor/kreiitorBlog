<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">7,168 与 1,024 的因果配对</title>
  <desc id="fig-desc">矩阵示意：查询与键的索引分 0—7167 和 7168—8191 两段；大块有 25,693,696 对，小块有 524,800 对，合计 26,218,496 对</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><text x="307" y="112" font-size="10.5" fill="var(--muted)" font-weight="700" text-anchor="middle">查询 0–7167</text><text x="613" y="112" font-size="10.5" fill="var(--muted)" font-weight="700" text-anchor="middle">查询 7168–8191</text><text x="94" y="149" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">键 0–7167</text><rect x="157" y="129" width="300" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.1"/><text x="307" y="149" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">✓ 25,693,696</text><rect x="463" y="129" width="300" height="34" rx="4" fill="var(--line-soft)" stroke="var(--line)" stroke-width="1.1"/><text x="613" y="149" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">—</text><text x="94" y="189" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">键 7168–8191</text><rect x="157" y="169" width="300" height="34" rx="4" fill="var(--line-soft)" stroke="var(--line)" stroke-width="1.1"/><text x="307" y="189" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">—</text><rect x="463" y="169" width="300" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.1"/><text x="613" y="189" font-size="10.5" fill="var(--ink)" font-weight="600" text-anchor="middle">✓ 524,800</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">25,693,696 = 7168 × 7169 / 2；524,800 = 1024 × 1025 / 2；合计 26,218,496，较前一种分法增加约 56%。</text>
</svg>