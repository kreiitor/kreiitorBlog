<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 73 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">7,168 与 1,024 的因果配对</title>
  <desc id="fig-desc">矩阵示意：查询与键的索引分 0—7167 和 7168—8191 两段；大块有 25,693,696 对，小块有 524,800 对，合计 26,218,496 对</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><text x="307" y="112" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="700" text-anchor="middle">查询 0–7167</text><text x="613" y="112" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="700" text-anchor="middle">查询 7168–8191</text><text x="94" y="149" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">键 0–7167</text><rect x="157" y="129" width="300" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.1"/><text x="307" y="149" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">✓ 25,693,696</text><rect x="463" y="129" width="300" height="34" rx="4" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)" stroke-width="1.1"/><text x="613" y="149" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">—</text><text x="94" y="189" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">键 7168–8191</text><rect x="157" y="169" width="300" height="34" rx="4" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)" stroke-width="1.1"/><text x="307" y="189" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">—</text><rect x="463" y="169" width="300" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.1"/><text x="613" y="189" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">✓ 524,800</text><text x="400" y="237" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">25,693,696 = 7168 × 7169 / 2；524,800 = 1024 × 1025 / 2；合计 26,218,496，较前一种分法增加约 56%。</text>
</svg>