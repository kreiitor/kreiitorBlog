<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">HBM 读取：批内权重与 KV</title>
  <desc id="fig-desc">固定 8K 上下文的折线图：传统 HBM 路径在 B=1 时约 16.34 GB、B=16 时约 2.15 GB，随 batch 增大继续下降；独立快速 ROM 路径是一条约 1.21 GB 的水平线</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">5</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">15</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">20</text><polyline points="74,153.75 750,331.125" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.4"/><circle cx="74" cy="153.75" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="750" cy="331.125" r="3.2" fill="var(--blue,#466b3f)"/><polyline points="74,342.875 750,342.875" fill="none" stroke="var(--yellow,#f5d75f)" stroke-width="2.4"/><circle cx="74" cy="342.875" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="750" cy="342.875" r="3.2" fill="var(--yellow,#f5d75f)"/><text x="74" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">1</text><text x="750" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">16</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">batch size B</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">GB / 输出 token</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">传统 HBM 路径 W/B + K</text><rect x="194.05" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="209.05" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">独立快速 ROM 路径 K</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">K 为单请求本步读取的 KV 字节数，本算例为 1.125 GiB，约 1.21 GB。</text>
</svg>