<svg xmlns="http://www.w3.org/2000/svg" width="800" height="368" viewBox="0 64 800 368" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">建立全部关系的时间</title>
  <desc id="fig-desc">横轴为本地端点数 N，纵轴为建立全部关系的时间；逐对连接随 N² 增长，在 N=1024 时标出 17.0 s；每端点一个 Jetty、每远端一条通道随 N 增长，标出 16 ms；两者都使用 32 个核并行</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="34" y="92" width="359" height="300" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/><text x="213.5" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">逐对连接（RoCE）</text><text x="213.5" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">N×M 条连接</text><text x="46" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">每条连接 4 次系统调用</text><text x="46" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">加一次带外往返</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">N=1024 时 17.0 s</text><rect x="407" y="92" width="359" height="300" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/><text x="586.5" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">端点加通道（UB）</text><text x="586.5" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">N+M 个对象</text><text x="419" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">每端点一个 Jetty</text><text x="419" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">每远端一条通道</text><text x="419" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">N=1024 时 16 ms</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line,#a2aec1)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">N 较小</text><text x="730" y="400" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">N=1024</text></svg>