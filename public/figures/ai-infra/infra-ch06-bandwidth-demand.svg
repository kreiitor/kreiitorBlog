<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">读取频率与带宽需求</title>
  <desc id="fig-desc">斜线表示 20 GB 乘以每秒读取次数：每分钟一次约 0.33 GB/s，每秒一次 20 GB/s，每秒二十次 400 GB/s；另有 50 GB/s 的路径参考线与 4.36 GB/s 的在途窗口参考线</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="246.8888888888889" x2="750" y2="246.8888888888889" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="250.8888888888889" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">200</text><line x1="74" y1="135.7777777777778" x2="750" y2="135.7777777777778" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="139.7777777777778" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">400</text><polyline points="74,357.81666666666666 412,346.8888888888889 750,135.7777777777778" fill="none" stroke="var(--blue)" stroke-width="2.4"/><circle cx="74" cy="357.81666666666666" r="3.2" fill="var(--blue)"/><circle cx="412" cy="346.8888888888889" r="3.2" fill="var(--blue)"/><circle cx="750" cy="135.7777777777778" r="3.2" fill="var(--blue)"/><text x="74" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">每分钟一次</text><text x="412" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">每秒一次</text><text x="750" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">每秒二十次</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">平均带宽需求（GB/s）</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">20 GB × 读取频率</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">在途窗口按每事务 256 bytes、往返 7.52 μs、128 个在途事务计，约 4.36 GB/s。</text>
</svg>