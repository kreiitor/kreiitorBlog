<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">CED 的专家层工作量</title>
  <desc id="fig-desc">两根柱对比普通全层与 CED 路径：普通全层为 8,192 × 40 = 327,680 token·层；CED 为 8,192 × 20 加 128 × 20 = 166,400 token·层</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="286.57142857142856" x2="750" y2="286.57142857142856" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="290.57142857142856" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">100000</text><line x1="74" y1="215.14285714285714" x2="750" y2="215.14285714285714" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="219.14285714285714" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">200000</text><line x1="74" y1="143.71428571428572" x2="750" y2="143.71428571428572" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="147.71428571428572" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">300000</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">350000</text><rect x="208" y="123.94285714285715" width="68" height="234.05714285714285" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="243" y="117.94285714285715" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">327680</text><text x="243" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">普通全层</text><rect x="546" y="239.14285714285714" width="68" height="118.85714285714286" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="581" y="233.14285714285714" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">166400</text><text x="581" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">CED</text><li