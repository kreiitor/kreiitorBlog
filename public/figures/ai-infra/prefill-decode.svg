<svg xmlns="http://www.w3.org/2000/svg" width="800" height="394" viewBox="0 56 800 394" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Prefill 与 Decode 的资源画像</title>
  <desc id="fig-desc">Prefill 一次并行处理多个输入 token，权重读取被复用，通常受算力限制；Decode 每步只处理一个 token，却要重读权重与全部 KV，通常受带宽限制。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:17px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:12px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:11px;fill:var(--muted,#5f4f3c)}
    .onblue{fill:var(--on-blue,#fffcf5)}
    .onyellow{fill:var(--on-yellow,#3b3024)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
    <marker id="arrow-y" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--yellow,#f5d75f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <rect x="36" y="84" width="350" height="3" fill="var(--blue,#466b3f)"/><rect x="36" y="84" width="350" height="300" rx="10" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>
  <rect x="36" y="84" width="350" height="48" rx="10" fill="var(--blue,#466b3f)"/>
  <rect x="36" y="120" width="350" height="12" fill="var(--blue,#466b3f)"/>
  <text x="211" y="115" text-anchor="middle" class="h onblue">Prefill</text>

  <g fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.5">
    <rect x="62" y="154" width="26" height="26" rx="4"/><rect x="94" y="154" width="26" height="26" rx="4"/>
    <rect x="126" y="154" width="26" height="26" rx="4"/><rect x="158" y="154" width="26" height="26" rx="4"/>
    <rect x="190" y="154" width="26" height="26" rx="4"/><rect x="222" y="154" width="26" height="26" rx="4"/>
    <rect x="254" y="154" width="26" height="26" rx="4"/><rect x="286" y="154" width="26" height="26" rx="4"/>
  </g>
  <text x="211" y="148" text-anchor="middle" class="s">P 个输入 token 并行</text>

  <rect x="76" y="202" width="270" height="38" rx="6" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.5"/>
  <text x="211" y="226" text-anchor="middle" class="b">权重读一次</text>
  <path d="M211 196 V198" stroke="var(--blue,#466b3f)" stroke-width="2" fill="none"/>
  <path d="M211 240 V260" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="224" y="255" class="tiny">一次读取，服务 P 行</text>

  <rect x="76" y="266" width="270" height="52" rx="6" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.5"/>
  <text x="211" y="288" text-anchor="middle" class="b">大矩阵计算</text>
  <text x="211" y="306" text-anchor="middle" class="tiny">计算密集，行数多</text>

  <rect x="96" y="334" width="230" height="30" rx="6" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="211" y="354" text-anchor="middle" class="b onblue">瓶颈：算力</text>

  <rect x="414" y="84" width="350" height="3" fill="var(--yellow,#f5d75f)"/><rect x="414" y="84" width="350" height="300" rx="10" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>
  <rect x="414" y="84" width="350" height="48" rx="10" fill="var(--yellow,#f5d75f)"/>
  <rect x="414" y="120" width="350" height="12" fill="var(--yellow,#f5d75f)"/>
  <text x="589" y="115" text-anchor="middle" class="h onyellow">Decode</text>

  <rect x="462" y="154" width="26" height="26" rx="4" fill="var(--surface,#fffcf5)" stroke="var(--yellow,#f5d75f)" stroke-width="1.5"/>
  <text x="500" y="173" class="s">每步 1 个新 token</text>

  <rect x="454" y="202" width="270" height="34" rx="6" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.5"/>
  <text x="589" y="224" text-anchor="middle" class="b">权重（全量重读）</text>
  <rect x="454" y="246" width="270" height="34" rx="6" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.5"/>
  <text x="589" y="268" text-anchor="middle" class="b">全部历史 KV</text>

  <path d="M589 200 V190" stroke="var(--yellow,#f5d75f)" stroke-width="2" fill="none"/>
  <path d="M529 280 V292" stroke="var(--yellow,#f5d75f)" stroke-width="2.5" fill="none" marker-end="url(#arrow-y)"/>
  <path d="M649 280 V292" stroke="var(--yellow,#f5d75f)" stroke-width="2.5" fill="none" marker-end="url(#arrow-y)"/>

  <rect x="454" y="296" width="270" height="38" rx="6" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.5"/>
  <text x="589" y="320" text-anchor="middle" class="b">读权重 + 读旧 KV</text>

  <rect x="474" y="344" width="230" height="30" rx="6" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)" stroke-width="1.5"/>
  <text x="589" y="364" text-anchor="middle" class="b onyellow">瓶颈：显存带宽</text>

  <text x="400" y="416" text-anchor="middle" class="s">首 token 由 prefill 产生；后续 G−1 次 decode 每次只推进一个 token。</text>
  <text x="400" y="436" text-anchor="middle" class="tiny">请求形状不同，资源画像就不同，不能只看总 token 数。</text>
</svg>
