<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">三个模型的状态与读取时间</title>
  <desc id="fig-desc">右图为三个模型在 batch 64、32K 上下文时一次 decode 的读取时间堆叠柱：Qwen3-32B 约 183 ms，Qwen3-30B-A3B 约 80 ms，Qwen3.6-35B-A3B 约 34 ms；每根柱由权重与状态两段组成</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">50</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">100</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">150</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">200</text><rect x="151.66666666666669" y="334.25" width="70" height="23.75" fill="var(--blue)" stroke="var(--blue)"/><rect x="151.66666666666669" y="129.25" width="70" height="205" fill="var(--yellow)" stroke="var(--yellow)"/><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">Qwen3-32B</text><rect x="377.00000000000006" y="335.5" width="70" height="22.5" fill="var(--blue)" stroke="var(--blue)"/><rect x="377.00000000000006" y="258" width="70" height="77.5" fill="var(--yellow)" stroke="var(--yellow)"/><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">Qwen3-30B-A3B</text><rect x="602.3333333333334" y="333" width="70" height="25" fill="var(--blue)" stroke="var(--blue)"/><rect x="602.3333333333334" y="315.5" width="70" height="17.5" fill="var(--yellow)" stroke="var(--yellow)"/><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">Qwen3.6-35B-A3B</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">读取时间（ms）</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">权重</text><rect x="130" y="86" width="10" height="10" fill="var(--yellow)"/><text x="145" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">状态</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">柱值为 batch 64、32K 上下文，按 H100 的 3350 GB/s 计；总高度分别为 183、80、34 ms。</text>
</svg>