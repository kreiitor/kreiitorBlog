<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">完整快照的累计读取时间</title>
  <desc id="fig-desc">横轴为复用次数 1 到 5，纵轴为累计时间；每次远程读取从 3.02 ms 起按 3.02 ms 每次上升，先搬回本地从 3.07 ms 起按 0.046 ms 每次缓慢上升，两线在约 1.03 次相交</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">完整快照的累计读取时间</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">每次远程读取按 3.02 ms 累加，搬回后按 0.046 ms 累加</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="279.875" x2="750" y2="279.875" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="283.875" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">5</text><line x1="74" y1="201.75" x2="750" y2="201.75" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="205.75" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="123.625" x2="750" y2="123.625" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="127.625" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">15</text><polyline points="74,310.8125 243,263.625 412,216.4375 581,169.25 750,122.0625" fill="none" stroke="var(--yellow)" stroke-width="2.4"/><circle cx="74" cy="310.8125" r="3.2" fill="var(--yellow)"/><circle cx="243" cy="263.625" r="3.2" fill="var(--yellow)"/><circle cx="412" cy="216.4375" r="3.2" fill="var(--yellow)"/><circle cx="581" cy="169.25" r="3.2" fill="var(--yellow)"/><circle cx="750" cy="122.0625" r="3.2" fill="var(--yellow)"/><polyline points="74,310.03125 243,309.3125 412,308.59375 581,307.875 750,307.15625" fill="none" stroke="var(--blue)" stroke-width="2.4"/><circle cx="74" cy="310.03125" r="3.2" fill="var(--blue)"/><circle cx="243" cy="309.3125" r="3.2" fill="var(--blue)"/><circle cx="412" cy="308.59375" r="3.2" fill="var(--blue)"/><circle cx="581" cy="307.875" r="3.2" fill="var(--blue)"/><circle cx="750" cy="307.15625" r="3.2" fill="var(--blue)"/><text x="74" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">1</text><text x="243" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">2</text><text x="412" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">3</text><text x="581" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">4</text><text x="750" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">5</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">复用次数</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">累计时间 / ms</text></g><rect x="82" y="86" width="10" height="10" fill="var(--yellow)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">每次远程读取</text><rect x="158" y="86" width="10" height="10" fill="var(--blue)"/><text x="173" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">先搬回本地</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">快照大小为 144 MiB；交点约在 r≈1.03。</text>
</svg>