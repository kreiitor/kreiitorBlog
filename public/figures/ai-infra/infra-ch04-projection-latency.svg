ted,#5f4f3c)" font-weight="600" text-anchor="middle">256 行 复用</text><rect x="630.5" y="218.41666666666666" width="68" height="139.58333333333334" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="665.5" y="212.41666666666666" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">33.5</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">256 行 轮换</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">条件</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">每次调用总耗时 / μs</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">平均耗时</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">每个条件测十一轮、每轮十六次调用，取每轮平均耗时的中位数；计时包含提交与同步。</text>
</svg>