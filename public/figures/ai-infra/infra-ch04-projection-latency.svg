<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">权重访问方式与调用耗时</title>
  <desc id="fig-desc">四根柱分别为 1 行复用 42.9 μs、1 行轮换 51.9 μs、256 行复用 32.6 μs、256 行轮换 33.5 μs</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">权重访问方式与调用耗时</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">RTX PRO 6000 上四个条件的平均耗时</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="274.6666666666667" x2="750" y2="274.6666666666667" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="278.6666666666667" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="191.33333333333334" x2="750" y2="191.33333333333334" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="195.33333333333334" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">40</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">60</text><rect x="123.5" y="179.25" width="68" height="178.75" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="158.5" y="173.25" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">42.9</text><text x="158.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">1 行 复用</text><rect x="292.5" y="141.75" width="68" height="216.25" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="327.5" y="135.75" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">51.9</text><text x="327.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">1 行 轮换</text><rect x="461.5" y="222.16666666666666" width="68" height="135.83333333333334" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="496.5" y="216.16666666666666" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">32.6</text><text x="496.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">256 行 复用</text><rect x="630.5" y="218.41666666666666" width="68" height="139.58333333333334" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="665.5" y="212.41666666666666" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">33.5</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">256 行 轮换</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">条件</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">每次调用总耗时 / μs</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">平均耗时</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">每个条件测十一轮、每轮十六次调用，取每轮平均耗时的中位数；计时包含提交与同步。</text>
</svg>