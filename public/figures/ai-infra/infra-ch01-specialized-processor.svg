<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">专用处理器的数据通路</title>
  <desc id="fig-desc">输入缓冲的数据搬移到矩阵计算阵列，结果再搬移到输出缓冲；阵列负责反复出现的矩阵运算，前后缓冲临时保存待计算或已算完的数据</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">专用处理器的数据通路</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">输入缓冲、矩阵计算阵列、输出缓冲串联</text><rect x="47.66666666666667" y="186" width="210" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="238.75" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">输入缓冲</text>
  <text x="152.66666666666669" y="255" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">待计算数据</text><rect x="295.00000000000006" y="186" width="210" height="112" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="238.75" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">矩阵计算阵列</text>
  <text x="400.00000000000006" y="255" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">专用计算资源</text><rect x="542.3333333333334" y="186" width="210" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="238.75" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">输出缓冲</text>
  <text x="647.3333333333334" y="255" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">已算完数据</text><path d="M257.6666666666667 242 L295.00000000000006 242" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 242 L542.3333333333334 242" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">缓冲是临时保存待计算或已算完数据的存储区域。</text>
</svg>