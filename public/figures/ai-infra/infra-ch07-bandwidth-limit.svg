<svg xmlns="http://www.w3.org/2000/svg" width="800" height="388" viewBox="0 57 800 388" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">路径与提交间隔的带宽上限</title>
  <desc id="fig-desc">两根柱对比高活跃槽位下的吞吐上限：只受路径与槽位限制时为 50 GB/s，再加入 18.6 ns 启动间隔后为 13.7 GB/s</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="267.0909090909091" x2="750" y2="267.0909090909091" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="271.0909090909091" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="176.1818181818182" x2="750" y2="176.1818181818182" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="180.1818181818182" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">40</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">55</text><rect x="208" y="130.72727272727275" width="68" height="227.27272727272725" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="243" y="124.72727272727275" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">50</text><text x="243" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">路径与槽位限制</text><rect x="546" y="295.72727272727275" width="68" height="62.27272727272727" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="581" y="289.72727272727275" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">13.7</text><text x="581" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">再加 18.6 ns 启动间隔</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">高活跃槽位</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">吞吐上限 / GB/s</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">吞吐上限</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">路径与槽位限制为 min(B_path, Nm/T)；增加槽位只能抬高蓝线，不能突破提交间隔。</text>
</svg>