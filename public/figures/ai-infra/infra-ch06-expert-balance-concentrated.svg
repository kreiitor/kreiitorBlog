<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">专家集中到一组</title>
  <desc id="fig-desc">四根柱子中只有组 0 高 512，组 1、组 2、组 3 都为 0；所选八个专家都在组 0，权重读取降到 288 MiB，但计算全部压在同一组</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">专家集中到一组</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">组 0 承担 512 次计算，其余三组为 0</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="267.0909090909091" x2="750" y2="267.0909090909091" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="271.0909090909091" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">200</text><line x1="74" y1="176.1818181818182" x2="750" y2="176.1818181818182" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="180.1818181818182" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">400</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">550</text><rect x="123.5" y="125.27272727272728" width="68" height="232.72727272727272" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="158.5" y="119.27272727272728" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">512</text><text x="158.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">组 0</text><rect x="292.5" y="358" width="68" height="0" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="327.5" y="352" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">0</text><text x="327.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">组 1</text><rect x="461.5" y="358" width="68" height="0" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="496.5" y="352" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">0</text><text x="496.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">组 2</text><rect x="630.5" y="358" width="68" height="0" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="665.5" y="352" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">0</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">组 3</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">token—专家计算次数</text></g><rect x="82" y="86" width="10" height="10" fill="var(--yellow)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">计算次数</text></svg>