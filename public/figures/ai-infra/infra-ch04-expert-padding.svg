<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">专家分散与集中的执行行数</title>
  <desc id="fig-desc">两根堆叠柱：256 个专家时总执行约 4096 行，其中约 512 行有效、约 3584 行补零；8 个专家时总执行 512 行，全部有效</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="246.8888888888889" x2="750" y2="246.8888888888889" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="250.8888888888889" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">2000</text><line x1="74" y1="135.7777777777778" x2="750" y2="135.7777777777778" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="139.7777777777778" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">4000</text><rect x="208" y="329.55555555555554" width="70" height="28.444444444444446" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><rect x="208" y="130.44444444444443" width="70" height="199.1111111111111" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow-soft,#fff5b7)"/><text x="243" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">256 个专家</text><rect x="546" y="329.55555555555554" width="70" height="28.444444444444446" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><rect x="546" y="329.55555555555554" width="70" height="0" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow-soft,#fff5b7)"/><text x="581" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">8 个专家</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">专家分布</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">执行的矩阵行数（含补零）</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#2647d7)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">有效行</text><rect x="137" y="86" width="10" height="10" fill="var(--yellow-soft,#fff5b7)"/><text x="152" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">补零行</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">纵轴含补零行；有效输入合计 512 行。</text>
</svg>