<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">专家分散与集中的执行行数</title>
  <desc id="fig-desc">两根堆叠柱：256 个专家时总执行约 4096 行，其中约 512 行有效、约 3584 行补零；8 个专家时总执行 512 行，全部有效</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="246.8888888888889" x2="750" y2="246.8888888888889" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="250.8888888888889" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">2000</text><line x1="74" y1="135.7777777777778" x2="750" y2="135.7777777777778" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="139.7777777777778" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">4000</text><rect x="208" y="329.55555555555554" width="70" height="28.444444444444446" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="208" y="130.44444444444443" width="70" height="199.1111111111111" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow-soft,#fbf3d9)"/><text x="243" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">256 个专家</text><rect x="546" y="329.55555555555554" width="70" height="28.444444444444446" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="546" y="329.55555555555554" width="70" height="0" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow-soft,#fbf3d9)"/><text x="581" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">8 个专家</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">专家分布</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">执行的矩阵行数（含补零）</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">有效行</text><rect x="137" y="86" width="10" height="10" fill="var(--yellow-soft,#fbf3d9)"/><text x="152" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">补零行</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">纵轴含补零行；有效输入合计 512 行。</text>
</svg>