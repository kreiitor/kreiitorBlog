<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 64 800 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">两次 RL 运行的重启与费用</title>
  <desc id="fig-desc">两栏对照：Pro 重启 14 次，总运行 127.5 小时，浪费约 30.1 小时，占 23.6%，费用约 61.9 万美元；Flash 重启 5 次，总运行 83.1 小时，浪费约 13.7 小时，占 16.5%，费用约 14.1 万美元</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="34" y="92" width="359" height="3" fill="var(--blue,#466b3f)"/><rect x="34" y="92" width="359" height="300" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="213.5" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Pro</text><text x="213.5" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">14 次重启</text><text x="46" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">总运行 127.5 小时</text><text x="46" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">浪费约 30.1 小时（23.6%）</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">费用约 61.9 万美元</text><rect x="407" y="92" width="359" height="3" fill="var(--yellow,#f5d75f)"/><rect x="407" y="92" width="359" height="300" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="586.5" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Flash</text><text x="586.5" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">5 次重启</text><text x="419" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">总运行 83.1 小时</text><text x="419" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="431" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">浪费约 13.7 小时（16.5%）</text><text x="419" y="217.89999999999998" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="431" y="217.89999999999998" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">费用约 14.1 万美元</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">金额由日志事件区间乘以看板固定费率估算，不是单列的故障账单。Pro 中断时间减少一半时，约省 15 小时、31 万美元。</text>
