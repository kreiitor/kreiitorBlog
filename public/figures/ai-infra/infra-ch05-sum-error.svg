<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">分段数对平方和误差的影响</title>
  <desc id="fig-desc">柱状图对比 1 段与 8 段：1 段与精确值的距离为 175.2 ULP，8 段为 9.2 ULP，两者相差 166 ULP；另标注 40,320 种合并次序只得到 3 个结果</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">分段数对平方和误差的影响</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">八段把误差从 175.2 ULP 降到 9.2 ULP</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="293.13906185139064" x2="750" y2="293.13906185139064" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="297.13906185139064" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">50</text><line x1="74" y1="228.27812370278124" x2="750" y2="228.27812370278124" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="232.27812370278124" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">100</text><line x1="74" y1="163.41718555417185" x2="750" y2="163.41718555417185" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="167.41718555417185" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">150</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">192.72</text><rect x="208" y="130.72727272727275" width="68" height="227.27272727272725" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="243" y="124.72727272727275" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">175.2</text><text x="243" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">1 段</text><rect x="546" y="346.06558738065587" width="68" height="11.934412619344124" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="581" y="340.06558738065587" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">9.2</text><text x="581" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">8 段</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">分段数</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">与精确值的距离 / ULP</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">误差</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">横轴单位为 FP32 的 ULP；精确值用有理数算得，只作比较基准。图中六种分段数为 1、2、4、8、16、32，仅标出 1 段与 8 段的数值。</text>
</svg>