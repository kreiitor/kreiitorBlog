<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">分段数对平方和误差的影响</title>
  <desc id="fig-desc">柱状图对比 1 段与 8 段：1 段与精确值的距离为 175.2 ULP，8 段为 9.2 ULP，两者相差 166 ULP；另标注 40,320 种合并次序只得到 3 个结果</desc>
  <style>
