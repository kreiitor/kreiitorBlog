<svg xmlns="http://www.w3.org/2000/svg" width="800" height="396" viewBox="0 54 800 396" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">超节点与集群的两级互联</title>
  <desc id="fig-desc">超节点内部用高速互联做 scale-up，追求低延迟；超节点之间通过网卡与交换网络做 scale-out，追求规模。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:12px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:11px;fill:var(--muted,#5f4f3c)}
    .onblue{fill:var(--on-blue,#fffcf5)}
    .onyellow{fill:var(--on-yellow,#3b3024)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <rect x="34" y="82" width="732" height="300" rx="12" fill="var(--paper,#faf6f0)" stroke="var(--line,#c9b49c)" stroke-width="2"/>
  <text x="54" y="108" class="h">集群（scale-out）</text>

  <rect x="62" y="124" width="296" height="3" fill="var(--blue,#466b3f)"/><rect x="62" y="124" width="296" height="228" rx="10" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>
  <text x="82" y="150" class="h">超节点 A（scale-up）</text>

  <g fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.5">
    <rect x="86" y="170" width="70" height="42" rx="5"/><rect x="168" y="170" width="70" height="42" rx="5"/>
    <rect x="86" y="224" width="70" height="42" rx="5"/><rect x="168" y="224" width="70" height="42" rx="5"/>
  </g>
  <g class="tiny" text-anchor="middle">
    <text x="121" y="196">GPU</text><text x="203" y="196">GPU</text>
    <text x="121" y="250">GPU</text><text x="203" y="250">GPU</text>
  </g>
  <rect x="88" y="286" width="148" height="34" rx="6" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="162" y="308" text-anchor="middle" class="b onblue">NVLink / 高速互联</text>

  <rect x="442" y="124" width="296" height="3" fill="var(--blue,#466b3f)"/><rect x="442" y="124" width="296" height="228" rx="10" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>
  <text x="462" y="150" class="h">超节点 B（scale-up）</text>
  <g fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.5">
    <rect x="466" y="170" width="70" height="42" rx="5"/><rect x="548" y="170" width="70" height="42" rx="5"/>
    <rect x="466" y="224" width="70" height="42" rx="5"/><rect x="548" y="224" width="70" height="42" rx="5"/>
  </g>
  <g class="tiny" text-anchor="middle">
    <text x="501" y="196">GPU</text><text x="583" y="196">GPU</text>
    <text x="501" y="250">GPU</text><text x="583" y="250">GPU</text>
  </g>
  <rect x="468" y="286" width="148" height="34" rx="6" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="542" y="308" text-anchor="middle" class="b onblue">NVLink / 高速互联</text>

  <path d="M358 220 H438" stroke="var(--blue,#466b3f)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M438 248 H358" stroke="var(--blue,#466b3f)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="398" y="208" text-anchor="middle" class="b">网卡 + 交换</text>
  <text x="398" y="274" text-anchor="middle" class="tiny">跨节点通信</text>

  <text x="400" y="404" text-anchor="middle" class="s">紧密协作留在超节点内；跨节点流量走 scale-out 网络。</text>
  <text x="400" y="430" text-anchor="middle" class="tiny">超节点把 scale-up 的边界从单机推到机柜，模型因此可以切得更细。</text>
</svg>
