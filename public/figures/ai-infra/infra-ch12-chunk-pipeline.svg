/text><rect x="318.61538461538464" y="157" width="4.815384615384598" height="32" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><rect x="511.2307692307692" y="157" width="4.815384615384598" height="32" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><rect x="703.8461538461539" y="157" width="4.815384615384598" height="32" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="116" y="219" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">回传</text><rect x="323.4307692307692" y="199" width="3.8523076923076958" height="32" rx="3" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)"/><rect x="516.0461538461539" y="199" width="7.7046153846153915" height="32" rx="3" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)"/><rect x="708.6615384615385" y="199" width="7.7046153846153915" height="32" rx="3" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)"/><text x="116" y="261" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">传播</text><rect x="716.3661538461538" y="241" width="4.815384615384598" height="32" rx="3" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)"/><line x1="126" y1="284" x2="752" y2="284" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="320" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">时间 / s</text><text x="400" y="357" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">条件：上行 20 Mbit/s、下行 100 Mbit/s、单向传播 0.05 秒；三块输出 1、2、2 MB。</text>
</svg>