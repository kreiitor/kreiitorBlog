<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">分块流水线的时间重叠</title>
  <desc id="fig-desc">上传行分为 0–4、4–8、8–12 秒三段；每块到达后处理 0.1 秒，再回传 0.08、0.16、0.16 秒；前两块的处理与回传与后续上传重叠，完整成片在 12.36 秒返回</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="126" y1="96" x2="126" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="366.7692307692308" y1="96" x2="366.7692307692308" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="366.7692307692308" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">5</text><line x1="607.5384615384615" y1="96" x2="607.5384615384615" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="607.5384615384615" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">10</text><line x1="752" y1="96" x2="752" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">13</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">上传</text><rect x="126" y="115" width="192.6153846153846" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="222.30769230769232" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">块 1 · 4 s</text><rect x="318.61538461538464" y="115" width="192.6153846153846" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="414.92307692307696" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">块 2 · 4 s</text><rect x="511.2307692307692" y="115" width="192.6153846153846" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="607.5384615384615" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">块 3 · 4 s</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">处理</text><rect x="318.61538461538464" y="157" width="4.815384615384598" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><rect x="511.2307692307692" y="157" width="4.815384615384598" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><rect x="703.8461538461539" y="157" width="4.815384615384598" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="116" y="219" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">回传</text><rect x="323.4307692307692" y="199" width="3.8523076923076958" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><rect x="516.0461538461539" y="199" width="7.7046153846153915" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><rect x="708.6615384615385" y="199" width="7.7046153846153915" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="116" y="261" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">传播</text><rect x="716.3661538461538" y="241" width="4.815384615384598" height="32" rx="3" fill="var(--line-soft)" stroke="var(--line)"/><line x1="126" y1="284" x2="752" y2="284" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="320" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">时间 / s</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">条件：上行 20 Mbit/s、下行 100 Mbit/s、单向传播 0.05 秒；三块输出 1、2、2 MB。</text>
</svg>