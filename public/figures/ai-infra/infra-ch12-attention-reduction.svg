<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 58 800 386" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">注意力输出的两卡归约</title>
  <desc id="fig-desc">左卡计算注意力分片 0，右卡计算注意力分片 1；两卡把局部结果送到两卡归约输出，求和得到完整输出后进入前馈计算</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="80" y1="110" x2="290" y2="245" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="500" y1="110" x2="290" y2="245" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="290" y1="245" x2="290" y2="360" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="80" y="114.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">注意力分片 0</text>
  <rect x="450" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="500" y="114.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">注意力分片 1</text>
  <rect x="240" y="221" width="100" height="48" rx="8" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="290" y="249.125" font-size="11" fill="var(--on-yellow,#3b3024)" font-weight="700" text-anchor="middle">两卡归约输出</text>
  <rect x="240" y="336" width="100" height="48" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="290" y="364.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">前馈计算</text>
  <text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">横向箭头表示执行顺序，纵向箭头表示两卡通信；每层注意力输出各有一次归约。</text>
</svg>