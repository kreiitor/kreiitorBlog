<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">注意力输出的两卡归约</title>
  <desc id="fig-desc">左卡计算注意力分片 0，右卡计算注意力分片 1；两卡把局部结果送到两卡归约输出，求和得到完整输出后进入前馈计算</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="80" y1="110" x2="290" y2="245" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="500" y1="110" x2="290" y2="245" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="290" y1="245" x2="290" y2="360" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="86" width="100" height="48" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="80" y="114.125" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">注意力分片 0</text>
  <rect x="450" y="86" width="100" height="48" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="500" y="114.125" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">注意力分片 1</text>
  <rect x="240" y="221" width="100" height="48" rx="8" fill="var(--yellow)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="290" y="249.125" font-size="11" fill="var(--on-yellow)" font-weight="700" text-anchor="middle">两卡归约输出</text>
  <rect x="240" y="336" width="100" height="48" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="290" y="364.125" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">前馈计算</text>
  <text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">横向箭头表示执行顺序，纵向箭头表示两卡通信；每层注意力输出各有一次归约。</text>
</svg>