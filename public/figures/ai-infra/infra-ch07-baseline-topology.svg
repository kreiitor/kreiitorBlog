<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 58 800 386" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">双服务器八卡基准拓扑</title>
  <desc id="fig-desc">两台服务器各含八张 GPU，服务器 A 为 GPU 0–7，服务器 B 为 GPU 8–15；服务器内部经 NVSwitch 以每方向 450 GB/s 互联，每张 GPU 配一张 50 GB/s 网卡，经各自的 rail 交换机相连</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="80" y1="110" x2="80" y2="247.5" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="520" y1="110" x2="520" y2="247.5" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="247.5" x2="300" y2="385" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="520" y1="247.5" x2="300" y2="385" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="80" y="107.25" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">服务器 A ·</text><text x="80" y="122.1" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">NVSwitch</text>
  <rect x="470" y="86" width="100" height="48" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="520" y="107.25" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">服务器 B ·</text><text x="520" y="122.1" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">NVSwitch</text>
  <rect x="30" y="223.5" width="100" height="48" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="80" y="244.75" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">GPU 0–7 · NIC×</text><text x="80" y="259.6" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">8</text>
  <rect x="470" y="223.5" width="100" height="48" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="520" y="244.75" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">GPU 8–15 · NIC</text><text x="520" y="259.6" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">×8</text>
  <rect x="250" y="361" width="100" height="48" rx="8" fill="var(--line-soft,#dce1e8)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="300" y="389.125" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">Rail 交换机</text>
  <text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">每条 rail 一台交换机；服务器内 NVSwitch 提供全互联，跨服务器流量必须经过网卡。</text>
</svg>