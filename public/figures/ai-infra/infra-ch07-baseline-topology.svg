<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 58 800 386" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">双服务器八卡基准拓扑</title>
  <desc id="fig-desc">两台服务器各含八张 GPU，服务器 A 为 GPU 0–7，服务器 B 为 GPU 8–15；服务器内部经 NVSwitch 以每方向 450 GB/s 互联，每张 GPU 配一张 50 GB/s 网卡，经各自的 rail 交换机相连</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="80" y1="110" x2="80" y2="247.5" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="520" y1="110" x2="520" y2="247.5" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="247.5" x2="300" y2="385" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="520" y1="247.5" x2="300" y2="385" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="80" y="107.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">服务器 A ·</text><text x="80" y="122.1" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">NVSwitch</text>
  <rect x="470" y="86" width="100" height="48" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="520" y="107.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">服务器 B ·</text><text x="520" y="122.1" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">NVSwitch</text>
  <rect x="30" y="223.5" width="100" height="48" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="80" y="244.75" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">GPU 0–7 · NIC×</text><text x="80" y="259.6" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">8</text>
  <rect x="470" y="223.5" width="100" height="48" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="520" y="244.75" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">GPU 8–15 · NIC</text><text x="520" y="259.6" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">×8</text>
  <rect x="250" y="361" width="100" height="48" rx="8" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="300" y="389.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Rail 交换机</text>
  <text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">每条 rail 一台交换机；服务器内 NVSwitch 提供全互联，跨服务器流量必须经过网卡。</text>
</svg>