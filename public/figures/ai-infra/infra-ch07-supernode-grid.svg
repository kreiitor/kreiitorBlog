<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">64 卡超节点的 8×8 排布</title>
  <desc id="fig-desc">8 行 8 列的方阵，共 64 张卡；每一行的八张卡处理同一 micro-batch 的不同模型分片，每一列的八张卡先汇合对应梯度再与其他超节点交换同一分片</desc>
