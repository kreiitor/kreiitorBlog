<svg xmlns="http://www.w3.org/2000/svg" width="800" height="231" viewBox="0 68 800 231" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">端侧方案的阶段耗时</title>
  <desc id="fig-desc">端侧横条：终端工作 6 秒，模型计算 58.0 秒，总长 64.0 秒；45 秒期限线在横条末端之前，任务超出期限</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0</text><line x1="318.61538461538464" y1="96" x2="318.61538461538464" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="318.61538461538464" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">20</text><line x1="511.2307692307692" y1="96" x2="511.2307692307692" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="511.2307692307692" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">40</text><line x1="703.8461538461539" y1="96" x2="703.8461538461539" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="703.8461538461539" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">60</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">端侧</text><rect x="126" y="115" width="57.784615384615385" height="32" rx="3" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)"/><text x="154.8923076923077" y="134" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">终端 6 s</text><rect x="183.7846153846154" y="115" width="558.5846153846154" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="463.0769230769231" y="134" font-size="9.5" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">模型 58.0 s</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">期限</text><rect x="126" y="157" width="433.38461538461536" height="32" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)"/><text x="342.6923076923077" y="176" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">45 s 期限</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">二十轮完成时间 / s</text><text x="400" y="273" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">三图共用同一横轴与 45 秒期限线；每段是二十轮同类工作的合计。</text>
</svg>