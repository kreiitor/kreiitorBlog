<svg xmlns="http://www.w3.org/2000/svg" width="800" height="376" viewBox="0 68 800 376" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">SwiGLU 的两卡切分</title>
  <desc id="fig-desc">完整输入 X（m×h）同时进入两路；每卡的上投影取中间维的一半，经 SiLU 与乘法得到 Z0 或 Z1（m×f/2），下投影只产生 m×h 的部分和；两路部分和相加得到完整输出</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="47.66666666666667" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="130.08333333333334" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">输入 X</text>
  <text x="152.66666666666669" y="146.33333333333334" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">m×h · 每卡一份</text><rect x="295.00000000000006" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="130.08333333333334" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">上投影（列）</text>
  <text x="400.00000000000006" y="146.33333333333334" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">前半中间维</text><rect x="542.3333333333334" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="130.08333333333334" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">SiLU ⊙ 乘法</text>
  <text x="647.3333333333334" y="146.33333333333334" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">Z0：m×(f/2)</text><rect x="47.66666666666667" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="238.75000000000003" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">下投影（行）</text>
  <text x="152.66666666666669" y="255.00000000000003" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">部分和 m×h</text><rect x="295.00000000000006" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="238.75000000000003" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">上投影（列）</text>
  <text x="400.00000000000006" y="255.00000000000003" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">后半中间维</text><rect x="542.3333333333334" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="238.75000000000003" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">SiLU ⊙ 乘法</text>
  <text x="647.3333333333334" y="255.00000000000003" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">Z1：m×(f/2)</text><rect x="47.66666666666667" y="313.33333333333337" width="210" height="74.66666666666667" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="347.4166666666667" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">下投影（行）</text>
  <text x="152.66666666666669" y="363.6666666666667" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">部分和 m×h</text><rect x="295.00000000000006" y="313.33333333333337" width="210" height="74.66666666666667" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="347.4166666666667" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">逐元素相加</text>
  <text x="400.00000000000006" y="363.6666666666667" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">完整输出 m×h</text><path d="M257.6666666666667 133.33333333333334 L295.00000000000006 133.33333333333334" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 133.33333333333334 L542.3333333333334 133.33333333333334" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 170.66666666666669 L647.3333333333334 187.66666666666669 L152.66666666666669 187.66666666666669 L152.66666666666669 204.66666666666669" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M152.66666666666669 279.33333333333337 L152.66666666666669 296.33333333333337 L400.00000000000006 296.33333333333337 L400.00000000000006 313.33333333333337" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M152.66666666666669 170.66666666666669 L152.66666666666669 187.66666666666669 L400.00000000000006 187.66666666666669 L400.00000000000006 204.66666666666669" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 242.00000000000003 L542.3333333333334 242.00000000000003" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 279.33333333333337 L647.3333333333334 296.33333333333337 L152.66666666666669 296.33333333333337 L152.66666666666669 313.33333333333337" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 350.6666666666667 L295.00000000000006 350.6666666666667" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">每卡中间激活为 m×(f/2)，输出部分和仍为 m×h；切分的是每个 token 的特征维，m 个 token 全部保留。</text>
</svg>