<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">单卡与八卡的每卡内存</title>
  <desc id="fig-desc">堆叠柱状图对比两种放置的每卡内存：单卡实例约 473.9 GB，远超 80 GB 参考线；八卡中的每卡约 61.50 GB，由权重、KV 和工作区三部分组成</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="258" x2="750" y2="258" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="262" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">200</text><line x1="74" y1="158" x2="750" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="162" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">400</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">500</text><rect x="208" y="122.9" width="70" height="235.1" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="208" y="122.11000000000001" width="70" height="0.79" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><rect x="208" y="121.03500000000003" width="70" height="1.075" fill="var(--surface,#fffcf5)" stroke="var(--surface,#fffcf5)"/><text x="243" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">单卡实例</text><rect x="546" y="328.52" width="70" height="29.48" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="546" y="328.325" width="70" height="0.195" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><rect x="546" y="327.25" width="70" height="1.075" fill="var(--surface,#fffcf5)" stroke="var(--surface,#fffcf5)"/><text x="581" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">八卡中的每卡</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">每卡内存占用（GB）</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">权重</text><rect x="130" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="145" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">KV</text><rect x="171.7" y="86" width="10" height="10" fill="var(--surface,#fffcf5)"/><text x="186.7" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">工作区</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">H100 单卡容量 80 GB；2 GiB 工作区在每张卡分别预留。</text>
</svg>