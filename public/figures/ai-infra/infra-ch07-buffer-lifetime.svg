<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">源缓冲与目的缓冲的生命周期</title>
  <desc id="fig-desc">时间轴 0 到 14 μs：源缓冲占用从 0 到 5 μs 发送完成，目的缓冲占用从 0 持续到 12 μs 消费者用完，消费者在 8–12 μs 读取</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="126" y1="96" x2="126" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="349.57142857142856" y1="96" x2="349.57142857142856" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="349.57142857142856" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">5</text><line x1="573.1428571428571" y1="96" x2="573.1428571428571" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="573.1428571428571" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">10</text><line x1="752" y1="96" x2="752" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">14</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">源缓冲</text><rect x="126" y="115" width="223.57142857142858" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="237.78571428571428" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">发送占用</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">目的缓冲</text><rect x="126" y="157" width="536.5714285714286" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="394.2857142857143" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">占用到消费者读完</text><text x="116" y="219" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">消费者读取</text><rect x="483.7142857142857" y="199" width="178.85714285714286" height="32" rx="3" fill="var(--line-soft)" stroke="var(--line)"/><text x="573.1428571428571" y="218" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">读取区间</text><line x1="126" y1="242" x2="752" y2="242" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="278" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">时间 / μs</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">图中 6 μs 处标出提前覆盖目的地址的错误操作，它落在消费者读取之前，会让消费者读到下一份数据。</text>
</svg>