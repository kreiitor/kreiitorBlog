<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">KV 组数与状态容量</title>
  <desc id="fig-desc">三根柱：MHA 32 组为 4,608.00 MiB，GQA 8 组为 1,152.00 MiB，MQA 1 组为 144.00 MiB</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="258" x2="750" y2="258" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="262" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">2000</text><line x1="74" y1="158" x2="750" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="162" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">4000</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">5000</text><rect x="151.66666666666669" y="127.6" width="68" height="230.4" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="186.66666666666669" y="121.6" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">4608</text><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">MHA 32 组</text><rect x="377.00000000000006" y="300.4" width="68" height="57.6" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="412.00000000000006" y="294.4" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">1152</text><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">GQA 8 组</text><rect x="602.3333333333334" y="350.8" width="68" height="7.2" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="637.3333333333334" y="344.8" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">144</text><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">MQA 1 组</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">KV 组数</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">8K 上下文状态容量（MiB）</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">容量</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">固定 8192 个上下文 token 与 BF16；实际模型采用 GQA，其余两柱用于分析共享比例。</text>
</svg>