<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">8K 输入的一次训练预算</title>
  <desc id="fig-desc">四根柱依次为前向 143.789、反向 287.579、前向加反向 431.368，以及按 6ND 估算的 402.591 TFLOPs</desc>
