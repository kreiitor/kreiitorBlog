<svg xmlns="http://www.w3.org/2000/svg" width="800" height="231" viewBox="0 68 800 231" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">缺失报文重传后的交付</title>
  <desc id="fig-desc">序号 0 丢失后等待重传，其余七个报文保留在接收方；只补发缺失报文，约 21.2 μs 后全部可交付</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0</text><line x1="268.27272727272725" y1="96" x2="268.27272727272725" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="268.27272727272725" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">5</text><line x1="410.54545454545456" y1="96" x2="410.54545454545456" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="410.54545454545456" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">10</text><line x1="552.8181818181818" y1="96" x2="552.8181818181818" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="552.8181818181818" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">15</text><line x1="695.0909090909091" y1="96" x2="695.0909090909091" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="695.0909090909091" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">20</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">22</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">其余七个报文</text><rect x="126" y="115" width="28.454545454545457" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="140.22727272727272" y="134" font-size="8" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">到达并…</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">缺失报文 0</text><rect x="126" y="157" width="597.5454545454546" height="32" rx="3" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)"/><text x="424.7727272727273" y="176" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">等待重传</text><rect x="723.5454545454546" y="157" width="5.690909090909071" height="32" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">时间 / μs</text><text x="400" y="273" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">重传等待时间采用算例给定值；横线表示到达后等待缺口补齐的区间。</text>
</svg>