<svg xmlns="http://www.w3.org/2000/svg" width="800" height="231" viewBox="0 68 800 231" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">缺失报文重传后的交付</title>
  <desc id="fig-desc">序号 0 丢失后等待重传，其余七个报文保留在接收方；只补发缺失报文，约 21.2 μs 后全部可交付</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">0</text><line x1="268.27272727272725" y1="96" x2="268.27272727272725" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="268.27272727272725" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">5</text><line x1="410.54545454545456" y1="96" x2="410.54545454545456" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="410.54545454545456" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">10</text><line x1="552.8181818181818" y1="96" x2="552.8181818181818" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="552.8181818181818" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">15</text><line x1="695.0909090909091" y1="96" x2="695.0909090909091" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="695.0909090909091" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">20</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">22</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">其余七个报文</text><rect x="126" y="115" width="28.454545454545457" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="140.22727272727272" y="134" font-size="8" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">到达并…</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">缺失报文 0</text><rect x="126" y="157" width="597.5454545454546" height="32" rx="3" fill="var(--line-soft,#dce1e8)" stroke="var(--line,#a2aec1)"/><text x="424.7727272727273" y="176" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">等待重传</text><rect x="723.5454545454546" y="157" width="5.690909090909071" height="32" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">时间 / μs</text><text x="400" y="273" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">重传等待时间采用算例给定值；横线表示到达后等待缺口补齐的区间。</text>
</svg>