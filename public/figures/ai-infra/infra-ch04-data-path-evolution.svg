<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 64 800 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">数据通路的三代变化</title>
  <desc id="fig-desc">三栏从左到右为 Ampere 异步拷贝、Hopper TMA 搬移、Blackwell SM100 TMA 搬移；前两代画共享内存到矩阵单元再到寄存器，Blackwell 画共享内存到矩阵单元再到 TMEM</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="34" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="151.33333333333331" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Ampere 异步拷贝</text><text x="151.33333333333331" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">全局内存 → 共享内存</text><text x="46" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">省去寄存器中转</text><text x="46" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">共享内存 → 矩阵单元 → 寄存器</text><rect x="282.66666666666663" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/><text x="399.99999999999994" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Hopper TMA</text><text x="399.99999999999994" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">描述符生成多维地址</text><text x="294.66666666666663" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">配合异步矩阵执行</text><text x="294.66666666666663" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">共享内存 → 矩阵单元 → 寄存器</text><rect x="531.3333333333333" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="648.6666666666666" y="118" font-size="14" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">Blackwell SM100</text><text x="648.6666666666666" y="136" font-size="10.5" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">TMA 搬移</text><text x="543.3333333333333" y="174" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="174" font-size="11.5" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="start">累加结果放入 TMEM</text><text x="543.3333333333333" y="195.95" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="195.95" font-size="11.5" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="start">共享内存 → 矩阵单元 → TMEM</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line,#c9b49c)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">更多软件安排</text><text x="730" y="400" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">更多专用部件</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">输入块 32 KiB；输出累加状态 64 KiB；蓝色表示数据存储与搬移，橙色表示矩阵计算，紫色表示累加结果。</text>
</svg>