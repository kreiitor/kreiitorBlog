<svg xmlns="http://www.w3.org/2000/svg" width="800" height="237" viewBox="0 68 800 237" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">路径时延不等时的缺口等待</title>
  <desc id="fig-desc">快路径传播 1 μs 后到达，但前方缺口未补齐，持续等待到约 9.33 μs；第二条路径传播 9 μs，到达后补齐缺口，应用才能交付</desc>
