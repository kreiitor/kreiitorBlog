 cy="358" r="3.2" fill="var(--muted,#5f4f3c)"/><polyline points="74,272.23780995549873 299.33333333333337,272.23780995549873 524.6666666666667,272.23780995549873 750,272.23780995549873" fill="none" stroke="var(--muted,#5f4f3c)" stroke-width="2.4"/><circle cx="74" cy="272.23780995549873" r="3.2" fill="var(--muted,#5f4f3c)"/><circle cx="299.33333333333337" cy="272.23780995549873" r="3.2" fill="var(--muted,#5f4f3c)"/><circle cx="524.6666666666667" cy="272.23780995549873" r="3.2" fill="var(--muted,#5f4f3c)"/><circle cx="750" cy="272.23780995549873" r="3.2" fill="var(--muted,#5f4f3c)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">同时生成的请求数（对数刻度）</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">GiB / 输出 token</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">2K 上下文</text><rect x="148.55" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="163.55" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">8K 上下文</text><rect x="215.10000000000002" y="86" width="10" height="10" fill="var(--muted,#5f4f3c)"/><text x="230.10000000000002" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">2K KV 读取</text><rect x="286.20000000000005" y="86" width="10" height="10" fill="var(--muted,#5f4f3c)"/><text x="301.20000000000005" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">8K KV 读取</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">Qwen3-8B、BF16；每份矩阵权重每轮读取一次，各请求的 KV 独立。</text>
</svg>