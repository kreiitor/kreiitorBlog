<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">批处理摊薄权重读取</title>
  <desc id="fig-desc">双对数折线图：batch 从 1 增到 64 时，2K 上下文每输出 token 读取量从 14.38 GiB 降到 0.50 GiB，8K 从 15.22 GiB 降到 1.35 GiB；两条水平线分别标出 0.28125 GiB 与 1.125 GiB 的 KV 读取量</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="74" y1="279.5243800890026" x2="750" y2="279.5243800890026" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="283.5243800890026" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">1</text><line x1="74" y1="137.07646579505354" x2="750" y2="137.07646579505354" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="141.07646579505354" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">10</text><polyline points="74,114.60404151634103 299.33333333333337,196.7728289427475 524.6666666666667,270.34247396404623 750,322.4054751112532" fill="none" stroke="var(--blue)" stroke-width="2.4"/><circle cx="74" cy="114.60404151634103" r="3.2" fill="var(--blue)"/><circle cx="299.33333333333337" cy="196.7728289427475" r="3.2" fill="var(--blue)"/><circle cx="524.6666666666667" cy="270.34247396404623" r="3.2" fill="var(--blue)"/><circle cx="750" cy="322.4054751112532" r="3.2" fill="var(--blue)"/><polyline points="74,111.0918790190957 299.33333333333337,184.4470990604912 524.6666666666667,236.33473408730555 750,260.95860660481856" fill="none" stroke="var(--yellow)" stroke-width="2.4"/><circle cx="74" cy="111.0918790190957" r="3.2" fill="var(--yellow)"/><circle cx="299.33333333333337" cy="184.4470990604912" r="3.2" fill="var(--yellow)"/><circle cx="524.6666666666667" cy="236.33473408730555" r="3.2" fill="var(--yellow)"/><circle cx="750" cy="260.95860660481856" r="3.2" fill="var(--yellow)"/><polyline points="74,358 299.33333333333337,358 524.6666666666667,358 750,358" fill="none" stroke="var(--muted)" stroke-width="2.4"/><circle cx="74" cy="358" r="3.2" fill="var(--muted)"/><circle cx="299.33333333333337" cy="358" r="3.2" fill="var(--muted)"/><circle cx="524.6666666666667" cy="358" r="3.2" fill="var(--muted)"/><circle cx="750" cy="358" r="3.2" fill="var(--muted)"/><polyline points="74,272.23780995549873 299.33333333333337,272.23780995549873 524.6666666666667,272.23780995549873 750,272.23780995549873" fill="none" stroke="var(--muted)" stroke-width="2.4"/><circle cx="74" cy="272.23780995549873" r="3.2" fill="var(--muted)"/><circle cx="299.33333333333337" cy="272.23780995549873" r="3.2" fill="var(--muted)"/><circle cx="524.6666666666667" cy="272.23780995549873" r="3.2" fill="var(--muted)"/><circle cx="750" cy="272.23780995549873" r="3.2" fill="var(--muted)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">同时生成的请求数（对数刻度）</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">GiB / 输出 token</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">2K 上下文</text><rect x="148.55" y="86" width="10" height="10" fill="var(--yellow)"/><text x="163.55" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">8K 上下文</text><rect x="215.10000000000002" y="86" width="10" height="10" fill="var(--muted)"/><text x="230.10000000000002" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">2K KV 读取</text><rect x="286.20000000000005" y="86" width="10" height="10" fill="var(--muted)"/><text x="301.20000000000005" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">8K KV 读取</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">Qwen3-8B、BF16；每份矩阵权重每轮读取一次，各请求的 KV 独立。</text>
</svg>