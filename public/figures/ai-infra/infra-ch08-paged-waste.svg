idth="70" height="234.375" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue-soft,#e8f0e2)"/><rect x="630.5" y="108" width="70" height="15.625" fill="var(--surface,#fffcf5)" stroke="var(--surface,#fffcf5)"/><text x="665.5" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">D（15）</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">请求</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">可保存 token 容量</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue-soft,#e8f0e2)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">已用</text><rect x="130" y="86" width="10" height="10" fill="var(--surface,#fffcf5)"/><text x="145" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">块尾未用</text></svg>