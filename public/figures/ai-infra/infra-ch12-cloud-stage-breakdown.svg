dle">上传 20 s</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">期限</text><rect x="126" y="157" width="433.38461538461536" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="342.6923076923077" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">45 s 期限</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">二十轮完成时间 / s</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">三图共用同一横轴与 45 秒期限线；每段是二十轮同类工作的合计。</text>
