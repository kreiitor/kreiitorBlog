<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 64 800 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">批内共享权重与独立 KV</title>
  <desc id="fig-desc">横轴为批内请求数（约 0 到 60），纵轴为逻辑读取量（GiB，0 到 70）；权重读取是水平线，8K token KV 从原点随请求数线性上升，两线在请求数约 13 处相交</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="34" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/><text x="151.33333333333331" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">权重组</text><text x="151.33333333333331" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">每批读取一次</text><text x="46" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">不随请求数变化</text><text x="46" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">按整个 decode batch 计量</text><rect x="282.66666666666663" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/><text x="399.99999999999994" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">KV 组</text><text x="399.99999999999994" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">每请求一份上下文</text><text x="294.66666666666663" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">随请求数线性上升</text><text x="294.66666666666663" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">固定每请求 8K 上下文</text><rect x="531.3333333333333" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="648.6666666666666" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">交点</text><text x="648.6666666666666" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">请求数约 13</text><text x="543.3333333333333" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">两组逻辑读取量相等</text><text x="543.3333333333333" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">对应例题的 B*</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line,#a2aec1)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">请求少</text><text x="730" y="400" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">请求多</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">交点对应例题算出的 B*；逻辑读取量分别累计共享权重与独立 KV。</text>
</svg>