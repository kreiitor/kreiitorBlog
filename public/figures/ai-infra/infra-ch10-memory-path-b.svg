<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">先释放训练状态的显存峰值</title>
  <desc id="fig-desc">折线图：按训练结束、只加载权重、释放训练状态、开始生成的顺序，显存占用从约 44 GiB 升到 59.3 GiB，降到 19.3 GiB，再升到 43.3 GiB；74.5 GiB 为 H100 SXM 容量线</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">25</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">50</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">75</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">100</text><polyline points="74,248 299.33333333333337,209.75 524.6666666666667,309.75 750,249.75" fill="none" stroke="var(--blue)" stroke-width="2.4"/><circle cx="74" cy="248" r="3.2" fill="var(--blue)"/><circle cx="299.33333333333337" cy="209.75" r="3.2" fill="var(--blue)"/><circle cx="524.6666666666667" cy="309.75" r="3.2" fill="var(--blue)"/><circle cx="750" cy="249.75" r="3.2" fill="var(--blue)"/><polyline points="74,171.75 299.33333333333337,171.75 524.6666666666667,171.75 750,171.75" fill="none" stroke="var(--yellow)" stroke-width="2.4"/><circle cx="74" cy="171.75" r="3.2" fill="var(--yellow)"/><circle cx="299.33333333333337" cy="171.75" r="3.2" fill="var(--yellow)"/><circle cx="524.6666666666667" cy="171.75" r="3.2" fill="var(--yellow)"/><circle cx="750" cy="171.75" r="3.2" fill="var(--yellow)"/><text x="74" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">训练结束</text><text x="299.33333333333337" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">只加载权重</text><text x="524.6666666666667" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">释放训练状态</text><text x="750" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">开始生成</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">操作顺序</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">显存占用 / GiB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">显存占用</text><rect x="144" y="86" width="10" height="10" fill="var(--yellow)"/><text x="159" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">H100 SXM 74.5 GiB</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">两图共用 74.5 GiB 容量线与同一纵轴；两条路径最终状态相同。</text>
</svg>