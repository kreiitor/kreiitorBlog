<svg xmlns="http://www.w3.org/2000/svg" width="800" height="231" viewBox="0 68 800 231" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">逐流交付的等待</title>
  <desc id="fig-desc">音频在第 3 秒收齐后立即交给应用；图片第 7 秒收齐并交付；两条流互不等待</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">0</text><line x1="282.5" y1="96" x2="282.5" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="282.5" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">2</text><line x1="439" y1="96" x2="439" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="439" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">4</text><line x1="595.5" y1="96" x2="595.5" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="595.5" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">6</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">8</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">音频</text><rect x="126" y="115" width="234.75" height="32" rx="3" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)"/><text x="243.375" y="134" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">接收中</text><rect x="360.75" y="115" width="391.25" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="556.375" y="134" font-size="9.5" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">第 3 s 交付</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">图片</text><rect x="126" y="157" width="547.75" height="32" rx="3" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)"/><text x="399.875" y="176" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">接收中</text><rect x="673.75" y="157" width="78.25" height="32" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="712.875" y="176" font-size="9.5" fill="var(--on-yellow,#202735)" font-weight="600" text-anchor="middle">第 7 s 交付</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">数据交给应用的时刻 / s</text><text x="400" y="273" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">两图的发送、到达与恢复时刻相同，区别只在不同流之间是否相互等待。</text>
</svg>