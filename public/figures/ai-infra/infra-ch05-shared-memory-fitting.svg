<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">共享内存中的输出块工作集</title>
  <desc id="fig-desc">堆叠条形：四份 64×64 工作集占 96 KiB，加 4 KiB 预留后填满 100 KB；一份 128×128 工作集占 80 KiB，加 1 KiB 预留后余约 19 KiB</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">25</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">50</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">75</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">100</text><rect x="208" y="118" width="70" height="240" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="208" y="108" width="70" height="10" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><rect x="208" y="108" width="70" height="0" fill="var(--muted,#5f4f3c)" stroke="var(--muted,#5f4f3c)"/><text x="243" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">四份 64×64</text><rect x="546" y="158" width="70" height="200" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="546" y="155.5" width="70" height="2.5" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><rect x="546" y="108" width="70" height="47.5" fill="var(--muted,#5f4f3c)" stroke="var(--muted,#5f4f3c)"/><text x="581" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">一份 128×128</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">工作集</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">共享内存 / KiB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">工作集</text><rect x="137" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="152" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">预留</text><rect x="185" y="86" width="10" height="10" fill="var(--muted,#5f4f3c)"/><text x="200" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">空余</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">总容量为 RTX PRO 6000 一个 SM 的 100 KB 共享内存。</text>
</svg>