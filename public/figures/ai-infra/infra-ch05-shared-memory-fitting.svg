<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">共享内存中的输出块工作集</title>
  <desc id="fig-desc">堆叠条形：四份 64×64 工作集占 96 KiB，加 4 KiB 预留后填满 100 KB；一份 128×128 工作集占 80 KiB，加 1 KiB 预留后余约 19 KiB</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">共享内存中的输出块工作集</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">四份 24 KiB 加预留恰好放满 100 KB</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">25</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">50</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">75</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">100</text><rect x="208" y="118" width="70" height="240" fill="var(--blue)" stroke="var(--blue)"/><rect x="208" y="108" width="70" height="10" fill="var(--yellow)" stroke="var(--yellow)"/><rect x="208" y="108" width="70" height="0" fill="var(--muted)" stroke="var(--muted)"/><text x="243" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">四份 64×64</text><rect x="546" y="158" width="70" height="200" fill="var(--blue)" stroke="var(--blue)"/><rect x="546" y="155.5" width="70" height="2.5" fill="var(--yellow)" stroke="var(--yellow)"/><rect x="546" y="108" width="70" height="47.5" fill="var(--muted)" stroke="var(--muted)"/><text x="581" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">一份 128×128</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">工作集</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">共享内存 / KiB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">工作集</text><rect x="137" y="86" width="10" height="10" fill="var(--yellow)"/><text x="152" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">预留</text><rect x="185" y="86" width="10" height="10" fill="var(--muted)"/><text x="200" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">空余</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">总容量为 RTX PRO 6000 一个 SM 的 100 KB 共享内存。</text>
</svg>