<svg xmlns="http://www.w3.org/2000/svg" width="800" height="384" viewBox="0 60 800 384" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">GPU 片上存储与数据通路</title>
  <desc id="fig-desc">两组 GPC 各含三个 SM 与共享内存；GPC 0 内三个 SM 组成线程块簇，可直接访问彼此的共享内存；所有 SM 经片上交叉互连连接到多个 L2 分片，再连接到显存控制器与显存；跨 SM 路径是一次写入 L2、一次从 L2 读回</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="80" y1="192.5" x2="180" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="180" y1="110" x2="280" y2="210.83333333333331" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="380" y1="110" x2="280" y2="210.83333333333331" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="280" y1="210.83333333333331" x2="280" y2="302.5" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="280" y1="302.5" x2="280" y2="210.83333333333331" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="280" y1="302.5" x2="280" y2="385" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><rect x="142" y="88" width="76" height="44" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="180" y="113.75" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">GPC 0</text>
  <rect x="342" y="88" width="76" height="44" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="380" y="113.75" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">GPC 1</text>
  <rect x="42" y="170.5" width="76" height="44" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="80" y="196.25" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">线程块簇</text>
  <rect x="242" y="188.83333333333331" width="76" height="44" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="280" y="214.58333333333331" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">片上交叉互连</text>
  <rect x="242" y="280.5" width="76" height="44" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="280" y="306.25" font-size="10" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">L2 分片 ×6</text>
  <rect x="242" y="363" width="76" height="44" rx="8" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="280" y="388.75" font-size="10" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">显存控制器</text>
  <text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">图中 SM、GPC 与 L2 分片数量仅表示结构；RTX PRO 6000 有 188 个 SM、128 MiB L2。</text>
</svg>