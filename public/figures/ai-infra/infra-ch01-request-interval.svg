<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">单个请求的输出间隔</title>
  <desc id="fig-desc">四根柱：同时请求数 1 时间隔 26.53 ms，4 时 26.97 ms，16 时 29.30 ms，64 时 40.48 ms</desc>
  <style>
