<svg xmlns="http://www.w3.org/2000/svg" width="800" height="278" viewBox="0 119 800 278" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">输出记录与 KV checkpoint 分开</title>
  <desc id="fig-desc">三条横向条带：已可靠记录的序列包含输入 8192 token、输出 1 到 1024、输出 1025；故障前保存的 KV 只覆盖输入 8192 token；恢复后继续生成先补算 1024 个 token 把 KV 推进到 9216，再处理输出 1025</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="40" y="147" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="179" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">已可靠记录</text><rect x="207.66666666666669" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="282.6666666666667" y="179" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">输入 8192 token</text><rect x="393.00000000000006" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468.00000000000006" y="179" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">输出 1–1024</text><rect x="578.3333333333334" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="653.3333333333334" y="179" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">输出 1025</text><rect x="40" y="213" width="720" height="58" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="54" y="245" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">故障前保存的 KV</text><rect x="254" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="329" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">输入 8192 token</text><rect x="532" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="607" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">生成部分尚未保存</text><rect x="40" y="279" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="311" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">恢复后继续生成</text><rect x="194" y="288" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="259.5" y="311" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">输入 8192 token</text><rect x="333" y="288" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="398.5" y="311" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">输出 1–1024</text><rect x="472" y="288" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="537.5" y="311" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">输出 1025</text><rect x="611" y="288" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="676.5" y="304.4" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">补算 1024 token →</text><text x="676.5" y="319.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">KV 9216</text><text x="400" y="371" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">假定 1025 个输出均已可靠记录；分段宽度不按 token 数量比例绘制。</text>
</svg>