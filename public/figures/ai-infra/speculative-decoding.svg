<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">推测解码的草稿、验证与回退</title>
  <desc id="fig-desc">草稿序列 a、b、c、d 由目标模型一次验证；前两个匹配，第三位改为 x，第四个草稿及其后续结果作废，本轮输出三个 token。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink)}
    .sub{font-size:14px;fill:var(--muted)}
    .h{font-size:16px;font-weight:700;fill:var(--ink)}
    .b{font-size:13px;font-weight:600;fill:var(--ink)}
    .s{font-size:12px;fill:var(--muted)}
    .tiny{font-size:11px;fill:var(--muted)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
    <marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--muted)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>

  <text x="60" y="118" class="b">草稿序列</text>
  <rect x="60" y="132" width="80" height="52" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="100" y="162" text-anchor="middle" class="b">a</text>
  <rect x="170" y="132" width="80" height="52" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="210" y="162" text-anchor="middle" class="b">b</text>
  <rect x="280" y="132" width="80" height="52" rx="7" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="2"/>
  <text x="320" y="162" text-anchor="middle" class="b">c</text>
  <rect x="390" y="132" width="80" height="52" rx="7" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="430" y="162" text-anchor="middle" class="b">d</text>

  <text x="60" y="238" class="b">目标模型验证</text>
  <rect x="60" y="252" width="80" height="52" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="100" y="282" text-anchor="middle" class="b">a</text>
  <rect x="170" y="252" width="80" height="52" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="210" y="282" text-anchor="middle" class="b">b</text>
  <rect x="280" y="252" width="80" height="52" rx="7" fill="var(--yellow)" stroke="var(--yellow)" stroke-width="2"/>
  <text x="320" y="282" text-anchor="middle" class="b">x</text>
  <rect x="390" y="252" width="80" height="52" rx="7" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="430" y="282" text-anchor="middle" class="tiny">作废</text>

  <path d="M100 184 L100 252" stroke="var(--blue)" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M210 184 L210 252" stroke="var(--blue)" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M320 184 L320 252" stroke="var(--blue)" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M430 184 L430 252" stroke="var(--muted)" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="332" y="225" class="tiny">c ≠ x</text>

  <text x="60" y="360" class="b">本轮最终输出</text>
  <rect x="60" y="374" width="80" height="46" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="100" y="402" text-anchor="middle" class="b">a</text>
  <rect x="170" y="374" width="80" height="46" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="210" y="402" text-anchor="middle" class="b">b</text>
  <rect x="280" y="374" width="80" height="46" rx="7" fill="var(--yellow)" stroke="var(--yellow)" stroke-width="2"/>
  <text x="320" y="402" text-anchor="middle" class="b">x</text>

  <path d="M100 304 L100 374" stroke="var(--blue)" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M210 304 L210 374" stroke="var(--blue)" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M320 304 L320 374" stroke="var(--blue)" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <text x="430" y="400" class="tiny">c、d 的 KV 一并丢弃</text>

  <rect x="530" y="108" width="240" height="250" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.8"/>
  <text x="548" y="136" class="b">读图要点</text>
  <text x="548" y="164" class="tiny">保留：a、b（与草稿匹配）</text>
  <text x="548" y="192" class="tiny">修正：第三位改为目标模型的 x</text>
  <text x="548" y="220" class="tiny">丢弃：c、d（依赖错误位置）</text>
  <line x1="548" y1="238" x2="752" y2="238" stroke="var(--line-soft)" stroke-width="1"/>
  <text x="548" y="264" class="b">一次验证输出 3 个 token</text>
  <text x="548" y="290" class="tiny">下一轮从 a、b、x 继续生成</text>
  <text x="548" y="318" class="tiny">全部接受时，末尾还能多送一个</text>
  <text x="548" y="340" class="tiny">验证成本接近一次普通 decode</text>

  <rect x="30" y="420" width="740" height="22" rx="5" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1.2"/>
  <text x="400" y="435" text-anchor="middle" class="tiny">随机采样时需按 min(1, p/q) 接受，并在拒绝后从正差额分布重采，才能保持目标分布。</text>
</svg>
