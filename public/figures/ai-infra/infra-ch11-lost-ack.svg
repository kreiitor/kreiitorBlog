<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 158 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">操作已提交但确认丢失</title>
  <desc id="fig-desc">控制器与外部系统之间：外部系统已执行并提交操作 K，确认消息丢失；控制器恢复后先按操作标识 K 查询结果，再决定是否继续</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="109.5" y="186" width="210" height="112" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="214.5" y="238.75" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">控制器</text>
  <text x="214.5" y="255" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">持有操作标识 K</text><rect x="480.5" y="186" width="210" height="112" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="585.5" y="238.75" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">外部系统</text>
  <text x="585.5" y="255" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">已执行并提交</text><path d="M319.5 242 L480.5 242" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M480.5 242 L319.5 242" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M319.5 242 L480.5 242" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/></svg>