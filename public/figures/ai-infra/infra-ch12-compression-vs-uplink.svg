<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">压缩收益随上行速率变化</title>
  <desc id="fig-desc">三种方案随上行速率变化的对照：原方案与处理快十倍几乎重合；输入减半在低上行速率段明显更低，到 800 Mbit/s 附近收益归零</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">压缩收益随上行速率变化</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">原方案、处理快十倍、输入减半三条曲线</text><rect x="34" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="151.33333333333331" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">原方案</text><text x="151.33333333333331" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">上传 30 MB</text><text x="46" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">处理 0.3 秒</text><text x="46" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">曲线随上行速率上升而下降</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">与处理加速几乎重合</text><rect x="282.66666666666663" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="399.99999999999994" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">处理快十倍</text><text x="399.99999999999994" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">处理 0.03 秒</text><text x="294.66666666666663" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">计算只占约 2.3%</text><text x="294.66666666666663" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">曲线与原方案几乎重合</text><text x="294.66666666666663" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">总时间改善很小</text><rect x="531.3333333333333" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/><text x="648.6666666666666" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">输入减半</text><text x="648.6666666666666" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">上传 15 MB</text><text x="543.3333333333333" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">额外 0.15 秒编解码</text><text x="543.3333333333333" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">低上行速率段明显更低</text><text x="543.3333333333333" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">800 Mbit/s 附近收益归零</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">低上行速率</text><text x="730" y="400" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="end">高上行速率</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">条件：原图 30 MB、成片 5 MB、下行 100 Mbit/s、RTT 0.1 秒、处理 0.3 秒；压缩方案增加 0.15 秒编解码。</text>
</svg>