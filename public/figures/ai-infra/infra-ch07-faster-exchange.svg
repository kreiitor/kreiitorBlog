<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">交换缩短到 0.2 ms</title>
  <desc id="fig-desc">参与者 0、1、2 仍从 0 ms 等待到 2 ms，参与者 3 在 2 ms 就绪；交换时间从 0.4 ms 减到 0.2 ms，全组在 2.2 ms 完成</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">交换缩短到 0.2 ms</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">就绪时刻不变，全组从 2.4 ms 提前到 2.2 ms</text><line x1="126" y1="96" x2="126" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="251.2" y1="96" x2="251.2" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="251.2" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0.5</text><line x1="376.4" y1="96" x2="376.4" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="376.4" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">1</text><line x1="501.59999999999997" y1="96" x2="501.59999999999997" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="501.59999999999997" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">1.5</text><line x1="626.8" y1="96" x2="626.8" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="626.8" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">2</text><line x1="752" y1="96" x2="752" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">2.5</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">参与者 0</text><rect x="126" y="115" width="500.8" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="376.4" y="134" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">等待</text><rect x="626.8" y="115" width="50.08000000000004" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="651.8399999999999" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">交换</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">参与者 1</text><rect x="126" y="157" width="500.8" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="376.4" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">等待</text><rect x="626.8" y="157" width="50.08000000000004" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="651.8399999999999" y="176" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">交换</text><text x="116" y="219" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">参与者 2</text><rect x="126" y="199" width="500.8" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="376.4" y="218" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">等待</text><rect x="626.8" y="199" width="50.08000000000004" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="651.8399999999999" y="218" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">交换</text><text x="116" y="261" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">参与者 3</text><rect x="126" y="241" width="500.8" height="32" rx="3" fill="var(--line-soft)" stroke="var(--line)"/><text x="376.4" y="260" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">尚未就绪</text><rect x="626.8" y="241" width="50.08000000000004" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="651.8399999999999" y="260" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">交换</text><line x1="126" y1="284" x2="752" y2="284" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="320" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">时间 / ms</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">灰色为尚未就绪，橙色为等待其他参与者，蓝色为交换。</text>
</svg>