<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">小块阵列的复用形状</title>
  <desc id="fig-desc">三行输入 A0、A1、A2 沿行方向传递，三列权重 W0、W1、W2 沿列方向传递；3 × 3 个乘加单元各自保留部分和并继续累加</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">小块阵列的复用形状</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">输入沿行传递，权重沿列传递，部分和留在本地</text><rect x="40" y="147" width="720" height="58" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="179" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">输入</text><rect x="254" y="156" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="329" y="179" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">A0、A1、A2</text><rect x="532" y="156" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="607" y="179" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">沿行方向传递</text><rect x="40" y="213" width="720" height="58" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="54" y="245" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">权重</text><rect x="254" y="222" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="329" y="245" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">W0、W1、W2</text><rect x="532" y="222" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="607" y="245" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">沿列方向传递</text><rect x="40" y="279" width="720" height="58" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="311" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">乘加阵列</text><rect x="254" y="288" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="329" y="311" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">3 × 3 个乘加单元</text><rect x="532" y="288" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="607" y="311" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">每个单元保留自己的部分和</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">每个格子是一个乘加单元；输入与权重在相邻单元之间传递。</text>
</svg>