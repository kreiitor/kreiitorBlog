<svg xmlns="http://www.w3.org/2000/svg" width="800" height="344" viewBox="0 68 800 344" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">专家并行的全交换</title>
  <desc id="fig-desc">两张卡各持有四个专家：卡 0 有 E0–E3，卡 1 有 E4–E7。注意力和路由在 token 所在卡完成；All-to-All dispatch 把输入按专家所在卡重排发送，专家计算后再用 All-to-All 把结果送回并按路由权重合并</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="109.5" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="214.5" y="130.08333333333334" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">卡 0</text>
  <text x="214.5" y="146.33333333333334" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">token · 注意力/路由</text><rect x="480.5" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="585.5" y="130.08333333333334" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">专家 E0–E3</text>
  <text x="585.5" y="146.33333333333334" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">本卡执行</text><rect x="109.5" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="214.5" y="238.75000000000003" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">卡 1</text>
  <text x="214.5" y="255.00000000000003" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">token · 注意力/路由</text><rect x="480.5" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="585.5" y="238.75000000000003" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">专家 E4–E7</text>
  <text x="585.5" y="255.00000000000003" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">本卡执行</text><rect x="109.5" y="313.33333333333337" width="210" height="74.66666666666667" rx="8" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="214.5" y="347.4166666666667" font-size="13" fill="var(--on-yellow,#202735)" font-weight="700" text-anchor="middle">All-to-All dispatch</text>
  <text x="214.5" y="363.6666666666667" font-size="12" fill="var(--on-yellow,#202735)" font-weight="400" text-anchor="middle">按专家所在卡发送</text><rect x="480.5" y="313.33333333333337" width="210" height="74.66666666666667" rx="8" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="585.5" y="347.4166666666667" font-size="13" fill="var(--on-yellow,#202735)" font-weight="700" text-anchor="middle">All-to-All 返回</text>
  <text x="585.5" y="363.6666666666667" font-size="12" fill="var(--on-yellow,#202735)" font-weight="400" text-anchor="middle">按路由权重合并</text><path d="M214.5 170.66666666666669 L214.5 242.00000000000003 L214.5 242.00000000000003 L214.5 313.33333333333337" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M214.5 279.33333333333337 L214.5 296.33333333333337 L214.5 296.33333333333337 L214.5 313.33333333333337" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M214.5 313.33333333333337 L214.5 242.00000000000003 L585.5 242.00000000000003 L585.5 170.66666666666669" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M214.5 313.33333333333337 L214.5 296.33333333333337 L585.5 296.33333333333337 L585.5 279.33333333333337" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M585.5 170.66666666666669 L585.5 242.00000000000003 L585.5 242.00000000000003 L585.5 313.33333333333337" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M585.5 279.33333333333337 L585.5 296.33333333333337 L585.5 296.33333333333337 L585.5 313.33333333333337" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M585.5 313.33333333333337 L585.5 242.00000000000003 L214.5 242.00000000000003 L214.5 170.66666666666669" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M585.5 313.33333333333337 L585.5 296.33333333333337 L214.5 296.33333333333337 L214.5 279.33333333333337" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/></svg>