<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 68 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">固定窗口下的停等周期</title>
  <desc id="fig-desc">发送端时间轴交替出现 25.6 ms 的发送段和 100 ms 的等待段；每批完整周期 125.6 ms，等待期间链路空闲</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="126" y1="96" x2="126" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="126" y="174" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0</text><line x1="304.8571428571429" y1="96" x2="304.8571428571429" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="304.8571428571429" y="174" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">100</text><line x1="483.7142857142857" y1="96" x2="483.7142857142857" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="483.7142857142857" y="174" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">200</text><line x1="662.5714285714286" y1="96" x2="662.5714285714286" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="662.5714285714286" y="174" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">300</text><line x1="752" y1="96" x2="752" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="752" y="174" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">350</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">发送端</text><rect x="126" y="115" width="45.78742857142858" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="148.89371428571428" y="134" font-size="8" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">发 25.…</text><rect x="171.78742857142856" y="115" width="178.85714285714286" height="32" rx="3" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)"/><text x="261.216" y="134" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">等整批确认 100 ms</text><rect x="350.6445714285714" y="115" width="45.787428571428556" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="373.5382857142857" y="134" font-size="8" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">发 25.…</text><rect x="396.432" y="115" width="178.85714285714286" height="32" rx="3" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)"/><text x="485.86057142857146" y="134" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">等整批确认 100 ms</text><rect x="575.2891428571428" y="115" width="45.78742857142861" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="598.1828571428571" y="134" font-size="8" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">发 25.…</text><rect x="621.0765714285715" y="115" width="130.92342857142856" height="32" rx="3" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)"/><text x="686.5382857142857" y="134" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">等待确认</text><line x1="126" y1="158" x2="752" y2="158" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="194" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">时间 / ms</text><text x="400" y="231" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">固定窗口 64 KB，链路 20 Mbit/s；接收方收齐一批后统一确认，从发完到收到整批确认需 100 ms。</text>
</svg>