><text x="373.5382857142857" y="134" font-size="8" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">发 25.…</text><rect x="396.432" y="115" width="178.85714285714286" height="32" rx="3" fill="var(--line-soft,#dce1e8)" stroke="var(--line,#a2aec1)"/><text x="485.86057142857146" y="134" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">等整批确认 100 ms</text><rect x="575.2891428571428" y="115" width="45.78742857142861" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="598.1828571428571" y="134" font-size="8" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">发 25.…</text><rect x="621.0765714285715" y="115" width="130.92342857142856" height="32" rx="3" fill="var(--line-soft,#dce1e8)" stroke="var(--line,#a2aec1)"/><text x="686.5382857142857" y="134" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">等待确认</text><line x1="126" y1="158" x2="752" y2="158" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="194" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">时间 / ms</text><text x="400" y="231" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">固定窗口 64 KB，链路 20 Mbit/s；接收方收齐一批后统一确认，从发完到收到整批确认需 100 ms。</text>
</svg>