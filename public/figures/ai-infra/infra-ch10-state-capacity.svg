14285714286" width="70" height="58.57142857142857" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><rect x="546" y="182.28571428571428" width="70" height="58.57142857142857" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow-soft,#fbf3d9)"/><rect x="546" y="123.71428571428572" width="70" height="58.57142857142857" fill="var(--surface,#fffcf5)" stroke="var(--surface,#fffcf5)"/><text x="581" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">训练状态</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">状态类别</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">容量 / GB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">BF16 权重</text><rect x="149.25" y="86" width="10" height="10" fill="var(--blue-soft,#e8f0e2)"/><text x="164.25" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">BF16 梯度</text><rect x="216.5" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="231.5" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">FP32 主权重</text><rect x="290.75" y="86" width="10" height="10" fill="var(--yellow-soft,#fbf3d9)"/><text x="305.75" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">一阶矩</text><rect x="345.75" y="86" width="10" height="10" fill="var(--surface,#fffcf5)"/><text x="360.75" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">二阶矩</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">权重与梯度为 BF16，主权重与两份 Adam 矩状态为 FP32；推理侧只保留一份 BF16 权重。</text>
