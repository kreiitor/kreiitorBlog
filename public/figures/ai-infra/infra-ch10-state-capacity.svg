<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">训练状态容量构成</title>
  <desc id="fig-desc">堆叠柱状图：左侧推理权重为 16.4 GB；右侧训练状态自下而上为 BF16 权重 16.4 GB、BF16 梯度 16.4 GB、FP32 主权重 32.8 GB、一阶矩 32.8 GB、二阶矩 32.8 GB，合计约 131 GB</desc>
  <style>
