<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">应用行为的表达方式与执行路径</title>
  <desc id="fig-desc">左右两栏对比：传统应用自下而上依次是代码与数据、编译器与操作系统、程序指令的执行、处理器内存与互联；模型驱动应用依次是 Agent、模型接口、计算输出与上下文状态、加速器内存与互联，工具执行仍回到操作系统路径</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">应用行为的表达方式与执行路径</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">传统应用与模型驱动应用共用底层硬件，多出模型接口</text><rect x="34" y="92" width="359" height="300" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="213.5" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">传统应用</text><text x="213.5" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">直接编译执行</text><text x="46" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">代码与数据</text><text x="46" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">编译器与操作系统</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">程序指令的执行</text><text x="46" y="239.84999999999997" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="239.84999999999997" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">处理器、内存与互联</text><rect x="407" y="92" width="359" height="300" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="586.5" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">模型驱动应用</text><text x="586.5" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">经模型接口调用</text><text x="419" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">Agent</text><text x="419" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">模型接口</text><text x="419" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">计算输出、保存上下文状态</text><text x="419" y="239.84999999999997" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="239.84999999999997" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">加速器、内存与互联</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">实线表示向下的执行依赖；虚线表示工具执行仍需传统操作系统。</text>
</svg>