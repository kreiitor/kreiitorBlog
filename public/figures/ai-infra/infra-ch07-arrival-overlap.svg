<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">共享出口前的到达速率</title>
  <desc id="fig-desc">三根柱对比到达速率峰值：重叠 20 ms 时为 100 GB/s，重叠 5 ms 时仍为 100 GB/s，不重叠时为 50 GB/s；共享出口为 50 GB/s</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="244.36363636363637" x2="750" y2="244.36363636363637" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="248.36363636363637" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">50</text><line x1="74" y1="130.72727272727275" x2="750" y2="130.72727272727275" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="134.72727272727275" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">100</text><rect x="151.66666666666669" y="130.72727272727275" width="68" height="227.27272727272725" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="186.66666666666669" y="124.72727272727275" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">100</text><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">重叠 20 ms</text><rect x="377.00000000000006" y="130.72727272727275" width="68" height="227.27272727272725" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="412.00000000000006" y="124.72727272727275" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">100</text><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">重叠 5 ms</text><rect x="602.3333333333334" y="244.36363636363637" width="68" height="113.63636363636363" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="637.3333333333334" y="238.36363636363637" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">50</text><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">不重叠</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">两作业高峰的重叠方式</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">到达速率 / GB/s</text></g><rect x="82" y="86" width="10" height="10" fill="var(--yellow,#ffe04b)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">峰值到达</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">两作业每 100 ms 各发送 20 ms，单作业速率 50 GB/s；共享出口为 50 GB/s。重叠 5 ms 的峰值只持续 5 ms。</text>
</svg>