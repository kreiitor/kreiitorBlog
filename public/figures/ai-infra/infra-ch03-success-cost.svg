<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">成功任务成本对照</title>
  <desc id="fig-desc">两根柱分别表示原策略与新策略的每个成功任务成本：原策略 100 成本除以 50 次成功，得 2；新策略 200 成本除以 80 次成功，得 2.5</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="274.6666666666667" x2="750" y2="274.6666666666667" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="278.6666666666667" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">1</text><line x1="74" y1="191.33333333333334" x2="750" y2="191.33333333333334" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="195.33333333333334" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">2</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">3</text><rect x="208" y="191.33333333333334" width="68" height="166.66666666666666" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="243" y="185.33333333333334" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">2</text><text x="243" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">原策略</text><rect x="546" y="149.66666666666666" width="68" height="208.33333333333334" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="581" y="143.66666666666666" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">2.5</text><text x="581" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">新策略</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">策略</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">每成功任务成本</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">每成功任务成本</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">两种策略各尝试 100 次；成本单位为任意统一单位。</text>
</svg>