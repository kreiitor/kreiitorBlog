<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">成功任务成本对照</title>
  <desc id="fig-desc">两根柱分别表示原策略与新策略的每个成功任务成本：原策略 100 成本除以 50 次成功，得 2；新策略 200 成本除以 80 次成功，得 2.5</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">成功任务成本对照</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">各尝试 100 次，成本除以成功数</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="274.6666666666667" x2="750" y2="274.6666666666667" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="278.6666666666667" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">1</text><line x1="74" y1="191.33333333333334" x2="750" y2="191.33333333333334" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="195.33333333333334" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">2</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">3</text><rect x="208" y="191.33333333333334" width="68" height="166.66666666666666" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="243" y="185.33333333333334" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">2</text><text x="243" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">原策略</text><rect x="546" y="149.66666666666666" width="68" height="208.33333333333334" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="581" y="143.66666666666666" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">2.5</text><text x="581" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">新策略</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">策略</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">每成功任务成本</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">每成功任务成本</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">两种策略各尝试 100 次；成本单位为任意统一单位。</text>
</svg>