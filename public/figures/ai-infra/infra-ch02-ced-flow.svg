<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">CED 的全局 KV 与局部状态</title>
  <desc id="fig-desc">提示 token 经编码器 20 层得到编码器末层表示，投影为全局 KV 供解码器读取；提示末尾 128 个 token 还经解码器 20 层重放构建局部 SWA；新 token 经编码器与解码器输出</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="47.66666666666667" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="130.08333333333334" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">提示 token</text>
  <text x="152.66666666666669" y="146.33333333333334" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">大部分位置</text><rect x="295.00000000000006" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="130.08333333333334" font-size="13" fill="var(--on-blue)" font-weight="700" text-anchor="middle">编码器 20 层</text>
  <text x="400.00000000000006" y="146.33333333333334" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">主体计算</text><rect x="542.3333333333334" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="130.08333333333334" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">全局 KV</text>
  <text x="647.3333333333334" y="146.33333333333334" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">供解码器读取</text><rect x="47.66666666666667" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="238.75000000000003" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">解码器 20 层</text>
  <text x="152.66666666666669" y="255.00000000000003" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">读取全局 KV</text><rect x="295.00000000000006" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="238.75000000000003" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">提示末尾 ≤128</text>
  <text x="400.00000000000006" y="255.00000000000003" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">窗口位置</text><rect x="542.3333333333334" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--yellow)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="238.75000000000003" font-size="13" fill="var(--on-yellow)" font-weight="700" text-anchor="middle">解码器 20 层重放</text>
  <text x="647.3333333333334" y="255.00000000000003" font-size="12" fill="var(--on-yellow)" font-weight="400" text-anchor="middle">取编码器输出</text><rect x="47.66666666666667" y="313.33333333333337" width="210" height="74.66666666666667" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="347.4166666666667" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">局部 SWA</text>
  <text x="152.66666666666669" y="363.6666666666667" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">窗口内状态</text><rect x="295.00000000000006" y="313.33333333333337" width="210" height="74.66666666666667" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="347.4166666666667" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">新 token</text>
  <text x="400.00000000000006" y="363.6666666666667" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">编码器 → 解码器</text><path d="M257.6666666666667 133.33333333333334 L295.00000000000006 133.33333333333334" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 133.33333333333334 L542.3333333333334 133.33333333333334" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 170.66666666666669 L647.3333333333334 187.66666666666669 L152.66666666666669 187.66666666666669 L152.66666666666669 204.66666666666669" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 242.00000000000003 L542.3333333333334 242.00000000000003" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 279.33333333333337 L647.3333333333334 296.33333333333337 L152.66666666666669 296.33333333333337 L152.66666666666669 313.33333333333337" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M152.66666666666669 313.33333333333337 L152.66666666666669 296.33333333333337 L152.66666666666669 296.33333333333337 L152.66666666666669 279.33333333333337" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M400.00000000000006 170.66666666666669 L400.00000000000006 187.66666666666669 L152.66666666666669 187.66666666666669 L152.66666666666669 204.66666666666669" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M152.66666666666669 279.33333333333337 L152.66666666666669 296.33333333333337 L400.00000000000006 296.33333333333337 L400.00000000000006 313.33333333333337" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">新 token 仍通过全部 40 层；编码器与解码器各 20 层。</text>
</svg>