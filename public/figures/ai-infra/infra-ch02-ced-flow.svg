<svg xmlns="http://www.w3.org/2000/svg" width="800" height="376" viewBox="0 68 800 376" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">CED 的全局 KV 与局部状态</title>
  <desc id="fig-desc">提示 token 经编码器 20 层得到编码器末层表示，投影为全局 KV 供解码器读取；提示末尾 128 个 token 还经解码器 20 层重放构建局部 SWA；新 token 经编码器与解码器输出</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="47.66666666666667" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="130.08333333333334" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">提示 token</text>
  <text x="152.66666666666669" y="146.33333333333334" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">大部分位置</text><rect x="295.00000000000006" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="130.08333333333334" font-size="13" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">编码器 20 层</text>
  <text x="400.00000000000006" y="146.33333333333334" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">主体计算</text><rect x="542.3333333333334" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="130.08333333333334" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">全局 KV</text>
  <text x="647.3333333333334" y="146.33333333333334" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">供解码器读取</text><rect x="47.66666666666667" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="238.75000000000003" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">解码器 20 层</text>
  <text x="152.66666666666669" y="255.00000000000003" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">读取全局 KV</text><rect x="295.00000000000006" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="238.75000000000003" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">提示末尾 ≤128</text>
  <text x="400.00000000000006" y="255.00000000000003" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">窗口位置</text><rect x="542.3333333333334" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="238.75000000000003" font-size="13" fill="var(--on-yellow,#3b3024)" font-weight="700" text-anchor="middle">解码器 20 层重放</text>
  <text x="647.3333333333334" y="255.00000000000003" font-size="12" fill="var(--on-yellow,#3b3024)" font-weight="400" text-anchor="middle">取编码器输出</text><rect x="47.66666666666667" y="313.33333333333337" width="210" height="74.66666666666667" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="347.4166666666667" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">局部 SWA</text>
  <text x="152.66666666666669" y="363.6666666666667" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">窗口内状态</text><rect x="295.00000000000006" y="313.33333333333337" width="210" height="74.66666666666667" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="347.4166666666667" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">新 token</text>
  <text x="400.00000000000006" y="363.6666666666667" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">编码器 → 解码器</text><path d="M257.6666666666667 133.33333333333334 L295.00000000000006 133.33333333333334" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 133.33333333333334 L542.3333333333334 133.33333333333334" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 170.66666666666669 L647.3333333333334 187.66666666666669 L152.66666666666669 187.66666666666669 L152.66666666666669 204.66666666666669" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 242.00000000000003 L542.3333333333334 242.00000000000003" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 279.33333333333337 L647.3333333333334 296.33333333333337 L152.66666666666669 296.33333333333337 L152.66666666666669 313.33333333333337" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M152.66666666666669 313.33333333333337 L152.66666666666669 296.33333333333337 L152.66666666666669 296.33333333333337 L152.66666666666669 279.33333333333337" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M400.00000000000006 170.66666666666669 L400.00000000000006 187.66666666666669 L152.66666666666669 187.66666666666669 L152.66666666666669 204.66666666666669" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M152.66666666666669 279.33333333333337 L152.66666666666669 296.33333333333337 L400.00000000000006 296.33333333333337 L400.00000000000006 313.33333333333337" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">新 token 仍通过全部 40 层；编码器与解码器各 20 层。</text>
</svg>