<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">借用前的物理内存占用</title>
  <desc id="fig-desc">四根柱子表示四个节点的已占用物理内存：节点 0 为 80 GB，节点 1 为 60 GB，节点 2 与节点 3 各为 40 GB；每节点容量 80 GB，任务 0 另有 20 GB 尚未分配</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">25</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">50</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">75</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">100</text><rect x="123.5" y="158" width="68" height="200" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="158.5" y="152" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">80</text><text x="158.5" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">节点 0</text><rect x="292.5" y="208" width="68" height="150" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="327.5" y="202" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">60</text><text x="327.5" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">节点 1</text><rect x="461.5" y="258" width="68" height="100" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="496.5" y="252" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">40</text><text x="496.5" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">节点 2</text><rect x="630.5" y="258" width="68" height="100" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="665.5" y="252" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">40</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">节点 3</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">已占用物理内存（GB）</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">已占用</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">每节点容量 80 GB；颜色表示数据所属任务。</text>
</svg>