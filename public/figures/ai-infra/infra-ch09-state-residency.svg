<svg xmlns="http://www.w3.org/2000/svg" width="800" height="231" viewBox="0 68 800 231" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">多轮请求的阶段与状态驻留</title>
  <desc id="fig-desc">时间线：阶段依次为视觉编码 E、prefill P、decode D、工具等待、下一轮 P；KV 在工具等待期间继续驻留；EC 只在有视觉输入时出现</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">0</text><line x1="251.2" y1="96" x2="251.2" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="251.2" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">2</text><line x1="376.4" y1="96" x2="376.4" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="376.4" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">4</text><line x1="501.59999999999997" y1="96" x2="501.59999999999997" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="501.59999999999997" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">6</text><line x1="626.8" y1="96" x2="626.8" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="626.8" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">8</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">10</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">计算阶段</text><rect x="126" y="115" width="62.6" height="32" rx="3" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)"/><text x="157.3" y="134" font-size="8.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">E 视觉编码</text><rect x="188.6" y="115" width="125.2" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="251.2" y="134" font-size="9.5" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">P prefill</text><rect x="313.79999999999995" y="115" width="187.79999999999998" height="32" rx="3" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)"/><text x="407.69999999999993" y="134" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">D decode</text><rect x="501.59999999999997" y="115" width="125.2" height="32" rx="3" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)"/><text x="564.1999999999999" y="134" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">工具等待</text><rect x="626.8" y="115" width="125.2" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="689.4" y="134" font-size="9.5" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">下一轮 P</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">状态驻留</text><rect x="126" y="157" width="62.6" height="32" rx="3" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)"/><text x="157.3" y="176" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">EC</text><rect x="313.79999999999995" y="157" width="438.2" height="32" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="532.9" y="176" font-size="9.5" fill="var(--on-yellow,#202735)" font-weight="600" text-anchor="middle">KV 持续保留</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">阶段顺序（非等长）</text><text x="400" y="273" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">E 为视觉编码，EC 为保存的视觉编码结果，P 为 prefill，D 为 decode。</text>
</svg>