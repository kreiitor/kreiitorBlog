909090907" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><rect x="602.3333333333334" y="223.3409090909091" width="70" height="106.25" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><rect x="602.3333333333334" y="109.70454545454544" width="70" height="113.63636363636363" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue-soft,#e9eefe)"/><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">图 · 16 MiB</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">执行方式</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">总时间 / μs</text></g><rect x="82" y="86" width="10" height="10" fill="var(--yellow,#ffe04b)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">准备</text><rect x="130" y="86" width="10" height="10" fill="var(--blue,#2647d7)"/><text x="145" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">输入复制</text><rect x="192" y="86" width="10" height="10" fill="var(--blue-soft,#e9eefe)"/><text x="207" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">加速器计算</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">复制按 RTX PRO 6000 的显存带宽 1792 GB/s 计。</text>
</svg>