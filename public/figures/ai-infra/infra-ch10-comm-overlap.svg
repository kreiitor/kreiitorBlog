<svg xmlns="http://www.w3.org/2000/svg" width="800" height="231" viewBox="0 68 800 231" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">链路空闲时的通信重叠</title>
  <desc id="fig-desc">两条泳道：独立计算从 0 到 5 ms；链路从 2 到 5 ms 执行 3 ms 归约，归约在计算结束前完成，没有额外等待</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">0</text><line x1="304.8571428571429" y1="96" x2="304.8571428571429" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="304.8571428571429" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">2</text><line x1="483.7142857142857" y1="96" x2="483.7142857142857" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="483.7142857142857" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">4</text><line x1="662.5714285714286" y1="96" x2="662.5714285714286" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="662.5714285714286" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">6</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">7</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">独立计算</text><rect x="126" y="115" width="447.14285714285717" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="349.57142857142856" y="134" font-size="9.5" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">5 ms</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">链路</text><rect x="304.8571428571429" y="157" width="268.2857142857143" height="32" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="439" y="176" font-size="9.5" fill="var(--on-yellow,#202735)" font-weight="600" text-anchor="middle">3 ms 归约</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">时间 / ms</text><text x="400" y="273" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">横轴为 0—7 ms；虚线标出计算结束时刻 5 ms。</text>
</svg>