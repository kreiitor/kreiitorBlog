<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 158 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">生成四个输出的调用顺序</title>
  <desc id="fig-desc">四步调用从左到右：prefill 处理 128 个 token 并输出 y1，保留 128 个；decode 1 输出 y2，保留 129 个；decode 2 输出 y3，保留 130 个；decode 3 输出 y4，保留 131 个</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="45" y="186" width="153.5" height="112" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="121.75" y="230.625" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">① prefill</text>
  <text x="121.75" y="246.875" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">128 token → y₁ · 保留</text><text x="121.75" y="263.075" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">128</text><rect x="230.5" y="186" width="153.5" height="112" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="307.25" y="238.75" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">② decode 1</text>
  <text x="307.25" y="255" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">y₁ → y₂ · 保留 129</text><rect x="416" y="186" width="153.5" height="112" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="492.75" y="238.75" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">③ decode 2</text>
  <text x="492.75" y="255" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">y₂ → y₃ · 保留 130</text><rect x="601.5" y="186" width="153.5" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="678.25" y="238.75" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">④ decode 3</text>
  <text x="678.25" y="255" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">y₃ → y₄ · 保留 131</text><path d="M198.5 242 L230.5 242" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 242 L416 242" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M569.5 242 L601.5 242" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="332" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">最终保留 131 个 token。</text>
</svg>