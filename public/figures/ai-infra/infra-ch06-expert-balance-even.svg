<svg xmlns="http://www.w3.org/2000/svg" width="800" height="348" viewBox="0 57 800 348" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">均匀覆盖时的组负载</title>
  <desc id="fig-desc">四根等高的柱子，组 0 到组 3 都是 128 次 token—专家计算；合计读取 4.5 GiB 权重</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
