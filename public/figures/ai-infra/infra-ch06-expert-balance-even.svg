lue,#2647d7)"/><text x="665.5" y="288" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">128</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">组 3</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">token—专家计算次数</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#2647d7)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">计算次数</text></svg>