<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">保存与恢复填满整个间隔</title>
  <desc id="fig-desc">横轴同 10–19 秒；内存条分为第 10–18 秒保存 8 秒、第 18–19 秒恢复两段，整个区间仍占 2 GiB，面积仍是 18 GiB·秒</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">保存与恢复填满整个间隔</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">8 秒保存加 1 秒恢复，占用面积不变</text><line x1="126" y1="96" x2="126" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="290.7368421052631" y1="96" x2="290.7368421052631" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="290.7368421052631" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">5</text><line x1="455.4736842105263" y1="96" x2="455.4736842105263" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="455.4736842105263" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">10</text><line x1="620.2105263157895" y1="96" x2="620.2105263157895" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="620.2105263157895" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">15</text><line x1="752" y1="96" x2="752" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="174" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">19</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">环境内存</text><rect x="455.4736842105263" y="115" width="263.57894736842104" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="587.2631578947369" y="134" font-size="9.5" fill="var(--on-yellow)" font-weight="600" text-anchor="middle">保存 8 s</text><rect x="719.0526315789473" y="115" width="32.94736842105263" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="735.5263157894736" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">恢复</text><line x1="126" y1="158" x2="752" y2="158" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="194" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">时间 / s</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">保存与恢复期间环境仍占 2 GiB。</text>
</svg>