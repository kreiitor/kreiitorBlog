<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 73 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">训练进度与预取进度</title>
  <desc id="fig-desc">矩阵示意：训练进度一行为 batch 100 及以前已训练、101—108 未训练、109 起未安排；预取进度一行显示 101—108 已准备或正在处理，109 起未准备</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><text x="236" y="112" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="700" text-anchor="middle">≤ 100</text><text x="448" y="112" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="700" text-anchor="middle">101—108</text><text x="660" y="112" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="700" text-anchor="middle">≥ 109</text><text x="82" y="149" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">训练进度</text><rect x="133" y="129" width="206" height="34" rx="4" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.1"/><text x="236" y="149" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">已训练</text><rect x="345" y="129" width="206" height="34" rx="4" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.1"/><text x="448" y="149" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">尚未训练</text><rect x="557" y="129" width="206" height="34" rx="4" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)" stroke-width="1.1"/><text x="660" y="149" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">未安排</text><text x="82" y="189" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">预取进度</text><rect x="133" y="169" width="206" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.1"/><text x="236" y="189" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">已使用</text><rect x="345" y="169" width="206" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.1"/><text x="448" y="189" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">已准备 / 处理中</text><rect x="557" y="169" width="206" height="34" rx="4" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)" stroke-width="1.1"/><text x="660" y="189" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">未准备</text><text x="400" y="237" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">101—108 中一部分已经准备好，另一部分仍在处理；虚线框表示尚在处理。</text>
</svg>