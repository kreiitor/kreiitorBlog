<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 64 800 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">LRU 命中率随缓存容量变化</title>
  <desc id="fig-desc">容量与命中率对照表：1,000 块时 30%，50,000 块时 50%，容量不限时 51%；10,000、30,000、100,000 块的具体命中率未给出</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="38" y="92" width="362" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.2"/><text x="219" y="112" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">缓存块数</text><rect x="400" y="92" width="362" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.2"/><text x="581" y="112" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">LRU 命中率</text><rect x="38" y="126" width="362" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="219" y="150" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">1,000</text><rect x="400" y="126" width="362" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="581" y="150" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">30%</text><rect x="38" y="168" width="362" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="219" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">10,000</text><rect x="400" y="168" width="362" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="581" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">—</text><rect x="38" y="210" width="362" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="219" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">30,000</text><rect x="400" y="210" width="362" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="581" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">—</text><rect x="38" y="252" width="362" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="219" y="276" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">50,000</text><rect x="400" y="252" width="362" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="581" y="276" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">50%</text><rect x="38" y="294" width="362" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="219" y="318" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">100,000</text><rect x="400" y="294" width="362" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="581" y="318" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">—</text><rect x="38" y="336" width="362" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="219" y="360" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">容量不限</text><rect x="400" y="336" width="362" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="581" y="360" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">51%</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">数据为 Mooncake 一小时采样 trace 在 LRU 淘汰下的命中率，每块 512 个 token；横轴按 Qwen3-8B 每 token 144 KiB 换算。</text>
</svg>