<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">抢占后暂停沙箱的两条泳道</title>
  <desc id="fig-desc">两条泳道：GPU 作业依次为训练、被抢占、训练；沙箱内存依次为驻留、保存、内存已释放、恢复、驻留，保存与恢复各占一小段，中间大段内存空出</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">抢占后暂停沙箱的两条泳道</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">训练被抢占，沙箱保存后释放内存</text><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="251.2" y1="96" x2="251.2" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="251.2" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">20</text><line x1="376.4" y1="96" x2="376.4" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="376.4" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">40</text><line x1="501.59999999999997" y1="96" x2="501.59999999999997" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="501.59999999999997" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">60</text><line x1="626.8" y1="96" x2="626.8" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="626.8" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">80</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">100</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">GPU 作业</text><rect x="126" y="115" width="125.2" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="188.6" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">训练</text><rect x="251.2" y="115" width="25.04" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="263.71999999999997" y="134" font-size="9.5" fill="var(--on-yellow)" font-weight="600" text-anchor="middle">被抢占</text><rect x="276.24" y="115" width="475.76" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="514.12" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">训练</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">沙箱内存</text><rect x="126" y="157" width="62.6" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="157.3" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">驻留</text><rect x="188.6" y="157" width="18.779999999999998" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><rect x="207.38" y="157" width="450.71999999999997" height="32" rx="3" fill="var(--surface)" stroke="var(--line)"/><text x="432.74" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">内存已释放</text><rect x="658.1" y="157" width="18.779999999999998" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><rect x="676.88" y="157" width="75.11999999999999" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="714.4399999999999" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">驻留</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">时间（未按比例）</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">横轴未按比例绘制；被抢占时长通常为一到三小时。</text>
</svg>