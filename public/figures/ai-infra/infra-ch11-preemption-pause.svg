<svg xmlns="http://www.w3.org/2000/svg" width="800" height="231" viewBox="0 68 800 231" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">抢占后暂停沙箱的两条泳道</title>
  <desc id="fig-desc">两条泳道：GPU 作业依次为训练、被抢占、训练；沙箱内存依次为驻留、保存、内存已释放、恢复、驻留，保存与恢复各占一小段，中间大段内存空出</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0</text><line x1="251.2" y1="96" x2="251.2" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="251.2" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">20</text><line x1="376.4" y1="96" x2="376.4" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="376.4" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">40</text><line x1="501.59999999999997" y1="96" x2="501.59999999999997" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="501.59999999999997" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">60</text><line x1="626.8" y1="96" x2="626.8" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="626.8" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">80</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">100</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">GPU 作业</text><rect x="126" y="115" width="125.2" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="188.6" y="134" font-size="9.5" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">训练</text><rect x="251.2" y="115" width="25.04" height="32" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="263.71999999999997" y="134" font-size="9.5" fill="var(--on-yellow,#3b3024)" font-weight="600" text-anchor="middle">被抢占</text><rect x="276.24" y="115" width="475.76" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="514.12" y="134" font-size="9.5" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">训练</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">沙箱内存</text><rect x="126" y="157" width="62.6" height="32" rx="3" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)"/><text x="157.3" y="176" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">驻留</text><rect x="188.6" y="157" width="18.779999999999998" height="32" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><rect x="207.38" y="157" width="450.71999999999997" height="32" rx="3" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)"/><text x="432.74" y="176" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">内存已释放</text><rect x="658.1" y="157" width="18.779999999999998" height="32" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)"/><rect x="676.88" y="157" width="75.11999999999999" height="32" rx="3" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)"/><text x="714.4399999999999" y="176" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">驻留</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">时间（未按比例）</text><text x="400" y="273" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">横轴未按比例绘制；被抢占时长通常为一到三小时。</text>
</svg>