<svg xmlns="http://www.w3.org/2000/svg" width="800" height="368" viewBox="0 76 800 368" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">相邻输出复用 A 的同一行</title>
  <desc id="fig-desc">A 的同一行分别与 W 的第 1 列、第 2 列相乘，得到 C[i,j] 与 C[i,j+1]；两次计算共用 A 行</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="47.66666666666667" y="104.5" width="210" height="112" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="157.25" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">A 的同一行</text>
  <text x="152.66666666666669" y="173.5" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">蓝色横条，两次共用</text><rect x="295.00000000000006" y="104.5" width="210" height="112" rx="8" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="157.25" font-size="13" fill="var(--on-yellow,#202735)" font-weight="700" text-anchor="middle">W 第 1 列</text>
  <text x="400.00000000000006" y="173.5" font-size="12" fill="var(--on-yellow,#202735)" font-weight="400" text-anchor="middle">橙色竖条</text><rect x="542.3333333333334" y="104.5" width="210" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">C[i,j]</text>
  <text x="647.3333333333334" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">本次输出元素</text><rect x="47.66666666666667" y="267.5" width="210" height="112" rx="8" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="320.25" font-size="13" fill="var(--on-yellow,#202735)" font-weight="700" text-anchor="middle">W 第 2 列</text>
  <text x="152.66666666666669" y="336.5" font-size="12" fill="var(--on-yellow,#202735)" font-weight="400" text-anchor="middle">橙色竖条</text><rect x="295.00000000000006" y="267.5" width="210" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="320.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">C[i,j+1]</text>
  <text x="400.00000000000006" y="336.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">相邻输出元素</text><path d="M257.6666666666667 160.5 L542.3333333333334 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 160.5 L542.3333333333334 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M152.66666666666669 216.5 L152.66666666666669 242 L400.00000000000006 242 L400.00000000000006 267.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 323.5 L295.00000000000006 323.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">图中矩阵为缩小尺寸，实际算例的 K 为 4096。</text>
</svg>