<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 158 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">两个请求的循环等待</title>
  <desc id="fig-desc">请求 0 持有 A 并等待 B，请求 1 持有 B 并等待 A，两个箭头互相指向对方，形成循环等待</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="109.5" y="186" width="210" height="112" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="214.5" y="238.75" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">请求 0</text>
  <text x="214.5" y="255" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">持有 A，等待 B</text><rect x="480.5" y="186" width="210" height="112" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="585.5" y="238.75" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">请求 1</text>
  <text x="585.5" y="255" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">持有 B，等待 A</text><path d="M319.5 242 L480.5 242" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M480.5 242 L319.5 242" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/></svg>