<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">归约时间的两种优化</title>
  <desc id="fig-desc">双对数横轴为每参与者输入 10^3 到 10^8 bytes，纵轴为归约时间；原配置左侧平台约 70 μs，带宽三倍后右侧斜坡降低，启动缩短后左侧平台下移</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="74" y1="289.914780241934" x2="750" y2="289.914780241934" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="293.914780241934" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">100</text><line x1="74" y1="166.75983973810992" x2="750" y2="166.75983973810992" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="170.75983973810992" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">1k</text><polyline points="74,308.991721907904 299.33333333333337,307.4849881557703 524.6666666666667,236.79020153142832 750,127.84653064239046" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.4"/><circle cx="74" cy="308.991721907904" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="299.33333333333337" cy="307.4849881557703" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="524.6666666666667" cy="236.79020153142832" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="750" cy="127.84653064239046" r="3.2" fill="var(--blue,#2647d7)"/><polyline points="74,308.991721907904 299.33333333333337,308.45952337680785 524.6666666666667,273.1942169080413 750,183.103649396434" fill="none" stroke="var(--yellow-soft,#fff5b7)" stroke-width="2.4"/><circle cx="74" cy="308.991721907904" r="3.2" fill="var(--yellow-soft,#fff5b7)"/><circle cx="299.33333333333337" cy="308.45952337680785" r="3.2" fill="var(--yellow-soft,#fff5b7)"/><circle cx="524.6666666666667" cy="273.1942169080413" r="3.2" fill="var(--yellow-soft,#fff5b7)"/><circle cx="750" cy="183.103649396434" r="3.2" fill="var(--yellow-soft,#fff5b7)"/><polyline points="74,358 299.33333333333337,354.3098810076482 524.6666666666667,245.83333545534774 750,128.94290454378657" fill="none" stroke="var(--yellow,#ffe04b)" stroke-width="2.4"/><circle cx="74" cy="358" r="3.2" fill="var(--yellow,#ffe04b)"/><circle cx="299.33333333333337" cy="354.3098810076482" r="3.2" fill="var(--yellow,#ffe04b)"/><circle cx="524.6666666666667" cy="245.83333545534774" r="3.2" fill="var(--yellow,#ffe04b)"/><circle cx="750" cy="128.94290454378657" r="3.2" fill="var(--yellow,#ffe04b)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">每参与者输入 / bytes</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">归约时间 / μs</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#2647d7)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">原配置</text><rect x="137" y="86" width="10" height="10" fill="var(--yellow-soft,#fff5b7)"/><text x="152" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">带宽三倍</text><rect x="199" y="86" width="10" height="10" fill="var(--yellow,#ffe04b)"/><text x="214" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">启动缩短</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">原配置每轮启动 5 μs、带宽 50 GB/s；带宽三倍为 150 GB/s；启动缩短为每轮 2 μs。14 轮启动对应约 70 μs 平台。</text>
</svg>