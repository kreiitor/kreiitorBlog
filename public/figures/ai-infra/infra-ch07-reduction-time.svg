<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">归约时间的两种优化</title>
  <desc id="fig-desc">双对数横轴为每参与者输入 10^3 到 10^8 bytes，纵轴为归约时间；原配置左侧平台约 70 μs，带宽三倍后右侧斜坡降低，启动缩短后左侧平台下移</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="289.914780241934" x2="750" y2="289.914780241934" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="293.914780241934" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">100</text><line x1="74" y1="166.75983973810992" x2="750" y2="166.75983973810992" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="170.75983973810992" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">1k</text><polyline points="74,308.991721907904 299.33333333333337,307.4849881557703 524.6666666666667,236.79020153142832 750,127.84653064239046" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.4"/><circle cx="74" cy="308.991721907904" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="299.33333333333337" cy="307.4849881557703" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="524.6666666666667" cy="236.79020153142832" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="750" cy="127.84653064239046" r="3.2" fill="var(--blue,#466b3f)"/><polyline points="74,308.991721907904 299.33333333333337,308.45952337680785 524.6666666666667,273.1942169080413 750,183.103649396434" fill="none" stroke="var(--yellow-soft,#fbf3d9)" stroke-width="2.4"/><circle cx="74" cy="308.991721907904" r="3.2" fill="var(--yellow-soft,#fbf3d9)"/><circle cx="299.33333333333337" cy="308.45952337680785" r="3.2" fill="var(--yellow-soft,#fbf3d9)"/><circle cx="524.6666666666667" cy="273.1942169080413" r="3.2" fill="var(--yellow-soft,#fbf3d9)"/><circle cx="750" cy="183.103649396434" r="3.2" fill="var(--yellow-soft,#fbf3d9)"/><polyline points="74,358 299.33333333333337,354.3098810076482 524.6666666666667,245.83333545534774 750,128.94290454378657" fill="none" stroke="var(--yellow,#f5d75f)" stroke-width="2.4"/><circle cx="74" cy="358" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="299.33333333333337" cy="354.3098810076482" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="524.6666666666667" cy="245.83333545534774" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="750" cy="128.94290454378657" r="3.2" fill="var(--yellow,#f5d75f)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">每参与者输入 / bytes</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">归约时间 / μs</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">原配置</text><rect x="137" y="86" width="10" height="10" fill="var(--yellow-soft,#fbf3d9)"/><text x="152" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">带宽三倍</text><rect x="199" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="214" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">启动缩短</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">原配置每轮启动 5 μs、带宽 50 GB/s；带宽三倍为 150 GB/s；启动缩短为每轮 2 μs。14 轮启动对应约 70 μs 平台。</text>
</svg>