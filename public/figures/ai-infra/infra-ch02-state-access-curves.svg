<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">每步状态访问量的变化</title>
  <desc id="fig-desc">横轴为上下文长度（千 token，对数轴），纵轴为每步状态访问量（GiB，对数轴）；逐 token 上下文计读取，递推矩阵计一读一写，图例与容量图相同</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">每步状态访问量的变化</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">逐 token 上下文计读取，递推矩阵计一读一写</text><rect x="34" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="151.33333333333331" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">逐 token 上下文</text><text x="151.33333333333331" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">读取已有上下文</text><text x="46" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">每步计入读取</text><text x="46" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">随上下文长度增长</text><rect x="282.66666666666663" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/><text x="399.99999999999994" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">递推矩阵</text><text x="399.99999999999994" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">固定状态</text><text x="294.66666666666663" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">一读一写</text><text x="294.66666666666663" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">按状态矩阵计量</text><rect x="531.3333333333333" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="648.6666666666666" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">统计口径</text><text x="648.6666666666666" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">一次 decode</text><text x="543.3333333333333" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">每步=生成下一个 token</text><text x="543.3333333333333" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">不含模型权重读取</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">上下文短</text><text x="730" y="400" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="end">上下文长</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">每步指为一个请求生成下一个 token 的一次 decode；纵轴不含模型权重读取。</text>
</svg>