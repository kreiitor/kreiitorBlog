<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">读取时间随线路时延的变化</title>
  <desc id="fig-desc">横轴为线路单程时延 50 到 500 ns，纵轴为一次 64 B 读取 0 到 3 μs；外设式 RoCE、UB 异步读取、UB Load 三条线斜率都为 2，截距分别为 2022、546、219 ns</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="279.875" x2="750" y2="279.875" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="283.875" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">1</text><line x1="74" y1="201.75" x2="750" y2="201.75" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="205.75" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">2</text><line x1="74" y1="123.625" x2="750" y2="123.625" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="127.625" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">3</text><polyline points="74,192.21875 750,121.90625000000003" fill="none" stroke="var(--blue)" stroke-width="2.4"/><circle cx="74" cy="192.21875" r="3.2" fill="var(--blue)"/><circle cx="750" cy="121.90625000000003" r="3.2" fill="var(--blue)"/><polyline points="74,307.53125 750,237.21875" fill="none" stroke="var(--yellow)" stroke-width="2.4"/><circle cx="74" cy="307.53125" r="3.2" fill="var(--yellow)"/><circle cx="750" cy="237.21875" r="3.2" fill="var(--yellow)"/><polyline points="74,333.078125 750,262.765625" fill="none" stroke="var(--muted)" stroke-width="2.4"/><circle cx="74" cy="333.078125" r="3.2" fill="var(--muted)"/><circle cx="750" cy="262.765625" r="3.2" fill="var(--muted)"/><text x="74" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">50</text><text x="750" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">500</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">线路单程时延 / ns</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">一次 64 B 读取 / μs</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">外设式 RoCE</text><rect x="156.25" y="86" width="10" height="10" fill="var(--yellow)"/><text x="171.25" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">UB 异步读取</text><rect x="229.8" y="86" width="10" height="10" fill="var(--muted)"/><text x="244.8" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">UB Load</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">横轴只画 50 与 500 ns 两个端点，连线按斜率 2 延伸。</text>
</svg>