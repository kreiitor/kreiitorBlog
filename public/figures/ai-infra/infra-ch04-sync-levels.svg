<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">同步层级的代价</title>
  <desc id="fig-desc">五根条形依次为 SM 内栅栏 7 ns、线程块簇内同步 131 ns、跨 SM 一对一交接 366 ns、全部 SM 汇合 663 ns、全部 SM 汇合并送达激活向量 1,004 ns</desc>
