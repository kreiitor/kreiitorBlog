<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">图片与特征的发送时间</title>
  <desc id="fig-desc">两根柱子：0.8 MB 压缩图片约 1 秒，8.192 MB 完整特征约 10.24 秒</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">图片与特征的发送时间</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">同一张图片，6.4 Mbit/s 上行下的两种传输量</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="253.83333333333331" x2="750" y2="253.83333333333331" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="257.8333333333333" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">5</text><line x1="74" y1="149.66666666666666" x2="750" y2="149.66666666666666" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="153.66666666666666" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">12</text><rect x="208" y="337.1666666666667" width="68" height="20.833333333333332" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="243" y="331.1666666666667" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">1</text><text x="243" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">压缩图片 0.8 MB</text><rect x="546" y="144.66666666666666" width="68" height="213.33333333333334" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="581" y="138.66666666666666" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">10.24</text><text x="581" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">完整特征 8.192 MB</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">6.4 Mbit/s 上行</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">发送时间 / s</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">发送时间</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">Qwen3-VL-4B 在 640×640 输入上产生 400 个视觉 token，每个 token 10240 个 BF16 分量；编码、排队和转换时间另计。</text>
</svg>