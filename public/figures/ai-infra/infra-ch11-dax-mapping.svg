<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">DAX 直接映射宿主机页</title>
  <desc id="fig-desc">三台 microVM 并排在上方，每台只映射宿主机页；下方宿主机 page cache 保存唯一一份镜像页，箭头表示经 DAX 直接映射而不复制</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="300" y1="310" x2="80" y2="110" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="300" y1="310" x2="300" y2="110" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="300" y1="310" x2="520" y2="110" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="86" width="100" height="48" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="80" y="107.25" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">microVM 1</text>
  <text x="80" y="121" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">映射宿主机页</text><rect x="250" y="86" width="100" height="48" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="300" y="107.25" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">microVM 2</text>
  <text x="300" y="121" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">映射宿主机页</text><rect x="470" y="86" width="100" height="48" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="520" y="107.25" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">microVM 3</text>
  <text x="520" y="121" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">映射宿主机页</text><rect x="250" y="286" width="100" height="48" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="300" y="293.5" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">宿主机 page</text><text x="300" y="308.35" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">cache</text>
  <text x="300" y="321" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">镜像页（唯一一份</text><text x="300" y="334.5" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">）</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">虚拟机仍为这段地址范围分配页描述结构，约占设备容量的 1/64。</text>
</svg>