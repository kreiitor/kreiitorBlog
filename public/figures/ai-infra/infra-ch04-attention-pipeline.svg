<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">注意力流水的三类资源耗时</title>
  <desc id="fig-desc">四组配置中每组的矩阵、共享内存、指数耗时：原配置为 1024、768、1024；矩阵翻倍为 512、768、1024；矩阵与指数均翻倍为 512、768、512；三项翻倍为 512、384、512 周期</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">注意力流水的三类资源耗时</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">原配置 1024 / 768 / 1024，三项翻倍后降到 512 / 384 / 512</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="253.83333333333331" x2="750" y2="253.83333333333331" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="257.8333333333333" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">500</text><line x1="74" y1="149.66666666666666" x2="750" y2="149.66666666666666" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="153.66666666666666" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">1000</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">1200</text><rect x="123.5" y="144.66666666666666" width="21.333333333333332" height="213.33333333333334" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="135.16666666666666" y="138.66666666666666" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">1024</text><rect x="146.83333333333334" y="198" width="21.333333333333332" height="160" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="158.5" y="192" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">768</text><rect x="170.16666666666666" y="144.66666666666666" width="21.333333333333332" height="213.33333333333334" rx="3" fill="var(--surface)" stroke="var(--surface)"/><text x="181.83333333333331" y="138.66666666666666" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">1024</text><text x="158.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">原配置</text><rect x="292.5" y="251.33333333333331" width="21.333333333333332" height="106.66666666666667" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="304.1666666666667" y="245.33333333333331" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">512</text><rect x="315.8333333333333" y="198" width="21.333333333333332" height="160" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="327.5" y="192" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">768</text><rect x="339.1666666666667" y="144.66666666666666" width="21.333333333333332" height="213.33333333333334" rx="3" fill="var(--surface)" stroke="var(--surface)"/><text x="350.83333333333337" y="138.66666666666666" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">1024</text><text x="327.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">矩阵 ×2</text><rect x="461.5" y="251.33333333333331" width="21.333333333333332" height="106.66666666666667" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="473.1666666666667" y="245.33333333333331" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">512</text><rect x="484.8333333333333" y="198" width="21.333333333333332" height="160" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="496.5" y="192" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">768</text><rect x="508.1666666666667" y="251.33333333333331" width="21.333333333333332" height="106.66666666666667" rx="3" fill="var(--surface)" stroke="var(--surface)"/><text x="519.8333333333334" y="245.33333333333331" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">512</text><text x="496.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">矩阵、指数均 ×2</text><rect x="630.5" y="251.33333333333331" width="21.333333333333332" height="106.66666666666667" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="642.1666666666666" y="245.33333333333331" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">512</text><rect x="653.8333333333334" y="278" width="21.333333333333332" height="80" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="665.5" y="272" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">384</text><rect x="677.1666666666666" y="251.33333333333331" width="21.333333333333332" height="106.66666666666667" rx="3" fill="var(--surface)" stroke="var(--surface)"/><text x="688.8333333333333" y="245.33333333333331" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">512</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">三项 ×2</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">配置</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">单计算组耗时 / 周期</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">矩阵</text><rect x="130" y="86" width="10" height="10" fill="var(--yellow)"/><text x="145" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">共享内存</text><rect x="192" y="86" width="10" height="10" fill="var(--surface)"/><text x="207" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">指数</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">横轴为完成同一计算块所需的时钟周期；×2 表示相应资源吞吐能力提高一倍。</text>
</svg>