<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 158 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">跨 SM 交接的顺序</title>
  <desc id="fig-desc">生产者依次写数据、等待确认、执行 fence、写标志；L2 分片中转数据与标志；消费者先读旧标志，轮询到新值后再读数据</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="47.66666666666667" y="186" width="210" height="112" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="238.75" font-size="13" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">生产者 SM</text>
  <text x="152.66666666666669" y="255" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">写数据 → fence → 写标志</text><rect x="295.00000000000006" y="186" width="210" height="112" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="238.75" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">L2 分片</text>
  <text x="400.00000000000006" y="255" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">数据与标志中转</text><rect x="542.3333333333334" y="186" width="210" height="112" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="238.75" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">消费者 SM</text>
  <text x="647.3333333333334" y="255" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">读标志 → 轮询 → 读数据</text><path d="M257.6666666666667 242 L295.00000000000006 242" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 242 L295.00000000000006 242" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 242 L542.3333333333334 242" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M542.3333333333334 242 L505.00000000000006 242" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="332" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">每次跨越生产者与 L2 的斜线表示穿过一次交叉互连，约为半次 L2 往返。</text>
</svg>