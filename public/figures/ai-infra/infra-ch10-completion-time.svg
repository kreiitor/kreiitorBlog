<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">两套方案的完成时间</title>
  <desc id="fig-desc">堆叠横条：32 卡方案由基础训练 29.0 天、保存恢复约 0.3 天、计划停顿 5 天组成，共 34.3 天；48 卡方案由 19.4 天、约 0.2 天、5 天组成，共 24.6 天</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">30</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">40</text><rect x="208" y="176.75" width="70" height="181.25" fill="var(--blue)" stroke="var(--blue)"/><rect x="208" y="174.875" width="70" height="1.875" fill="var(--yellow)" stroke="var(--yellow)"/><rect x="208" y="143.62500000000003" width="70" height="31.25" fill="var(--blue-soft)" stroke="var(--blue-soft)"/><text x="243" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">32 卡</text><rect x="546" y="236.75" width="70" height="121.25" fill="var(--blue)" stroke="var(--blue)"/><rect x="546" y="235.5" width="70" height="1.25" fill="var(--yellow)" stroke="var(--yellow)"/><rect x="546" y="204.25" width="70" height="31.25" fill="var(--blue-soft)" stroke="var(--blue-soft)"/><text x="581" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">48 卡</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">方案</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">完成时间 / 天</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">基础训练</text><rect x="144" y="86" width="10" height="10" fill="var(--yellow)"/><text x="159" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">保存恢复</text><rect x="206" y="86" width="10" height="10" fill="var(--blue-soft)"/><text x="221" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">计划停顿</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">基础训练时间已包含通信与输入等待；橙色小段为 checkpoint 模型得到的额外耗时。两套方案使用相同任务与全局 batch。</text>
</svg>