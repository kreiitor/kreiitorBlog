<svg xmlns="http://www.w3.org/2000/svg" width="800" height="363" viewBox="0 13 800 363" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">分块矩阵乘的累加顺序</title>
  <desc id="fig-desc">三对输入块依次乘加，结果都写进同一份 FP32 累加器；累加器在三次乘加之间留在片上，K 走完后才转成 BF16 输出块</desc>
