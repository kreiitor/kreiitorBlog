<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">分块矩阵乘：输入换，部分和不换</title>
  <desc id="fig-desc">沿 K 维依次换入三对输入块，每对的 A 块与 W 块都加到同一份 FP32 累加器上；累加器不写回下一级存储，K 走完后才舍入成 BF16 输出块</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="36" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)">分块矩阵乘：输入换，部分和不换</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="var(--muted)">沿 K 维依次换入输入块，每对都加到同一份 FP32 累加器上</text>

  <text x="125" y="112" text-anchor="middle" font-size="12" fill="var(--muted)">第 1 对</text>
  <rect x="60" y="120" width="130" height="40" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.8"/>
  <text x="125" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">A 块 · m×k</text>
  <rect x="60" y="168" width="130" height="40" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.8"/>
  <text x="125" y="193" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">W 块 · k×n</text>
  <rect x="50" y="92" width="150" height="128" rx="10" fill="none" stroke="var(--line-soft)" stroke-width="1.5"/>

  <text x="307" y="112" text-anchor="middle" font-size="12" fill="var(--muted)">第 2 对</text>
  <rect x="242" y="120" width="130" height="40" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.8"/>
  <text x="307" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">A 块 · m×k</text>
  <rect x="242" y="168" width="130" height="40" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.8"/>
  <text x="307" y="193" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">W 块 · k×n</text>
  <rect x="232" y="92" width="150" height="128" rx="10" fill="none" stroke="var(--line-soft)" stroke-width="1.5"/>

  <text x="489" y="112" text-anchor="middle" font-size="12" fill="var(--muted)">第 3 对</text>
  <rect x="424" y="120" width="130" height="40" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.8"/>
  <text x="489" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">A 块 · m×k</text>
  <rect x="424" y="168" width="130" height="40" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.8"/>
  <text x="489" y="193" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">W 块 · k×n</text>
  <rect x="414" y="92" width="150" height="128" rx="10" fill="none" stroke="var(--line-soft)" stroke-width="1.5"/>

  <path d="M204 156 L228 156" stroke="var(--blue)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M386 156 L410 156" stroke="var(--blue)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <path d="M125 232 L125 266" stroke="var(--blue)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M307 232 L307 266" stroke="var(--blue)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M489 232 L489 266" stroke="var(--blue)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="50" y="272" width="514" height="76" rx="9" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="2"/>
  <text x="307" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">FP32 累加器 · m×n</text>
  <text x="307" y="326" text-anchor="middle" font-size="12" fill="var(--muted)">每对输入都加到同一份部分和上，不写回下一级存储</text>

  <path d="M568 310 L606 310" stroke="var(--blue)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="612" y="278" width="138" height="64" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.8"/>
  <text x="681" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">C 块 · BF16</text>
  <text x="681" y="326" text-anchor="middle" font-size="11" fill="var(--muted)">K 走完才写出</text>

  <text x="400" y="388" text-anchor="middle" font-size="12" fill="var(--muted)">输入块换、部分和不换：三对只是示意，实际沿 K 维共换入 K/k 对。</text>
  <text x="400" y="412" text-anchor="middle" font-size="12" fill="var(--muted)">若把部分和也换进换出，中间结果就要写回下一级存储，省下的带宽又赔回去。</text>
</svg>
