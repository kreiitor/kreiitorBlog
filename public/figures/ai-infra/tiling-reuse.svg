  <path d="M214 96 L250 96" stroke="var(--blue,#2647d7)" stroke-width="1.5" fill="none"/>
  <path d="M214 206 L250 206" stroke="var(--blue,#2647d7)" stroke-width="1.5" fill="none"/>
  <path d="M214 316 L250 316" stroke="var(--blue,#2647d7)" stroke-width="1.5" fill="none"/>
