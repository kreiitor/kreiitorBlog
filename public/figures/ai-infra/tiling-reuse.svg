  <rect x="304" y="150" width="256" height="166" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.4"/>
  <text x="316" y="176" font-size="12" font-weight="600" fill="var(--ink,#202735)">FP32 累加器 m×n</text>
  <text x="316" y="196" font-size="10.5" fill="var(--muted,#596171)">三次乘加写同一份缓冲</text>
  <line x1="316" y1="212" x2="544" y2="212" stroke="var(--line,#a2aec1)" stroke-width="1"/>
  <text x="316" y="236" font-size="10.5" fill="var(--muted,#596171)">步骤之间不写回显存</text>
  <text x="316" y="254" font-size="10.5" fill="var(--muted,#596171)">装不下时才退化为反复读写</text>
  <text x="544" y="290" text-anchor="end" font-size="10.5" fill="var(--muted,#596171)" class="mono">S = 2mk + 2kn + 4mn</text>

  <path d="M560 232 L602 232" stroke="var(--blue,#2647d7)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
