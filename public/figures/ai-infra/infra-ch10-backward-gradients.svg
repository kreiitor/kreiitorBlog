<svg xmlns="http://www.w3.org/2000/svg" width="800" height="376" viewBox="0 68 800 376" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">矩阵反向的两路梯度</title>
  <desc id="fig-desc">上游梯度 dY 居中，分别指向 dX 与 dW 两路：dX 读取权重 W 后传给前一层，dW 读取前向输入 X 后进入本层归约和参数更新</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="47.66666666666667" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="130.08333333333334" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">上游梯度 dY</text>
  <text x="152.66666666666669" y="146.33333333333334" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">来自后续计算</text><rect x="295.00000000000006" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="130.08333333333334" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">dX = dY · Wᵀ</text>
  <text x="400.00000000000006" y="146.33333333333334" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">输入梯度</text><rect x="542.3333333333334" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="130.08333333333334" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">传给前一层</text>
  <text x="647.3333333333334" y="146.33333333333334" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">继续反向传播</text><rect x="47.66666666666667" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="238.75000000000003" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">dW = Xᵀ · dY</text>
  <text x="152.66666666666669" y="255.00000000000003" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">参数梯度</text><rect x="295.00000000000006" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="238.75000000000003" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">归约与参数更新</text>
  <text x="400.00000000000006" y="255.00000000000003" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">更新本层参数</text><rect x="542.3333333333334" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--line-soft,#dce1e8)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="238.75000000000003" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">权重 W</text>
  <text x="647.3333333333334" y="255.00000000000003" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">常驻参数</text><rect x="47.66666666666667" y="313.33333333333337" width="210" height="74.66666666666667" rx="8" fill="var(--line-soft,#dce1e8)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="347.4166666666667" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">前向输入 X</text>
  <text x="152.66666666666669" y="363.6666666666667" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">需要保留或重建</text><path d="M257.6666666666667 133.33333333333334 L295.00000000000006 133.33333333333334" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 204.66666666666669 L647.3333333333334 187.66666666666669 L400.00000000000006 187.66666666666669 L400.00000000000006 170.66666666666669" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 133.33333333333334 L542.3333333333334 133.33333333333334" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M152.66666666666669 170.66666666666669 L152.66666666666669 187.66666666666669 L152.66666666666669 187.66666666666669 L152.66666666666669 204.66666666666669" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M152.66666666666669 313.33333333333337 L152.66666666666669 296.33333333333337 L152.66666666666669 296.33333333333337 L152.66666666666669 279.33333333333337" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 242.00000000000003 L295.00000000000006 242.00000000000003" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">dW 的计算还需要前向输入 X，dX 的计算需要权重 W；W 在训练期间常驻。</text>
</svg>