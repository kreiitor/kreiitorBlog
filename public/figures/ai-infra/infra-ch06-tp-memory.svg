.54545454545454" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="665.5" y="289.45454545454544" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">27.52</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">TP8×1</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">每卡内存需求（GB）</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">每卡内存</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">包括权重、实例内全部排队会话的 KV 和 2 GiB 工作区。</text>
</svg>