<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">准备时间决定路由翻转</title>
  <desc id="fig-desc">柱状图：A 排队 10 ms，B 的传输加编码器恢复 12.666 ms，A 排队 20 ms；12.666 ms 是路由翻转的阈值</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">准备时间决定路由翻转</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">A 排队 10 ms 时 A 更早，20 ms 时 B 更早</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="258" x2="750" y2="258" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="262" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="158" x2="750" y2="158" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="162" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">25</text><rect x="151.66666666666669" y="258" width="68" height="100" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="186.66666666666669" y="252" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">10</text><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">A 排队 10 ms</text><rect x="377.00000000000006" y="231.34" width="68" height="126.66" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="412.00000000000006" y="225.34" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">12.666</text><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">B 传输 + 恢复</text><rect x="602.3333333333334" y="158" width="68" height="200" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="637.3333333333334" y="152" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">20</text><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">A 排队 20 ms</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">准备路径</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">准备时间 / ms</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">准备时间</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">两端共同的解码器重放等后续工作略去；灰色为等待队列，其余为传输与恢复。</text>
</svg>