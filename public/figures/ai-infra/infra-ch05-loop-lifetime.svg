<svg xmlns="http://www.w3.org/2000/svg" width="800" height="242" viewBox="0 119 800 242" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">循环层次与临时数据生命周期</title>
  <desc id="fig-desc">三层循环结构：最外层遍历输出块并创建 16 KiB FP32 累加器；中间层 ko 循环 128 次，每轮读取 A、W 块并更新累加器；归约结束后做 BF16 舍入与 SiLU</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="40" y="147" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="179" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">输出块循环 io、jo</text><rect x="254" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="329" y="172.4" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">创建 FP32 累加器：16</text><text x="329" y="187.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">KiB</text><rect x="532" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="607" y="179" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">决定累加器生命周期</text><rect x="40" y="213" width="720" height="58" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="54" y="245" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">ko 循环：共 128 次</text><rect x="254" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="329" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">读取 A、W 块</text><rect x="532" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="607" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">更新累加器</text><rect x="40" y="279" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="311" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">归约结束</text><rect x="254" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="329" y="311" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">BF16 舍入</text><rect x="532" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="607" y="311" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">SiLU</text></svg>