<svg xmlns="http://www.w3.org/2000/svg" width="800" height="242" viewBox="0 119 800 242" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">循环层次与临时数据生命周期</title>
  <desc id="fig-desc">三层循环结构：最外层遍历输出块并创建 16 KiB FP32 累加器；中间层 ko 循环 128 次，每轮读取 A、W 块并更新累加器；归约结束后做 BF16 舍入与 SiLU</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="40" y="147" width="720" height="58" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="54" y="179" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">输出块循环 io、jo</text><rect x="254" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="329" y="172.4" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">创建 FP32 累加器：16</text><text x="329" y="187.25" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">KiB</text><rect x="532" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="607" y="179" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">决定累加器生命周期</text><rect x="40" y="213" width="720" height="58" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/><text x="54" y="245" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">ko 循环：共 128 次</text><rect x="254" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="329" y="245" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">读取 A、W 块</text><rect x="532" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="607" y="245" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">更新累加器</text><rect x="40" y="279" width="720" height="58" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="54" y="311" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">归约结束</text><rect x="254" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="329" y="311" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">BF16 舍入</text><rect x="532" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="607" y="311" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">SiLU</text></svg>