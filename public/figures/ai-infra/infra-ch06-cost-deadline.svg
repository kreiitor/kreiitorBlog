<svg xmlns="http://www.w3.org/2000/svg" width="800" height="368" viewBox="0 64 800 368" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">不同期限下的单位成本</title>
  <desc id="fig-desc">三条曲线分别对应 TP2、TP4、TP8，横轴为完成期限，纵轴为每个按时会话的 GPU·s；三条曲线都从至少三个会话能按时完成的位置开始，TP2 始终最低、TP8 始终最高，期限放宽时三条曲线都下降</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="34" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="151.33333333333331" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">TP2</text><text x="151.33333333333331" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">每实例两张卡</text><text x="46" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">三条曲线中最低</text><text x="46" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">四个会话可并行</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">期限放宽后继续下降</text><rect x="282.66666666666663" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/><text x="399.99999999999994" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">TP4</text><text x="399.99999999999994" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">每实例四张卡</text><text x="294.66666666666663" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">成本居中</text><text x="294.66666666666663" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">单会话快于 TP2</text><text x="294.66666666666663" y="217.89999999999998" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="217.89999999999998" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">两会话串行</text><rect x="531.3333333333333" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/><text x="648.6666666666666" y="118" font-size="14" fill="var(--on-yellow,#3b3024)" font-weight="700" text-anchor="middle">TP8</text><text x="648.6666666666666" y="136" font-size="10.5" fill="var(--on-yellow,#3b3024)" font-weight="400" text-anchor="middle">每实例八张卡</text><text x="543.3333333333333" y="174" font-size="12" fill="var(--on-yellow,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="174" font-size="11.5" fill="var(--on-yellow,#3b3024)" font-weight="400" text-anchor="start">三条曲线中最高</text><text x="543.3333333333333" y="195.95" font-size="12" fill="var(--on-yellow,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="195.95" font-size="11.5" fill="var(--on-yellow,#3b3024)" font-weight="400" text-anchor="start">单会话最快</text><text x="543.3333333333333" y="217.89999999999998" font-size="12" fill="var(--on-yellow,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="217.89999999999998" font-size="11.5" fill="var(--on-yellow,#3b3024)" font-weight="400" text-anchor="start">四会话串行</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line,#c9b49c)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">期限紧</text><text x="730" y="400" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">期限宽</text></svg>