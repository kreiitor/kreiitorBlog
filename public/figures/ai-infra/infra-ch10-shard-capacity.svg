<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">分片数与每卡显存需求</title>
  <desc id="fig-desc">折线图：分片参与者数从 8 到 40 时，每卡显存需求从约 25.3 GiB 降到约 13.1 GiB；22 GiB 的水平线标出可用显存预算</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">分片数与每卡显存需求</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">曲线低于 22 GiB 预算的区域满足容量要求</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="274.6666666666667" x2="750" y2="274.6666666666667" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="278.6666666666667" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="191.33333333333334" x2="750" y2="191.33333333333334" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="195.33333333333334" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">30</text><polyline points="74,147.16666666666666 243,211.33333333333334 412,232.16666666666669 581,243 750,248.83333333333334" fill="none" stroke="var(--blue)" stroke-width="2.4"/><circle cx="74" cy="147.16666666666666" r="3.2" fill="var(--blue)"/><circle cx="243" cy="211.33333333333334" r="3.2" fill="var(--blue)"/><circle cx="412" cy="232.16666666666669" r="3.2" fill="var(--blue)"/><circle cx="581" cy="243" r="3.2" fill="var(--blue)"/><circle cx="750" cy="248.83333333333334" r="3.2" fill="var(--blue)"/><polyline points="74,174.66666666666669 243,174.66666666666669 412,174.66666666666669 581,174.66666666666669 750,174.66666666666669" fill="none" stroke="var(--yellow)" stroke-width="2.4"/><circle cx="74" cy="174.66666666666669" r="3.2" fill="var(--yellow)"/><circle cx="243" cy="174.66666666666669" r="3.2" fill="var(--yellow)"/><circle cx="412" cy="174.66666666666669" r="3.2" fill="var(--yellow)"/><circle cx="581" cy="174.66666666666669" r="3.2" fill="var(--yellow)"/><circle cx="750" cy="174.66666666666669" r="3.2" fill="var(--yellow)"/><text x="74" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">8</text><text x="243" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">16</text><text x="412" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">24</text><text x="581" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">32</text><text x="750" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">40</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">分片参与者数</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">每卡显存需求 / GiB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">分片 + 10 GiB 临时缓冲</text><rect x="196.5" y="86" width="10" height="10" fill="var(--yellow)"/><text x="211.5" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">RTX 4090 可用 22 GiB</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">曲线按 16N/d + 10 GiB 计算，N = 8.19073536e9，16N 约为 122.1 GiB；横轴 0—40，纵轴 0—30 GiB 以上。</text>
</svg>