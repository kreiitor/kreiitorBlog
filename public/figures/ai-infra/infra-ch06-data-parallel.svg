<svg xmlns="http://www.w3.org/2000/svg" width="800" height="344" viewBox="0 68 800 344" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">数据并行的两卡分工</title>
  <desc id="fig-desc">样本 0–7 分成两批：卡 0 接收样本 0–3，卡 1 接收样本 4–7；两张卡各保存一份完整模型并各自输出，训练时通过梯度 AllReduce 汇合</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="109.5" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="214.5" y="138.20833333333334" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">样本 0–7</text>
  <rect x="480.5" y="96" width="210" height="74.66666666666667" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="585.5" y="130.08333333333334" font-size="13" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">卡 0</text>
  <text x="585.5" y="146.33333333333334" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">完整模型 · 样本 0–3</text><rect x="109.5" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="214.5" y="238.75000000000003" font-size="13" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">卡 1</text>
  <text x="214.5" y="255.00000000000003" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">完整模型 · 样本 4–7</text><rect x="480.5" y="204.66666666666669" width="210" height="74.66666666666667" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="585.5" y="246.87500000000003" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">输出 0–3</text>
  <rect x="109.5" y="313.33333333333337" width="210" height="74.66666666666667" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="214.5" y="355.5416666666667" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">输出 4–7</text>
