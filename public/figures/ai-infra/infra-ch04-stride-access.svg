<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 64 800 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">按行跨步读取的量</title>
  <desc id="fig-desc">128 行每行只读取前 256 bytes，相邻行起点相差 8192 bytes；有效数据合计 32 KiB，地址跨度 1,040,640 bytes，跨度约为有效数据的 31.8 倍</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="38" y="92" width="362" height="34" rx="4" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.2"/><text x="219" y="112" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">量</text><rect x="400" y="92" width="362" height="34" rx="4" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.2"/><text x="581" y="112" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">数值</text><rect x="38" y="126" width="362" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="219" y="150" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">每行有效读取</text><rect x="400" y="126" width="362" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="581" y="150" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">256 bytes</text><rect x="38" y="168" width="362" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="219" y="192" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">行步长</text><rect x="400" y="168" width="362" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="581" y="192" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">8,192 bytes</text><rect x="38" y="210" width="362" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="219" y="234" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">读取行数</text><rect x="400" y="210" width="362" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="581" y="234" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">128</text><rect x="38" y="252" width="362" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="219" y="276" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">有效数据</text><rect x="400" y="252" width="362" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="581" y="276" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">32 KiB</text><rect x="38" y="294" width="362" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="219" y="318" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">地址跨度</text><rect x="400" y="294" width="362" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="581" y="318" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">1,040,640 bytes</text><rect x="38" y="336" width="362" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="219" y="360" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">跨度 ÷ 有效数据</text><rect x="400" y="336" width="362" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="581" y="360" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">约 31.8</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">行宽 4096 个 BF16 元素，即 8192 bytes；每行取 128 个元素，即 256 bytes。</text>
</svg>