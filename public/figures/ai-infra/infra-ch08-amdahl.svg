3.71428571428572" r="3.2" fill="var(--yellow)"/><circle cx="750" cy="231" r="3.2" fill="var(--yellow)"/><polyline points="74,286.57142857142856 299.33333333333337,238.92857142857142 524.6666666666667,179.42857142857142 750,119.92857142857142" fill="none" stroke="var(--blue-soft)" stroke-width="2.4"/><circle cx="74" cy="286.57142857142856" r="3.2" fill="var(--blue-soft)"/><circle cx="299.33333333333337" cy="238.92857142857142" r="3.2" fill="var(--blue-soft)"/><circle cx="524.6666666666667" cy="179.42857142857142" r="3.2" fill="var(--blue-soft)"/><circle cx="750" cy="119.92857142857142" r="3.2" fill="var(--blue-soft)"/><text x="74" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">1</text><text x="299.33333333333337" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">2</text><text x="524.6666666666667" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">4</text><text x="750" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">8</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">decode 加速比</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">完整任务加速比</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">decode 占 20%</text><rect x="165.35" y="86" width="10" height="10" fill="var(--yellow)"/><text x="180.35" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">decode 占 50%</text><rect x="248.7" y="86" width="10" height="10" fill="var(--blue-soft)"/><text x="263.7" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">decode 占 80%</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">曲线按 1/((1-f)+f/s) 计算，f 为 decode 占基线时间的比例，s 为 decode 加速比。</text>
</svg>