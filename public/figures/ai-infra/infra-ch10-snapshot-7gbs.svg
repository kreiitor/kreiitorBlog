<svg xmlns="http://www.w3.org/2000/svg" width="800" height="273" viewBox="0 68 800 273" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">7 GB/s 下的快照提交</title>
  <desc id="fig-desc">两条泳道：快照 1 在 20 s 捕获、20.5 s 开始上传并在 36.5 s 提交；快照 2 在 40 s 捕获、40.5 s 开始上传，原定 56.5 s 提交，50 s 故障时尚未完成</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="126" y1="96" x2="126" y2="242" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="126" y="258" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">0</text><line x1="334.66666666666663" y1="96" x2="334.66666666666663" y2="242" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="334.66666666666663" y="258" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">20</text><line x1="543.3333333333333" y1="96" x2="543.3333333333333" y2="242" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="543.3333333333333" y="258" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">40</text><line x1="752" y1="96" x2="752" y2="242" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="752" y="258" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">60</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">快照 1</text><rect x="334.66666666666663" y="115" width="5.216666666666667" height="32" rx="3" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)"/><rect x="339.8833333333333" y="115" width="166.93333333333334" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="423.35" y="134" font-size="9.5" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">上传 16 s</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">快照 2</text><rect x="543.3333333333333" y="157" width="5.216666666666667" height="32" rx="3" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)"/><rect x="548.55" y="157" width="166.93333333333334" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="632.0166666666667" y="176" font-size="9.5" fill="var(--on-blue,#fffefa)" font-weight="600" text-anchor="middle">上传 16 s</text><text x="116" y="219" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">故障</text><rect x="647.6666666666667" y="199" width="2.086666666666696" height="32" rx="3" fill="var(--line-soft,#dce1e8)" stroke="var(--line,#a2aec1)"/><line x1="126" y1="242" x2="752" y2="242" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="278" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">时间 / s</text><text x="400" y="315" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">斜线表示无故障时剩余的上传；空心点为原定提交时刻 36.5 s 与 56.5 s。</text>
</svg>