<svg xmlns="http://www.w3.org/2000/svg" width="800" height="248" viewBox="0 64 800 248" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">双缓冲的槽位状态</title>
  <desc id="fig-desc">表格列出三个时段：0–1.29 μs 槽 A 写入块 0、槽 B 空闲；1.29–1.57 μs 槽 A 读取块 0、槽 B 写入块 1；2.58–2.86 μs 槽 A 写入块 2、槽 B 读取块 1</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="38" y="92" width="217.20000000000005" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.2"/><text x="146.60000000000002" y="112" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">时段</text><rect x="255.20000000000005" y="92" width="253.40000000000003" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.2"/><text x="381.9000000000001" y="112" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">槽 A</text><rect x="508.6000000000001" y="92" width="253.40000000000003" height="34" rx="4" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.2"/><text x="635.3000000000001" y="112" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">槽 B</text><rect x="38" y="126" width="217.20000000000005" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="146.60000000000002" y="150" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">0–1.29 μs</text><rect x="255.20000000000005" y="126" width="253.40000000000003" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="381.9000000000001" y="150" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">写入块 0</text><rect x="508.6000000000001" y="126" width="253.40000000000003" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="635.3000000000001" y="150" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">空闲</text><rect x="38" y="168" width="217.20000000000005" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="146.60000000000002" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">1.29–1.57 μs</text><rect x="255.20000000000005" y="168" width="253.40000000000003" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="381.9000000000001" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">读取块 0</text><rect x="508.6000000000001" y="168" width="253.40000000000003" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="635.3000000000001" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">写入块 1</text><rect x="38" y="210" width="217.20000000000005" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="146.60000000000002" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">2.58–2.86 μs</text><rect x="255.20000000000005" y="210" width="253.40000000000003" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="381.9000000000001" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">写入块 2</text><rect x="508.6000000000001" y="210" width="253.40000000000003" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="635.3000000000001" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">读取块 1</text><text x="400" y="286" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">1.57–2.58 μs 两个槽都没有可算的数据，计算单元空等；颜色固定表示槽 A、B。</text>
</svg>