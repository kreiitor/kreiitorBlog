<svg xmlns="http://www.w3.org/2000/svg" width="800" height="248" viewBox="0 64 800 248" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">双缓冲的槽位状态</title>
  <desc id="fig-desc">表格列出三个时段：0–1.29 μs 槽 A 写入块 0、槽 B 空闲；1.29–1.57 μs 槽 A 读取块 0、槽 B 写入块 1；2.58–2.86 μs 槽 A 写入块 2、槽 B 读取块 1</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="38" y="92" width="217.20000000000005" height="34" rx="4" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.2"/><text x="146.60000000000002" y="112" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">时段</text><rect x="255.20000000000005" y="92" width="253.40000000000003" height="34" rx="4" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.2"/><text x="381.9000000000001" y="112" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">槽 A</text><rect x="508.6000000000001" y="92" width="253.40000000000003" height="34" rx="4" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.2"/><text x="635.3000000000001" y="112" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">槽 B</text><rect x="38" y="126" width="217.20000000000005" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="146.60000000000002" y="150" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">0–1.29 μs</text><rect x="255.20000000000005" y="126" width="253.40000000000003" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="381.9000000000001" y="150" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">写入块 0</text><rect x="508.6000000000001" y="126" width="253.40000000000003" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="635.3000000000001" y="150" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">空闲</text><rect x="38" y="168" width="217.20000000000005" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="146.60000000000002" y="192" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">1.29–1.57 μs</text><rect x="255.20000000000005" y="168" width="253.40000000000003" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="381.9000000000001" y="192" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">读取块 0</text><rect x="508.6000000000001" y="168" width="253.40000000000003" height="42" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="635.3000000000001" y="192" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">写入块 1</text><rect x="38" y="210" width="217.20000000000005" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="146.60000000000002" y="234" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">2.58–2.86 μs</text><rect x="255.20000000000005" y="210" width="253.40000000000003" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="381.9000000000001" y="234" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">写入块 2</text><rect x="508.6000000000001" y="210" width="253.40000000000003" height="42" fill="var(--paper,#f9faf7)" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="635.3000000000001" y="234" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">读取块 1</text><text x="400" y="286" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">1.57–2.58 μs 两个槽都没有可算的数据，计算单元空等；颜色固定表示槽 A、B。</text>
</svg>