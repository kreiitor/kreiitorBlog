<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">在途请求占用请求槽</title>
  <desc id="fig-desc">四个请求槽各有一条时间条，四个请求错开发出，时间条相互交叠；每个请求带回 128 bytes，发出后 500 ns 返回</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">在途请求占用请求槽</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">每个请求 128 bytes，发出后 500 ns 返回</text><line x1="126" y1="96" x2="126" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="282.5" y1="96" x2="282.5" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="282.5" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0.2</text><line x1="439" y1="96" x2="439" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="439" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0.4</text><line x1="595.5" y1="96" x2="595.5" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="595.5" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0.6</text><line x1="752" y1="96" x2="752" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0.8</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">请求 1</text><rect x="126" y="115" width="391.25" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="321.625" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">128 B / 500 ns</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">请求 2</text><rect x="204.25" y="157" width="391.25" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="399.875" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">128 B / 500 ns</text><text x="116" y="219" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">请求 3</text><rect x="282.5" y="199" width="391.24999999999994" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="478.125" y="218" font-size="9.5" fill="var(--on-yellow)" font-weight="600" text-anchor="middle">128 B / 500 ns</text><text x="116" y="261" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">请求 4</text><rect x="360.75" y="241" width="391.25" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="556.375" y="260" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">128 B / 500 ns</text><line x1="126" y1="284" x2="752" y2="284" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="320" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">相对时间 / μs</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">图中只画四个代表请求；横轴为相对时间。</text>
</svg>