<svg xmlns="http://www.w3.org/2000/svg" width="800" height="315" viewBox="0 68 800 315" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">在途请求占用请求槽</title>
  <desc id="fig-desc">四个请求槽各有一条时间条，四个请求错开发出，时间条相互交叠；每个请求带回 128 bytes，发出后 500 ns 返回</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="126" y1="96" x2="126" y2="284" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="126" y="300" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0</text><line x1="282.5" y1="96" x2="282.5" y2="284" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="282.5" y="300" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0.2</text><line x1="439" y1="96" x2="439" y2="284" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="439" y="300" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0.4</text><line x1="595.5" y1="96" x2="595.5" y2="284" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="595.5" y="300" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0.6</text><line x1="752" y1="96" x2="752" y2="284" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="752" y="300" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0.8</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">请求 1</text><rect x="126" y="115" width="391.25" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="321.625" y="134" font-size="9.5" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">128 B / 500 ns</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">请求 2</text><rect x="204.25" y="157" width="391.25" height="32" rx="3" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)"/><text x="399.875" y="176" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">128 B / 500 ns</text><text x="116" y="219" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">请求 3</text><rect x="282.5" y="199" width="391.24999999999994" height="32" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="478.125" y="218" font-size="9.5" fill="var(--on-yellow,#3b3024)" font-weight="600" text-anchor="middle">128 B / 500 ns</text><text x="116" y="261" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">请求 4</text><rect x="360.75" y="241" width="391.25" height="32" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)"/><text x="556.375" y="260" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">128 B / 500 ns</text><line x1="126" y1="284" x2="752" y2="284" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="320" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">相对时间 / μs</text><text x="400" y="357" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">图中只画四个代表请求；横轴为相对时间。</text>
</svg>