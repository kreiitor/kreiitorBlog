<svg xmlns="http://www.w3.org/2000/svg" width="800" height="402" viewBox="0 48 800 402" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Prefill–Decode 分离</title>
  <desc id="fig-desc">Prefill 池与 Decode 池各自持有完整权重，分别处理输入和逐 token 生成；两池之间需要交接上下文 KV。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:12px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:11px;fill:var(--muted,#5f4f3c)}
    .onblue{fill:var(--on-blue,#fffcf5)}
    .onyellow{fill:var(--on-yellow,#3b3024)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <rect x="280" y="76" width="240" height="34" rx="6" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="2"/>
  <text x="400" y="98" text-anchor="middle" class="b">统一调用接口</text>
  <path d="M340 110 V124 H190 V132" stroke="var(--line,#c9b49c)" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M460 110 V124 H610 V132" stroke="var(--line,#c9b49c)" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="132" width="280" height="3" fill="var(--blue,#466b3f)"/><rect x="40" y="132" width="280" height="196" rx="10" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>
  <rect x="40" y="132" width="280" height="42" rx="10" fill="var(--blue,#466b3f)"/>
  <rect x="40" y="160" width="280" height="14" fill="var(--blue,#466b3f)"/>
  <text x="180" y="160" text-anchor="middle" class="h onblue">P 池 · Prefill</text>
  <text x="62" y="200" class="b">完整模型权重</text>
  <text x="62" y="226" class="s">一次处理 P 个输入 token</text>
  <text x="62" y="252" class="s">大矩阵计算，算力密集</text>
  <rect x="62" y="276" width="236" height="30" rx="6" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>
  <text x="180" y="296" text-anchor="middle" class="b">产出首 token 与上下文 KV</text>

  <rect x="480" y="132" width="280" height="3" fill="var(--yellow,#f5d75f)"/><rect x="480" y="132" width="280" height="196" rx="10" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>
  <rect x="480" y="132" width="280" height="42" rx="10" fill="var(--yellow,#f5d75f)"/>
  <rect x="480" y="160" width="280" height="14" fill="var(--yellow,#f5d75f)"/>
  <text x="620" y="160" text-anchor="middle" class="h onyellow">D 池 · Decode</text>
  <text x="502" y="200" class="b">完整模型权重</text>
  <text x="502" y="226" class="s">每步处理 1 个新 token</text>
  <text x="502" y="252" class="s">反复读权重与 KV，带宽密集</text>
  <rect x="502" y="276" width="236" height="30" rx="6" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>
  <text x="620" y="296" text-anchor="middle" class="b">续写后续 G−1 个 token</text>

  <path d="M324 230 H476" stroke="var(--blue,#466b3f)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="212" text-anchor="middle" class="b">KV 交接</text>
  <text x="400" y="256" text-anchor="middle" class="tiny">1.125 GiB</text>
  <text x="400" y="272" text-anchor="middle" class="tiny">48.3 ms @25 GB/s</text>

  <rect x="120" y="366" width="560" height="36" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>
  <text x="400" y="390" text-anchor="middle" class="b">分离不切模型：两个池都持有完整权重，收益来自互不排队</text>
  <text x="400" y="430" text-anchor="middle" class="tiny">代价是状态搬移；值不值得，先看 KV 交接贵不贵。</text>
</svg>
