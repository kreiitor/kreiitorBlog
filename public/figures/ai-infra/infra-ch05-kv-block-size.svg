<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 64 800 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">K/V 块大小与更新次数</title>
  <desc id="fig-desc">三个点沿接口读写量与块对更新次数两个方向排列：b=1 读取最少但更新最多，b=128 读取最多但更新最少，b=64 位于两者之间；从 b=64 移到 b=1，更新次数约增至 41 倍</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="34" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="151.33333333333331" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">b=1</text><text x="151.33333333333331" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">读取少，更新多</text><text x="46" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">接口读写量最低</text><text x="46" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">块对更新次数最高</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">相对 b=64 约 41 倍</text><rect x="282.66666666666663" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="399.99999999999994" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">b=64</text><text x="399.99999999999994" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">折中点</text><text x="294.66666666666663" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">接口读写量居中</text><text x="294.66666666666663" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">更新次数居中</text><rect x="531.3333333333333" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/><text x="648.6666666666666" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">b=128</text><text x="648.6666666666666" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">更新少，读取多</text><text x="543.3333333333333" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">接口读写量最高</text><text x="543.3333333333333" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">块对更新次数最低</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line,#c9b49c)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">少读数据</text><text x="730" y="400" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">少做更新</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">快速缓冲为 RTX PRO 6000 一个线程块的 99 KB 共享内存，序列长 8192、头维度 128，无掩码；b 表示一个 K/V 块包含的 token 数。</text>
</svg>