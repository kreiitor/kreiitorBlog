<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">RTX 4090 的显存占用</title>
  <desc id="fig-desc">三根堆叠柱：8K 四请求与 16K 两请求均为权重 16.4 GB、工作区约 2.15 GB、KV 约 4.83 GB，总计约 23.38 GB；8K 五请求的 KV 约 6.04 GB，总计约 24.59 GB，超过 24 GB 容量线</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="258" x2="750" y2="258" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="262" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="158" x2="750" y2="158" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="162" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">25</text><rect x="151.66666666666669" y="194.00000000000003" width="70" height="163.99999999999997" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="151.66666666666669" y="172.53000000000003" width="70" height="21.47" fill="var(--surface,#fffcf5)" stroke="var(--surface,#fffcf5)"/><rect x="151.66666666666669" y="124.21000000000004" width="70" height="48.32" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">8K token × 4 请求</text><rect x="377.00000000000006" y="194.00000000000003" width="70" height="163.99999999999997" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="377.00000000000006" y="172.53000000000003" width="70" height="21.47" fill="var(--surface,#fffcf5)" stroke="var(--surface,#fffcf5)"/><rect x="377.00000000000006" y="112.13000000000005" width="70" height="60.400000000000006" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">8K token × 5 请求</text><rect x="602.3333333333334" y="194.00000000000003" width="70" height="163.99999999999997" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><rect x="602.3333333333334" y="172.53000000000003" width="70" height="21.47" fill="var(--surface,#fffcf5)" stroke="var(--surface,#fffcf5)"/><rect x="602.3333333333334" y="124.21000000000004" width="70" height="48.32" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">16K token × 2 请求</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">配置</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">RTX 4090 显存占用 / GB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">权重</text><rect x="130" y="86" width="10" height="10" fill="var(--surface,#fffcf5)"/><text x="145" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">工作区</text><rect x="185" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="200" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">KV</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">工作区按 2 GiB 折算为约 2.15 GB；每 token KV 为 144 KiB。</text>
</svg>