<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">RTX 4090 的显存占用</title>
  <desc id="fig-desc">三根堆叠柱：8K 四请求与 16K 两请求均为权重 16.4 GB、工作区约 2.15 GB、KV 约 4.83 GB，总计约 23.38 GB；8K 五请求的 KV 约 6.04 GB，总计约 24.59 GB，超过 24 GB 容量线</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="258" x2="750" y2="258" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="262" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="158" x2="750" y2="158" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="162" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">25</text><rect x="151.66666666666669" y="194.00000000000003" width="70" height="163.99999999999997" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><rect x="151.66666666666669" y="172.53000000000003" width="70" height="21.47" fill="var(--surface,#fffefa)" stroke="var(--surface,#fffefa)"/><rect x="151.66666666666669" y="124.21000000000004" width="70" height="48.32" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">8K token × 4 请求</text><rect x="377.00000000000006" y="194.00000000000003" width="70" height="163.99999999999997" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><rect x="377.00000000000006" y="172.53000000000003" width="70" height="21.47" fill="var(--surface,#fffefa)" stroke="var(--surface,#fffefa)"/><rect x="377.00000000000006" y="112.13000000000005" width="70" height="60.400000000000006" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">8K token × 5 请求</text><rect x="602.3333333333334" y="194.00000000000003" width="70" height="163.99999999999997" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><rect x="602.3333333333334" y="172.53000000000003" width="70" height="21.47" fill="var(--surface,#fffefa)" stroke="var(--surface,#fffefa)"/><rect x="602.3333333333334" y="124.21000000000004" width="70" height="48.32" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">16K token × 2 请求</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">配置</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">RTX 4090 显存占用 / GB</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#2647d7)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">权重</text><rect x="130" y="86" width="10" height="10" fill="var(--surface,#fffefa)"/><text x="145" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">工作区</text><rect x="185" y="86" width="10" height="10" fill="var(--yellow,#ffe04b)"/><text x="200" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">KV</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">工作区按 2 GiB 折算为约 2.15 GB；每 token KV 为 144 KiB。</text>
</svg>