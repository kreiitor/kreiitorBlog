<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">UB 的事务层与传输层</title>
  <desc id="fig-desc">应用 A 与 Jetty A、应用 B 与 Jetty B 分别保留；两个 Jetty 汇入同一条共享传输通道，通道负责序号、确认、重传与拥塞控制；再往下依次是事务、报文、网络交付与远端事务层，按目标端点分派并检查权限</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="40" y="114" width="720" height="58" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="146" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">应用端点</text><rect x="254" y="123" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="329" y="146" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">应用 A → Jetty A</text><rect x="532" y="123" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="607" y="146" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">应用 B → Jetty B</text><rect x="40" y="180" width="720" height="58" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="54" y="212" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">共享传输通道</text><rect x="194" y="189" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="259.5" y="212" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">序号</text><rect x="333" y="189" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="398.5" y="212" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">确认</text><rect x="472" y="189" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="537.5" y="212" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">重传</text><rect x="611" y="189" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="676.5" y="212" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">拥塞控制</text><rect x="40" y="246" width="720" height="58" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="278" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">事务与报文</text><rect x="254" y="255" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="329" y="278" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">事务 → 报文</text><rect x="532" y="255" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="607" y="278" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">网络交付</text><rect x="40" y="312" width="720" height="58" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="54" y="344" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">远端事务层</text><rect x="254" y="321" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="329" y="344" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">按目标端点分派</text><rect x="532" y="321" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="607" y="344" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">检查权限</text></svg>