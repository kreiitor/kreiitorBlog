<svg xmlns="http://www.w3.org/2000/svg" width="800" height="308" viewBox="0 86 800 308" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">UB 的事务层与传输层</title>
  <desc id="fig-desc">应用 A 与 Jetty A、应用 B 与 Jetty B 分别保留；两个 Jetty 汇入同一条共享传输通道，通道负责序号、确认、重传与拥塞控制；再往下依次是事务、报文、网络交付与远端事务层，按目标端点分派并检查权限</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="40" y="114" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="146" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">应用端点</text><rect x="254" y="123" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="329" y="146" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">应用 A → Jetty A</text><rect x="532" y="123" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="607" y="146" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">应用 B → Jetty B</text><rect x="40" y="180" width="720" height="58" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="54" y="212" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">共享传输通道</text><rect x="194" y="189" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="259.5" y="212" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">序号</text><rect x="333" y="189" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="398.5" y="212" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">确认</text><rect x="472" y="189" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="537.5" y="212" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">重传</text><rect x="611" y="189" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="676.5" y="212" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">拥塞控制</text><rect x="40" y="246" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="278" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">事务与报文</text><rect x="254" y="255" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="329" y="278" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">事务 → 报文</text><rect x="532" y="255" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="607" y="278" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">网络交付</text><rect x="40" y="312" width="720" height="58" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="54" y="344" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">远端事务层</text><rect x="254" y="321" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="329" y="344" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">按目标端点分派</text><rect x="532" y="321" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="607" y="344" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">检查权限</text></svg>