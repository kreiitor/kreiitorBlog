rect x="412.00000000000006" y="279.1458333333333" width="32" height="78.85416666666667" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="429.00000000000006" y="273.1458333333333" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">757</text><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">UB 异步读取</text><rect x="603.3333333333334" y="314.3541666666667" width="32" height="43.645833333333336" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="620.3333333333334" y="308.3541666666667" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">419</text><rect x="637.3333333333334" y="305.9166666666667" width="32" height="52.083333333333336" rx="3" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)"/><text x="654.3333333333334" y="299.9166666666667" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">500</text><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">UB Load</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">一次 64 B 远程读取</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">关键路径 / ns</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#2647d7)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">推导</text><rect x="130" y="86" width="10" height="10" fill="var(--yellow,#ffe04b)"/><text x="145" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">仿真</text><text x=