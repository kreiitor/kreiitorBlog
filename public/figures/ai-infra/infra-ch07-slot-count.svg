<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">128 与 391 个槽位的发送节奏</title>
  <desc id="fig-desc">两行时间轴对比：128 个槽位时蓝色载荷发送到约 0.66 μs 结束，随后灰色空闲到 2 μs，再继续发送；391 个槽位时蓝色发送段连续不断</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">128 与 391 个槽位的发送节奏</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">槽位不足时在约 0.66 μs 后断流，2 μs 才恢复</text><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="282.5" y1="96" x2="282.5" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="282.5" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">1</text><line x1="439" y1="96" x2="439" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="439" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">2</text><line x1="595.5" y1="96" x2="595.5" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="595.5" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">3</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">4</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">128 个槽位</text><rect x="126" y="115" width="103.29" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="177.645" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">发送</text><rect x="229.29000000000002" y="115" width="209.70999999999998" height="32" rx="3" fill="var(--line-soft)" stroke="var(--line)"/><text x="334.145" y="134" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">链路空闲</text><rect x="439" y="115" width="313" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="595.5" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">继续发送</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">391 个槽位</text><rect x="126" y="157" width="626" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="439" y="176" font-size="9.5" fill="var(--on-yellow)" font-weight="600" text-anchor="middle">连续发送</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">时间 / μs</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">蓝色为载荷发送，灰色为链路空闲。</text>
</svg>