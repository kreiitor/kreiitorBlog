<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">热点专家在三种 EP 规模下的 skew</title>
  <desc id="fig-desc">柱状图：热点专家收到 128 行，是每专家平均 32 行的 4 倍；最忙卡与每卡平均之比在 EP8 为 1.08，EP32 为 1.36，EP256 为 4.0</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="238.95238095238096" x2="750" y2="238.95238095238096" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="242.95238095238096" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">2</text><line x1="74" y1="119.90476190476193" x2="750" y2="119.90476190476193" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="123.90476190476193" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">4</text><rect x="151.66666666666669" y="293.7142857142857" width="68" height="64.28571428571429" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="186.66666666666669" y="287.7142857142857" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">1.08</text><text x="186.66666666666669" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">EP8</text><rect x="377.00000000000006" y="277.04761904761904" width="68" height="80.95238095238096" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="412.00000000000006" y="271.04761904761904" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">1.36</text><text x="412.00000000000006" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">EP32</text><rect x="602.3333333333334" y="119.90476190476193" width="68" height="238.09523809523807" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="637.3333333333334" y="113.90476190476193" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">4</text><text x="637.3333333333334" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">EP256</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">EP 规模</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">最忙卡 ÷ 每卡平均</text></g><rect x="82" y="86" width="10" height="10" fill="var(--yellow)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">热点卡</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">256 个专家按编号均分，不设副本；虚线表示每卡平均值。</text>
</svg>