<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">粗粒度执行的串行间隙</title>
  <desc id="fig-desc">时间线：投影连续执行八块，每块约 12.8 μs，共 102.4 μs；随后激活执行八块，每块约 1.76 μs，共 14.08 μs，总时间约 116.5 μs，激活开始前存在明显串行间隙</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="256.4166666666667" y1="96" x2="256.4166666666667" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="256.4166666666667" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">25</text><line x1="386.83333333333337" y1="96" x2="386.83333333333337" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="386.83333333333337" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">50</text><line x1="517.25" y1="96" x2="517.25" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="517.25" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">75</text><line x1="647.6666666666667" y1="96" x2="647.6666666666667" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="647.6666666666667" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">100</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">120</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">投影</text><rect x="126" y="115" width="534.1866666666667" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="393.09333333333336" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">8 × 12.8 μs</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">激活</text><rect x="660.1866666666667" y="157" width="73.45066666666666" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="696.912" y="176" font-size="8.5" fill="var(--on-yellow)" font-weight="600" text-anchor="middle">8 × 1.76 μs</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">时间 / μs</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">两次 kernel launch 各 5 μs；图中时间条按计算段排布，轴范围为 0–120 μs。</text>
</svg>