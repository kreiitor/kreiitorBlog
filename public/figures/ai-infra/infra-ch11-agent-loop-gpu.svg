<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">agent 循环放在可抢占 GPU 侧</title>
  <desc id="fig-desc">上层可抢占 GPU 资源中并排放着模型服务、RL 框架与 agent 循环；下层 CPU 沙箱平台中只有沙箱及其文件与进程</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">agent 循环放在可抢占 GPU 侧</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">抢占发生时循环状态随容器丢失</text><rect x="40" y="180" width="720" height="58" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="212" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">可抢占 GPU 资源</text><rect x="207.66666666666669" y="189" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="282.6666666666667" y="212" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">模型服务</text><rect x="393.00000000000006" y="189" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="468.00000000000006" y="212" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">RL 框架</text><rect x="578.3333333333334" y="189" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="653.3333333333334" y="212" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">agent 循环</text><rect x="40" y="246" width="720" height="58" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="54" y="278" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">CPU 沙箱平台</text><rect x="393" y="255" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="468" y="278" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">沙箱：文件与进程</text></svg>