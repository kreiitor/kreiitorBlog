font-weight="600" text-anchor="middle">120</text><text x="750" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">140</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">重复执行的组数</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">准备加执行 / ms</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">通用</text><rect x="130" y="86" width="10" height="10" fill="var(--yellow)"/><text x="145" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">分桶</text><rect x="178" y="86" width="10" height="10" fill="var(--muted)"/><text x="193" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">特化</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">「通用」用同一执行方案处理所有形状，「分桶」把相近形状归组，「特化」为具体形状选择专用方案；交点用未四舍五入的数值计算。</text>
</svg>