<svg xmlns="http://www.w3.org/2000/svg" width="800" height="231" viewBox="0 68 800 231" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">决策请求与普通 LLM 的时间轴</title>
  <desc id="fig-desc">上泳道为决策请求：prefill 1929 个 token 用 70.5 毫秒，8 个位置的答案一次读出；下泳道为普通 LLM：prefill 后执行 63 步 decode，每步 9.2 毫秒，在约 651 毫秒结束</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0</text><line x1="304.8571428571429" y1="96" x2="304.8571428571429" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="304.8571428571429" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">200</text><line x1="483.7142857142857" y1="96" x2="483.7142857142857" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="483.7142857142857" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">400</text><line x1="662.5714285714286" y1="96" x2="662.5714285714286" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="662.5714285714286" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">600</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">700</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">决策请求</text><rect x="126" y="115" width="63.04714285714286" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="157.52357142857142" y="134" font-size="8" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">prefil…</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">普通 LLM</text><rect x="126" y="157" width="63.04714285714286" height="32" rx="3" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)"/><text x="157.52357142857142" y="176" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">prefill</text><rect x="189.04714285714286" y="157" width="518.3280000000001" height="32" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="448.21114285714293" y="176" font-size="9.5" fill="var(--on-yellow,#3b3024)" font-weight="600" text-anchor="middle">63 步 × 9.2 ms</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">时间 / ms</text><text x="400" y="273" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">模型 Qwen3-8B；算力效率取 40%，带宽效率取 50%。</text>
</svg>