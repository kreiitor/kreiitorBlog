<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">决策请求与普通 LLM 的时间轴</title>
  <desc id="fig-desc">上泳道为决策请求：prefill 1929 个 token 用 70.5 毫秒，8 个位置的答案一次读出；下泳道为普通 LLM：prefill 后执行 63 步 decode，每步 9.2 毫秒，在约 651 毫秒结束</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">决策请求与普通 LLM 的时间轴</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">同样的 prefill 后，一个直接读出，一个逐 token 生成</text><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="304.8571428571429" y1="96" x2="304.8571428571429" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="304.8571428571429" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">200</text><line x1="483.7142857142857" y1="96" x2="483.7142857142857" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="483.7142857142857" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">400</text><line x1="662.5714285714286" y1="96" x2="662.5714285714286" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="662.5714285714286" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">600</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">700</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">决策请求</text><rect x="126" y="115" width="63.04714285714286" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="157.52357142857142" y="134" font-size="8" fill="var(--on-blue)" font-weight="600" text-anchor="middle">prefil…</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">普通 LLM</text><rect x="126" y="157" width="63.04714285714286" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="157.52357142857142" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">prefill</text><rect x="189.04714285714286" y="157" width="518.3280000000001" height="32" rx="3" fill="var(--yellow)" stroke="var(--yellow)"/><text x="448.21114285714293" y="176" font-size="9.5" fill="var(--on-yellow)" font-weight="600" text-anchor="middle">63 步 × 9.2 ms</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">时间 / ms</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">模型 Qwen3-8B；算力效率取 40%，带宽效率取 50%。</text>
</svg>