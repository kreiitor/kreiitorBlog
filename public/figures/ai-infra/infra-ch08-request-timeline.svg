<svg xmlns="http://www.w3.org/2000/svg" width="800" height="231" viewBox="0 68 800 231" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">一条短请求的完整时间线</title>
  <desc id="fig-desc">时间线从 0 到 7 秒：排队 0.1 秒，prefill 0.096 秒，随后 255 个输出间隔各 26.5 毫秒，请求约在 6.95 秒完成，距 7 秒时限只剩约 0.05 秒</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="126" y1="96" x2="126" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="126" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">0</text><line x1="304.8571428571429" y1="96" x2="304.8571428571429" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="304.8571428571429" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">2</text><line x1="483.7142857142857" y1="96" x2="483.7142857142857" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="483.7142857142857" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">4</text><line x1="662.5714285714286" y1="96" x2="662.5714285714286" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="662.5714285714286" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">6</text><line x1="752" y1="96" x2="752" y2="200" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="752" y="216" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">7</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">请求</text><rect x="126" y="115" width="8.942857142857143" height="32" rx="3" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)"/><rect x="134.94285714285715" y="115" width="8.585142857142857" height="32" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><rect x="143.528" y="115" width="604.3135714285714" height="32" rx="3" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)"/><text x="445.6847857142857" y="134" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">decode 255 × 26.5 ms</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">时限</text><rect x="747.8415714285715" y="157" width="4.15842857142857" height="32" rx="3" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)"/><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">从到达起计时 / s</text><text x="400" y="273" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">decode 的 255 个间隔来自 256 个输出 token：prefill 已顺带产生第一个输出。</text>
</svg>