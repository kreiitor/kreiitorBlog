<svg xmlns="http://www.w3.org/2000/svg" width="800" height="348" viewBox="0 57 800 348" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">借用后的物理内存占用</title>
  <desc id="fig-desc">四根柱子仍为四个节点：节点 0 为 80 GB，节点 1 为 80 GB（其中 60 GB 属于任务 1、20 GB 属于任务 0），节点 2 与节点 3 各为 40 GB；每个节点都没有超过 80 GB</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">25</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">50</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">75</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">100</text><rect x="123.5" y="158" width="68" height="200" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="158.5" y="152" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">80</text><text x="158.5" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">节点 0</text><rect x="292.5" y="158" width="68" height="200" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="327.5" y="152" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">80</text><text x="327.5" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">节点 1</text><rect x="461.5" y="258" width="68" height="100" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="496.5" y="252" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">40</text><text x="496.5" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">节点 2</text><rect x="630.5" y="258" width="68" height="100" rx="3" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)"/><text x="665.5" y="252" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">40</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">节点 3</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">已占用物理内存（GB）</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#2647d7)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">已占用</text></svg>