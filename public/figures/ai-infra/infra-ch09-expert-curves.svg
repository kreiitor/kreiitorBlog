<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">复用行数决定 CPU 还是 GPU</title>
  <desc id="fig-desc">折线图：横轴为每个专家收到的 token 数，纵轴为八个专家的路径时间；CPU AVX-512 在 1 个 token 时约 1.46 ms，128 个时约 22.2 ms；CPU AMX 从约 1.46 ms 升到约 2.57 ms；搬权重到 GPU 在各点约 12.5 ms</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="274.6666666666667" x2="750" y2="274.6666666666667" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="278.6666666666667" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="191.33333333333334" x2="750" y2="191.33333333333334" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="195.33333333333334" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">20</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="end">30</text><polyline points="74,345.8333333333333 243,345.75 412,334.25 581,265.0833333333333 750,173" fill="none" stroke="var(--yellow,#f5d75f)" stroke-width="2.4"/><circle cx="74" cy="345.8333333333333" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="243" cy="345.75" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="412" cy="334.25" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="581" cy="265.0833333333333" r="3.2" fill="var(--yellow,#f5d75f)"/><circle cx="750" cy="173" r="3.2" fill="var(--yellow,#f5d75f)"/><polyline points="74,345.8333333333333 243,345.75 412,345.1666666666667 581,343.0833333333333 750,336.5833333333333" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.4"/><circle cx="74" cy="345.8333333333333" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="243" cy="345.75" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="412" cy="345.1666666666667" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="581" cy="343.0833333333333" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="750" cy="336.5833333333333" r="3.2" fill="var(--blue,#466b3f)"/><polyline points="74,253.83333333333331 243,253.83333333333331 412,253.83333333333331 581,253.83333333333331 750,253.83333333333331" fill="none" stroke="var(--muted,#5f4f3c)" stroke-width="2.4"/><circle cx="74" cy="253.83333333333331" r="3.2" fill="var(--muted,#5f4f3c)"/><circle cx="243" cy="253.83333333333331" r="3.2" fill="var(--muted,#5f4f3c)"/><circle cx="412" cy="253.83333333333331" r="3.2" fill="var(--muted,#5f4f3c)"/><circle cx="581" cy="253.83333333333331" r="3.2" fill="var(--muted,#5f4f3c)"/><circle cx="750" cy="253.83333333333331" r="3.2" fill="var(--muted,#5f4f3c)"/><text x="74" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">1</text><text x="243" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">4</text><text x="412" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">16</text><text x="581" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">64</text><text x="750" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">128</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">每专家 token 数（对数刻度）</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">八个专家路径时间 / ms</text></g><rect x="82" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">CPU AVX-512</text><rect x="158.35" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="173.35" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">CPU AMX</text><rect x="219.29999999999998" y="86" width="10" height="10" fill="var(--muted,#5f4f3c)"/><text x="234.29999999999998" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">搬权重到 GPU</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">AVX-512 与 GPU 的交点在 71/72 个 token；AMX 与 GPU 的交点在 688/689 个 token，超出本图横轴范围。曲线为单层专家路径，未含格式转换。</text>
</svg>