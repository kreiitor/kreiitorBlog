<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">后台复制追赶仍在增长的状态</title>
  <desc id="fig-desc">折线图：源端状态从 41.1 GB 起步，以约 0.172 GB/s 缓慢上升；25 GB/s 网卡的待复制量快速下降，约 1.65 秒与源端曲线相交；50 GbE 的待复制量下降较慢，约 6.76 秒相交</desc>
  <style>
