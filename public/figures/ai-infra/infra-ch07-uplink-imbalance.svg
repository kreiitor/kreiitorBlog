<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">最忙上联的相对负载</title>
  <desc id="fig-desc">五根柱按流数与上联数分组：8 流 32 上联约 1.66，32 流 32 上联约 3.53，8 流 16 上联约 2.06，32 流 16 上联约 2.42，128 流 16 上联约 1.67</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">最忙上联的相对负载</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">32 条流配 32 条上联时比值最高，为 3.53</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="295.5" x2="750" y2="295.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="299.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">1</text><line x1="74" y1="233" x2="750" y2="233" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="237" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">2</text><line x1="74" y1="170.5" x2="750" y2="170.5" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="174.5" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">3</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="end">4</text><rect x="106.6" y="254.25" width="68" height="103.75" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="141.6" y="248.25" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">1.66</text><text x="141.6" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">8 流 / 32 上联</text><rect x="241.79999999999995" y="137.375" width="68" height="220.625" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="276.79999999999995" y="131.375" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">3.53</text><text x="276.79999999999995" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">32 流 / 32 上联</text><rect x="377" y="229.25" width="68" height="128.75" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="412" y="223.25" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">2.06</text><text x="412" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">8 流 / 16 上联</text><rect x="512.1999999999999" y="206.75" width="68" height="151.25" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="547.1999999999999" y="200.75" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">2.42</text><text x="547.1999999999999" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">32 流 / 16 上联</text><rect x="647.4" y="253.625" width="68" height="104.375" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="682.4" y="247.625" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">1.67</text><text x="682.4" y="378" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="middle">128 流 / 16 上联</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">流数与上联数</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">最忙上联流数 / 无冲突值</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue)"/><text x="97" y="95" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">相对负载</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">32 条上联对应无阻塞叶交换机，16 条上联对应 3:1 超售叶交换机；纵轴为 E[Lmax]/ceil(n/m)。</text>
</svg>