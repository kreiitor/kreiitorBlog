<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Q 投影的计算与读取耗时</title>
  <desc id="fig-desc">两条折线随 token 数 M 变化：矩阵计算从接近 0 上升到 M = 256 时约 52 μs；片外读取从约 33 μs 缓慢升到约 37 μs；两条线在约 179 行处交叉</desc>
