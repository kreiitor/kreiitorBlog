<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">单槽处理四块</title>
  <desc id="fig-desc">四条泳道对应块 0 至块 3；每块占用 320 tick，依次为传输、等待返回、计算，四块首尾相接，最后在 1280 tick 完成</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">单槽处理四块</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">传输与计算完全不重叠，完成于 1280 tick</text><line x1="126" y1="96" x2="126" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="370.53125" y1="96" x2="370.53125" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="370.53125" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">500</text><line x1="615.0625" y1="96" x2="615.0625" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="615.0625" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">1000</text><line x1="752" y1="96" x2="752" y2="284" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="300" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">1280</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">块 0</text><rect x="126" y="115" width="31.3" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="141.65" y="134" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">传输</text><rect x="157.3" y="115" width="62.6" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="188.60000000000002" y="134" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">等待</text><rect x="219.89999999999998" y="115" width="62.6" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="251.2" y="134" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">计算</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">块 1</text><rect x="282.5" y="157" width="31.3" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="298.15" y="176" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">传输</text><rect x="313.79999999999995" y="157" width="62.6" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="345.09999999999997" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">等待</text><rect x="376.4" y="157" width="62.6" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="407.7" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">计算</text><text x="116" y="219" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">块 2</text><rect x="439" y="199" width="31.3" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="454.65" y="218" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">传输</text><rect x="470.3" y="199" width="62.6" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="501.6" y="218" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">等待</text><rect x="532.9000000000001" y="199" width="62.6" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="564.2" y="218" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">计算</text><text x="116" y="261" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">块 3</text><rect x="595.5" y="241" width="31.3" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="611.15" y="260" font-size="9.5" fill="var(--on-blue)" font-weight="600" text-anchor="middle">传输</text><rect x="626.8" y="241" width="62.6" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="658.0999999999999" y="260" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">等待</text><rect x="689.4" y="241" width="62.6" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="720.6999999999999" y="260" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">计算</text><line x1="126" y1="284" x2="752" y2="284" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="320" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">时间 / tick</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">横轴与两槽、三槽图使用同一尺度。</text>
</svg>