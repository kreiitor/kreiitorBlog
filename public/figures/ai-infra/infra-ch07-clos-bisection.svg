<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 58 800 386" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">两层 Clos 与半分割集</title>
  <desc id="fig-desc">上方两台脊交换机，下方四台叶交换机，每台叶交换机都连到两台脊交换机；每台叶交换机下挂 32 个端点，中间虚线把端点分成左右两半，穿过虚线的叶—脊链路构成半分割集</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="80" y1="240" x2="270" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="240" x2="470" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="270" y1="240" x2="270" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="270" y1="240" x2="470" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="460" y1="240" x2="270" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="460" y1="240" x2="470" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="650" y1="240" x2="270" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="650" y1="240" x2="470" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="240" x2="80" y2="380" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="270" y1="240" x2="270" y2="380" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="460" y1="240" x2="460" y2="380" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="650" y1="240" x2="650" y2="380" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="86" width="100" height="48" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="270" y="114.125" font-size="11" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">脊交换机 0</text>
  <rect x="420" y="86" width="100" height="48" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="470" y="114.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">脊交换机 1</text>
  <rect x="30" y="216" width="100" height="48" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="80" y="244.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">叶交换机 0</text>
  <rect x="220" y="216" width="100" height="48" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="270" y="244.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">叶交换机 1</text>
  <rect x="410" y="216" width="100" height="48" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="460" y="244.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">叶交换机 2</text>
  <rect x="600" y="216" width="100" height="48" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="650" y="244.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">叶交换机 3</text>
  <rect x="30" y="356" width="100" height="48" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="80" y="384.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">32 端点</text>
  <rect x="220" y="356" width="100" height="48" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="270" y="384.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">32 端点</text>
  <rect x="410" y="356" width="100" height="48" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="460" y="384.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">32 端点</text>
  <rect x="600" y="356" width="100" height="48" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="650" y="384.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">32 端点</text>
  <text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">图中以四台叶交换机和两台脊交换机作代表；64 端口配置实际为 64 台叶交换机、32 台脊交换机，每台叶交换机一半端口接服务器、一半接脊交换机。</text>
</svg>