ext x="483.7142857142857" y="134" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">到最近快照 8192</text><rect x="602.952380952381" y="115" width="149.04761904761904" height="32" rx="3" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)"/><text x="677.4761904761905" y="134" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">重算 2560 token</text><line x1="126" y1="158" x2="752" y2="158" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="194" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">从序列起点累计 / token</text></svg>