<svg xmlns="http://www.w3.org/2000/svg" width="800" height="278" viewBox="0 119 800 278" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">三级缓存与重算起点</title>
  <desc id="fig-desc">三层从上到下：图片 0.8 MB，需要重做视觉编码与语言前缀；编码缓存 EC 7.8 MiB，从语言前缀处理开始；视觉 token KV 56.3 MiB，从匹配前缀之后继续</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="40" y="147" width="720" height="58" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="54" y="179" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">图片</text><rect x="207.66666666666669" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="282.6666666666667" y="179" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">0.8 MB</text><rect x="393.00000000000006" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="468.00000000000006" y="179" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">重做视觉编码与语言前缀</text><rect x="578.3333333333334" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="653.3333333333334" y="179" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">最慢恢复</text><rect x="40" y="213" width="720" height="58" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/><text x="54" y="245" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">编码缓存 EC</text><rect x="207.66666666666669" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="282.6666666666667" y="245" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">7.8 MiB</text><rect x="393.00000000000006" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="468.00000000000006" y="245" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">省去视觉编码</text><rect x="578.3333333333334" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="653.3333333333334" y="245" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">从语言前缀处理开始</text><rect x="40" y="279" width="720" height="58" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="54" y="311" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">视觉 token KV</text><rect x="207.66666666666669" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="282.6666666666667" y="311" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">56.3 MiB</text><rect x="393.00000000000006" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="468.00000000000006" y="311" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">省去已处理前缀的计算</text><rect x="578.3333333333334" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="653.3333333333334" y="311" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">从匹配前缀之后继续</text><text x="400" y="371" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">KV 需匹配模型权重、前缀与 token 位置索引；容量对应固定视觉配置。</text>
</svg>