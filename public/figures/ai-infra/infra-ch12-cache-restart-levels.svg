<svg xmlns="http://www.w3.org/2000/svg" width="800" height="278" viewBox="0 119 800 278" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">三级缓存与重算起点</title>
  <desc id="fig-desc">三层从上到下：图片 0.8 MB，需要重做视觉编码与语言前缀；编码缓存 EC 7.8 MiB，从语言前缀处理开始；视觉 token KV 56.3 MiB，从匹配前缀之后继续</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="40" y="147" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="179" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">图片</text><rect x="207.66666666666669" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="282.6666666666667" y="179" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">0.8 MB</text><rect x="393.00000000000006" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468.00000000000006" y="179" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">重做视觉编码与语言前缀</text><rect x="578.3333333333334" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="653.3333333333334" y="179" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">最慢恢复</text><rect x="40" y="213" width="720" height="58" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="54" y="245" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">编码缓存 EC</text><rect x="207.66666666666669" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="282.6666666666667" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">7.8 MiB</text><rect x="393.00000000000006" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468.00000000000006" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">省去视觉编码</text><rect x="578.3333333333334" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="653.3333333333334" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">从语言前缀处理开始</text><rect x="40" y="279" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="311" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">视觉 token KV</text><rect x="207.66666666666669" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="282.6666666666667" y="311" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">56.3 MiB</text><rect x="393.00000000000006" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468.00000000000006" y="311" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">省去已处理前缀的计算</text><rect x="578.3333333333334" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="653.3333333333334" y="311" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">从匹配前缀之后继续</text><text x="400" y="371" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">KV 需匹配模型权重、前缀与 token 位置索引；容量对应固定视觉配置。</text>
</svg>