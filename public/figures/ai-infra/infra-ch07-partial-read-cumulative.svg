 cx="344.4" cy="260.625" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="479.59999999999997" cy="259.90625" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="614.8" cy="259.1875" r="3.2" fill="var(--blue,#466b3f)"/><circle cx="750" cy="258.46875" r="3.2" fill="var(--blue,#466b3f)"/><text x="74" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">0</text><text x="209.2" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">5</text><text x="344.4" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">10</text><text x="479.59999999999997" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">15</text><text x="614.8" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">20</text><text x="750" y="378" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">25</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#c9b49c)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">复用次数</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">累计时间 / ms</text></g><rect x="82" y="86" width="10" height="10" fill="var(--yellow,#f5d75f)"/><text x="97" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">每次远程读取</text><rect x="158" y="86" width="10" height="10" fill="var(--blue,#466b3f)"/><text x="173" y="95" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">先搬回本地</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">本图假设本地读取不产生额外跨网络流量。</text>
