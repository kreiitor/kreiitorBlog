<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">只读取 10% 时的累计时间</title>
  <desc id="fig-desc">横轴为复用次数 0 到 25，纵轴为累计时间 0 到 7 ms；每次远程读取按 0.302 ms 每次上升，先搬回本地从 3.07 ms 起按 0.0046 ms 每次缓慢上升，两线在约 10.3 次相交</desc>
