<svg xmlns="http://www.w3.org/2000/svg" width="800" height="368" viewBox="0 76 800 368" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">沙箱的三个隔离方向</title>
  <desc id="fig-desc">沙箱内部有 agent 进程与平台代理进程，两者之间由 AppArmor 限制；沙箱经 eBPF 白名单访问外部网络，经虚拟化与配额与其他沙箱隔开，另有输出与写盘上限</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="47.66666666666667" y="104.5" width="210" height="112" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="157.25" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">沙箱</text>
  <text x="152.66666666666669" y="173.5" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">agent 与平台代理 · AppArmor</text><rect x="295.00000000000006" y="104.5" width="210" height="112" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">eBPF 白名单</text>
  <text x="400.00000000000006" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">逐包检查地址与端口</text><rect x="542.3333333333334" y="104.5" width="210" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">外部网络</text>
  <text x="647.3333333333334" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">仅放行任务白名单</text><rect x="47.66666666666667" y="267.5" width="210" height="112" rx="8" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="320.25" font-size="13" fill="var(--on-yellow,#202735)" font-weight="700" text-anchor="middle">虚拟化与配额</text>
  <text x="152.66666666666669" y="336.5" font-size="12" fill="var(--on-yellow,#202735)" font-weight="400" text-anchor="middle">隔离其他沙箱</text><rect x="295.00000000000006" y="267.5" width="210" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="320.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">其他沙箱</text>
  <text x="400.00000000000006" y="336.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">独立边界</text><rect x="542.3333333333334" y="267.5" width="210" height="112" rx="8" fill="var(--line-soft,#dce1e8)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="320.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">输出与写盘上限</text>
  <text x="647.3333333333334" y="336.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">防止日志无限增长</text><path d="M257.6666666666667 160.5 L295.00000000000006 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 160.5 L542.3333333333334 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M152.66666666666669 216.5 L152.66666666666669 242 L152.66666666666669 242 L152.66666666666669 267.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 323.5 L295.00000000000006 323.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M152.66666666666669 216.5 L152.66666666666669 242 L647.3333333333334 242 L647.3333333333334 267.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">沙箱内另设输出量与写盘量上限。</text>
</svg>