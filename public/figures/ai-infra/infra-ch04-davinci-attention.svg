<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 64 800 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">DaVinci 注意力的存储与通路</title>
  <desc id="fig-desc">全局内存保存权重与 Q、K、V，经 MTE 或 NDDMA 进入 L1 或 UB；L0A、L0B 供 Cube 或 AIC 做 QK、PV 并写入 L0C；Vector 或 AIV 做 Softmax 与归约；两者之间可走 CV 直通或经 UB、L1 交接</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="40" y="92" width="720" height="53.6" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="121.8" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">全局内存</text><rect x="393" y="101" width="150" height="35.6" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468" y="121.8" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">权重、Q、K、V</text><rect x="40" y="153.6" width="720" height="53.6" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="54" y="183.4" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">搬移</text><rect x="393" y="162.6" width="150" height="35.6" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468" y="176.8" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">MTE / NDDMA：搬移与地址</text><text x="468" y="191.65" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">生成</text><rect x="40" y="215.2" width="720" height="53.6" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="245" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">片上缓冲</text><rect x="207.66666666666669" y="224.2" width="150" height="35.6" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="282.6666666666667" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">L1 / UB：行组与缓冲槽</text><rect x="393.00000000000006" y="224.2" width="150" height="35.6" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468.00000000000006" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">L0A / L0B：输入 tile</text><rect x="578.3333333333334" y="224.2" width="150" height="35.6" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="653.3333333333334" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">L0C：部分和</text><rect x="40" y="276.8" width="720" height="53.6" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="54" y="306.6" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">计算单元</text><rect x="207.66666666666669" y="285.8" width="150" height="35.6" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="282.6666666666667" y="306.6" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">Cube / AIC：QK、PV</text><rect x="393.00000000000006" y="285.8" width="150" height="35.6" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468.00000000000006" y="300" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">Vector / AIV：Softmax</text><text x="468.00000000000006" y="314.85" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">、归约</text><rect x="578.3333333333334" y="285.8" width="150" height="35.6" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="653.3333333333334" y="306.6" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">Scalar：循环、地址、同步</text><rect x="40" y="338.4" width="720" height="53.6" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="368.2" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">计算顺序</text><rect x="393" y="347.4" width="150" height="35.6" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468" y="368.2" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">QK → Softmax → PV</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">Scalar 负责循环、地址与同步；计算顺序为 QK → Softmax → PV。</text>
</svg>