<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">DaVinci 注意力的存储与通路</title>
  <desc id="fig-desc">全局内存保存权重与 Q、K、V，经 MTE 或 NDDMA 进入 L1 或 UB；L0A、L0B 供 Cube 或 AIC 做 QK、PV 并写入 L0C；Vector 或 AIV 做 Softmax 与归约；两者之间可走 CV 直通或经 UB、L1 交接</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="40" y="92" width="720" height="53.6" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="121.8" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">全局内存</text><rect x="393" y="101" width="150" height="35.6" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="468" y="121.8" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">权重、Q、K、V</text><rect x="40" y="153.6" width="720" height="53.6" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="54" y="183.4" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">搬移</text><rect x="393" y="162.6" width="150" height="35.6" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="468" y="176.8" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">MTE / NDDMA：搬移与地址</text><text x="468" y="191.65" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">生成</text><rect x="40" y="215.2" width="720" height="53.6" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="245" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">片上缓冲</text><rect x="207.66666666666669" y="224.2" width="150" height="35.6" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="282.6666666666667" y="245" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">L1 / UB：行组与缓冲槽</text><rect x="393.00000000000006" y="224.2" width="150" height="35.6" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="468.00000000000006" y="245" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">L0A / L0B：输入 tile</text><rect x="578.3333333333334" y="224.2" width="150" height="35.6" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="653.3333333333334" y="245" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">L0C：部分和</text><rect x="40" y="276.8" width="720" height="53.6" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="54" y="306.6" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">计算单元</text><rect x="207.66666666666669" y="285.8" width="150" height="35.6" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="282.6666666666667" y="306.6" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">Cube / AIC：QK、PV</text><rect x="393.00000000000006" y="285.8" width="150" height="35.6" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="468.00000000000006" y="300" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">Vector / AIV：Softmax</text><text x="468.00000000000006" y="314.85" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">、归约</text><rect x="578.3333333333334" y="285.8" width="150" height="35.6" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="653.3333333333334" y="306.6" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">Scalar：循环、地址、同步</text><rect x="40" y="338.4" width="720" height="53.6" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="368.2" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">计算顺序</text><rect x="393" y="347.4" width="150" height="35.6" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="468" y="368.2" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">QK → Softmax → PV</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">Scalar 负责循环、地址与同步；计算顺序为 QK → Softmax → PV。</text>
</svg>