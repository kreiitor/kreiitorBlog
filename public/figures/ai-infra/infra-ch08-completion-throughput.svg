ne-soft)" stroke-width="1"/><text x="641.3333333333333" y="224" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">—</text><rect x="38" y="240" width="482.66666666666663" height="38" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="279.3333333333333" y="262" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">连续 · 1/s</text><rect x="520.6666666666666" y="240" width="241.33333333333331" height="38" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="641.3333333333333" y="262" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">—</text><rect x="38" y="278" width="482.66666666666663" height="38" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="279.3333333333333" y="300" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">连续 · 4/s</text><rect x="520.6666666666666" y="278" width="241.33333333333331" height="38" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="641.3333333333333" y="300" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">2.33</text><rect x="38" y="316" width="482.66666666666663" height="38" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="279.3333333333333" y="338" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">连续 · 16/s</text><rect x="520.6666666666666" y="316" width="241.33333333333331" height="38" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="641.3333333333333" y="338" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">2.38</text><rect x="38" y="354" width="482.66666666666663" height="38" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="279.3333333333333" y="376" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">突发一次到达</text><rect x="520.6666666666666" y="354" width="241.33333333333331" height="38"