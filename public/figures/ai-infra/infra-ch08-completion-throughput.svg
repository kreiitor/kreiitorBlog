<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">七组条件的完成吞吐</title>
  <desc id="fig-desc">七组条件的完成吞吐表：逐个 4 约 1.22 req/s，连续 4 约 2.33 req/s，连续 16 约 2.38 req/s；其余条件未给出具体中位数</desc>
