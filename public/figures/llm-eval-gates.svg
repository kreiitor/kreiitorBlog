<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" font-family="'DM Sans Variable','PingFang SC','Microsoft YaHei',sans-serif">
  <title>LLM 软件工程评测的四层流水线与样本回溯闭环</title>
  <desc>展示 datasets、prompts、runs 与 analysis 四层目录下的数据流，每条评测运行可按同一样本编号追溯原始输入、提示词模板和模型输出，并通过典型错例反向迭代规则与数据集。</desc>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#57575e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#2f5268" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="248" rx="12" fill="#faf9f6" stroke="#e4e2db" stroke-width="1"/>

  <text x="28" y="34" font-size="12.5" font-weight="600" fill="#18181b">四层可复现评测流水线与目录对应关系</text>

  <!-- Main horizontal pipeline rail at y=104 -->
  <path d="M 164 104 L 204 104" fill="none" stroke="#57575e" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <path d="M 344 104 L 384 104" fill="none" stroke="#57575e" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <path d="M 524 104 L 564 104" fill="none" stroke="#2f5268" stroke-width="1.6" marker-end="url(#arr-b)"/>

  <!-- Stage 1 -->
  <rect x="34" y="72" width="128" height="64" rx="8" fill="#ffffff" stroke="#d4d1c8" stroke-width="1.2"/>
  <text x="46" y="92" font-size="10.5" font-weight="600" fill="#18181b">datasets/</text>
  <text x="46" y="109" font-size="9.5" fill="#57575e">冻结 task_id、输入</text>
  <text x="46" y="123" font-size="9.5" fill="#71717a">与期望参考答案</text>

  <!-- Stage 2 -->
  <rect x="214" y="72" width="128" height="64" rx="8" fill="#ffffff" stroke="#d4d1c8" stroke-width="1.2"/>
  <text x="226" y="92" font-size="10.5" font-weight="600" fill="#18181b">prompts/</text>
  <text x="226" y="109" font-size="9.5" fill="#57575e">版本化提示词模板</text>
  <text x="226" y="123" font-size="9.5" fill="#71717a">与格式约束规则</text>

  <!-- Stage 3 -->
  <rect x="394" y="72" width="128" height="64" rx="8" fill="#ffffff" stroke="#d4d1c8" stroke-width="1.2"/>
  <text x="406" y="92" font-size="10.5" font-weight="600" fill="#18181b">runs/</text>
  <text x="406" y="109" font-size="9.5" fill="#57575e">统一接口运行并记录</text>
  <text x="406" y="123" font-size="9.5" fill="#71717a">模型版本与原始输出</text>

  <!-- Stage 4 (accented) -->
  <rect x="574" y="72" width="186" height="64" rx="8" fill="#eef3f6" stroke="#2f5268" stroke-width="1.7"/>
  <text x="588" y="92" font-size="10.5" font-weight="600" fill="#2f5268">analysis/ · 论文证据层</text>
  <text x="588" y="109" font-size="9.5" fill="#18181b">分层指标、消融表、典型错例</text>
  <text x="588" y="123" font-size="9.5" fill="#57575e">按 task_id 直接回溯原始输入</text>

  <!-- Feedback return loop along bottom -->
  <path d="M 667 138 L 667 182 L 98 182 L 98 142" fill="none" stroke="#2f5268" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-b)"/>
  <path d="M 278 182 L 278 142" fill="none" stroke="#2f5268" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr-b)"/>
  <text x="384" y="199" font-size="10.5" font-weight="600" fill="#2f5268" text-anchor="middle">错例归因反向补充边界样本、校准提示词并迭代评测</text>
</svg>
