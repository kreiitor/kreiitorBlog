<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 272" width="800" height="272" font-family="'DM Sans Variable','PingFang SC','Microsoft YaHei',sans-serif">
  <title>Post-Norm 与 Pre-Norm 反向梯度路径对比</title>
  <desc>上方 Post-Norm 的残差主干每层都被 Norm 截断；下方 Pre-Norm 保留了一条直通输入输出的无阻断恒等梯度通道。</desc>
  <defs>
    <marker id="arr-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#57575e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-hi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#2f5268" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="270" rx="12" fill="#faf9f6" stroke="#e4e2db" stroke-width="1"/>

  <!-- Top Track: Post-Norm -->
  <text x="28" y="34" font-size="12.5" font-weight="600" fill="#18181b">Post-Norm · 主干被归一化切分</text>
  <text x="28" y="88" font-size="10.5" fill="#57575e">x_l</text>
  <path d="M 52 84 L 120 84" fill="none" stroke="#57575e" stroke-width="1.4" marker-end="url(#arr-n)"/>
  <!-- Sublayer 1 detour -->
  <path d="M 92 84 L 92 52 L 138 52" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-n)"/>
  <rect x="140" y="38" width="90" height="28" rx="5" fill="#ffffff" stroke="#d4d1c8" stroke-width="1.1"/>
  <text x="155" y="56" font-size="9.5" fill="#18181b">Sublayer k</text>
  <path d="M 230 52 L 266 52 L 266 72" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-n)"/>
  <path d="M 122 84 L 254 84" fill="none" stroke="#57575e" stroke-width="1.4" marker-end="url(#arr-n)"/>
  <circle cx="266" cy="84" r="10" fill="#ffffff" stroke="#57575e" stroke-width="1.2"/>
  <path d="M 262 84 L 270 84 M 266 80 L 266 88" fill="none" stroke="#57575e" stroke-width="1.3"/>
  <!-- Norm 1 right on the main trunk! -->
  <path d="M 276 84 L 306 84" fill="none" stroke="#57575e" stroke-width="1.4" marker-end="url(#arr-n)"/>
  <rect x="308" y="68" width="76" height="32" rx="5" fill="#f4f3ef" stroke="#18181b" stroke-width="1.3"/>
  <text x="327" y="88" font-size="10.5" font-weight="600" fill="#18181b">Norm</text>

  <!-- Sublayer 2 + Norm 2 -->
  <path d="M 384 84 L 444 84" fill="none" stroke="#57575e" stroke-width="1.4" marker-end="url(#arr-n)"/>
  <path d="M 412 84 L 412 52 L 456 52" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-n)"/>
  <rect x="458" y="38" width="90" height="28" rx="5" fill="#ffffff" stroke="#d4d1c8" stroke-width="1.1"/>
  <text x="470" y="56" font-size="9.5" fill="#18181b">Sublayer k+1</text>
  <path d="M 548 52 L 584 52 L 584 72" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arr-n)"/>
  <path d="M 446 84 L 572 84" fill="none" stroke="#57575e" stroke-width="1.4" marker-end="url(#arr-n)"/>
  <circle cx="584" cy="84" r="10" fill="#ffffff" stroke="#57575e" stroke-width="1.2"/>
  <path d="M 580 84 L 588 84 M 584 80 L 584 88" fill="none" stroke="#57575e" stroke-width="1.3"/>
  <path d="M 594 84 L 624 84" fill="none" stroke="#57575e" stroke-width="1.4" marker-end="url(#arr-n)"/>
  <rect x="626" y="68" width="76" height="32" rx="5" fill="#f4f3ef" stroke="#18181b" stroke-width="1.3"/>
  <text x="645" y="88" font-size="10.5" font-weight="600" fill="#18181b">Norm</text>
  <path d="M 702 84 L 748 84" fill="none" stroke="#57575e" stroke-width="1.4" marker-end="url(#arr-n)"/>
  <text x="754" y="88" font-size="10.5" fill="#57575e">x_L</text>
  <text x="464" y="114" font-size="9.5" fill="#57575e">反向梯度逐层乘过每个 Norm 雅可比，深层易震荡</text>

  <!-- Horizontal divider -->
  <line x1="28" y1="130" x2="772" y2="130" stroke="#e4e2db" stroke-width="1"/>

  <!-- Bottom Track: Pre-Norm (accent highway) -->
  <text x="28" y="156" font-size="12.5" font-weight="600" fill="#2f5268">Pre-Norm · 恒等梯度通道</text>
  <text x="28" y="188" font-size="10.5" font-weight="600" fill="#2f5268">x_l</text>
  <!-- Continuous identity highway rail -->
  <path d="M 52 184 L 746 184" fill="none" stroke="#2f5268" stroke-width="2.4" marker-end="url(#arr-hi)"/>
  <text x="754" y="188" font-size="10.5" font-weight="600" fill="#2f5268">x_L</text>

  <!-- Branch 1 below rail -->
  <path d="M 102 184 L 102 222 L 132 222" fill="none" stroke="#57575e" stroke-width="1.2" marker-end="url(#arr-n)"/>
  <rect x="134" y="206" width="66" height="30" rx="5" fill="#ffffff" stroke="#d4d1c8" stroke-width="1.1"/>
  <text x="148" y="225" font-size="9.5" fill="#18181b">Norm</text>
  <path d="M 200 222 L 218 222" fill="none" stroke="#57575e" stroke-width="1.2" marker-end="url(#arr-n)"/>
  <rect x="220" y="206" width="88" height="30" rx="5" fill="#ffffff" stroke="#d4d1c8" stroke-width="1.1"/>
  <text x="234" y="225" font-size="9.5" fill="#18181b">Sublayer k</text>
  <path d="M 308 222 L 348 222 L 348 196" fill="none" stroke="#57575e" stroke-width="1.2" marker-end="url(#arr-n)"/>
  <circle cx="348" cy="184" r="10" fill="#eaf0f4" stroke="#2f5268" stroke-width="1.5"/>
  <path d="M 344 184 L 352 184 M 348 180 L 348 188" fill="none" stroke="#2f5268" stroke-width="1.5"/>

  <!-- Branch 2 below rail -->
  <path d="M 418 184 L 418 222 L 448 222" fill="none" stroke="#57575e" stroke-width="1.2" marker-end="url(#arr-n)"/>
  <rect x="450" y="206" width="66" height="30" rx="5" fill="#ffffff" stroke="#d4d1c8" stroke-width="1.1"/>
  <text x="464" y="225" font-size="9.5" fill="#18181b">Norm</text>
  <path d="M 516 222 L 534 222" fill="none" stroke="#57575e" stroke-width="1.2" marker-end="url(#arr-n)"/>
  <rect x="536" y="206" width="96" height="30" rx="5" fill="#ffffff" stroke="#d4d1c8" stroke-width="1.1"/>
  <text x="546" y="225" font-size="9.5" fill="#18181b">Sublayer k+1</text>
  <path d="M 632 222 L 672 222 L 672 196" fill="none" stroke="#57575e" stroke-width="1.2" marker-end="url(#arr-n)"/>
  <circle cx="672" cy="184" r="10" fill="#eaf0f4" stroke="#2f5268" stroke-width="1.5"/>
  <path d="M 668 184 L 676 184 M 672 180 L 672 188" fill="none" stroke="#2f5268" stroke-width="1.5"/>

  <text x="394" y="172" font-size="9.5" font-weight="600" fill="#2f5268">恒等通道 ∂L/∂x_l 包含直接项 I，可直通浅层</text>
</svg>
