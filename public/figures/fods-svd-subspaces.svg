<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" font-family="'DM Sans Variable','PingFang SC','Microsoft YaHei',sans-serif">
  <title>矩阵 A 的四大基本子空间与正交直和分解</title>
  <desc>左侧展示 R^n 分解为互相正交的行空间 R(A^T) 与零空间 N(A)；右侧展示 R^m 分解为互相正交的列空间 R(A) 与左零空间 N(A^T)。A 将行空间双射到列空间，而将零空间整体映为零点，最小二乘残差落在左零空间。</desc>
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#2f5268" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#57575e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="288" rx="12" fill="#faf9f6" stroke="#e4e2db" stroke-width="1"/>

  <text x="28" y="34" font-size="12.5" font-weight="600" fill="#18181b">四大基本子空间与线性映射 A（秩 r）的正交分解</text>

  <!-- Left domain: R^n -->
  <text x="64" y="64" font-size="10.5" font-weight="600" fill="#18181b">输入空间 ℝⁿ = R(Aᵀ) ⊕ N(A)</text>
  <!-- Row space tilted plane (dim r) -->
  <path d="M 88 86 L 244 76 L 268 148 L 112 158 Z" fill="#eef3f6" stroke="#2f5268" stroke-width="1.6"/>
  <text x="122" y="114" font-size="10.5" font-weight="600" fill="#2f5268">行空间 R(Aᵀ)</text>
  <text x="122" y="130" font-size="9.5" fill="#57575e">dim = r</text>

  <!-- Origin corner (178, 154) and perpendicular Null space plane N(A) -->
  <path d="M 178 154 L 228 228 L 122 238 L 72 164 Z" fill="#ffffff" stroke="#57575e" stroke-width="1.3"/>
  <path d="M 164 155 L 169 164 L 183 163" fill="none" stroke="#2f5268" stroke-width="1.2"/>
  <circle cx="178" cy="154" r="3.5" fill="#18181b"/>
  <text x="192" y="150" font-size="9.5" fill="#18181b">0</text>
  <text x="108" y="200" font-size="10.5" fill="#18181b">零空间 N(A)</text>
  <text x="108" y="216" font-size="9.5" fill="#57575e">dim = n − r</text>

  <!-- Center bijection and null collapse arrows -->
  <path d="M 264 110 C 340 88, 460 88, 534 110" fill="none" stroke="#2f5268" stroke-width="1.9" marker-end="url(#arr-b)"/>
  <text x="400" y="84" font-size="10.5" font-weight="600" fill="#2f5268" text-anchor="middle">A 一一映射（可逆限制）</text>

  <circle cx="212" cy="112" r="3.5" fill="#2f5268"/>
  <text x="219" y="106" font-size="9.5" fill="#2f5268">xᵣ</text>

  <path d="M 192 198 C 310 194, 440 176, 594 157" fill="none" stroke="#57575e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-g)"/>
  <text x="400" y="216" font-size="9.5" fill="#57575e" text-anchor="middle">A xₙ = 0（零空间整体塌缩到原点）</text>
  <circle cx="186" cy="204" r="3.5" fill="#57575e"/>
  <text x="193" y="220" font-size="9.5" fill="#57575e">xₙ</text>

  <!-- Right codomain: R^m -->
  <text x="514" y="64" font-size="10.5" font-weight="600" fill="#18181b">输出空间 ℝᵐ = R(A) ⊕ N(Aᵀ)</text>
  <!-- Column space plane (dim r) -->
  <path d="M 526 86 L 682 76 L 706 148 L 550 158 Z" fill="#eef3f6" stroke="#2f5268" stroke-width="1.6"/>
  <circle cx="566" cy="112" r="3.5" fill="#2f5268"/>
  <text x="576" y="108" font-size="9.5" font-weight="600" fill="#2f5268">Axᵣ = Ax̂</text>
  <text x="556" y="132" font-size="10.5" font-weight="600" fill="#2f5268">列空间 R(A) · dim = r</text>

  <!-- Origin (600, 155) and Left Null space N(A^T) -->
  <path d="M 600 155 L 650 228 L 544 238 L 494 165 Z" fill="#ffffff" stroke="#57575e" stroke-width="1.3"/>
  <path d="M 586 156 L 591 165 L 605 164" fill="none" stroke="#2f5268" stroke-width="1.2"/>
  <circle cx="600" cy="155" r="3.8" fill="#18181b"/>
  <text x="614" y="151" font-size="9.5" fill="#18181b">0</text>
  <text x="524" y="198" font-size="10.5" fill="#18181b">左零空间 N(Aᵀ)</text>
  <text x="524" y="214" font-size="9.5" fill="#57575e">残差 b − Ax̂ ⊥ R(A)</text>
</svg>
