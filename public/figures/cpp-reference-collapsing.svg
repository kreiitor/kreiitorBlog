<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="'DM Sans Variable','PingFang SC','Microsoft YaHei',sans-serif">
  <title>模板转发引用 T&amp;&amp; 的引用折叠与 std::forward 路由</title>
  <desc>展示转发引用在不同实参类别下的推导、折叠及 std::forward 还原流向。</desc>
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#2f5268" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#57575e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="258" rx="12" fill="#faf9f6" stroke="#e4e2db" stroke-width="1"/>

  <text x="28" y="34" font-size="12.5" font-weight="600" fill="#18181b">转发引用 wrapper(T&amp;&amp; x)：推导、折叠与 std::forward</text>

  <text x="42" y="64" font-size="9.5" fill="#71717a">实参</text>
  <text x="184" y="64" font-size="9.5" fill="#71717a">推导 T</text>
  <text x="348" y="64" font-size="9.5" fill="#71717a">引用折叠</text>
  <text x="548" y="64" font-size="9.5" fill="#71717a">std::forward&lt;T&gt;(x)</text>

  <path d="M 142 98 L 178 98" fill="none" stroke="#2f5268" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <path d="M 294 98 L 340 98" fill="none" stroke="#2f5268" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <path d="M 498 98 L 542 98" fill="none" stroke="#2f5268" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <rect x="34" y="78" width="106" height="40" rx="6" fill="#eef3f6" stroke="#2f5268" stroke-width="1.5"/>
  <text x="46" y="96" font-size="10.5" font-weight="600" fill="#2f5268">左值 int n</text>
  <text x="46" y="110" font-size="9.5" fill="#57575e">具名可取址</text>

  <text x="184" y="95" font-size="10.5" font-weight="600" fill="#2f5268">T = int&amp;</text>
  <text x="184" y="110" font-size="9.5" fill="#57575e">保留左值引用</text>

  <rect x="346" y="78" width="150" height="40" rx="6" fill="#ffffff" stroke="#2f5268" stroke-width="1.3"/>
  <text x="358" y="96" font-size="10.5" fill="#18181b">(int&amp;)&amp;&amp; → <tspan font-weight="600" fill="#2f5268">int&amp;</tspan></text>
  <text x="358" y="110" font-size="9.5" fill="#57575e">见左即折为左引</text>

  <rect x="548" y="78" width="218" height="40" rx="6" fill="#eef3f6" stroke="#2f5268" stroke-width="1.5"/>
  <text x="560" y="96" font-size="10.5" font-weight="600" fill="#2f5268">输出 int&amp;（拷贝）</text>
  <text x="560" y="110" font-size="9.5" fill="#18181b">形参名 x 恒为左值</text>

  <line x1="34" y1="138" x2="766" y2="138" stroke="#e4e2db" stroke-width="1" stroke-dasharray="3 3"/>

  <path d="M 142 178 L 178 178" fill="none" stroke="#57575e" stroke-width="1.4" marker-end="url(#arr-g)"/>
  <path d="M 294 178 L 340 178" fill="none" stroke="#57575e" stroke-width="1.4" marker-end="url(#arr-g)"/>
  <path d="M 498 178 L 542 178" fill="none" stroke="#57575e" stroke-width="1.4" marker-end="url(#arr-g)"/>

  <rect x="34" y="158" width="106" height="40" rx="6" fill="#ffffff" stroke="#57575e" stroke-width="1.3"/>
  <text x="46" y="176" font-size="10.5" font-weight="600" fill="#18181b">右值 0</text>
  <text x="46" y="190" font-size="9.5" fill="#57575e">纯右值/将亡值</text>

  <text x="184" y="175" font-size="10.5" font-weight="600" fill="#18181b">T = int</text>
  <text x="184" y="190" font-size="9.5" fill="#57575e">纯非引用类型</text>

  <rect x="346" y="158" width="150" height="40" rx="6" fill="#ffffff" stroke="#d4d1c8" stroke-width="1.2"/>
  <text x="358" y="176" font-size="10.5" fill="#18181b">int&amp;&amp; → <tspan font-weight="600">int&amp;&amp;</tspan></text>
  <text x="358" y="190" font-size="9.5" fill="#57575e">保持右值引用</text>

  <rect x="548" y="158" width="218" height="40" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.4"/>
  <text x="560" y="176" font-size="10.5" font-weight="600" fill="#18181b">输出 int&amp;&amp;（移动）</text>
  <text x="560" y="190" font-size="9.5" fill="#57575e">按 T 强转回右值</text>

  <text x="34" y="216" font-size="9.5" fill="#71717a">折叠律：有 &amp; 即折 &amp;，仅 &amp;&amp; + &amp;&amp; → &amp;&amp;</text>
</svg>
