<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">工具 schema 散落在轨迹中</title>
  <desc id="fig-desc">上层静态前缀包含 System Prompt 与核心工具定义 web_search、code_interpreter、tool_search；下层轨迹按时间顺序包含查询股价、tool_search_call、get_stock_quote schema、调用与结果、查询 GitHub 贡献者、list_contributors schema、调用与回复</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="40" y="180" width="720" height="58" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="206.3" font-size="9.5" fill="var(--ink)" font-weight="700" text-anchor="start">静态前缀（字节级不变 ·</text><text x="54" y="219.125" font-size="9.5" fill="var(--ink)" font-weight="700" text-anchor="start">KV Cache 持续命中）</text><rect x="254" y="189" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="329" y="212" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">System Prompt</text><rect x="532" y="189" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="607" y="206.9" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">核心工具定义：web_search ·</text><text x="607" y="218.375" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">code_interpreter …</text><rect x="40" y="246" width="720" height="58" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="54" y="271.1" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">轨迹（只增不改 · 新</text><text x="54" y="286.625" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">内容追加在末尾）</text><rect x="194" y="255" width="53.77777777777778" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="220.88888888888889" y="272.9" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">User：查</text><text x="220.88888888888889" y="284.375" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">询 NVD…</text><rect x="255.77777777777777" y="255" width="53.77777777777778" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="282.6666666666667" y="272.9" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">Assistan</text><text x="282.6666