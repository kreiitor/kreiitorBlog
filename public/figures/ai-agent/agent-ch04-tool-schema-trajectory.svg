<svg xmlns="http://www.w3.org/2000/svg" width="800" height="212" viewBox="0 152 800 212" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">工具 schema 散落在轨迹中</title>
  <desc id="fig-desc">上层静态前缀包含 System Prompt 与核心工具定义 web_search、code_interpreter、tool_search；下层轨迹按时间顺序包含查询股价、tool_search_call、get_stock_quote schema、调用与结果、查询 GitHub 贡献者、list_contributors schema、调用与回复</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="40" y="180" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="206.3" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">静态前缀（字节级不变 ·</text><text x="54" y="219.125" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">KV Cache 持续命中）</text><rect x="254" y="189" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="329" y="212" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">System Prompt</text><rect x="532" y="189" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="607" y="206.9" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">核心工具定义：web_search ·</text><text x="607" y="218.375" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">code_interpreter …</text><rect x="40" y="246" width="720" height="58" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="54" y="271.1" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">轨迹（只增不改 · 新</text><text x="54" y="286.625" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">内容追加在末尾）</text><rect x="194" y="255" width="53.77777777777778" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="220.88888888888889" y="272.9" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">User：查</text><text x="220.88888888888889" y="284.375" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">询 NVD…</text><rect x="255.77777777777777" y="255" width="53.77777777777778" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="282.6666666666667" y="272.9" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">Assistan</text><text x="282.6666666666667" y="284.375" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">t：…</text><rect x="317.55555555555554" y="255" width="53.77777777777778" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="344.44444444444446" y="272.9" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">tool_sea</text><text x="344.44444444444446" y="284.375" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">rch_out…</text><rect x="379.33333333333337" y="255" width="53.77777777777778" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="406.2222222222223" y="272.9" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">Assistan</text><text x="406.2222222222223" y="284.375" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">t：调…</text><rect x="441.1111111111111" y="255" width="53.77777777777778" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468" y="272.9" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">User：分</text><text x="468" y="284.375" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">析…</text><rect x="502.8888888888889" y="255" width="53.77777777777778" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="529.7777777777778" y="272.9" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">Assistan</text><text x="529.7777777777778" y="284.375" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">t：…</text><rect x="564.6666666666667" y="255" width="53.77777777777778" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="591.5555555555557" y="272.9" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">tool_sea</text><text x="591.5555555555557" y="284.375" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">rch_out…</text><rect x="626.4444444444445" y="255" width="53.77777777777778" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="653.3333333333334" y="272.9" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">Assistan</text><text x="653.3333333333334" y="284.375" font-size="8.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">t：调用 …</text><rect x="688.2222222222222" y="255" width="53.77777777777778" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="715.1111111111111" y="271.4" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">…… 本轮</text><text x="715.1111111111111" y="286.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">最新内容</text><text x="400" y="338" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">三条规则：首次出现时 prefill 一次；此后作为普通历史命中缓存；不得移除或重排已加载工具。</text>
</svg>