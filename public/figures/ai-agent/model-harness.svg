<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Agent 内部的 Model 与 Harness</title>
  <desc id="fig-desc">Agent 边界内，Harness 负责上下文管理、工具接口、约束、验证和纠正；Model 负责理解、推理与选择行动，工具接口通向外部环境。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .t{font-size:12.5px;font-weight:600;fill:var(--ink)}
    .l{font-size:10.5px;font-weight:400;fill:var(--ink)}
    .m{font-size:9.5px;font-weight:400;fill:var(--muted)}
    .b{fill:var(--blue)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="350" fill="var(--paper,#faf6f0)"/>

  <rect x="32" y="24" width="736" height="304" rx="2" fill="none" stroke="var(--line-soft,#e4d6c5)" stroke-width="1" stroke-dasharray="5 5"/>
  <text x="48" y="46" class="m">Agent 边界</text>

  <text x="52" y="78" class="t">Harness</text>
  <text x="52" y="96" class="m">运行、约束与纠错</text>

  <g stroke="var(--line-soft,#e4d6c5)" stroke-width="1">
    <line x1="52" y1="112" x2="496" y2="112"/>
    <line x1="52" y1="142" x2="496" y2="142"/>
    <line x1="52" y1="172" x2="496" y2="172"/>
    <line x1="52" y1="202" x2="496" y2="202"/>
    <line x1="52" y1="232" x2="496" y2="232"/>
    <line x1="52" y1="262" x2="496" y2="262"/>
  </g>

  <g class="l">
    <text x="52" y="130">上下文管理</text>
    <text x="52" y="160">工具接口</text>
    <text x="52" y="190">约束</text>
    <text x="52" y="220">验证</text>
    <text x="52" y="250">纠正</text>
  </g>
  <g class="m">
    <text x="160" y="130">观察、历史、记忆</text>
    <text x="160" y="160">名称、参数、协议</text>
    <text x="160" y="190">权限、预算、格式</text>
    <text x="160" y="220">结果检查与失败分类</text>
    <text x="160" y="250">重试、回退、修复</text>
  </g>

  <rect x="560" y="112" width="160" height="150" fill="none" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="640" y="142" text-anchor="middle" class="t b">Model</text>
  <g class="l" text-anchor="middle">
    <text x="640" y="174">理解意图</text>
    <text x="640" y="196">推理规划</text>
    <text x="640" y="218">选择行动</text>
  </g>
  <text x="640" y="246" text-anchor="middle" class="m">决策内核</text>

  <path d="M500 160H556" stroke="var(--blue,#466b3f)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M556 200H504" stroke="var(--blue,#466b3f)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="528" y="150" text-anchor="middle" class="m">上下文</text>
  <text x="528" y="214" text-anchor="middle" class="m">决策</text>

  <line x1="52" y1="288" x2="720" y2="288" stroke="var(--line,#c9b49c)" stroke-width="1"/>
  <text x="52" y="306" class="l">工具与动作接口</text>
  <text x="720" y="306" text-anchor="end" class="m">调用协议 · 适配器 · 通向外部环境</text>
</svg>
