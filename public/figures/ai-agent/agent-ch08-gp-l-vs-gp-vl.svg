<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">GP-L 与 GP-VL 的训练测试设计</title>
  <desc id="fig-desc">上栏 GP-L 训练时 J/Q/K 计为 10，测试 OOD 改为 11/12/13，同一条式子从等于 24 变成等于 32；下栏 GP-VL 训练用黑色花色，测试改用红色花色，图像经视觉编码器、数字识别与思考后作答</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="34" y="92" width="359" height="300" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="213.5" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">GP-L（纯文本）</text><text x="213.5" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">训练 J/Q/K = 10</text><text x="46" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">测试 OOD：J = 11, Q = 12, K = 13</text><text x="46" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">输入：用 [7, J, 3, 5] 计算 24</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">输出：(J−7)×(5+3) = 3×8 = 24</text><text x="46" y="239.84999999999997" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="239.84999999999997" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">OOD 时：(11−7)×(5+3) = 32 ≠ 24</text><rect x="407" y="92" width="359" height="300" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/><text x="586.5" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">GP-VL（视觉—语言）</text><text x="586.5" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">训练黑色花色 ♠♣</text><text x="419" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">测试 OOD：红色花色 ♥♦</text><text x="419" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">输入：扑克牌图像</text><text x="419" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">处理链：视觉编码器 → 数字识别 → 思考</text><text x="419" y="239.84999999999997" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="239.84999999999997" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">OOD 测的是花色外观变化下的鲁棒性</text><text x="419" y="261.79999999999995" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="261.79999999999995" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">基础模型：Llama-3.2-Vision-11B</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">文本规则</text><text x="730" y="400" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="end">视觉外观</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">OOD 结果（相对 SFT Init 基线）：GP-L 规则 OOD：SFT −8.1%（11.5→3.4），RL +3.5%（11.5→15.0）；GP-VL 规则 OOD：SFT −5.6%，RL +3.0%；GP-VL 视觉 OOD</text><text x="400" y="429.4" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">：SFT −9.9%（23.6→13.7），RL +17.6%（23.6→41.2）。SFT 路径 max Σ log P(y|x)，RL 路径（PPO）max E[R(τ)]。未经 SFT 的端到端 RL 完全失败。基础模型为</text><text x="400" y="440.8" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">Llama-3.2-Vision-11B。</text>
</svg>