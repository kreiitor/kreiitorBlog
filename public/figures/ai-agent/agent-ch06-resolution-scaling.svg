<svg xmlns="http://www.w3.org/2000/svg" width="800" height="368" viewBox="0 76 800 368" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">分辨率匹配与坐标缩放</title>
  <desc id="fig-desc">实际屏幕 2560×1440 上用户点击 (1280, 720)；截图按宽高比选 FWXGA 1366×768 缩小（×0.53）；模型在缩小图上预测 (683, 384)，坐标按 ×1.87 放大回实际分辨率，由 xdotool 执行。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="47.66666666666667" y="104.5" width="210" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">实际屏幕</text>
  <text x="152.66666666666669" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">截图 2560×1440</text><rect x="295.00000000000006" y="104.5" width="210" height="112" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">选择分辨率</text>
  <text x="400.00000000000006" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">按宽高比选 FWXGA</text><rect x="542.3333333333334" y="104.5" width="210" height="112" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="157.25" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">缩小截图</text>
  <text x="647.3333333333334" y="173.5" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">1366×768 · ×0.53</text><rect x="47.66666666666667" y="267.5" width="210" height="112" rx="8" fill="var(--yellow,#ffe04b)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="320.25" font-size="13" fill="var(--on-yellow,#202735)" font-weight="700" text-anchor="middle">模型推理</text>
  <text x="152.66666666666669" y="336.5" font-size="12" fill="var(--on-yellow,#202735)" font-weight="400" text-anchor="middle">预测 (683, 384)</text><rect x="295.00000000000006" y="267.5" width="210" height="112" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="320.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">坐标放大</text>
  <text x="400.00000000000006" y="336.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">×1.87 → (1280, 720)</text><rect x="542.3333333333334" y="267.5" width="210" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="320.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">执行动作</text>
  <text x="647.3333333333334" y="336.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">xdotool 点击</text><path d="M257.6666666666667 160.5 L295.00000000000006 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 160.5 L542.3333333333334 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 216.5 L647.3333333333334 242 L152.66666666666669 242 L152.66666666666669 267.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 323.5 L295.00000000000006 323.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 323.5 L542.3333333333334 323.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">三档分辨率：XGA 1024×768、WXGA 1280×800、FWXGA 1366×768。流程：选目标分辨率 → ImageMagick 缩小 → 模型推理 → 按比例放大 → xdotool 执行。</text>
</svg>