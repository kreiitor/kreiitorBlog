<svg xmlns="http://www.w3.org/2000/svg" width="800" height="359" viewBox="0 68 800 359" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">状态栏在消息数组中的位置</title>
  <desc id="fig-desc">messages 数组自上而下是固定不变的 system 与 tools、随轮次追加的 user 与 assistant 与 tool 消息，最后一条是框架注入的 agent_status；模型从数组末尾开始生成</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/>

  <rect x="56" y="96" width="470" height="30" rx="2" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.3"/>
  <text x="70" y="116" font-size="11.5" fill="var(--ink,#202735)"><tspan class="mono" fill="var(--muted,#596171)">system</tspan> 你是电信客服……</text>

  <rect x="56" y="132" width="470" height="30" rx="2" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.3"/>
  <text x="70" y="152" font-size="11.5" fill="var(--ink,#202735)"><tspan class="mono" fill="var(--muted,#596171)">tools</tspan> [cancel_plan, query_records, …]</text>

  <rect x="56" y="168" width="470" height="30" rx="2" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1.3"/>
  <text x="70" y="188" font-size="11.5" fill="var(--ink,#202735)"><tspan class="mono" fill="var(--muted,#596171)">user</tspan> 帮我取消套餐</text>

  <rect x="56" y="204" width="470" height="30" rx="2" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1.3"/>
  <text x="70" y="224" font-size="11.5" fill="var(--ink,#202735)"><tspan class="mono" fill="var(--muted,#596171)">assistant</tspan> tool_calls [cancel_plan(…)]</text>

  <rect x="56" y="240" width="470" height="30" rx="2" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1.3"/>
  <text x="70" y="260" font-size="11.5" fill="var(--ink,#202735)"><tspan class="mono" fill="var(--muted,#596171)">tool</tspan> 该套餐有合约期……</text>

  <rect x="56" y="276" width="470" height="30" rx="2" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1.3"/>
  <text x="70" y="296" font-size="11.5" fill="var(--ink,#202735)"><tspan class="mono" fill="var(--muted,#596171)">user</tspan> 那帮我查一下通话记录</text>

  <rect x="56" y="312" width="470" height="30" rx="2" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="70" y="332" font-size="11.5" fill="var(--ink,#202735)"><tspan class="mono" fill="var(--muted,#596171)">user</tspan> &lt;agent_status&gt; 已呼叫 3/3 次 · TODO 取消套餐（进行中）</text>

  <line x1="540" y1="96" x2="540" y2="162" stroke="var(--line,#a2aec1)" stroke-width="1.3"/>
  <line x1="540" y1="96" x2="548" y2="96" stroke="var(--line,#a2aec1)" stroke-width="1.3"/>
  <line x1="540" y1="162" x2="548" y2="162" stroke="var(--line,#a2aec1)" stroke-width="1.3"/>
  <text x="558" y="118" font-size="11.5" font-weight="600" fill="var(--ink,#202735)">固定不变</text>
  <text x="558" y="136" font-size="11" fill="var(--muted,#596171)">始终命中缓存</text>

  <line x1="540" y1="168" x2="540" y2="306" stroke="var(--line,#a2aec1)" stroke-width="1.3"/>
  <line x1="540" y1="168" x2="548" y2="168" stroke="var(--line,#a2aec1)" stroke-width="1.3"/>
  <line x1="540" y1="306" x2="548" y2="306" stroke="var(--line,#a2aec1)" stroke-width="1.3"/>
  <text x="558" y="234" font-size="11.5" font-weight="600" fill="var(--ink,#202735)">随轮次追加</text>
  <text x="558" y="252" font-size="11" fill="var(--muted,#596171)">只增不改</text>

  <line x1="540" y1="312" x2="540" y2="342" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <line x1="540" y1="312" x2="548" y2="312" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <line x1="540" y1="342" x2="548" y2="342" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="558" y="322" font-size="11.5" font-weight="600" fill="var(--ink,#202735)">框架注入</text>
  <text x="558" y="340" font-size="11" fill="var(--muted,#596171)">不是用户输入</text>

  <path d="M291 384 L291 348" stroke="var(--blue,#2647d7)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="304" y="380" font-size="12" font-weight="600" fill="var(--ink,#202735)">模型从此处开始生成</text>
  <text x="304" y="400" font-size="11" fill="var(--muted,#596171)">末尾离生成位置最近，注意力权重最高</text>
</svg>
