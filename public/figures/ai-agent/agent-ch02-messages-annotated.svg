<svg xmlns="http://www.w3.org/2000/svg" width="800" height="359" viewBox="0 68 800 359" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">状态栏在消息数组中的位置</title>
  <desc id="fig-desc">messages 数组自上而下是固定不变的 system 与 tools、随轮次追加的 user 与 assistant 与 tool 消息，最后一条是框架注入的 agent_status；模型从数组末尾开始生成</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <rect x="56" y="96" width="470" height="30" rx="2" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.3"/>
  <text x="70" y="116" font-size="11.5" fill="var(--ink,#3b3024)"><tspan class="mono" fill="var(--muted,#5f4f3c)">system</tspan> 你是电信客服……</text>

  <rect x="56" y="132" width="470" height="30" rx="2" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.3"/>
  <text x="70" y="152" font-size="11.5" fill="var(--ink,#3b3024)"><tspan class="mono" fill="var(--muted,#5f4f3c)">tools</tspan> [cancel_plan, query_records, …]</text>

  <rect x="56" y="168" width="470" height="30" rx="2" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.3"/>
  <text x="70" y="188" font-size="11.5" fill="var(--ink,#3b3024)"><tspan class="mono" fill="var(--muted,#5f4f3c)">user</tspan> 帮我取消套餐</text>

  <rect x="56" y="204" width="470" height="30" rx="2" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.3"/>
  <text x="70" y="224" font-size="11.5" fill="var(--ink,#3b3024)"><tspan class="mono" fill="var(--muted,#5f4f3c)">assistant</tspan> tool_calls [cancel_plan(…)]</text>

  <rect x="56" y="240" width="470" height="30" rx="2" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.3"/>
  <text x="70" y="260" font-size="11.5" fill="var(--ink,#3b3024)"><tspan class="mono" fill="var(--muted,#5f4f3c)">tool</tspan> 该套餐有合约期……</text>

  <rect x="56" y="276" width="470" height="30" rx="2" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.3"/>
  <text x="70" y="296" font-size="11.5" fill="var(--ink,#3b3024)"><tspan class="mono" fill="var(--muted,#5f4f3c)">user</tspan> 那帮我查一下通话记录</text>

  <rect x="56" y="312" width="470" height="30" rx="2" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="70" y="332" font-size="11.5" fill="var(--ink,#3b3024)"><tspan class="mono" fill="var(--muted,#5f4f3c)">user</tspan> &lt;agent_status&gt; 已呼叫 3/3 次 · TODO 取消套餐（进行中）</text>

  <line x1="540" y1="96" x2="540" y2="162" stroke="var(--line,#c9b49c)" stroke-width="1.3"/>
  <line x1="540" y1="96" x2="548" y2="96" stroke="var(--line,#c9b49c)" stroke-width="1.3"/>
  <line x1="540" y1="162" x2="548" y2="162" stroke="var(--line,#c9b49c)" stroke-width="1.3"/>
  <text x="558" y="118" font-size="11.5" font-weight="600" fill="var(--ink,#3b3024)">固定不变</text>
  <text x="558" y="136" font-size="11" fill="var(--muted,#5f4f3c)">始终命中缓存</text>

  <line x1="540" y1="168" x2="540" y2="306" stroke="var(--line,#c9b49c)" stroke-width="1.3"/>
  <line x1="540" y1="168" x2="548" y2="168" stroke="var(--line,#c9b49c)" stroke-width="1.3"/>
  <line x1="540" y1="306" x2="548" y2="306" stroke="var(--line,#c9b49c)" stroke-width="1.3"/>
  <text x="558" y="234" font-size="11.5" font-weight="600" fill="var(--ink,#3b3024)">随轮次追加</text>
  <text x="558" y="252" font-size="11" fill="var(--muted,#5f4f3c)">只增不改</text>

  <line x1="540" y1="312" x2="540" y2="342" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <line x1="540" y1="312" x2="548" y2="312" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <line x1="540" y1="342" x2="548" y2="342" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="558" y="322" font-size="11.5" font-weight="600" fill="var(--ink,#3b3024)">框架注入</text>
  <text x="558" y="340" font-size="11" fill="var(--muted,#5f4f3c)">不是用户输入</text>

  <path d="M291 384 L291 348" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="304" y="380" font-size="12" font-weight="600" fill="var(--ink,#3b3024)">模型从此处开始生成</text>
  <text x="304" y="400" font-size="11" fill="var(--muted,#5f4f3c)">末尾离生成位置最近，注意力权重最高</text>
</svg>
