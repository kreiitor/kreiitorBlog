<svg xmlns="http://www.w3.org/2000/svg" width="800" height="316" viewBox="0 68 800 316" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">异步 Agent 的打断与恢复</title>
  <desc id="fig-desc">四条泳道：主循环在 0 秒启动脚本 A、B、C；脚本 A 每秒 3%、33 秒完成，脚本 B 每秒 2%、50 秒完成，脚本 C 每秒 1%、约 33 秒时进度 33% 被取消；33 秒查询到 B 约 66%、C 约 33%，50 秒后整合 A 与 B 的结果生成报告。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="126" y1="96" x2="126" y2="284" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="126" y="300" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0</text><line x1="251.2" y1="96" x2="251.2" y2="284" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="251.2" y="300" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">20</text><line x1="376.4" y1="96" x2="376.4" y2="284" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="376.4" y="300" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">40</text><line x1="501.59999999999997" y1="96" x2="501.59999999999997" y2="284" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="501.59999999999997" y="300" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">60</text><line x1="626.8" y1="96" x2="626.8" y2="284" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="626.8" y="300" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">80</text><line x1="752" y1="96" x2="752" y2="284" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="752" y="300" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">100</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">主循环</text><rect x="126" y="115" width="206.58" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="229.29000000000002" y="134" font-size="9.5" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">启动 A/B/C</text><rect x="332.58000000000004" y="115" width="106.42" height="32" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)"/><text x="385.79" y="134" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">查询进度 · 取消 C</text><rect x="439" y="115" width="62.6" height="32" rx="3" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)"/><text x="470.3" y="134" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">整合报告</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">脚本 A</text><rect x="126" y="157" width="206.58" height="32" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="229.29000000000002" y="176" font-size="9.5" fill="var(--on-yellow,#3b3024)" font-weight="600" text-anchor="middle">3%/s → 33s</text><text x="116" y="219" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">脚本 B</text><rect x="126" y="199" width="313" height="32" rx="3" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)"/><text x="282.5" y="218" font-size="9.5" fill="var(--on-yellow,#3b3024)" font-weight="600" text-anchor="middle">2%/s → 50s</text><text x="116" y="261" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">脚本 C</text><rect x="126" y="241" width="206.58" height="32" rx="3" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)"/><text x="229.29000000000002" y="260" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">1%/s → 33%</text><rect x="332.58000000000004" y="241" width="419.42" height="32" rx="3" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)"/><text x="542.2900000000001" y="260" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">已取消</text><line x1="126" y1="284" x2="752" y2="284" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="320" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">时间 / s</text><text x="400" y="357" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">关键机制：占位符注入、异步完成事件、cancel_tool(task_id) API。</text>
</svg>