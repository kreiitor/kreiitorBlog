<svg xmlns="http://www.w3.org/2000/svg" width="800" height="317" viewBox="0 58 800 317" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Manager 顺序协调</title>
  <desc id="fig-desc">Manager Agent 位于上方，工具集里同时有子 Agent 与普通工具；三个子 Agent 依次承担数据收集、分析处理和报告生成；执行流为 Manager 调用 A、A 返回数据、Manager 传给 B、B 返回分析、Manager 传给 C、C 返回报告，A 与 B、B 与 C 之间不直接通信</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="330" y1="110" x2="80" y2="290" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="290" x2="330" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="330" y1="110" x2="330" y2="290" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="330" y1="290" x2="330" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="330" y1="110" x2="580" y2="290" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="580" y1="290" x2="330" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="86" width="100" height="48" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="330" y="100.375" font-size="11" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">Manager Agent</text>
  <text x="330" y="114.125" font-size="10" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">理解 → 分解 → 调</text><text x="330" y="127.625" font-size="10" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">度 → 综合</text><rect x="30" y="266" width="100" height="48" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="80" y="280.375" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Sub-Agent A</text>
  <text x="80" y="294.125" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">数据收集 · Step</text><text x="80" y="307.625" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">1</text><rect x="280" y="266" width="100" height="48" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="330" y="280.375" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Sub-Agent B</text>
  <text x="330" y="294.125" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">分析处理 · Step</text><text x="330" y="307.625" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">2</text><rect x="530" y="266" width="100" height="48" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="580" y="280.375" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Sub-Agent C</text>
  <text x="580" y="294.125" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">报告生成 · Step</text><text x="580" y="307.625" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">3</text><text x="400" y="348" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">工具集为 call_agent_A、call_agent_B、call_agent_C、search、write_file；Step 1–3 对应数据收集、分析处理、报告生成。</text>
</svg>