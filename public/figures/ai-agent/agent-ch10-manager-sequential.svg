<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Manager 顺序协调</title>
  <desc id="fig-desc">Manager Agent 位于上方，工具集里同时有子 Agent 与普通工具；三个子 Agent 依次承担数据收集、分析处理和报告生成；执行流为 Manager 调用 A、A 返回数据、Manager 传给 B、B 返回分析、Manager 传给 C、C 返回报告，A 与 B、B 与 C 之间不直接通信</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="330" y1="110" x2="80" y2="290" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="290" x2="330" y2="110" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="330" y1="110" x2="330" y2="290" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="330" y1="290" x2="330" y2="110" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="330" y1="110" x2="580" y2="290" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="580" y1="290" x2="330" y2="110" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="86" width="100" height="48" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="330" y="100.375" font-size="11" fill="var(--on-blue)" font-weight="700" text-anchor="middle">Manager Agent</text>
  <text x="330" y="114.125" font-size="10" fill="var(--on-blue)" font-weight="400" text-anchor="middle">理解 → 分解 → 调</text><text x="330" y="127.625" font-size="10" fill="var(--on-blue)" font-weight="400" text-anchor="middle">度 → 综合</text><rect x="30" y="266" width="100" height="48" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="80" y="280.375" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">Sub-Agent A</text>
  <text x="80" y="294.125" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">数据收集 · Step</text><text x="80" y="307.625" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">1</text><rect x="280" y="266" width="100" height="48" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="330" y="280.375" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">Sub-Agent B</text>
  <text x="330" y="294.125" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">分析处理 · Step</text><text x="330" y="307.625" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">2</text><rect x="530" y="266" width="100" height="48" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="580" y="280.375" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">Sub-Agent C</text>
  <text x="580" y="294.125" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">报告生成 · Step</text><text x="580" y="307.625" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">3</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">工具集为 call_agent_A、call_agent_B、call_agent_C、search、write_file；Step 1–3 对应数据收集、分析处理、报告生成。</text>
</svg>