  <text x="340" y="100.375" font-size="11" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">Manager Agent</text>
  <text x="340" y="114.125" font-size="10" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">规划 · 监控 · 异</text><text x="340" y="127.625" font-size="10" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">常 · 综合</text><rect x="30" y="228.24137931034483" width="100" height="48" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="80" y="242.61637931034483" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Glossary Agent</text>
  <text x="80" y="256.3663793103448" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">识别术语 ·</text><text x="80" y="269.8663793103448" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">glossary.json</text><rect x="290" y="228.24137931034483" width="100" height="48" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="340" y="235.74137931034483" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Translation</text><text x="340" y="250.59137931034482" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Agent ×N</text>
  <text x="340" y="263.2413793103448" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">章节 + 术语表 ·</text><text x="340" y="276.7413793103448" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">译文</text><rect x="550" y="228.24137931034483" width="100" height="48" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="600" y="235.74137931034483" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Proofreading</text><text x="600" y="250.59137931034482" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Agent</text>
  <text x="600" y="263.2413793103448" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">一致性审校 · 报</text><text x="600" y="276.7413793103448" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">告</text><rect x="290" y="361" width="100" height="48" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="340" y="375.375" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">共享文件系统</text>
  <text x="340" y="389.125" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">术语表 · 译文 ·</text><text x="340" y="402.625" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">审校报告 · 指南</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">共享目录同时保存 translation_guide.md；Glossary Agent 完成写入后即可销毁。</text>
</svg>