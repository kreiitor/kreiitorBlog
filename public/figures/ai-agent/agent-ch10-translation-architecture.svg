<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 58 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">书籍翻译 Agent 架构</title>
  <desc id="fig-desc">Manager Agent 位于中心，负责规划、进度监控、异常处理和结果综合；外围是 Glossary Agent、Translation Agent 多实例和 Proofreading Agent，分别产出 glossary.json、chapter{n}_zh.md 与 review_report.md，全部写入共享文件系统，Manager 只维护文件索引</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="340" y1="110" x2="80" y2="252.24137931034483" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="340" y1="110" x2="340" y2="252.24137931034483" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="340" y1="110" x2="600" y2="252.24137931034483" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="252.24137931034483" x2="340" y2="385" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="340" y1="252.24137931034483" x2="340" y2="385" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="600" y1="252.24137931034483" x2="340" y2="385" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="340" y1="385" x2="340" y2="110" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><rect x="290" y="86" width="100" height="48" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="340" y="100.375" font-size="11" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">Manager Agent</text>
  <text x="340" y="114.125" font-size="10" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">规划 · 监控 · 异</text><text x="340" y="127.625" font-size="10" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">常 · 综合</text><rect x="30" y="228.24137931034483" width="100" height="48" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="80" y="242.61637931034483" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">Glossary Agent</text>
  <text x="80" y="256.3663793103448" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">识别术语 ·</text><text x="80" y="269.8663793103448" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">glossary.json</text><rect x="290" y="228.24137931034483" width="100" height="48" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="340" y="235.74137931034483" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">Translation</text><text x="340" y="250.59137931034482" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">Agent ×N</text>
  <text x="340" y="263.2413793103448" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">章节 + 术语表 ·</text><text x="340" y="276.7413793103448" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">译文</text><rect x="550" y="228.24137931034483" width="100" height="48" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="600" y="235.74137931034483" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">Proofreading</text><text x="600" y="250.59137931034482" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">Agent</text>
  <text x="600" y="263.2413793103448" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">一致性审校 · 报</text><text x="600" y="276.7413793103448" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">告</text><rect x="290" y="361" width="100" height="48" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="340" y="375.375" font-size="11" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">共享文件系统</text>
  <text x="340" y="389.125" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">术语表 · 译文 ·</text><text x="340" y="402.625" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">审校报告 · 指南</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">共享目录同时保存 translation_guide.md；Glossary Agent 完成写入后即可销毁。</text>
</svg>