<svg xmlns="http://www.w3.org/2000/svg" width="800" height="396" viewBox="0 54 800 396" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">ReAct 轨迹的逐轮累积</title>
  <desc id="fig-desc">静态前缀每轮保持不变，轨迹只追加；第 1 轮只有用户输入，第 2 轮增加工具结果，第 3 轮增加最终回答。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:12px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:11px;fill:var(--muted,#5f4f3c)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <text x="30" y="100" class="b">第 1 轮</text>
  <rect x="110" y="82" width="50" height="36" rx="5" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)" stroke-width="1.2"/>
  <text x="135" y="105" text-anchor="middle" class="tiny">前缀</text>
  <rect x="160" y="82" width="75" height="36" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.5"/>
  <text x="197" y="105" text-anchor="middle" class="tiny">user</text>
  <rect x="235" y="82" width="100" height="36" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.5"/>
  <text x="285" y="105" text-anchor="middle" class="tiny">assistant + 调用</text>
  <rect x="335" y="82" width="60" height="36" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.5"/>
  <text x="365" y="105" text-anchor="middle" class="tiny">tool ×3</text>
  <text x="420" y="105" class="s">只看到三种货币的金额</text>

  <text x="30" y="180" class="b">第 2 轮</text>
  <rect x="110" y="162" width="50" height="36" rx="5" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)" stroke-width="1.2"/>
  <text x="135" y="185" text-anchor="middle" class="tiny">前缀</text>
  <rect x="160" y="162" width="235" height="36" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.2"/>
  <text x="277" y="185" text-anchor="middle" class="tiny">上一轮轨迹（完整保留）</text>
  <rect x="395" y="162" width="75" height="36" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.5"/>
  <text x="432" y="185" text-anchor="middle" class="tiny">assistant</text>
  <rect x="470" y="162" width="55" height="36" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.5"/>
  <text x="497" y="185" text-anchor="middle" class="tiny">tool</text>
  <text x="545" y="185" class="s">多看到三条汇率结果</text>

  <text x="30" y="260" class="b">第 3 轮</text>
  <rect x="110" y="242" width="50" height="36" rx="5" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)" stroke-width="1.2"/>
  <text x="135" y="265" text-anchor="middle" class="tiny">前缀</text>
  <rect x="160" y="242" width="365" height="36" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.2"/>
  <text x="342" y="265" text-anchor="middle" class="tiny">前两轮轨迹（只读，不改写）</text>
  <rect x="525" y="242" width="80" height="36" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.5"/>
  <text x="565" y="265" text-anchor="middle" class="tiny">最终回答</text>
  <text x="625" y="265" class="s">多看到汇总结果</text>

  <rect x="30" y="320" width="740" height="92" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>
  <text x="48" y="345" class="b">读法</text>
  <text x="48" y="368" class="s">灰色是静态前缀（系统提示词 + 工具定义），每轮逐字节不变，因此可以复用 KV 缓存。</text>
  <text x="48" y="391" class="s">蓝色是已经写下的轨迹，黄色是本轮新增；模型从不删除或重排旧消息，只是在其后继续追加。</text>

  <text x="400" y="438" text-anchor="middle" class="tiny">轨迹 = user / assistant / tool 的结构化消息流水；它不含静态前缀，但每次调用都会被拼在前缀之后。</text>
</svg>
