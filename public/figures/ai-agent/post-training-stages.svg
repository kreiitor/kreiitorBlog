<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 64 800 386" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">从预训练到 RL 的四阶段</title>
  <desc id="fig-desc">预训练、Mid-training、SFT 与 RL 使用不同的数据与优化目标，分别形成语言与世界知识、领域基础能力、指令与格式协议、可迁移决策策略。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:12px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:11px;fill:var(--muted,#5f4f3c)}
    .onblue{fill:var(--on-blue,#fffcf5)}
    .onyellow{fill:var(--on-yellow,#3b3024)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <rect x="32" y="92" width="172" height="244" rx="9" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="2"/>
  <text x="118" y="124" text-anchor="middle" class="h onblue">① 预训练</text>
  <text x="118" y="146" text-anchor="middle" class="tiny onblue">Pre-training</text>
  <text x="48" y="180" class="tiny onblue">数据</text>
  <text x="48" y="198" class="b onblue">海量互联网文本</text>
  <text x="48" y="228" class="tiny onblue">目标</text>
  <text x="48" y="246" class="b onblue">预测下一个词</text>
  <text x="48" y="276" class="tiny onblue">学到</text>
  <text x="48" y="294" class="b onblue">语言与世界知识</text>
  <text x="48" y="322" class="tiny onblue">代价：极高</text>

  <rect x="224" y="92" width="172" height="244" rx="9" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="2"/>
  <text x="310" y="124" text-anchor="middle" class="h">② Mid-training</text>
  <text x="310" y="146" text-anchor="middle" class="tiny">继续预训练</text>
  <text x="240" y="180" class="tiny">数据</text>
  <text x="240" y="198" class="b">领域 / 长上下文语料</text>
  <text x="240" y="228" class="tiny">目标</text>
  <text x="240" y="246" class="b">继续预测下一个词</text>
  <text x="240" y="276" class="tiny">学到</text>
  <text x="240" y="294" class="b">领域知识与基础能力</text>
  <text x="240" y="322" class="tiny">代价：中 — 高</text>

  <rect x="416" y="92" width="172" height="244" rx="9" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="2"/>
  <text x="502" y="124" text-anchor="middle" class="h">③ SFT</text>
  <text x="502" y="146" text-anchor="middle" class="tiny">监督微调</text>
  <text x="432" y="180" class="tiny">数据</text>
  <text x="432" y="198" class="b">输入—输出示范对</text>
  <text x="432" y="228" class="tiny">目标</text>
  <text x="432" y="246" class="b">只在回答上算损失</text>
  <text x="432" y="276" class="tiny">学到</text>
  <text x="432" y="294" class="b">指令、格式、流程</text>
  <text x="432" y="322" class="tiny">代价：低</text>

  <rect x="608" y="92" width="160" height="244" rx="9" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="2"/>
  <text x="688" y="124" text-anchor="middle" class="h">④ RL</text>
  <text x="688" y="146" text-anchor="middle" class="tiny">强化学习</text>
  <text x="624" y="180" class="tiny">数据</text>
  <text x="624" y="198" class="b">任务 + 环境 + 奖励</text>
  <text x="624" y="228" class="tiny">目标</text>
  <text x="624" y="246" class="b">最大化期望奖励</text>
  <text x="624" y="276" class="tiny">学到</text>
  <text x="624" y="294" class="b">可迁移决策策略</text>
  <text x="624" y="322" class="tiny">代价：高，常为 SFT 的</text>
  <text x="624" y="338" class="tiny">几十至上百倍</text>

  <path d="M206 214 H220" stroke="var(--line,#c9b49c)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M398 214 H412" stroke="var(--line,#c9b49c)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M590 214 H604" stroke="var(--line,#c9b49c)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="32" y="360" width="736" height="42" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>
  <text x="400" y="386" text-anchor="middle" class="b">SFT 优化示范复现，RL 优化期望奖励；数据与环境比算法更重要</text>
  <text x="400" y="428" text-anchor="middle" class="tiny">阶段顺序可以因目标分布与数据条件调整，但每一阶段的信号来源不同。</text>
</svg>
