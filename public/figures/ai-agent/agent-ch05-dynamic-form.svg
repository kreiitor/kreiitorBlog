<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">动态表单澄清意图</title>
  <desc id="fig-desc">用户说想去北京，LLM 生成含出发城市、日期、旅行类型的表单；用户填上海、2025-08-15、往返、2025-08-22 后提交，前端返回结构化 JSON，Agent 带着完整参数继续搜索航班。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="47.66666666666667" y="104.5" width="210" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">用户输入</text>
  <text x="152.66666666666669" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">我想订去北京的机票</text><rect x="295.00000000000006" y="104.5" width="210" height="112" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="157.25" font-size="13" fill="var(--on-blue)" font-weight="700" text-anchor="middle">生成表单</text>
  <text x="400.00000000000006" y="173.5" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">文本 · 日期 · 下拉</text><rect x="542.3333333333334" y="104.5" width="210" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">级联逻辑</text>
  <text x="647.3333333333334" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">选往返才显示返程日期</text><rect x="47.66666666666667" y="267.5" width="210" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="320.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">渲染表单</text>
  <text x="152.66666666666669" y="336.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">上海 · 2025-08-15 · 往返</text><rect x="295.00000000000006" y="267.5" width="210" height="112" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="320.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">结构化 JSON</text>
  <text x="400.00000000000006" y="336.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">出发 · 日期 · 类型</text><rect x="542.3333333333334" y="267.5" width="210" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="320.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">继续执行</text>
  <text x="647.3333333333334" y="336.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">search_flights(...)</text><path d="M257.6666666666667 160.5 L295.00000000000006 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 160.5 L542.3333333333334 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 216.5 L647.3333333333334 242 L152.66666666666669 242 L152.66666666666669 267.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 323.5 L295.00000000000006 323.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 323.5 L542.3333333333334 323.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">表单代码由 LLM 动态生成；选择「往返」时自动显示返程日期。</text>
</svg>