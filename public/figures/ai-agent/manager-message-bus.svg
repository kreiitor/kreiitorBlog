<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Manager 并行协调与消息总线</title>
  <desc id="fig-desc">Manager 通过消息总线向四个独立上下文的子 Agent 下发任务，接收完成汇报，并支持子 Agent 之间的数据就绪通知与依赖启动。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink)}
    .sub{font-size:14px;fill:var(--muted)}
    .h{font-size:16px;font-weight:700;fill:var(--ink)}
    .b{font-size:13px;font-weight:600;fill:var(--ink)}
    .s{font-size:12px;fill:var(--muted)}
    .tiny{font-size:11px;fill:var(--muted)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>

  <rect x="300" y="82" width="200" height="70" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.5"/>
  <text x="400" y="108" text-anchor="middle" class="b" fill="var(--on-blue)">Manager Agent</text>
  <text x="400" y="132" text-anchor="middle" class="tiny" fill="var(--on-blue)">规划 · 调度 · 监控 · 综合</text>

  <rect x="60" y="208" width="680" height="46" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.8"/>
  <text x="400" y="230" text-anchor="middle" class="b">Message Bus · 发布 / 订阅</text>
  <text x="400" y="247" text-anchor="middle" class="tiny">异步通信，收发双方不必同时在线</text>

  <path d="M388 152 L388 208" stroke="var(--blue)" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M412 208 L412 152" stroke="var(--blue)" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <text x="378" y="180" text-anchor="end" class="tiny">start</text>
  <text x="422" y="180" class="tiny">completed</text>

  <rect x="45" y="316" width="150" height="82" rx="8" fill="var(--surface)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="120" y="340" text-anchor="middle" class="b">Agent 1</text>
  <text x="120" y="362" text-anchor="middle" class="tiny">数据采集</text>
  <text x="120" y="384" text-anchor="middle" class="tiny">运行中 ◎</text>

  <rect x="235" y="316" width="150" height="82" rx="8" fill="var(--surface)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="310" y="340" text-anchor="middle" class="b">Agent 2</text>
  <text x="310" y="362" text-anchor="middle" class="tiny">内容分析</text>
  <text x="310" y="384" text-anchor="middle" class="tiny">运行中 ◎</text>

  <rect x="425" y="316" width="150" height="82" rx="8" fill="var(--surface)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="500" y="340" text-anchor="middle" class="b">Agent 3</text>
  <text x="500" y="362" text-anchor="middle" class="tiny">图表生成</text>
  <text x="500" y="384" text-anchor="middle" class="tiny">已完成 ✓</text>

  <rect x="615" y="316" width="150" height="82" rx="8" fill="var(--surface)" stroke="var(--yellow)" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="690" y="340" text-anchor="middle" class="b">Agent 4</text>
  <text x="690" y="362" text-anchor="middle" class="tiny">格式校验</text>
  <text x="690" y="384" text-anchor="middle" class="tiny">等待中 ○ · 依赖 A2/A3</text>

  <path d="M120 254 L120 316" stroke="var(--blue)" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M310 254 L310 316" stroke="var(--blue)" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M500 254 L500 316" stroke="var(--blue)" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M690 254 L690 316" stroke="var(--blue)" stroke-width="2.2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 4"/>

  <path d="M120 404 L120 424 L310 424 L310 404" stroke="var(--yellow)" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="215" y="440" text-anchor="middle" class="tiny">Agent 1 → Agent 2：data_ready</text>

  <text x="400" y="292" text-anchor="middle" class="tiny">子 Agent 各自持有独立上下文；Manager 只保留任务、状态与产物索引，不保留全部轨迹。</text>
</svg>
