<svg xmlns="http://www.w3.org/2000/svg" width="800" height="278" viewBox="0 119 800 278" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">RAPTOR 的层次树</title>
  <desc id="fig-desc">底层是原始文档切出的文本块 1 到文本块 7；中间层是聚类摘要 A、B、C；顶层是全局摘要。箭头自下而上表示细节到主题再到全局概览</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="40" y="147" width="720" height="58" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="54" y="179" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">全局摘要</text><rect x="393" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="468" y="179" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">整棵树的总览</text><rect x="40" y="213" width="720" height="58" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/><text x="54" y="245" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">聚类摘要</text><rect x="207.66666666666669" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="282.6666666666667" y="245" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">聚类摘要 A</text><rect x="393.00000000000006" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="468.00000000000006" y="245" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">聚类摘要 B</text><rect x="578.3333333333334" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="653.3333333333334" y="245" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">聚类摘要 C</text><rect x="40" y="279" width="720" height="58" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="54" y="311" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">原始文档 / 叶子块</text><rect x="393" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="468" y="311" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">文本块 1 … 文本块 7</text><text x="400" y="371" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">检索可以在细节、主题、全局多个抽象层次上进行。</text>
</svg>