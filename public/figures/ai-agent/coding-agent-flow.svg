<svg xmlns="http://www.w3.org/2000/svg" width="800" height="376" viewBox="0 68 800 376" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Coding Agent 的五段工作流</title>
  <desc id="fig-desc">从项目文档化、需求澄清、设计、编码测试到审查交付，测试与审查形成内循环，完成标准由验证结果判定。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:15px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:12px;fill:var(--muted,#5f4f3c)}
    .onblue{fill:var(--on-blue,#fffcf5)}
    .onyellow{fill:var(--on-yellow,#3b3024)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
    <marker id="arrow-y" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--yellow,#f5d75f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <rect x="28" y="96" width="136" height="96" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="2"/>
  <text x="96" y="124" text-anchor="middle" class="h onblue">① 项目文档化</text>
  <text x="96" y="148" text-anchor="middle" class="s onblue">读代码与约定</text>
  <text x="96" y="168" text-anchor="middle" class="s onblue">生成项目指南</text>

  <rect x="188" y="96" width="136" height="96" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="2"/>
  <text x="256" y="124" text-anchor="middle" class="h">② 需求澄清</text>
  <text x="256" y="148" text-anchor="middle" class="s">ask_user</text>
  <text x="256" y="168" text-anchor="middle" class="s">确认目标与权衡</text>

  <rect x="348" y="96" width="136" height="96" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="2"/>
  <text x="416" y="124" text-anchor="middle" class="h">③ 设计文档</text>
  <text x="416" y="148" text-anchor="middle" class="s">方案对比</text>
  <text x="416" y="168" text-anchor="middle" class="s">等待人类审批</text>

  <rect x="508" y="96" width="136" height="96" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="2"/>
  <text x="576" y="124" text-anchor="middle" class="h">④ 编码测试</text>
  <text x="576" y="148" text-anchor="middle" class="s">edit_file</text>
  <text x="576" y="168" text-anchor="middle" class="s">跑测试并修复</text>

  <rect x="668" y="96" width="104" height="96" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="2"/>
  <text x="720" y="124" text-anchor="middle" class="h">⑤ 审查交付</text>
  <text x="720" y="148" text-anchor="middle" class="s">lint + 自审</text>
  <text x="720" y="168" text-anchor="middle" class="s">同步文档</text>

  <path d="M166 144 H184" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M326 144 H344" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M486 144 H504" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M646 144 H664" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <path d="M540 192 C540 250 612 250 612 196" stroke="var(--yellow,#f5d75f)" stroke-width="2.5" fill="none" marker-end="url(#arrow-y)"/>
  <text x="576" y="270" text-anchor="middle" class="b">测试失败 → 修改 → 重跑</text>
  <text x="576" y="288" text-anchor="middle" class="s">④ 内循环，通常 2–3 轮</text>

  <path d="M720 192 V230 H624 V192" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="672" y="220" text-anchor="middle" class="b">审查退回</text>
  <text x="672" y="250" text-anchor="middle" class="s">⑤ → ④</text>

  <rect x="28" y="382" width="744" height="38" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>
  <text x="400" y="406" text-anchor="middle" class="b">完成标准由测试与审查判定，不由模型自己宣布</text>
</svg>
