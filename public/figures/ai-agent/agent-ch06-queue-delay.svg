<svg xmlns="http://www.w3.org/2000/svg" width="800" height="387" viewBox="0 57 800 387" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">排队延迟随利用率上升</title>
  <desc id="fig-desc">折线图：横轴利用率 ρ 从 0 到 1，纵轴总延迟 0 到 12 秒。ρ=0.5 时延迟 2 秒，标注为用户忍受上限；ρ=0.8 时延迟 5 秒，标注为不可接受；ρ 趋近 1 时延迟趋于无穷。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="362" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">0</text><line x1="74" y1="253.83333333333331" x2="750" y2="253.83333333333331" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="257.8333333333333" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">5</text><line x1="74" y1="149.66666666666666" x2="750" y2="149.66666666666666" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="153.66666666666666" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">10</text><line x1="74" y1="108" x2="750" y2="108" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/><text x="66" y="112" font-size="10" fill="var(--muted,#596171)" font-weight="400" text-anchor="end">12</text><polyline points="74,316.3333333333333 158.5,311.75 243,305.9166666666667 327.5,298.4166666666667 412,288.625 496.5,274.6666666666667 581,253.83333333333331 665.5,219.04166666666669 750,149.66666666666666" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.4"/><circle cx="74" cy="316.3333333333333" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="158.5" cy="311.75" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="243" cy="305.9166666666667" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="327.5" cy="298.4166666666667" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="412" cy="288.625" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="496.5" cy="274.6666666666667" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="581" cy="253.83333333333331" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="665.5" cy="219.04166666666669" r="3.2" fill="var(--blue,#2647d7)"/><circle cx="750" cy="149.66666666666666" r="3.2" fill="var(--blue,#2647d7)"/><text x="74" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">0.5</text><text x="158.5" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">0.55</text><text x="243" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">0.6</text><text x="327.5" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">0.65</text><text x="412" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">0.7</text><text x="496.5" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">0.75</text><text x="581" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">0.8</text><text x="665.5" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">0.85</text><text x="750" y="378" font-size="10.5" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">0.9</text><line x1="74" y1="358" x2="750" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><line x1="74" y1="108" x2="74" y2="358" stroke="var(--line,#a2aec1)" stroke-width="1.5"/><text x="412" y="400" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">利用率 ρ</text><g transform="translate(20 233) rotate(-90)"><text x="0" y="0" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">总延迟 / s</text></g><rect x="82" y="86" width="10" height="10" fill="var(--blue,#2647d7)"/><text x="97" y="95" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">总延迟</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">公式：总延迟 = S / (1 − ρ)，空载延迟 S = 1s；ρ→1 时趋于无穷。生产环境 ρ 通常为 0.5–0.8，实际延迟为 2–5 倍空载延迟。</text>
</svg>