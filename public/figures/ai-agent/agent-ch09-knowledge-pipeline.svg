<svg xmlns="http://www.w3.org/2000/svg" width="800" height="368" viewBox="0 76 800 368" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">经验知识化流水线</title>
  <desc id="fig-desc">五段流水线从左到右：原始轨迹保留动作、结果与环境作为不可变证据；单次评价记录成功、失败与标签并保留证据位置；跨轨迹比较聚合同类任务、对照成败、提取共性与边界；Markdown 文档写清适用场景、策略、例外、来源、版本与验证时间；检索应用按需加载并继续产生反馈；第五段有回边指向第四段</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="47.66666666666667" y="104.5" width="210" height="112" rx="8" fill="var(--line-soft,#dce1e8)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">原始轨迹</text>
  <text x="152.66666666666669" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">动作 · 结果 · 环境 · 不可变</text><rect x="295.00000000000006" y="104.5" width="210" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">单次评价</text>
  <text x="400.00000000000006" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">成功 · 失败 · 标签 · 证据位置</text><rect x="542.3333333333334" y="104.5" width="210" height="112" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">跨轨迹比较</text>
  <text x="647.3333333333334" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">聚合同类 · 对照成败 · 提取边界</text><rect x="47.66666666666667" y="267.5" width="210" height="112" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="312.125" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">Markdown 文档</text>
  <text x="152.66666666666669" y="328.375" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">场景 · 策略 · 例外 · 来源 · 验</text><text x="152.66666666666669" y="344.575" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">证时间</text><rect x="295.00000000000006" y="267.5" width="210" height="112" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="320.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">检索应用</text>
  <text x="400.00000000000006" y="336.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">按需加载 · 继续产生反馈</text><path d="M257.6666666666667 160.5 L295.00000000000006 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 160.5 L542.3333333333334 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 216.5 L647.3333333333334 242 L152.66666666666669 242 L152.66666666666669 267.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 323.5 L295.00000000000006 323.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M295.00000000000006 323.5 L257.6666666666667 323.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">与第三章共用抽取和检索基础设施；本章新增轨迹评价与行为改进闭环。</text>
</svg>