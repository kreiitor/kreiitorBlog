<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">OpenClaw 的分层结构</title>
  <desc id="fig-desc">自上而下三层：多平台消息网关接入 WhatsApp、Telegram、iMessage、Slack 与 CLI；Coding Agent 运行时并排七个工具，外侧接网络搜索与浏览器自动化；文件系统保存 MEMORY.md、每日日志、SOUL.md、知识库与 Git 版本。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">OpenClaw 的分层结构</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">消息网关、Coding Agent 运行时与文件系统</text><rect x="40" y="147" width="720" height="58" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="179" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">多平台消息网关</text><rect x="194" y="156" width="103.2" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="245.6" y="179" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">WhatsApp</text><rect x="305.2" y="156" width="103.2" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="356.8" y="179" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">Telegram</text><rect x="416.4" y="156" width="103.2" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="468" y="179" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">iMessage</text><rect x="527.6" y="156" width="103.2" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="579.2" y="179" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">Slack</text><rect x="638.8" y="156" width="103.2" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="690.4" y="179" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">CLI</text><rect x="40" y="213" width="720" height="58" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="54" y="238.1" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">Coding Agent 运行</text><text x="54" y="253.625" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">时</text><rect x="194" y="222" width="84.66666666666667" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="236.33333333333334" y="238.4" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">Code</text><text x="236.33333333333334" y="253.25" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">Interpreter</text><rect x="286.6666666666667" y="222" width="84.66666666666667" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="329" y="245" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">Bash Shell</text><rect x="379.33333333333337" y="222" width="84.66666666666667" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="421.6666666666667" y="239" font-size="10" fill="var(--ink)" font-weight="600" text-anchor="middle">Read / Write</text><text x="421.6666666666667" y="252.5" font-size="10" fill="var(--ink)" font-weight="600" text-anchor="middle">/ Edit File</text><rect x="472" y="222" width="84.66666666666667" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="514.3333333333334" y="245" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">Glob / Grep</text><rect x="564.6666666666667" y="222" width="84.66666666666667" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="607.0000000000001" y="245" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">网络搜索</text><rect x="657.3333333333334" y="222" width="84.66666666666667" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="699.6666666666667" y="245" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">浏览器自动化</text><rect x="40" y="279" width="720" height="58" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="311" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">文件系统</text><rect x="194" y="288" width="103.2" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="245.6" y="311" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">MEMORY.md</text><rect x="305.2" y="288" width="103.2" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="356.8" y="304.4" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">daily/YYYY-MM-</text><text x="356.8" y="319.25" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">DD.md</text><rect x="416.4" y="288" width="103.2" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="468" y="311" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">SOUL.md</text><rect x="527.6" y="288" width="103.2" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="579.2" y="311" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">知识库文件</text><rect x="638.8" y="288" width="103.2" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="690.4" y="311" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">Git 版本控制</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">底部总结：大模型 = 新操作系统；运行时与文件系统之间是读 / 写文件的双向关系。</text>
</svg>