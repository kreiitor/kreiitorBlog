<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 58 800 386" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">可视化工作流编辑器的典型结构</title>
  <desc id="fig-desc">工作流编辑器的三栏界面示意：左侧节点面板，中间画布上排列触发器、Agent 与输出节点，右侧是节点配置</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="36" y="86" width="728" height="314" rx="10" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.8"/><rect x="36" y="86" width="728" height="30" rx="10" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)" stroke-width="1.2"/><rect x="36" y="106" width="728" height="10" fill="var(--line-soft,#e4d6c5)"/><text x="50" y="106" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="start">工作流编辑器</text><rect x="50.56" y="145.6" width="145.6" height="226.79999999999998" rx="6" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.4"/><text x="123.36" y="255.95" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">节点面板 触发器 · Agent</text><text x="123.36" y="270.8" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">· 工具 · 输出</text><rect x="210.72" y="145.6" width="378.56" height="226.79999999999998" rx="6" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="400" y="262" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">画布 触发器 → Agent → 输出</text><rect x="603.84" y="145.6" width="145.6" height="226.79999999999998" rx="6" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.4"/><text x="676.64" y="255.95" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">节点配置 模型 · 工具 ·</text><text x="676.64" y="270.8" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">提示词</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">界面为通用结构示意，具体布局随产品版本变化。</text>
</svg>