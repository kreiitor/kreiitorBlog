<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">可视化工作流编辑器的典型结构</title>
  <desc id="fig-desc">工作流编辑器的三栏界面示意：左侧节点面板，中间画布上排列触发器、Agent 与输出节点，右侧是节点配置</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="36" y="86" width="728" height="314" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.8"/><rect x="36" y="86" width="728" height="30" rx="10" fill="var(--line-soft)" stroke="var(--line)" stroke-width="1.2"/><rect x="36" y="106" width="728" height="10" fill="var(--line-soft)"/><text x="50" y="106" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="start">工作流编辑器</text><rect x="50.56" y="145.6" width="145.6" height="226.79999999999998" rx="6" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.4"/><text x="123.36" y="255.95" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">节点面板 触发器 · Agent</text><text x="123.36" y="270.8" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">· 工具 · 输出</text><rect x="210.72" y="145.6" width="378.56" height="226.79999999999998" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/><text x="400" y="262" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">画布 触发器 → Agent → 输出</text><rect x="603.84" y="145.6" width="145.6" height="226.79999999999998" rx="6" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.4"/><text x="676.64" y="255.95" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">节点配置 模型 · 工具 ·</text><text x="676.64" y="270.8" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">提示词</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">界面为通用结构示意，具体布局随产品版本变化。</text>
</svg>