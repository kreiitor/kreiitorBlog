<svg xmlns="http://www.w3.org/2000/svg" width="800" height="392" viewBox="0 58 800 392" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">LLM-as-a-Judge 的评分流水线</title>
  <desc id="fig-desc">Rubric、候选回答与可选参考答案送入 Judge 模型，输出逐维分数与理由，再按加权平均、一票否决、多评委等规则聚合。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#202735)}
    .sub{font-size:14px;fill:var(--muted,#596171)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#202735)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#202735)}
    .s{font-size:12px;fill:var(--muted,#596171)}
    .tiny{font-size:11px;fill:var(--muted,#596171)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/>

  <rect x="30" y="88" width="216" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--blue,#2647d7)" stroke-width="1.8"/>
  <text x="46" y="112" class="b">Rubric（评分标准）</text>
  <text x="46" y="136" class="tiny">事实正确性 · Essential</text>
  <text x="46" y="158" class="tiny">完整性 · Important</text>
  <text x="46" y="180" class="tiny">幻觉检测 · Veto ⚠</text>

  <rect x="30" y="214" width="216" height="78" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.5"/>
  <text x="46" y="238" class="b">候选回答</text>
  <text x="46" y="260" class="tiny">退款已处理，$150 将在</text>
  <text x="46" y="278" class="tiny">3–5 个工作日内到账。</text>

  <rect x="30" y="306" width="216" height="78" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="46" y="330" class="b">参考方案（可选）</text>
  <text x="46" y="352" class="tiny">必须包含金额与到账时间</text>
  <text x="46" y="370" class="tiny">不可承诺具体日期</text>

  <rect x="300" y="172" width="128" height="116" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.5"/>
  <text x="364" y="204" text-anchor="middle" class="b" fill="var(--on-blue,#fffefa)">Judge 模型</text>
  <text x="364" y="228" text-anchor="middle" class="tiny" fill="var(--on-blue,#fffefa)">按 Rubric 逐维打分</text>
  <text x="364" y="250" text-anchor="middle" class="tiny" fill="var(--on-blue,#fffefa)">多源输入防止同源偏见</text>

  <path d="M246 144 L276 144 L276 198 L300 198" stroke="var(--blue,#2647d7)" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M246 253 L300 253" stroke="var(--blue,#2647d7)" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M246 340 L276 340 L276 262 L300 262" stroke="var(--blue,#2647d7)" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>

  <rect x="478" y="86" width="292" height="224" rx="8" fill="var(--surface,#fffefa)" stroke="var(--blue,#2647d7)" stroke-width="1.8"/>
  <text x="494" y="110" class="b">结构化评估输出</text>
  <text x="494" y="132" class="tiny">维度</text>
  <text x="754" y="132" text-anchor="end" class="tiny">分数</text>
  <line x1="494" y1="142" x2="754" y2="142" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/>
  <text x="494" y="166" class="tiny">事实正确性</text>
  <text x="754" y="166" text-anchor="end" class="tiny">4/4</text>
  <text x="494" y="194" class="tiny">完整性</text>
  <text x="754" y="194" text-anchor="end" class="tiny">3/4</text>
  <text x="494" y="222" class="tiny">幻觉检测</text>
  <text x="754" y="222" text-anchor="end" class="tiny">PASS</text>
  <text x="494" y="250" class="tiny">逻辑连贯性</text>
  <text x="754" y="250" text-anchor="end" class="tiny">4/4</text>
  <rect x="494" y="266" width="260" height="30" rx="5" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.4"/>
  <text x="624" y="286" text-anchor="middle" class="tiny">幻觉一票否决：FAIL → 总分 0</text>

  <path d="M428 230 L478 230" stroke="var(--blue,#2647d7)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="478" y="330" width="292" height="70" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.5"/>
  <text x="494" y="354" class="b">评分聚合</text>
  <text x="494" y="378" class="tiny">加权平均 · 一票否决 · 多评委取中位数 · 分歧送人审</text>

  <path d="M624 310 L624 330" stroke="var(--blue,#2647d7)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <text x="30" y="424" class="s">Rubric 回答「怎么算好」，参考答案回答「什么是对的」；开放式任务可以没有参考答案，但不能没有 Rubric。</text>
  <text x="400" y="442" text-anchor="middle" class="tiny">Judge 的分数要能还原成具体问题：哪个维度低、低在哪里，才便于回到轨迹修复。</text>
</svg>
