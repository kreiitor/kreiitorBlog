<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">GRPO 的一次参数更新</title>
  <desc id="fig-desc">从上到下：同一 SWE-bench 任务与初始代码进入 16 个隔离沙箱采样；验证器按是否通过测试且未改测试给出 1 或 0；4 条通过获得正优势、12 条失败获得负优势；最后用梯度下降提高成功路径概率、降低失败路径概率</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">GRPO 的一次参数更新</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">16 条 rollout，验证器判分，组内比较后更新一次策略</text><rect x="45" y="104.5" width="153.5" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="121.75" y="149.125" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">任务与初始化</text>
  <text x="121.75" y="165.375" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">SWE-bench · parser.py</text><text x="121.75" y="181.575" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">· 空输入 IndexError</text><rect x="230.5" y="104.5" width="153.5" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="307.25" y="149.125" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">采样</text>
  <text x="307.25" y="165.375" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">16 个隔离沙箱 · 16 条</text><text x="307.25" y="181.575" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">rollout</text><rect x="416" y="104.5" width="153.5" height="112" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="492.75" y="149.125" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">奖励计算</text>
  <text x="492.75" y="165.375" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">通过且未改测试 → 1；否</text><text x="492.75" y="181.575" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">则 → 0</text><rect x="601.5" y="104.5" width="153.5" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="678.25" y="149.125" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">组内比较</text>
  <text x="678.25" y="165.375" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">4 条通过 → 正优势；12</text><text x="678.25" y="181.575" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">条 → 负优势</text><rect x="45" y="267.5" width="153.5" height="112" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="121.75" y="312.125" font-size="13" fill="var(--on-blue)" font-weight="700" text-anchor="middle">策略更新</text>
  <text x="121.75" y="328.375" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">成功路径 ↑ · 失败路径</text><text x="121.75" y="344.575" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">↓ · 下一 step</text><path d="M198.5 160.5 L230.5 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 160.5 L416 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M569.5 160.5 L601.5 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M678.25 216.5 L678.25 242 L121.75 242 L121.75 267.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">rollout 结果：#01 ×、#02 ✓、#03 ×、#04 ×、#05 ×、#06 ×、#07 ✓、#08 ×、#09 ×、#10 ×、#11 ✓、#12 ×、#13 ×、#14 ×、#15 ×、#16 ✓；4 条通过，12 条失败</text><text x="400" y="429.4" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">。粗略量级：rollout ≈ 2,000 s + update ≈ 600 s → step ≈ 2,600 s（约 43 分钟）。</text>
</svg>