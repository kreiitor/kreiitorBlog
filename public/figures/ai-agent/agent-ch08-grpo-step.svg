<svg xmlns="http://www.w3.org/2000/svg" width="800" height="374" viewBox="0 76 800 374" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">GRPO 的一次参数更新</title>
  <desc id="fig-desc">从上到下：同一 SWE-bench 任务与初始代码进入 16 个隔离沙箱采样；验证器按是否通过测试且未改测试给出 1 或 0；4 条通过获得正优势、12 条失败获得负优势；最后用梯度下降提高成功路径概率、降低失败路径概率</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="45" y="104.5" width="153.5" height="112" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="121.75" y="149.125" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">任务与初始化</text>
  <text x="121.75" y="165.375" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">SWE-bench · parser.py</text><text x="121.75" y="181.575" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">· 空输入 IndexError</text><rect x="230.5" y="104.5" width="153.5" height="112" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="307.25" y="149.125" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">采样</text>
  <text x="307.25" y="165.375" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">16 个隔离沙箱 · 16 条</text><text x="307.25" y="181.575" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">rollout</text><rect x="416" y="104.5" width="153.5" height="112" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="492.75" y="149.125" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">奖励计算</text>
  <text x="492.75" y="165.375" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">通过且未改测试 → 1；否</text><text x="492.75" y="181.575" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">则 → 0</text><rect x="601.5" y="104.5" width="153.5" height="112" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="678.25" y="149.125" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">组内比较</text>
  <text x="678.25" y="165.375" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">4 条通过 → 正优势；12</text><text x="678.25" y="181.575" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">条 → 负优势</text><rect x="45" y="267.5" width="153.5" height="112" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="121.75" y="312.125" font-size="13" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">策略更新</text>
  <text x="121.75" y="328.375" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">成功路径 ↑ · 失败路径</text><text x="121.75" y="344.575" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">↓ · 下一 step</text><path d="M198.5 160.5 L230.5 160.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 160.5 L416 160.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M569.5 160.5 L601.5 160.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M678.25 216.5 L678.25 242 L121.75 242 L121.75 267.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">rollout 结果：#01 ×、#02 ✓、#03 ×、#04 ×、#05 ×、#06 ×、#07 ✓、#08 ×、#09 ×、#10 ×、#11 ✓、#12 ×、#13 ×、#14 ×、#15 ×、#16 ✓；4 条通过，12 条失败</text><text x="400" y="429.4" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">。粗略量级：rollout ≈ 2,000 s + update ≈ 600 s → step ≈ 2,600 s（约 43 分钟）。</text>
</svg>