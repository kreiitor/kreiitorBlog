<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">在线执行与离线进化双循环</title>
  <desc id="fig-desc">左侧在线循环：稳定版 Agent 处理真实任务，记录轨迹与反馈后回到稳定版；右侧离线循环：聚合与诊断、候选修改、回归与安全验证、灰度监控与回滚、晋升为新稳定版，再回到聚合与诊断；两个循环之间向右传版本化经验日志，向左回流通过验证的新版本</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">在线执行与离线进化双循环</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">正式版本不在运行中直接改写</text><line x1="80" y1="144.375" x2="80" y2="238.90625" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="238.90625" x2="80" y2="333.4375" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="333.4375" x2="560" y2="110" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="560" y1="110" x2="560" y2="178.75" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="560" y1="178.75" x2="560" y2="247.5" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="560" y1="247.5" x2="560" y2="316.25" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="560" y1="316.25" x2="560" y2="385" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="560" y1="385" x2="560" y2="110" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="560" y1="385" x2="80" y2="144.375" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><rect x="42" y="122.375" width="76" height="44" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="80" y="141.875" font-size="10" fill="var(--on-blue)" font-weight="700" text-anchor="middle">稳定版</text><text x="80" y="155.375" font-size="10" fill="var(--on-blue)" font-weight="700" text-anchor="middle">Agent</text>
  <rect x="42" y="216.90625" width="76" height="44" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="80" y="242.65625" font-size="10" fill="var(--ink)" font-weight="700" text-anchor="middle">处理真实任务</text>
  <rect x="42" y="311.4375" width="76" height="44" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="80" y="330.9375" font-size="10" fill="var(--ink)" font-weight="700" text-anchor="middle">记录轨迹与反</text><text x="80" y="344.4375" font-size="10" fill="var(--ink)" font-weight="700" text-anchor="middle">馈</text>
  <rect x="522" y="88" width="76" height="44" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="560" y="113.75" font-size="10" fill="var(--ink)" font-weight="700" text-anchor="middle">聚合与诊断</text>
  <rect x="522" y="156.75" width="76" height="44" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="560" y="182.5" font-size="10" fill="var(--ink)" font-weight="700" text-anchor="middle">候选修改</text>
  <rect x="522" y="225.5" width="76" height="44" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="560" y="245" font-size="10" fill="var(--ink)" font-weight="700" text-anchor="middle">回归与安全验</text><text x="560" y="258.5" font-size="10" fill="var(--ink)" font-weight="700" text-anchor="middle">证</text>
  <rect x="522" y="294.25" width="76" height="44" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="560" y="313.75" font-size="10" fill="var(--ink)" font-weight="700" text-anchor="middle">灰度、监控与</text><text x="560" y="327.25" font-size="10" fill="var(--ink)" font-weight="700" text-anchor="middle">回滚</text>
  <rect x="522" y="363" width="76" height="44" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="560" y="382.5" font-size="10" fill="var(--on-blue)" font-weight="700" text-anchor="middle">晋升为新稳定</text><text x="560" y="396" font-size="10" fill="var(--on-blue)" font-weight="700" text-anchor="middle">版</text>
  <text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">可信根：权限、审计、验证与回滚机制不由普通进化流程自行修改。</text>
</svg>