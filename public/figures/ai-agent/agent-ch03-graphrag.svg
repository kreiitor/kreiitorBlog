<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 58 800 386" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">实体与关系的知识图谱</title>
  <desc id="fig-desc">用户节点分出两条边，分别指向张医生-A 与张医生-B；张医生-A 就职于仁爱口腔医院，该医院地址为徐汇区 XX 路；张医生-B 就职于华山医院，并连到心血管中心</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="80" y1="252.24137931034483" x2="300" y2="138.44827586206895" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="252.24137931034483" x2="300" y2="366.0344827586207" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="300" y1="138.44827586206895" x2="500" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="500" y1="110" x2="680" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="300" y1="366.0344827586207" x2="500" y2="385" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="500" y1="385" x2="680" y2="385" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="228.24137931034483" width="100" height="48" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="80" y="256.3663793103448" font-size="11" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">用户</text>
  <rect x="250" y="114.44827586206895" width="100" height="48" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="300" y="142.57327586206895" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">张医生-A</text>
  <rect x="250" y="342.0344827586207" width="100" height="48" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="300" y="370.1594827586207" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">张医生-B</text>
  <rect x="450" y="86" width="100" height="48" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="500" y="114.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">仁爱口腔医院</text>
  <rect x="450" y="361" width="100" height="48" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="500" y="389.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">华山医院</text>
  <rect x="630" y="86" width="100" height="48" rx="8" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="680" y="114.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">徐汇区 XX 路</text>
  <rect x="630" y="361" width="100" height="48" rx="8" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="680" y="389.125" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">心血管中心</text>
  <text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">每条边是一个（主语-关系-宾语）三元组。</text>
</svg>