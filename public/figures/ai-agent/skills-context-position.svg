<svg xmlns="http://www.w3.org/2000/svg" width="800" height="412" viewBox="0 38 800 412" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Skills 在上下文中的位置</title>
  <desc id="fig-desc">系统提示词与工具定义构成稳定前缀，Skill 目录与完整正文各自只在首次出现时写入一次，之后的新内容只追加到消息数组末尾。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:14px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:13px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:12px;fill:var(--muted,#5f4f3c)}
    .onblue{fill:var(--on-blue,#fffcf5)}
    .onyellow{fill:var(--on-yellow,#3b3024)}
  </style>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <path d="M60 84 V420" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="60" y="78" text-anchor="middle" class="tiny">只追加</text>

  <rect x="72" y="84" width="450" height="42" rx="6" fill="var(--blue,#466b3f)"/>
  <text x="92" y="102" class="b onblue">system + tools</text>
  <text x="92" y="119" class="tiny onblue">固定前缀</text>

  <rect x="72" y="134" width="450" height="42" rx="6" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>
  <text x="92" y="152" class="b">user：从 PDF 生成 PPT</text>
  <text x="92" y="169" class="tiny">真实用户消息</text>

  <rect x="72" y="184" width="450" height="42" rx="6" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.5"/>
  <text x="92" y="202" class="b">Skill 目录（约 300 tokens）</text>
  <text x="92" y="219" class="tiny">emit-once：首轮写入，之后命中</text>

  <rect x="72" y="234" width="450" height="34" rx="6" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>
  <text x="92" y="256" class="b">assistant：Skill(pptx)</text>

  <rect x="72" y="276" width="450" height="34" rx="6" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>
  <text x="92" y="298" class="b">tool：Launching skill: pptx</text>
  <text x="500" y="298" text-anchor="end" class="tiny">占位符</text>

  <rect x="72" y="318" width="450" height="42" rx="6" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.5"/>
  <text x="92" y="336" class="b">Skill 正文（约 2k tokens）</text>
  <text x="92" y="353" class="tiny">emit-once：追加在调用位置</text>

  <rect x="72" y="368" width="450" height="34" rx="6" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>
  <text x="92" y="390" class="b">Read / Write 的 tool_use 与 result</text>
  <text x="500" y="390" text-anchor="end" class="tiny">持续追加</text>

  <rect x="560" y="120" width="200" height="230" rx="10" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="2"/>
  <text x="660" y="148" text-anchor="middle" class="h">缓存状态</text>
  <line x1="580" y1="160" x2="740" y2="160" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>

  <circle cx="590" cy="186" r="5" fill="var(--yellow,#f5d75f)"/>
  <text x="606" y="191" class="b">Turn 1</text>
  <text x="606" y="209" class="s">新增内容：NEW</text>
  <text x="606" y="226" class="tiny">付一次 cache_creation</text>

  <circle cx="590" cy="256" r="5" fill="var(--blue,#466b3f)"/>
  <text x="606" y="261" class="b">Turn 2+</text>
  <text x="606" y="279" class="s">已有前缀：HIT</text>
  <text x="606" y="296" class="tiny">边际成本为零</text>

  <text x="660" y="330" text-anchor="middle" class="tiny">位置一旦插入，就不再移动</text>

  <text x="400" y="434" text-anchor="middle" class="tiny">首轮加载目录与正文仍要真实计算；收益来自后续轮次的复用。</text>
</svg>
