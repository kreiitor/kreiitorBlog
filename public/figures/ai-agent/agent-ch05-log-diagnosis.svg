<svg xmlns="http://www.w3.org/2000/svg" width="800" height="368" viewBox="0 76 800 368" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">生产日志诊断流水线</title>
  <desc id="fig-desc">五步串联：采集 trajectory_001.json 轨迹，LLM 结合架构文档与 PRD 分析，生成 P1 问题报告，生成引用轨迹编号的回归测试用例，最后通过 MCP 创建 GitHub Issue。</desc>
