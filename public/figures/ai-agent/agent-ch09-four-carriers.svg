<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">持续进化的四种载体</title>
  <desc id="fig-desc">四个并列条目：知识承载事实、经验与例外，写入 Markdown 或知识库；指令承载可语言化的判断原则，写入 Prompt 或 Skill；程序承载确定性流程与强约束，写成工具、工作流或 Harness；参数承载高维感知与隐式策略，通过 SFT、蒸馏或 RL 更新</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="34" y="92" width="172.5" height="300" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="120.25" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">知识</text><text x="120.25" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">事实、经验与例外</text><text x="46" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">Markdown / 知识库</text><text x="46" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">适用场景与例外</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">易更新、可追溯</text><rect x="220.5" y="92" width="172.5" height="300" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="306.75" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">指令</text><text x="306.75" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">可语言化的判断原则</text><text x="232.5" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">Prompt / Skill</text><text x="232.5" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">按需加载</text><text x="232.5" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">作用域明确</text><rect x="407" y="92" width="172.5" height="300" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/><text x="493.25" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">程序</text><text x="493.25" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">确定性流程与强约束</text><text x="419" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">工具 / 工作流 /</text><text x="431" y="189.525" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">Harness</text><text x="419" y="210.9" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="210.9" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">可重复执行</text><text x="419" y="232.85000000000002" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="232.85000000000002" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">硬边界</text><rect x="593.5" y="92" width="172.5" height="300" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/><text x="679.75" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">参数</text><text x="679.75" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">高维感知与隐式策略</text><text x="605.5" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">SFT / 蒸馏 / RL</text><text x="605.5" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">内化、低推理开销</text><text x="605.5" y="217.89999999999998" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="217.89999999999998" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">更新与回归成本高</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">易更新、可追溯</text><text x="730" y="400" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="end">内化、低推理开销</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">稳定性、成本与更新频率决定具体部署方式，不影响能力能否参数化。</text>
</svg>