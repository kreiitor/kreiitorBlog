<svg xmlns="http://www.w3.org/2000/svg" width="800" height="325" viewBox="0 74 800 325" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">自主 Agent 的执行循环</title>
  <desc id="fig-desc">思考、行动、观察三个环节首尾相连；判断框检查退出条件，满足则输出最终结果，否则回到思考</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><path d="M400 130 Q508.25317547305485 220 616.5063509461097 310" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><path d="M616.5063509461097 310 Q400.00000000000006 310 183.49364905389038 310.00000000000006" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><path d="M183.49364905389038 310.00000000000006 Q291.7468245269452 220.00000000000003 400 130" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="102" width="132" height="56" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="400" y="127.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">① 思考</text>
  <text x="400" y="141" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">还需更多信息</text><rect x="550.5063509461097" y="282" width="132" height="56" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="616.5063509461097" y="307.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">② 行动</text>
  <text x="616.5063509461097" y="321" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">web_search(...)</text><rect x="117.49364905389038" y="282.00000000000006" width="132" height="56" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="183.49364905389038" y="307.25000000000006" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">③ 观察</text>
  <text x="183.49364905389038" y="321.00000000000006" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">tool_result: ...</text><text x="400" y="242.8" font-size="12" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">满足退出条件？ 是 → 输</text><text x="400" y="259" font-size="12" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">出结果 否 → 继续下一轮</text><text x="400" y="372" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">退出条件（任一满足）：任务完成 · 调用 final_answer · 无工具调用返回 · 错误次数超限 · 达到最大轮次</text>
</svg>