<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 64 800 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">异步事件的三种处理策略</title>
  <desc id="fig-desc">三栏对照同一时刻的处理：取消式在用户说停止时打断推理并清空队列；队列式把补充消息入队，等工具返回后批量追加；并行式为主任务另起一个 LLM，立即回答独立的天气查询。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="34" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/><text x="151.33333333333331" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">取消式</text><text x="151.33333333333331" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">紧急 · 立即打断</text><text x="46" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">停止当前推理</text><text x="46" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">取消执行中的工具</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">清空队列并追加事件</text><text x="46" y="239.84999999999997" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="58" y="239.84999999999997" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">重新调用 LLM</text><rect x="282.66666666666663" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="399.99999999999994" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">队列式</text><text x="399.99999999999994" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">常规 · 等到安全点</text><text x="294.66666666666663" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">消息入队等待</text><text x="294.66666666666663" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">工具继续执行</text><text x="294.66666666666663" y="217.89999999999998" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="217.89999999999998" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">返回后批量追加</text><text x="294.66666666666663" y="239.84999999999997" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="306.66666666666663" y="239.84999999999997" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">LLM 综合处理</text><rect x="531.3333333333333" y="92" width="234.66666666666666" height="300" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="648.6666666666666" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">并行式</text><text x="648.6666666666666" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">独立 · 另起循环</text><text x="543.3333333333333" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">主任务继续执行</text><text x="543.3333333333333" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">另起并行 LLM</text><text x="543.3333333333333" y="217.89999999999998" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="217.89999999999998" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">立即回复轻量查询</text><text x="543.3333333333333" y="239.84999999999997" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="555.3333333333333" y="239.84999999999997" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">不占用主循环</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">取消式重新发起 LLM 推理并清空队列；队列式在工具返回后一次性追加 tool.result 与用户补充；并行式在主线标记「与主任务并行」。</text>
</svg>