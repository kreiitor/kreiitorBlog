<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">快慢双分支的时序冲突</title>
  <desc id="fig-desc">两条并行分支：快思考在 500ms 内给出「价格不错，建议购买」，慢思考约 8 秒后给出「缺少国际漫游，不太适合」；用户体验时间线上 0.5 秒听到第一句，8.0 秒听到第二句，形成自相矛盾。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">快慢双分支的时序冲突</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">0.5 秒与 8 秒两次回答相互矛盾</text><line x1="126" y1="96" x2="126" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="282.5" y1="96" x2="282.5" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="282.5" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">2000</text><line x1="439" y1="96" x2="439" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="439" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">4000</text><line x1="595.5" y1="96" x2="595.5" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="595.5" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">6000</text><line x1="752" y1="96" x2="752" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="752" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">8000</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">快思考</text><rect x="126" y="115" width="39.125" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><text x="145.5625" y="134" font-size="8" fill="var(--on-blue)" font-weight="600" text-anchor="middle">思考关…</text><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">慢思考</text><rect x="126" y="157" width="626" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="439" y="176" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">思考开启 → 缺少国际漫游</text><text x="116" y="219" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">用户听到</text><rect x="126" y="199" width="39.125" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="145.5625" y="218" font-size="8" fill="var(--ink)" font-weight="600" text-anchor="middle">0.5s …</text><rect x="165.125" y="199" width="586.875" height="32" rx="3" fill="var(--line-soft)" stroke="var(--line)"/><text x="458.5625" y="218" font-size="9.5" fill="var(--ink)" font-weight="600" text-anchor="middle">等待至第二句</text><line x1="126" y1="242" x2="752" y2="242" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="278" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">时间 / ms</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">下半部问题：简单问题被慢思考重复处理（「今天星期几」仍运行 8s）；改进方向是慢思考通过 Agent 状态栏指导快思考，但沟通仍然间接。</text>
</svg>