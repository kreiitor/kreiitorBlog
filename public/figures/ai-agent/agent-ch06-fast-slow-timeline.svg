<svg xmlns="http://www.w3.org/2000/svg" width="800" height="273" viewBox="0 68 800 273" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">快慢双分支的时序冲突</title>
  <desc id="fig-desc">两条并行分支：快思考在 500ms 内给出「价格不错，建议购买」，慢思考约 8 秒后给出「缺少国际漫游，不太适合」；用户体验时间线上 0.5 秒听到第一句，8.0 秒听到第二句，形成自相矛盾。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="126" y1="96" x2="126" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="126" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">0</text><line x1="282.5" y1="96" x2="282.5" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="282.5" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">2000</text><line x1="439" y1="96" x2="439" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="439" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">4000</text><line x1="595.5" y1="96" x2="595.5" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="595.5" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">6000</text><line x1="752" y1="96" x2="752" y2="242" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="752" y="258" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">8000</text><text x="116" y="135" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">快思考</text><rect x="126" y="115" width="39.125" height="32" rx="3" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)"/><text x="145.5625" y="134" font-size="8" fill="var(--on-blue,#fffcf5)" font-weight="600" text-anchor="middle">思考关…</text><text x="116" y="177" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">慢思考</text><rect x="126" y="157" width="626" height="32" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)"/><text x="439" y="176" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">思考开启 → 缺少国际漫游</text><text x="116" y="219" font-size="10.5" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">用户听到</text><rect x="126" y="199" width="39.125" height="32" rx="3" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)"/><text x="145.5625" y="218" font-size="8" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">0.5s …</text><rect x="165.125" y="199" width="586.875" height="32" rx="3" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)"/><text x="458.5625" y="218" font-size="9.5" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">等待至第二句</text><line x1="126" y1="242" x2="752" y2="242" stroke="var(--line,#c9b49c)" stroke-width="1.4"/><text x="439" y="278" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="middle">时间 / ms</text><text x="400" y="315" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">下半部问题：简单问题被慢思考重复处理（「今天星期几」仍运行 8s）；改进方向是慢思考通过 Agent 状态栏指导快思考，但沟通仍然间接。</text>
</svg>