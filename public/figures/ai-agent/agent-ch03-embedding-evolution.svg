<svg xmlns="http://www.w3.org/2000/svg" width="800" height="368" viewBox="0 76 800 368" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">稠密嵌入的技术演进</title>
  <desc id="fig-desc">五个节点按年份排列：Word2Vec 2013 年 300 维，GloVe 2014 年 300 维，BERT 2018 年 768 维，Sentence-BERT 2019 年 768 维，BGE-M3 2024 年 1024 维；前两个是静态词向量，后三个是上下文感知嵌入</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="45" y="104.5" width="153.5" height="112" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="121.75" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">Word2Vec</text>
  <text x="121.75" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">2013 · 300 维 · 共现</text><rect x="230.5" y="104.5" width="153.5" height="112" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="307.25" y="149.125" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">GloVe</text>
  <text x="307.25" y="165.375" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">2014 · 300 维 · 全局</text><text x="307.25" y="181.575" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">统计</text><rect x="416" y="104.5" width="153.5" height="112" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="492.75" y="149.125" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">BERT</text>
  <text x="492.75" y="165.375" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">2018 · 768 维 · 上下</text><text x="492.75" y="181.575" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">文</text><rect x="601.5" y="104.5" width="153.5" height="112" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="678.25" y="149.125" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">Sentence-BERT</text>
  <text x="678.25" y="165.375" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">2019 · 768 维 · 句子</text><text x="678.25" y="181.575" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">级</text><rect x="45" y="267.5" width="153.5" height="112" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="121.75" y="312.125" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">BGE-M3</text>
  <text x="121.75" y="328.375" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">2024 · 1024 维 · 多语</text><text x="121.75" y="344.575" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">言</text><path d="M198.5 160.5 L230.5 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 160.5 L416 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M569.5 160.5 L601.5 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M678.25 216.5 L678.25 242 L121.75 242 L121.75 267.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">前段：静态词向量（一词一向量）；后段：上下文感知嵌入（一词多向量）。</text>
</svg>