<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 64 800 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Computer Use 的动作空间</title>
  <desc id="fig-desc">四栏：GUI 操作工具提供鼠标移动、点击、拖拽，键盘输入与组合键，四方向滚动；感知动作提供截图、光标位置与等待；bash 提供持久终端、120 秒超时与哨兵字符串；文件编辑提供查看、创建、替换、插入与撤销。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="34" y="92" width="172.5" height="300" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/><text x="120.25" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">GUI 操作</text><text x="120.25" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">computer</text><text x="46" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">鼠标移动 / 点击 / 拖拽</text><text x="46" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">键盘输入 / 组合键</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">四方向滚动</text><text x="46" y="239.84999999999997" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="239.84999999999997" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">截图 / 光标 / 等待</text><rect x="220.5" y="92" width="172.5" height="300" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="306.75" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">感知动作</text><text x="306.75" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">screenshot · cursor · wait</text><text x="232.5" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">截图缩放到训练分辨率</text><text x="232.5" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">读取光标 (x, y)</text><text x="232.5" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">等待界面稳定</text><rect x="407" y="92" width="172.5" height="300" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/><text x="493.25" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">命令执行</text><text x="493.25" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">bash</text><text x="419" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">持久 bash 会话</text><text x="419" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">120s 超时</text><text x="419" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">哨兵字符串判完成</text><rect x="593.5" y="92" width="172.5" height="300" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/><text x="679.75" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">文件编辑</text><text x="679.75" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">str_replace_editor</text><text x="605.5" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">view / create</text><text x="605.5" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">str_replace</text><text x="605.5" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">insert / undo_edit</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line,#a2aec1)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">通用但脆弱</text><text x="730" y="400" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">精确但需定位</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">坐标缩放：实际分辨率与训练分辨率（XGA / WXGA / FWXGA）之间双向映射；典型表单填写每步间隔 2–5s，速度约为人类的 1/3 到 1/5。</text>
</svg>