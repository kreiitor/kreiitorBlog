<svg xmlns="http://www.w3.org/2000/svg" width="800" height="306" viewBox="0 58 800 306" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">并行 Web Scraping 架构</title>
  <desc id="fig-desc">Manager Agent 在上方负责动态创建、实时监控和级联终止；下方五个被画出的子 Agent 对应 cs.edu.cn、math.edu.cn、phys.edu.cn、chem.edu.cn 与其余 Agent 5 到 10，状态分别为搜索中、未找到、找到、已终止、已终止；找到的 Agent 3 向 Manager 发送 target_found，其余 Agent 在 t=19s 前确认终止</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><line x1="380" y1="110" x2="80" y2="280" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="380" y1="110" x2="230" y2="280" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="380" y1="110" x2="380" y2="280" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="380" y1="110" x2="530" y2="280" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="380" y1="110" x2="680" y2="280" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><line x1="380" y1="280" x2="380" y2="110" stroke="var(--blue,#466b3f)" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="86" width="100" height="48" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="380" y="100.375" font-size="11" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">Manager Agent</text>
  <text x="380" y="114.125" font-size="10" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">动态创建 · 监控</text><text x="380" y="127.625" font-size="10" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">· 级联终止</text><rect x="30" y="256" width="100" height="48" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="80" y="270.375" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Agent 1</text>
  <text x="80" y="284.125" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">cs.edu.cn · 搜索</text><text x="80" y="297.625" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">中</text><rect x="180" y="256" width="100" height="48" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="230" y="270.375" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Agent 2</text>
  <text x="230" y="284.125" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">math.edu.cn ·</text><text x="230" y="297.625" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">未找到</text><rect x="330" y="256" width="100" height="48" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="380" y="270.375" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Agent 3</text>
  <text x="380" y="284.125" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">phys.edu.cn ·</text><text x="380" y="297.625" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">找到</text><rect x="480" y="256" width="100" height="48" rx="8" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="530" y="270.375" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Agent 4</text>
  <text x="530" y="284.125" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">chem.edu.cn ·</text><text x="530" y="297.625" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">已终止</text><rect x="630" y="256" width="100" height="48" rx="8" fill="var(--line-soft,#e4d6c5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="680" y="277.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Agent 5–10</text>
  <text x="680" y="291" font-size="10" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">其余 · 已终止</text><text x="400" y="338" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">串行 10 个网站 × 30s ≈ 5 分钟；并行 18 秒找到加 1 秒终止共 19 秒；加速比约 15 倍，其中包含级联终止省下的等待。</text>
</svg>