<svg xmlns="http://www.w3.org/2000/svg" width="800" height="148" viewBox="0 18 800 148" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">从 API 消息到 Token 流</title>
  <desc id="fig-desc">左侧是 system 与 user 两条消息，经 Chat Template 渲染后成为右侧的 token 序列；特殊标记 im_start 与 im_end 在序列里各占一个 token</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#2c251d;--yellow:#e7c96b;--yellow-soft:#3b3024;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="240" fill="var(--paper,#faf6f0)"/>

  <text x="40" y="40" font-size="10.5" fill="var(--muted,#5f4f3c)">API 消息</text>
  <rect x="40" y="54" width="62" height="22" rx="3" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1"/>
  <text x="71" y="69" text-anchor="middle" font-size="9.5" fill="var(--ink,#3b3024)" class="mono">system</text>
  <text x="114" y="69" font-size="11" fill="var(--ink,#3b3024)">你是助手</text>
  <line x1="40" y1="90" x2="300" y2="90" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>
  <rect x="40" y="100" width="52" height="22" rx="3" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1"/>
  <text x="66" y="115" text-anchor="middle" font-size="9.5" fill="var(--ink,#3b3024)" class="mono">user</text>
  <text x="104" y="115" font-size="11" fill="var(--ink,#3b3024)">你好</text>
  <line x1="40" y1="136" x2="300" y2="136" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>

  <path d="M312 95 L398 95" stroke="var(--blue,#466b3f)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="355" y="84" text-anchor="middle" font-size="10" fill="var(--muted,#5f4f3c)">Chat Template</text>

  <text x="412" y="40" font-size="10.5" fill="var(--muted,#5f4f3c)">token 序列</text>

  <rect x="412" y="54" width="78" height="22" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1"/>
  <text x="451" y="69" text-anchor="middle" font-size="9.5" fill="var(--ink,#3b3024)" class="mono">&lt;|im_start|&gt;</text>
  <rect x="496" y="54" width="54" height="22" rx="3" fill="none" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>
  <text x="523" y="69" text-anchor="middle" font-size="9.5" fill="var(--ink,#3b3024)" class="mono">system</text>
  <rect x="556" y="54" width="58" height="22" rx="3" fill="none" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>
  <text x="585" y="69" text-anchor="middle" font-size="9.5" fill="var(--ink,#3b3024)">你是助手</text>
  <rect x="620" y="54" width="66" height="22" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1"/>
  <text x="653" y="69" text-anchor="middle" font-size="9.5" fill="var(--ink,#3b3024)" class="mono">&lt;|im_end|&gt;</text>

  <rect x="412" y="84" width="78" height="22" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1"/>
  <text x="451" y="99" text-anchor="middle" font-size="9.5" fill="var(--ink,#3b3024)" class="mono">&lt;|im_start|&gt;</text>
  <rect x="496" y="84" width="44" height="22" rx="3" fill="none" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>
  <text x="518" y="99" text-anchor="middle" font-size="9.5" fill="var(--ink,#3b3024)" class="mono">user</text>
  <rect x="546" y="84" width="42" height="22" rx="3" fill="none" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>
  <text x="567" y="99" text-anchor="middle" font-size="9.5" fill="var(--ink,#3b3024)">你好</text>
  <rect x="594" y="84" width="66" height="22" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1"/>
  <text x="627" y="99" text-anchor="middle" font-size="9.5" fill="var(--ink,#3b3024)" class="mono">&lt;|im_end|&gt;</text>

  <rect x="412" y="114" width="78" height="22" rx="3" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1"/>
  <text x="451" y="129" text-anchor="middle" font-size="9.5" fill="var(--ink,#3b3024)" class="mono">&lt;|im_start|&gt;</text>
  <rect x="496" y="114" width="66" height="22" rx="3" fill="none" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>
  <text x="529" y="129" text-anchor="middle" font-size="9.5" fill="var(--ink,#3b3024)" class="mono">assistant</text>
  <text x="572" y="129" font-size="10" fill="var(--muted,#5f4f3c)">← 模型从这里开始生成</text>
</svg>
