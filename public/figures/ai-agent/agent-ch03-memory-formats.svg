<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">四种记忆存储格式</title>
  <desc id="fig-desc">四列从左到右为 Simple Notes、Enhanced Notes、JSON Cards、Advanced JSON Cards；每列给出示例、优点与缺点，Simple Notes 是原子事实，Advanced JSON Cards 增加 backstory、person 与 relationship</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="34" y="92" width="172.5" height="300" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="120.25" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">Simple Notes</text><text x="120.25" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">原子事实</text><text x="46" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">示例：用户邮箱 john@</text><text x="58" y="189.525" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">x.com</text><text x="46" y="210.9" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="210.9" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">优点：原子事实 · O(1)</text><text x="46" y="232.85000000000002" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="232.85000000000002" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">缺点：关联性丢失</text><rect x="220.5" y="92" width="172.5" height="300" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="306.75" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">Enhanced Notes</text><text x="306.75" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">整段叙事</text><text x="232.5" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">示例：在 TechCorp 任高</text><text x="244.5" y="189.525" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">级工程师，带 5 人团队…</text><text x="232.5" y="210.9" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="210.9" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">优点：语义完整</text><text x="232.5" y="232.85000000000002" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="232.85000000000002" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">缺点：冗余 · 难更新</text><rect x="407" y="92" width="172.5" height="300" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/><text x="493.25" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">JSON Cards</text><text x="493.25" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">类别 → 键值</text><text x="419" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">示例：</text><text x="431" y="189.525" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">work.position.title</text><text x="419" y="210.9" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="210.9" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">优点：三层结构化 · 部分</text><text x="431" y="226.425" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">更新</text><text x="419" y="247.8" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="247.8" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">缺点：刚性分类</text><rect x="593.5" y="92" width="172.5" height="300" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/><text x="679.75" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">Advanced JSON Cards</text><text x="679.75" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">JSON Cards + 上下文</text><text x="605.5" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">增加 backstory ·</text><text x="617.5" y="189.525" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">person · relationship</text><text x="605.5" y="210.9" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="210.9" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">优点：消歧 · 知识管理</text><text x="605.5" y="232.85000000000002" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="232.85000000000002" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">缺点：生成维护成本高</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">简单性</text><text x="730" y="400" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="end">表达力</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">坐标轴：左端简单性，右端表达力。</text>
</svg>