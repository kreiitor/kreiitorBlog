<svg xmlns="http://www.w3.org/2000/svg" width="800" height="395" viewBox="0 55 800 395" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Chat Template 把结构化消息串成 token 流</title>
  <desc id="fig-desc">左侧是 system、user、assistant 三条 API 消息，经 Chat Template 转换后，变成带角色标记和结束标记的线性 token 序列。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:12px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:11px;fill:var(--muted,#5f4f3c)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <text x="40" y="96" class="b">API 消息（开发者看到）</text>
  <rect x="40" y="108" width="240" height="76" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.8"/>
  <text x="56" y="132" class="mono b">system</text>
  <text x="56" y="156" class="s">You are a helpful assistant.</text>

  <rect x="40" y="196" width="240" height="66" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.8"/>
  <text x="56" y="220" class="mono b">user</text>
  <text x="56" y="244" class="s">北京今天天气怎么样？</text>

  <rect x="40" y="274" width="240" height="66" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--yellow,#f5d75f)" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="56" y="298" class="mono b">assistant</text>
  <text x="56" y="322" class="s">（待生成）</text>

  <path d="M292 220 L372 220" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="332" y="208" text-anchor="middle" class="b">Chat</text>
  <text x="332" y="240" text-anchor="middle" class="b">Template</text>

  <text x="400" y="96" class="b">Token 流（模型看到）</text>
  <rect x="400" y="108" width="370" height="70" rx="6" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="412" y="133" class="mono tiny">&lt;|im_start|&gt;system</text>
  <text x="550" y="126" class="mono tiny">You are a helpful</text>
  <text x="550" y="140" class="mono tiny">assistant.</text>
  <text x="690" y="133" class="mono tiny">&lt;|im_end|&gt;</text>
  <line x1="400" y1="146" x2="770" y2="146" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>
  <text x="412" y="166" class="tiny">角色标记</text>
  <text x="550" y="166" class="tiny">内容</text>
  <text x="690" y="166" class="tiny">结束标记</text>

  <rect x="400" y="196" width="370" height="70" rx="6" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="412" y="221" class="mono tiny">&lt;|im_start|&gt;user</text>
  <text x="550" y="221" class="mono tiny">北京今天天气怎么样？</text>
  <text x="690" y="221" class="mono tiny">&lt;|im_end|&gt;</text>
  <line x1="400" y1="234" x2="770" y2="234" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>
  <text x="412" y="254" class="tiny">角色标记</text>
  <text x="550" y="254" class="tiny">内容</text>
  <text x="690" y="254" class="tiny">结束标记</text>

  <rect x="400" y="284" width="370" height="70" rx="6" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="412" y="309" class="mono tiny">&lt;|im_start|&gt;assistant</text>
  <text x="565" y="309" class="tiny">模型从这里开始续写</text>
  <line x1="400" y1="322" x2="770" y2="322" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>
  <text x="412" y="342" class="tiny">角色标记</text>
  <text x="565" y="342" class="tiny">没有结束标记：生成起点</text>

  <rect x="40" y="374" width="730" height="38" rx="7" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>
  <text x="56" y="398" class="s">特殊标记界定角色与消息边界；整段标记必须逐字节稳定，前缀缓存才能持续命中。</text>

  <text x="400" y="438" text-anchor="middle" class="tiny">不同模型家族使用不同的模板；调用方通常只提交结构化消息，由服务端按模型配置完成拼接。</text>
</svg>
