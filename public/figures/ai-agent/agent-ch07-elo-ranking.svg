)" font-weight="400" text-anchor="middle">匿名对决：Model A 回复“退款已处理，将在 3-5 个工作日到账”，Model B 回复“好的退款会处理的”，用户盲选 A 更好。预期胜率 E_A = 1/(1+10^((R_B−R_A)/400))；</text><text x="400" y="429.4" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">更新 R_A′ = R_A + K·(S_A−E_A)。GRPO 将配对比较引入 RL 训练：一组候选响应 → 相对优势归一化 → 策略更新。</text>
