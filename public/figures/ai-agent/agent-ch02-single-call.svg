<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">单轮调用的请求与响应</title>
  <desc id="fig-desc">左侧 Request 包含 system 与 user 两条消息，右侧 Response 只含一条 assistant 消息，中间用「调用」箭头连接；底部说明每次调用都是无状态的</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">单轮调用的请求与响应</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">两条消息发出，一条 assistant 消息返回</text><rect x="34" y="92" width="359" height="300" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="213.5" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">Request</text><text x="213.5" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">Agent 框架构造</text><text x="46" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">system：开发者写的规则</text><text x="46" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">user：Hello, who are you?</text><rect x="407" y="92" width="359" height="300" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/><text x="586.5" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">Response</text><text x="586.5" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">API 返回</text><text x="419" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">assistant：Hi! I'm a coding assistant…</text><text x="419" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">无 tool_calls</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">system 内容是开发者写的规则，user 内容是 Hello, who are you?。</text>
</svg>