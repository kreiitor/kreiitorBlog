<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">OpenAI 探索的三个阶段</title>
  <desc id="fig-desc">时间轴分三段：2015–2016 算法中心主义，代表成果 DQN 与 Atari；2016–2018 环境的重要性，代表成果 Gym、Universe 与 Dota 2；2018 至今先验的觉醒，代表成果 GPT-2/3、WebGPT 与 ChatGPT</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="126" y1="96" x2="126" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="126" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">0</text><line x1="280.4916090819348" y1="96" x2="280.4916090819348" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="280.4916090819348" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">500</text><line x1="434.9832181638697" y1="96" x2="434.9832181638697" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="434.9832181638697" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">1000</text><line x1="589.4748272458046" y1="96" x2="589.4748272458046" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="589.4748272458046" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">1500</text><line x1="743.9664363277394" y1="96" x2="743.9664363277394" y2="242" stroke="var(--line-soft)" stroke-width="1"/><text x="743.9664363277394" y="258" font-size="10" fill="var(--muted)" font-weight="400" text-anchor="middle">2000</text><text x="116" y="135" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">算法中心主义</text><rect x="748.6011846001975" y="115" width="2" height="32" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/><text x="116" y="177" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">环境的重要性</text><rect x="748.9101678183613" y="157" width="2" height="32" rx="3" fill="var(--yellow-soft)" stroke="var(--yellow)"/><text x="116" y="219" font-size="10.5" fill="var(--muted)" font-weight="600" text-anchor="end">先验的觉醒</text><rect x="749.5281342546891" y="199" width="2.4718657453109576" height="32" rx="3" fill="var(--blue)" stroke="var(--blue)"/><line x1="126" y1="242" x2="752" y2="242" stroke="var(--line)" stroke-width="1.4"/><text x="439" y="278" font-size="11" fill="var(--muted)" font-weight="600" text-anchor="middle">年份</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">三阶段结论依次是：更好算法是关键、换环境需从头训练；环境标准化有进展、通用网页导航仍未突破；先验 &gt; 环境 &gt; 算法。先验知识可通过与 RL 完全无关的语言预训练</text><text x="400" y="429.4" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">获得。</text>
</svg>