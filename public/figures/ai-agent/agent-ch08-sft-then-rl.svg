<svg xmlns="http://www.w3.org/2000/svg" width="800" height="211" viewBox="0 158 800 211" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">SFT 到 RL 的两阶段诊断</title>
  <desc id="fig-desc">Mid-training 位于最前，之后是阶段一 SFT 固化格式，再到阶段二 RL 最大化任务奖励，最后以格式稳定加策略泛化作为部署判据；侧边失败链为输出无结构、无法解析 JSON、奖励 NaN、梯度全零、训练失败</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="45" y="186" width="153.5" height="112" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="121.75" y="238.75" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Mid-training</text>
  <text x="121.75" y="255" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">位于两个对齐阶段之前</text><rect x="230.5" y="186" width="153.5" height="112" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="307.25" y="230.625" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">阶段一：SFT</text>
  <text x="307.25" y="246.875" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">固化格式 · 数千条示范</text><text x="307.25" y="263.075" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">· 格式稳定</text><rect x="416" y="186" width="153.5" height="112" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="492.75" y="230.625" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">阶段二：RL</text>
  <text x="492.75" y="246.875" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">最大化任务奖励 · 策略</text><text x="492.75" y="263.075" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">泛化</text><rect x="601.5" y="186" width="153.5" height="112" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="678.25" y="238.75" font-size="13" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">部署就绪</text>
  <text x="678.25" y="255" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">格式稳定 + 策略泛化</text><path d="M198.5 242 L230.5 242" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 242 L416 242" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M569.5 242 L601.5 242" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="332" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">SFT：max Σ log P(y|x)，拟合训练分布；RL：max E[R(τ)]，优化任务目标，τ 表示一条轨迹。阶段一过度训练会让模型塌缩到训练分布；当增加示范仍无法覆盖新场景时</text><text x="400" y="343.4" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">，才转向 RL。</text>
</svg>