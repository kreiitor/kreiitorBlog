<svg xmlns="http://www.w3.org/2000/svg" width="800" height="408" viewBox="0 42 800 408" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">两层工具匹配：先选服务器，再选工具</title>
  <desc id="fig-desc">Agent 用自然语言提出需求，系统先在服务器层按相似度选出 GitHub，再在它的 26 个工具中选出前三个 schema 注入上下文。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:12px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:11px;fill:var(--muted,#5f4f3c)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <rect x="24" y="172" width="154" height="92" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="101" y="198" text-anchor="middle" class="b" fill="var(--on-blue,#fffcf5)">Agent 需求</text>
  <text x="101" y="222" text-anchor="middle" class="tiny" fill="var(--on-blue,#fffcf5)">查询 GitHub 仓库</text>
  <text x="101" y="242" text-anchor="middle" class="tiny" fill="var(--on-blue,#fffcf5)">的贡献者统计</text>

  <rect x="214" y="86" width="202" height="188" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.8"/>
  <text x="230" y="110" class="b">① 服务器匹配</text>
  <text x="230" y="130" class="tiny">5 个候选 · 取 Top-1</text>
  <rect x="228" y="142" width="174" height="22" rx="4" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.4"/>
  <text x="238" y="158" class="tiny">GitHub</text>
  <text x="394" y="158" text-anchor="end" class="tiny">0.92</text>
  <text x="238" y="184" class="tiny">File System</text>
  <text x="394" y="184" text-anchor="end" class="tiny">0.31</text>
  <text x="238" y="208" class="tiny">Finance</text>
  <text x="394" y="208" text-anchor="end" class="tiny">0.23</text>
  <text x="238" y="232" class="tiny">ArXiv</text>
  <text x="394" y="232" text-anchor="end" class="tiny">0.18</text>
  <text x="238" y="256" class="tiny">Weather</text>
  <text x="394" y="256" text-anchor="end" class="tiny">0.15</text>

  <rect x="458" y="70" width="228" height="284" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.8"/>
  <text x="474" y="94" class="b">② 工具匹配</text>
  <text x="474" y="114" class="tiny">GitHub 服务器 · 26 个工具</text>
  <rect x="472" y="126" width="200" height="26" rx="4" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.4"/>
  <text x="482" y="144" class="tiny">list_contributors</text>
  <text x="662" y="144" text-anchor="end" class="tiny">0.89</text>
  <rect x="472" y="158" width="200" height="26" rx="4" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.4"/>
  <text x="482" y="176" class="tiny">get_repo_stats</text>
  <text x="662" y="176" text-anchor="end" class="tiny">0.85</text>
  <rect x="472" y="190" width="200" height="26" rx="4" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.4"/>
  <text x="482" y="208" class="tiny">get_commit_history</text>
  <text x="662" y="208" text-anchor="end" class="tiny">0.67</text>
  <text x="482" y="240" class="tiny">search_repositories</text>
  <text x="662" y="240" text-anchor="end" class="tiny">0.41</text>
  <text x="482" y="264" class="tiny">create_issue</text>
  <text x="662" y="264" text-anchor="end" class="tiny">0.12</text>
  <line x1="472" y1="282" x2="672" y2="282" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>
  <text x="474" y="304" class="tiny">只读查询压过写操作</text>
  <text x="474" y="326" class="tiny">低于阈值 → 返回“未找到”</text>

  <rect x="458" y="372" width="228" height="46" rx="7" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="572" y="392" text-anchor="middle" class="b">返回 Top-3 schema</text>
  <text x="572" y="409" text-anchor="middle" class="tiny">追加到轨迹末尾，前缀保持不变</text>

  <path d="M178 206 L200 206 L200 180 L214 180" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M416 180 L458 180" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M572 354 L572 372" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <text x="214" y="306" class="s">第一层把搜索空间</text>
  <text x="214" y="326" class="s">从数千个工具收敛到</text>
  <text x="214" y="346" class="s">一个服务器。</text>

  <text x="400" y="438" text-anchor="middle" class="tiny">两层都依赖离线构建、支持增量更新的嵌入索引；每层的候选空间小，分数也更可比。</text>
</svg>
