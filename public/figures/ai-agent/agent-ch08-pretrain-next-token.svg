<svg xmlns="http://www.w3.org/2000/svg" width="800" height="369" viewBox="0 76 800 369" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">预训练的下一个词预测</title>
  <desc id="fig-desc">流程从左到右：输入文本进入模型，输出下一个 token 的概率分布，候选为中 42%、里 28%、下 15%、其他 15%；负对数似然求和后最小化交叉熵，模型由此学到语言规律、世界知识与基本推理</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="45" y="104.5" width="153.5" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="121.75" y="149.125" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">输入文本</text>
  <text x="121.75" y="165.375" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">Agent 需要在真实环境中</text><text x="121.75" y="181.575" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">执行任务……</text><rect x="230.5" y="104.5" width="153.5" height="112" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="307.25" y="157.25" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">模型预测</text>
  <text x="307.25" y="173.5" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">P(x_t | x_&lt;t)</text><rect x="416" y="104.5" width="153.5" height="112" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="492.75" y="149.125" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">候选分布</text>
  <text x="492.75" y="165.375" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">中 42% · 里 28% · 下</text><text x="492.75" y="181.575" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">15% · 其他 15%</text><rect x="601.5" y="104.5" width="153.5" height="112" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="678.25" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">负对数似然</text>
  <text x="678.25" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">最小化交叉熵</text><rect x="45" y="267.5" width="153.5" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="121.75" y="312.125" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">学到什么</text>
  <text x="121.75" y="328.375" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">语言规律 → 世界知识 →</text><text x="121.75" y="344.575" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">基本推理</text><path d="M198.5 160.5 L230.5 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 160.5 L416 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M569.5 160.5 L601.5 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M678.25 216.5 L678.25 242 L121.75 242 L121.75 267.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">损失 = −Σ log P(x_t | x_1 … x_{t−1})。x_1 … x_{t−1} 是前文，x_t 是待预测的下一个 token。</text>
</svg>