<svg xmlns="http://www.w3.org/2000/svg" width="800" height="396" viewBox="0 20 800 396" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">同一条轨迹，有无状态栏</title>
  <desc id="fig-desc">左右两列是同一段砍价对话的消息序列。左列没有状态摘要，模型需要自己数呼叫次数，最终打出第 4 次；右列在末尾多一条 agent_status，写明已呼叫 3 次并已达上限，模型拒绝再拨</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/>

  <text x="40" y="60" font-size="12" font-weight="600" fill="var(--ink,#202735)">没有状态摘要</text>
  <text x="420" y="60" font-size="12" font-weight="600" fill="var(--ink,#202735)">末尾追加状态摘要</text>

  <text x="40" y="96" font-size="10" fill="var(--muted,#596171)" class="mono">system</text>
  <text x="112" y="96" font-size="11.5" fill="var(--ink,#202735)">System Prompt + Tools</text>
  <text x="40" y="122" font-size="10" fill="var(--muted,#596171)" class="mono">user</text>
  <text x="112" y="122" font-size="11.5" fill="var(--ink,#202735)">帮我联系 Xfinity 砍价</text>
  <text x="40" y="148" font-size="10" fill="var(--muted,#596171)" class="mono">tool</text>
  <text x="112" y="148" font-size="11.5" fill="var(--ink,#202735)">第 1 次呼叫，未接通</text>
  <text x="40" y="174" font-size="10" fill="var(--muted,#596171)" class="mono">tool</text>
  <text x="112" y="174" font-size="11.5" fill="var(--ink,#202735)">搜索 "Xfinity deals"</text>
  <text x="40" y="200" font-size="10" fill="var(--muted,#596171)" class="mono">tool</text>
  <text x="112" y="200" font-size="11.5" fill="var(--ink,#202735)">第 2 次呼叫，报价 $65/月</text>
  <text x="40" y="226" font-size="10" fill="var(--muted,#596171)" class="mono">tool</text>
  <text x="112" y="226" font-size="11.5" fill="var(--ink,#202735)">第 3 次呼叫，降到 $59/月</text>
  <text x="40" y="252" font-size="10" fill="var(--muted,#596171)" class="mono">user</text>
  <text x="112" y="252" font-size="11.5" fill="var(--ink,#202735)">再打一次催一下？</text>

  <text x="40" y="292" font-size="11.5" fill="var(--ink,#202735)">→ 用全部历史重新数，打出第 4 次</text>
  <text x="40" y="312" font-size="10.5" fill="var(--muted,#596171)">三次结果分散在轨迹里，没有汇总</text>

  <line x1="400" y1="60" x2="400" y2="392" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/>

  <text x="420" y="96" font-size="10" fill="var(--muted,#596171)" class="mono">system</text>
  <text x="492" y="96" font-size="11.5" fill="var(--ink,#202735)">System Prompt + Tools</text>
  <text x="420" y="122" font-size="10" fill="var(--muted,#596171)" class="mono">user</text>
  <text x="492" y="122" font-size="11.5" fill="var(--ink,#202735)">帮我联系 Xfinity 砍价</text>
  <text x="420" y="148" font-size="10.5" fill="var(--muted,#596171)">…… 中间是同样的三次呼叫 ……</text>
  <text x="420" y="174" font-size="10" fill="var(--muted,#596171)" class="mono">user</text>
  <text x="492" y="174" font-size="11.5" fill="var(--ink,#202735)">再打一次催一下？</text>

  <rect x="486" y="190" width="272" height="86" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.3"/>
  <text x="498" y="210" font-size="10" fill="var(--muted,#596171)" class="mono">&lt;agent_status&gt;</text>
  <text x="498" y="230" font-size="11" fill="var(--ink,#202735)">已呼叫 3 次（Xfinity: 3）</text>
  <text x="498" y="248" font-size="11" fill="var(--ink,#202735)">约束检查：已达上限（3/3）</text>
  <text x="498" y="266" font-size="11" fill="var(--ink,#202735)">TODO：联系 ✓　降价 ✓</text>

  <text x="420" y="308" font-size="11.5" fill="var(--ink,#202735)">→ 直接读到次数与上限，拒绝再拨</text>
  <text x="420" y="328" font-size="10.5" fill="var(--muted,#596171)">一条消息替换了整段历史里的扫描</text>
</svg>
