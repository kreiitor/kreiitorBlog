<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">有状态栏与无状态栏的同一条轨迹</title>
  <desc id="fig-desc">左侧没有状态栏，模型要自己数已拨打次数，最终打出第 4 次；右侧在末尾追加一段 agent_status，直接读到已呼叫 3 次与上限，于是拒绝再拨</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="36" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)">有状态栏与无状态栏的同一条轨迹</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="var(--muted)">差别只在末尾多了一段结构化摘要，模型就从「自己数」变成「直接读」</text>

  <rect x="28" y="88" width="352" height="316" rx="9" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1.5"/>
  <text x="204" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">无状态栏</text>
  <text x="44" y="146" font-size="11.5" fill="var(--muted)"><tspan fill="var(--muted)">system</tspan> System Prompt + Tools</text>
  <text x="44" y="173" font-size="11.5" fill="var(--ink)"><tspan fill="var(--muted)">user</tspan> 帮我联系 Xfinity 砍价</text>
  <text x="44" y="200" font-size="11.5" fill="var(--ink)"><tspan fill="var(--muted)">phone_call</tspan> 第 1 次 → 未接通</text>
  <text x="44" y="227" font-size="11.5" fill="var(--ink)"><tspan fill="var(--muted)">web_search</tspan> "Xfinity deals"</text>
  <text x="44" y="254" font-size="11.5" fill="var(--ink)"><tspan fill="var(--muted)">phone_call</tspan> 第 2 次 → $65/月</text>
  <text x="44" y="281" font-size="11.5" fill="var(--ink)"><tspan fill="var(--muted)">phone_call</tspan> 第 3 次 → $59/月</text>
  <text x="44" y="308" font-size="11.5" fill="var(--ink)"><tspan fill="var(--muted)">user</tspan> 再打一次催一下？</text>

  <rect x="40" y="326" width="328" height="62" rx="7" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="56" y="350" font-size="12" font-weight="600" fill="var(--ink)">模型要扫全部历史来「数」</text>
  <text x="56" y="372" font-size="12" font-weight="600" fill="var(--ink)">结果：打出第 4 次，越过上限</text>

  <line x1="400" y1="100" x2="400" y2="392" stroke="var(--line-soft)" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="382" y="232" width="36" height="22" rx="4" fill="var(--paper)"/>
  <text x="400" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">VS</text>

  <rect x="420" y="88" width="352" height="316" rx="9" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1.5"/>
  <text x="596" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">有状态栏</text>
  <text x="436" y="146" font-size="11.5" fill="var(--muted)"><tspan fill="var(--muted)">system</tspan> System Prompt + Tools</text>
  <text x="436" y="173" font-size="11.5" fill="var(--ink)"><tspan fill="var(--muted)">user</tspan> 帮我联系 Xfinity 砍价</text>
  <text x="436" y="200" font-size="11.5" fill="var(--muted)">…… 中间是同样的三次呼叫 ……</text>

  <rect x="432" y="214" width="328" height="94" rx="7" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="446" y="236" font-size="11" font-weight="700" fill="var(--ink)">&lt;agent_status&gt;</text>
  <text x="446" y="257" font-size="11.5" fill="var(--ink)">已呼叫 3 次（Xfinity: 3）</text>
  <text x="446" y="277" font-size="11.5" fill="var(--ink)">约束检查：已达上限（3/3）</text>
  <text x="446" y="297" font-size="11.5" fill="var(--ink)">TODO：联系 ✓　降价 ✓</text>

  <text x="436" y="330" font-size="11.5" fill="var(--ink)"><tspan fill="var(--muted)">user</tspan> 再打一次催一下？</text>
  <rect x="432" y="340" width="328" height="50" rx="7" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="448" y="361" font-size="12" font-weight="600" fill="var(--ink)">直接读到状态，</text>
  <text x="448" y="379" font-size="12" font-weight="600" fill="var(--ink)">结果：拒绝再拨，遵守约束</text>

  <text x="400" y="428" text-anchor="middle" font-size="12" fill="var(--muted)">两边的消息内容一致，右边只多了一条由框架注入的 user 消息；状态栏紧邻生成位置，所以被直接读到。</text>
</svg>
