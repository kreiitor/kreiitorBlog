<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Q-learning 的一次正向更新</title>
  <desc id="fig-desc">更新链：当前估计 Q = 0.25，TD 目标为 5 + 0.99×0.63 = 5.624，TD 误差为 5.374，乘学习率 0.2 得 1.075，加到旧值后 Q = 1.325</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">Q-learning 的一次正向更新</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">拿钥匙的旧估计 0.25 被奖励 +5 推到 1.325</text><rect x="45" y="104.5" width="153.5" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="121.75" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">当前估计</text>
  <text x="121.75" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">Q = 0.25</text><rect x="230.5" y="104.5" width="153.5" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="307.25" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">TD 目标</text>
  <text x="307.25" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">5 + 0.99×0.63 = 5.624</text><rect x="416" y="104.5" width="153.5" height="112" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="492.75" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">TD 误差</text>
  <text x="492.75" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">5.624 − 0.25 = 5.374</text><rect x="601.5" y="104.5" width="153.5" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="678.25" y="149.125" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">更新步长</text>
  <text x="678.25" y="165.375" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">α = 0.2 × 5.374 =</text><text x="678.25" y="181.575" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">1.075</text><rect x="45" y="267.5" width="153.5" height="112" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="121.75" y="320.25" font-size="13" fill="var(--on-blue)" font-weight="700" text-anchor="middle">更新后 Q</text>
  <text x="121.75" y="336.5" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">0.25 + 1.075 = 1.325</text><path d="M198.5 160.5 L416 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 160.5 L416 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M569.5 160.5 L601.5 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M678.25 216.5 L678.25 242 L121.75 242 L121.75 267.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">状态 s：储藏室（持有：空）；动作 a：拿红钥匙；奖励 r = +5；新状态 s′：储藏室（持有：红钥匙）；max Q(s′,a′) = 0.63（向北开门）。</text>
</svg>