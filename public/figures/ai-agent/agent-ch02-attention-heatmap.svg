<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">真实注意力热力图的四种模式</title>
  <desc id="fig-desc">热力图以被关注的 token 为列、当前处理的 token 为行，下三角区域显示注意力分布，呈现首 token 储存池、思考三角形、输出三角形和位置偏好四种模式</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="34" y="92" width="359" height="143" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="46" y="116" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="start">首 token 储存池</text><text x="46" y="140.9" font-size="11" fill="var(--muted)" font-weight="400" text-anchor="start">序列第一个 token 吸收异常高的注意力</text><rect x="407" y="92" width="359" height="143" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="419" y="116" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="start">思考三角形</text><text x="419" y="140.9" font-size="11" fill="var(--muted)" font-weight="400" text-anchor="start">思维链内部频繁回看之前的思考</text><rect x="34" y="249" width="359" height="143" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="46" y="273" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="start">输出三角形</text><text x="46" y="297.9" font-size="11" fill="var(--muted)" font-weight="400" text-anchor="start">输出阶段以思考过程为提示</text><rect x="407" y="249" width="359" height="143" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="419" y="273" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="start">位置偏好</text><text x="419" y="297.9" font-size="11" fill="var(--muted)" font-weight="400" text-anchor="start">开头和结尾的注意力更高，中间容易被忽视</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">四种模式：首 token 的注意力储存池；思考的三角形模式；输出的三角形模式；位置偏好。</text>
</svg>