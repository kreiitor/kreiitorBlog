<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 64 800 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">真实注意力热力图的四种模式</title>
  <desc id="fig-desc">热力图以被关注的 token 为列、当前处理的 token 为行，下三角区域显示注意力分布，呈现首 token 储存池、思考三角形、输出三角形和位置偏好四种模式</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="34" y="92" width="359" height="143" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="46" y="116" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">首 token 储存池</text><text x="46" y="140.9" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="start">序列第一个 token 吸收异常高的注意力</text><rect x="407" y="92" width="359" height="143" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="419" y="116" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">思考三角形</text><text x="419" y="140.9" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="start">思维链内部频繁回看之前的思考</text><rect x="34" y="249" width="359" height="143" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="46" y="273" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">输出三角形</text><text x="46" y="297.9" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="start">输出阶段以思考过程为提示</text><rect x="407" y="249" width="359" height="143" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="419" y="273" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">位置偏好</text><text x="419" y="297.9" font-size="11" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="start">开头和结尾的注意力更高，中间容易被忽视</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">四种模式：首 token 的注意力储存池；思考的三角形模式；输出的三角形模式；位置偏好。</text>
</svg>