<svg xmlns="http://www.w3.org/2000/svg" width="800" height="402" viewBox="0 48 800 402" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">失败归因：首个错误与后续症状</title>
  <desc id="fig-desc">一条轨迹中首个导致任务偏离的错误往往没有报错，后面的报错只是连锁反应；归因记录要标出首错步号、错误类别、证据与主因。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#202735)}
    .sub{font-size:14px;fill:var(--muted,#596171)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#202735)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#202735)}
    .s{font-size:12px;fill:var(--muted,#596171)}
    .tiny{font-size:11px;fill:var(--muted,#596171)}
    .onblue{fill:var(--on-blue,#fffefa)}
    .onyellow{fill:var(--on-yellow,#202735)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
    <marker id="arrow-y" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--yellow,#ffe04b)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/>

  <rect x="55" y="76" width="220" height="52" rx="7" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="2"/>
  <text x="165" y="98" text-anchor="middle" class="b">首个错误：第 4 步</text>
  <text x="165" y="117" text-anchor="middle" class="tiny">读取了错误的文件，不一定报错</text>
  <path d="M165 128 V158" stroke="var(--yellow,#ffe04b)" stroke-width="2.5" fill="none" marker-end="url(#arrow-y)"/>

  <rect x="525" y="76" width="220" height="52" rx="7" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="2"/>
  <text x="635" y="98" text-anchor="middle" class="b">后续报错：第 11 步</text>
  <text x="635" y="117" text-anchor="middle" class="tiny">保存失败，只是连锁症状</text>
  <path d="M635 128 V158" stroke="var(--line,#a2aec1)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <line x1="70" y1="180" x2="730" y2="180" stroke="var(--line,#a2aec1)" stroke-width="2"/>
  <g fill="var(--surface,#fffefa)" stroke="var(--blue,#2647d7)" stroke-width="2">
    <circle cx="90" cy="180" r="9"/><circle cx="145" cy="180" r="9"/><circle cx="200" cy="180" r="9"/>
    <circle cx="255" cy="180" r="9"/><circle cx="310" cy="180" r="9"/><circle cx="365" cy="180" r="9"/>
    <circle cx="420" cy="180" r="9"/><circle cx="475" cy="180" r="9"/><circle cx="530" cy="180" r="9"/>
    <circle cx="585" cy="180" r="9"/><circle cx="640" cy="180" r="9"/><circle cx="695" cy="180" r="9"/>
  </g>
  <circle cx="255" cy="180" r="11" fill="var(--yellow,#ffe04b)" stroke="var(--ink,#202735)" stroke-width="2"/>
  <circle cx="640" cy="180" r="9" fill="var(--ink,#202735)" stroke="var(--ink,#202735)" stroke-width="2"/>
  <g class="tiny" text-anchor="middle">
    <text x="90" y="205">1</text><text x="145" y="205">2</text><text x="200" y="205">3</text><text x="255" y="205">4</text>
    <text x="310" y="205">5</text><text x="365" y="205">6</text><text x="420" y="205">7</text><text x="475" y="205">8</text>
    <text x="530" y="205">9</text><text x="585" y="205">10</text><text x="640" y="205">11</text><text x="695" y="205">12</text>
  </g>

  <rect x="45" y="238" width="350" height="150" rx="9" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="2"/>
  <text x="65" y="266" class="h">定位方法</text>
  <text x="65" y="294" class="b">事实锚点比对</text>
  <text x="65" y="313" class="s">把陈述与工具返回值逐步对齐</text>
  <text x="65" y="337" class="b">轨迹前缀二分</text>
  <text x="65" y="356" class="s">截到第 k 步交给人接手</text>
  <text x="65" y="376" class="tiny">不能只搜索 error 关键字</text>

  <rect x="415" y="238" width="340" height="150" rx="9" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="2"/>
  <text x="435" y="266" class="h">结构化归因记录</text>
  <text x="435" y="294" class="b">首错步号：4</text>
  <text x="435" y="316" class="b">错误类别：工具调用错误</text>
  <text x="435" y="338" class="b">证据：tool_result + 原始请求</text>
  <text x="435" y="360" class="b">主因 / 后果：主因在前，重试是后果</text>
  <text x="435" y="380" class="tiny">另附置信度与是否可恢复</text>

  <text x="400" y="426" text-anchor="middle" class="tiny">首个错误可能既没有报错，也不是一次工具调用。</text>
</svg>
