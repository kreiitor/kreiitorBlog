<svg xmlns="http://www.w3.org/2000/svg" width="800" height="374" viewBox="0 46 800 374" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Agent 持续进化的闭环</title>
  <desc id="fig-desc">执行任务、记录轨迹、形成信号、生成候选更新、验证与发布五步构成闭环；候选更新分为知识、指令、程序与参数四类，只有通过验证的更新才改变下一轮运行。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:15px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:12px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:11px;fill:var(--muted,#5f4f3c)}
    .onblue{fill:var(--on-blue,#fffcf5)}
    .onyellow{fill:var(--on-yellow,#3b3024)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <rect x="24" y="92" width="136" height="86" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="2"/>
  <text x="92" y="122" text-anchor="middle" class="h onblue">① 执行任务</text>
  <text x="92" y="146" text-anchor="middle" class="tiny onblue">用户 · 环境 · 工具</text>

  <rect x="184" y="92" width="136" height="86" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="2"/>
  <text x="252" y="122" text-anchor="middle" class="h">② 记录轨迹</text>
  <text x="252" y="146" text-anchor="middle" class="tiny">动作 · 结果 · 反馈</text>

  <rect x="344" y="92" width="136" height="86" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="2"/>
  <text x="412" y="122" text-anchor="middle" class="h">③ 形成信号</text>
  <text x="412" y="146" text-anchor="middle" class="tiny">结果 · 过程 · 质量</text>

  <rect x="504" y="92" width="136" height="86" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="2"/>
  <text x="572" y="122" text-anchor="middle" class="h">④ 候选更新</text>
  <text x="572" y="146" text-anchor="middle" class="tiny">先形成待验证版本</text>

  <rect x="664" y="92" width="112" height="86" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="2"/>
  <text x="720" y="122" text-anchor="middle" class="h">⑤ 验证发布</text>
  <text x="720" y="146" text-anchor="middle" class="tiny">回归 · 灰度 · 回滚</text>

  <path d="M162 135 H180" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M322 135 H340" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M482 135 H500" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M642 135 H660" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <path d="M720 92 V74 H92 V92" stroke="var(--blue,#466b3f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="406" y="88" text-anchor="middle" class="tiny">新的版本进入下一轮运行</text>

  <rect x="504" y="252" width="272" height="76" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>
  <text x="640" y="276" text-anchor="middle" class="b">四类候选载体</text>
  <text x="640" y="300" text-anchor="middle" class="s">知识 · 指令 · 程序 · 参数</text>
  <text x="640" y="318" text-anchor="middle" class="tiny">选择依据是能力的表示性质</text>
  <path d="M572 182 V248" stroke="var(--yellow,#f5d75f)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="24" y="252" width="456" height="76" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="44" y="278" class="h">三层验证</text>
  <text x="44" y="302" class="s">结果验证器：环境真实状态</text>
  <text x="248" y="302" class="s">过程验证器：规则与动作</text>
  <text x="44" y="320" class="s">质量验证器：LLM Rubric</text>

  <rect x="24" y="356" width="752" height="40" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>
  <text x="400" y="381" text-anchor="middle" class="b">在线执行使用稳定版本；离线进化产出候选版本，验证通过后才替换</text>
</svg>
