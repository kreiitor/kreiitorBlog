<svg xmlns="http://www.w3.org/2000/svg" width="800" height="374" viewBox="0 46 800 374" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Agent 持续进化的闭环</title>
  <desc id="fig-desc">执行任务、记录轨迹、形成信号、生成候选更新、验证与发布五步构成闭环；候选更新分为知识、指令、程序与参数四类，只有通过验证的更新才改变下一轮运行。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#202735)}
    .sub{font-size:14px;fill:var(--muted,#596171)}
    .h{font-size:15px;font-weight:700;fill:var(--ink,#202735)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#202735)}
    .s{font-size:12px;fill:var(--muted,#596171)}
    .tiny{font-size:11px;fill:var(--muted,#596171)}
    .onblue{fill:var(--on-blue,#fffefa)}
    .onyellow{fill:var(--on-yellow,#202735)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/>

  <rect x="24" y="92" width="136" height="86" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="2"/>
  <text x="92" y="122" text-anchor="middle" class="h onblue">① 执行任务</text>
  <text x="92" y="146" text-anchor="middle" class="tiny onblue">用户 · 环境 · 工具</text>

  <rect x="184" y="92" width="136" height="86" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="2"/>
  <text x="252" y="122" text-anchor="middle" class="h">② 记录轨迹</text>
  <text x="252" y="146" text-anchor="middle" class="tiny">动作 · 结果 · 反馈</text>

  <rect x="344" y="92" width="136" height="86" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="2"/>
  <text x="412" y="122" text-anchor="middle" class="h">③ 形成信号</text>
  <text x="412" y="146" text-anchor="middle" class="tiny">结果 · 过程 · 质量</text>

  <rect x="504" y="92" width="136" height="86" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="2"/>
  <text x="572" y="122" text-anchor="middle" class="h">④ 候选更新</text>
  <text x="572" y="146" text-anchor="middle" class="tiny">先形成待验证版本</text>

  <rect x="664" y="92" width="112" height="86" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="2"/>
  <text x="720" y="122" text-anchor="middle" class="h">⑤ 验证发布</text>
  <text x="720" y="146" text-anchor="middle" class="tiny">回归 · 灰度 · 回滚</text>

  <path d="M162 135 H180" stroke="var(--blue,#2647d7)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M322 135 H340" stroke="var(--blue,#2647d7)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M482 135 H500" stroke="var(--blue,#2647d7)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M642 135 H660" stroke="var(--blue,#2647d7)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <path d="M720 92 V74 H92 V92" stroke="var(--blue,#2647d7)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="406" y="88" text-anchor="middle" class="tiny">新的版本进入下一轮运行</text>

  <rect x="504" y="252" width="272" height="76" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1.5"/>
  <text x="640" y="276" text-anchor="middle" class="b">四类候选载体</text>
  <text x="640" y="300" text-anchor="middle" class="s">知识 · 指令 · 程序 · 参数</text>
  <text x="640" y="318" text-anchor="middle" class="tiny">选择依据是能力的表示性质</text>
  <path d="M572 182 V248" stroke="var(--yellow,#ffe04b)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="24" y="252" width="456" height="76" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.5"/>
  <text x="44" y="278" class="h">三层验证</text>
  <text x="44" y="302" class="s">结果验证器：环境真实状态</text>
  <text x="248" y="302" class="s">过程验证器：规则与动作</text>
  <text x="44" y="320" class="s">质量验证器：LLM Rubric</text>

  <rect x="24" y="356" width="752" height="40" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1.5"/>
  <text x="400" y="381" text-anchor="middle" class="b">在线执行使用稳定版本；离线进化产出候选版本，验证通过后才替换</text>
</svg>
