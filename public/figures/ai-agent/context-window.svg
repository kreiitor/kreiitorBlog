<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">上下文窗口的组成</title>
  <desc id="fig-desc">一次模型调用看到的上下文窗口由系统提示词、工具定义、对话历史、本轮思考和当前生成位置组成，最终序列化为 token 流交给 Transformer。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#eef2fb;--yellow:#ffe04b;--yellow-soft:#fdf7d9;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#22314c;--yellow:#f0cd42;--yellow-soft:#33341f;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .t{font-size:12.5px;font-weight:600;fill:var(--ink)}
    .l{font-size:10.5px;font-weight:400;fill:var(--ink)}
    .m{font-size:9.5px;font-weight:400;fill:var(--muted)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="300" fill="var(--paper,#f9faf7)"/>

  <rect x="80" y="213" width="320" height="47" fill="var(--yellow-soft,#fdf7d9)"/>
  <rect x="80" y="40" width="320" height="220" fill="none" stroke="var(--line,#a2aec1)" stroke-width="1.5"/>
  <text x="96" y="64" class="m">上下文窗口</text>

  <g stroke="var(--line-soft,#dce1e8)" stroke-width="1">
    <line x1="80" y1="72" x2="400" y2="72"/>
    <line x1="80" y1="119" x2="400" y2="119"/>
    <line x1="80" y1="166" x2="400" y2="166"/>
    <line x1="80" y1="213" x2="400" y2="213"/>
  </g>

  <g class="t">
    <text x="96" y="94">系统提示词</text>
    <text x="96" y="141">工具定义</text>
    <text x="96" y="188">对话历史</text>
    <text x="96" y="235">本轮思考</text>
  </g>
  <g class="m">
    <text x="186" y="94">角色、规则、输出格式</text>
    <text x="166" y="141">名称、参数、描述</text>
    <text x="186" y="188">用户消息、模型回复、工具结果</text>
    <text x="166" y="235">当前生成位置</text>
  </g>

  <path d="M400 150H536" stroke="var(--blue,#2647d7)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <g stroke="var(--blue,#2647d7)" stroke-width="1">
    <line x1="424" y1="144" x2="424" y2="156"/>
    <line x1="432" y1="144" x2="432" y2="156"/>
    <line x1="440" y1="144" x2="440" y2="156"/>
    <line x1="448" y1="144" x2="448" y2="156"/>
    <line x1="456" y1="144" x2="456" y2="156"/>
    <line x1="464" y1="144" x2="464" y2="156"/>
    <line x1="472" y1="144" x2="472" y2="156"/>
    <line x1="480" y1="144" x2="480" y2="156"/>
    <line x1="488" y1="144" x2="488" y2="156"/>
    <line x1="496" y1="144" x2="496" y2="156"/>
    <line x1="504" y1="144" x2="504" y2="156"/>
    <line x1="512" y1="144" x2="512" y2="156"/>
  </g>
  <text x="468" y="136" text-anchor="middle" class="m">序列化为 token 流</text>

  <rect x="540" y="90" width="150" height="120" fill="none" stroke="var(--line,#a2aec1)" stroke-width="1.5"/>
  <text x="615" y="142" text-anchor="middle" class="t">Transformer</text>
  <text x="615" y="164" text-anchor="middle" class="m">注意力计算</text>
  <text x="615" y="230" text-anchor="middle" class="m">逐 token 生成</text>
</svg>
