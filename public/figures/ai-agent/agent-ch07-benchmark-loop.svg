<svg xmlns="http://www.w3.org/2000/svg" width="800" height="374" viewBox="0 76 800 374" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">从 Benchmark 报告到改进闭环</title>
  <desc id="fig-desc">五步闭环：从总体成功率 88% 的诊断报告出发，提出 H1 到 H6 的分层假设，每配置 5 次 × 116 任务做实验，按成本收益决定采纳 H1+H3+H6，部署后成功率升到 94%，再进入下一轮 H7/H8</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="45" y="104.5" width="153.5" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="121.75" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">① 观察</text>
  <text x="121.75" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">成功率 88%（102/116）</text><rect x="230.5" y="104.5" width="153.5" height="112" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="307.25" y="149.125" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">② 假设</text>
  <text x="307.25" y="165.375" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">表层 / 中层 / 深层 ·</text><text x="307.25" y="181.575" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">H1–H6</text><rect x="416" y="104.5" width="153.5" height="112" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="492.75" y="157.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">③ 实验</text>
  <text x="492.75" y="173.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">每配置 5 次 × 116 任务</text><rect x="601.5" y="104.5" width="153.5" height="112" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="678.25" y="157.25" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">④ 决策</text>
  <text x="678.25" y="173.5" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">H1+H3+H6 采纳</text><rect x="45" y="267.5" width="153.5" height="112" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="121.75" y="320.25" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">⑤ 迭代</text>
  <text x="121.75" y="336.5" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">88% → 94% · H7/H8</text><path d="M198.5 160.5 L230.5 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 160.5 L416 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M569.5 160.5 L601.5 160.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M678.25 216.5 L678.25 242 L121.75 242 L121.75 267.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M121.75 267.5 L121.75 242 L121.75 242 L121.75 216.5" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">观察项：总体成功率 88%（102/116）；transcription 0%、complex_ui 17%、math_counting 0%、Wi-Fi 操作 0%；Task 82、102–115 集中失败。实验结果：H1 设置</text><text x="400" y="429.4" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">导航 0%→75%，token +8%；H3 多模态 转录 0%→80%，延迟 +1 s；H4 思考 计数 0%→70%，延迟 3×；H6 元素树 UI 17%→52%，token +30%。决策：H1+H3 低成本高收益</text><text x="400" y="440.8" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">，H4 拒绝，H6 采纳，H5 列为备选。</text>
</svg>