<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">经典 RL Agent 与 LLM Agent</title>
  <desc id="fig-desc">七行对照：动作空间从封闭有限变成开放无限；先验从零变成海量预训练；状态从哈希编码变成语义理解；信号从标量奖励变成奖励加语言反馈；思考从无变成 CoT 特殊动作；泛化从单环境变成跨任务；样本效率从约 10000 episodes 变成约 1 episode</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="38" y="92" width="124.82758620689656" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.2"/><text x="100.41379310344828" y="112" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">对比维度</text><rect x="162.82758620689657" y="92" width="299.58620689655174" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.2"/><text x="312.62068965517244" y="112" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">经典 RL Agent</text><rect x="462.4137931034483" y="92" width="299.58620689655174" height="34" rx="4" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.2"/><text x="612.2068965517242" y="112" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">LLM Agent</text><rect x="38" y="126" width="124.82758620689656" height="38" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="100.41379310344828" y="148" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">动作空间</text><rect x="162.82758620689657" y="126" width="299.58620689655174" height="38" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="312.62068965517244" y="148" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">封闭有限：{东, 西, 南, 北, 拿, 攻击}</text><rect x="462.4137931034483" y="126" width="299.58620689655174" height="38" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="612.2068965517242" y="148" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">开放无限：自然语言 + 工具调用</text><rect x="38" y="164" width="124.82758620689656" height="38" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="100.41379310344828" y="186" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">先验知识</text><rect x="162.82758620689657" y="164" width="299.58620689655174" height="38" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="312.62068965517244" y="186" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">零先验，从随机策略开始</text><rect x="462.4137931034483" y="164" width="299.58620689655174" height="38" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="612.2068965517242" y="186" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">海量预训练知识 + 语言游戏规则</text><rect x="38" y="202" width="124.82758620689656" height="38" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="100.41379310344828" y="224" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">状态表示</text><rect x="162.82758620689657" y="202" width="299.58620689655174" height="38" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="312.62068965517244" y="224" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">哈希编码：state_id = 0x3A7F</text><rect x="462.4137931034483" y="202" width="299.58620689655174" height="38" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="612.2068965517242" y="224" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">语义理解：“储藏室里有红钥匙”</text><rect x="38" y="240" width="124.82758620689656" height="38" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="100.41379310344828" y="262" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">学习信号</text><rect x="162.82758620689657" y="240" width="299.58620689655174" height="38" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="312.62068965517244" y="262" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">标量奖励：R ∈ {−1, 0, +5, +50}</text><rect x="462.4137931034483" y="240" width="299.58620689655174" height="38" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="612.2068965517242" y="262" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">奖励 + 语言反馈 + 自我反思</text><rect x="38" y="278" width="124.82758620689656" height="38" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="100.41379310344828" y="300" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">思考能力</text><rect x="162.82758620689657" y="278" width="299.58620689655174" height="38" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="312.62068965517244" y="300" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">无内部思考（纯反应式）</text><rect x="462.4137931034483" y="278" width="299.58620689655174" height="38" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="612.2068965517242" y="300" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">思考作为特殊动作（CoT）</text><rect x="38" y="316" width="124.82758620689656" height="38" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="100.41379310344828" y="338" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">泛化能力</text><rect x="162.82758620689657" y="316" width="299.58620689655174" height="38" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="312.62068965517244" y="338" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">单环境，规则变化需重训</text><rect x="462.4137931034483" y="316" width="299.58620689655174" height="38" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="612.2068965517242" y="338" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">跨任务零样本 / 少样本迁移</text><rect x="38" y="354" width="124.82758620689656" height="38" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="100.41379310344828" y="376" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">样本效率</text><rect x="162.82758620689657" y="354" width="299.58620689655174" height="38" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="312.62068965517244" y="376" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">约 10000 episodes / 10 秒</text><rect x="462.4137931034483" y="354" width="299.58620689655174" height="38" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="612.2068965517242" y="376" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">约 1 episode / 2 分钟</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">样本效率一行：经典 RL 约 10000 episodes / 10 秒；LLM Agent 约 1 episode / 2 分钟。LLM 的动作仍由有限 token 词表和工具 schema 定义，“开放无限”指组合</text><text x="400" y="429.4" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">出的序列数量爆炸。</text>
</svg>