<svg xmlns="http://www.w3.org/2000/svg" width="800" height="359" viewBox="0 86 800 359" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">事件驱动 Agent 架构</title>
  <desc id="fig-desc">四层结构：外部事件源提供用户消息、邮件、GitHub、定时器、Webhook 与告警事件；FastAPI 服务器接收 POST /events/{type}，内部有路由器、优先级队列、Agent 循环与会话管理；MCP 工具服务器分感知、执行、协作、通知四组；持久层保存对话历史、事件日志、定时任务、工具状态与审计追踪。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="40" y="114" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="146" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">外部事件源</text><rect x="194" y="123" width="84.66666666666667" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="236.33333333333334" y="146" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">Web / App</text><rect x="286.6666666666667" y="123" width="84.66666666666667" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="329" y="146" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">邮件</text><rect x="379.33333333333337" y="123" width="84.66666666666667" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="421.6666666666667" y="146" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">GitHub</text><rect x="472" y="123" width="84.66666666666667" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="514.3333333333334" y="146" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">定时器</text><rect x="564.6666666666667" y="123" width="84.66666666666667" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="607.0000000000001" y="146" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">Webhook</text><rect x="657.3333333333334" y="123" width="84.66666666666667" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="699.6666666666667" y="146" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">系统告警</text><rect x="40" y="180" width="720" height="58" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="54" y="212" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">FastAPI 服务器</text><rect x="194" y="189" width="103.2" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="245.6" y="205.4" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">POST /events/{</text><text x="245.6" y="220.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">type}</text><rect x="305.2" y="189" width="103.2" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="356.8" y="212" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">事件路由器</text><rect x="416.4" y="189" width="103.2" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468" y="212" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">事件队列</text><rect x="527.6" y="189" width="103.2" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="579.2" y="212" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">Agent 循环</text><rect x="638.8" y="189" width="103.2" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="690.4" y="212" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">会话管理</text><rect x="40" y="246" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="278" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">MCP 工具服务器</text><rect x="194" y="255" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="259.5" y="278" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">感知工具</text><rect x="333" y="255" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="398.5" y="278" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">执行工具</text><rect x="472" y="255" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="537.5" y="278" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">协作工具</text><rect x="611" y="255" width="131" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="676.5" y="278" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">通知工具</text><rect x="40" y="312" width="720" height="58" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="54" y="344" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">持久层</text><rect x="194" y="321" width="103.2" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="245.6" y="344" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">对话历史</text><rect x="305.2" y="321" width="103.2" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="356.8" y="344" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">事件日志</text><rect x="416.4" y="321" width="103.2" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468" y="344" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">定时任务</text><rect x="527.6" y="321" width="103.2" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="579.2" y="344" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">工具状态</text><rect x="638.8" y="321" width="103.2" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="690.4" y="344" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">审计追踪</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">事件源示例：on_user_message、on_email_reply、on_github_pr_update、on_timer_expire、on_webhook_received、on_resource_alert。</text>
</svg>