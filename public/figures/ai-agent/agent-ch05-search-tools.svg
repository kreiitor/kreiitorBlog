<svg xmlns="http://www.w3.org/2000/svg" width="800" height="381" viewBox="0 64 800 381" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">四类代码搜索方式</title>
  <desc id="fig-desc">四栏并列：grep 做正则内容匹配，返回所有出现位置；glob 做文件名匹配，不读文件内容；语义代码搜索用自然语言返回带相似度的结果；符号查找基于 AST 区分定义与引用。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="34" y="92" width="172.5" height="300" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/><text x="120.25" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">正则内容匹配</text><text x="120.25" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">grep</text><text x="46" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">查询：def handle_.*</text><text x="46" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">返回全部出现位置</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">精确文本</text><rect x="220.5" y="92" width="172.5" height="300" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/><text x="306.75" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">文件名匹配</text><text x="306.75" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">glob</text><text x="232.5" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">查询：**/test_*.py</text><text x="232.5" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">只匹配路径模式</text><text x="232.5" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">不读取文件内容</text><rect x="407" y="92" width="172.5" height="300" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/><text x="493.25" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">语义代码搜索</text><text x="493.25" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">向量 + BM25 混合</text><text x="419" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">自然语言查询</text><text x="419" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">返回相似度分数</text><text x="419" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">语义相近即可</text><rect x="593.5" y="92" width="172.5" height="300" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/><text x="679.75" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">符号定义/引用</text><text x="679.75" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">AST 级</text><text x="605.5" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">find_references</text><text x="605.5" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">区分定义与引用</text><text x="605.5" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">消除同名歧义</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line,#a2aec1)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="start">路径 / 字面</text><text x="730" y="400" font-size="10" fill="var(--muted,#596171)" font-weight="600" text-anchor="end">语法结构</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">示例：rg &quot;def handle_.*&quot; --type py；glob: **/test_*.py；find_references: UserService。</text>
</svg>