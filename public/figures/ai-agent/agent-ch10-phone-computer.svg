<svg xmlns="http://www.w3.org/2000/svg" width="800" height="384" viewBox="0 60 800 384" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Phone 与 Computer 双 Agent</title>
  <desc id="fig-desc">左侧 Phone Agent 流水线为语音输入、VAD 加 ASR、LLM 推理、TTS 合成；右侧 Computer Agent 流水线为屏幕截图、Vision LLM、动作规划、执行操作；两条流水线经 ws://localhost:8849 双向通信，互不阻塞</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><line x1="80" y1="110" x2="80" y2="200" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="200" x2="80" y2="290" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="290" x2="80" y2="380" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="520" y1="110" x2="520" y2="200" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="520" y1="200" x2="520" y2="290" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="520" y1="290" x2="520" y2="380" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="290" x2="520" y2="290" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><line x1="520" y1="380" x2="80" y2="290" stroke="var(--blue,#2647d7)" stroke-width="2" marker-end="url(#arrow)"/><rect x="42" y="88" width="76" height="44" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="80" y="101.25" font-size="10" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">语音输入</text>
  <text x="80" y="113.75" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">麦克风 ·</text><text x="80" y="127.25" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">VAD</text><rect x="42" y="178" width="76" height="44" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="80" y="191.25" font-size="10" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">VAD + ASR</text>
  <text x="80" y="203.75" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">Silero VAD</text><text x="80" y="217.25" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">→ STT</text><rect x="42" y="268" width="76" height="44" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="80" y="281.25" font-size="10" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">LLM 推理</text>
  <text x="80" y="293.75" font-size="10" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">理解意图 ·</text><text x="80" y="307.25" font-size="10" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">提取信息</text><rect x="42" y="358" width="76" height="44" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="80" y="371.25" font-size="10" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">TTS 合成</text>
  <text x="80" y="383.75" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">生成语音 ·</text><text x="80" y="397.25" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">播放</text><rect x="482" y="88" width="76" height="44" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="520" y="101.25" font-size="10" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">屏幕截图</text>
  <text x="520" y="113.75" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">浏览器当前页</text><text x="520" y="127.25" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">面</text><rect x="482" y="178" width="76" height="44" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="520" y="191.25" font-size="10" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">Vision LLM</text>
  <text x="520" y="203.75" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">页面结构 ·</text><text x="520" y="217.25" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">表单字段</text><rect x="482" y="268" width="76" height="44" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="520" y="281.25" font-size="10" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">动作规划</text>
  <text x="520" y="293.75" font-size="10" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">定位字段 ·</text><text x="520" y="307.25" font-size="10" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">输入序列</text><rect x="482" y="358" width="76" height="44" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="520" y="371.25" font-size="10" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">执行操作</text>
  <text x="520" y="383.75" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">点击 · 输入</text><text x="520" y="397.25" font-size="10" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">· 提交</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">消息示例：用户说姓名是张三 → 已填写姓名，需要证件号 → 证件号 … → 表单已提交。证件号为示意数据。</text>
</svg>