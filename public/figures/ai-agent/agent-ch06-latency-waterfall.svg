text-anchor="middle">生成 300</text><rect x="615.9130434782609" y="157" width="136.08695652173913" height="32" rx="3" fill="var(--line-soft,#dce1e8)" stroke="var(--line,#a2aec1)"/><text x="683.9565217391305" y="176" font-size="9.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">TTS 500</text><line x1="126" y1="200" x2="752" y2="200" stroke="var(--line,#a2aec1)" stroke-width="1.4"/><text x="439" y="236" font-size="11" fill="var(--muted,#596171)" font-weight="600" text-anchor="middle">响应时间 / ms</text><text x="400" y="273" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">真实数值取决于输入长度、模型、硬件、网络和负载；生产环境的排队会进一步放大延迟。</text>
