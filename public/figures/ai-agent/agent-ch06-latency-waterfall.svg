<svg xmlns="http://www.w3.org/2000/svg" width="800" height="231" viewBox="0 68 800 231" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">串行语音链路的延迟瀑布</title>
  <desc id="fig-desc">两条泳道按五段累加。最优情形：VAD 500ms、ASR 50ms、LLM 首 token 100ms、生成 100ms、TTS 200ms，总计 950ms；最差情形：VAD 800ms、ASR 200ms、首 token 500ms、生成 300ms、TTS 500ms，总计 2300ms。</desc>
