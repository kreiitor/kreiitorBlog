<svg xmlns="http://www.w3.org/2000/svg" width="800" height="376" viewBox="0 67 800 376" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">本地 LLM 的工具调用链路</title>
  <desc id="fig-desc">用户请求进入 vLLM 或 Ollama 兼容服务，模型推理生成 tool_call，本地工具执行函数或外部 API，结果回传模型生成最终回复</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="295" y="96" width="210" height="31.200000000000003" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="400" y="108.35" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">用户请求</text>
  <text x="400" y="124.6" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">帮我联系 Xfinity 砍价</text><rect x="295" y="161.2" width="210" height="31.200000000000003" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="400" y="173.54999999999998" font-size="13" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">本地 LLM 服务</text>
  <text x="400" y="189.79999999999998" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">vLLM / Ollama · OpenAI 兼容</text><rect x="295" y="226.4" width="210" height="31.200000000000003" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="400" y="238.75" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">模型推理</text>
  <text x="400" y="255" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">决定并生成 tool_call</text><rect x="295" y="291.6" width="210" height="31.200000000000003" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="400" y="303.95000000000005" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">本地工具执行</text>
  <text x="400" y="320.20000000000005" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">调用函数 / 外部 API</text><rect x="295" y="356.8" width="210" height="31.200000000000003" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="400" y="369.15000000000003" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">结果回传</text>
  <text x="400" y="385.40000000000003" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">生成最终回复</text><path d="M400 127.2 L400 144.2 L400 144.2 L400 161.2" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M400 192.39999999999998 L400 209.39999999999998 L400 209.39999999999998 L400 226.4" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M400 257.6 L400 274.6 L400 274.6 L400 291.6" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M400 322.8 L400 339.8 L400 339.8 L400 356.8" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">示例请求是「帮我联系 Xfinity 砍价」。</text>
</svg>