<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">语音狼人杀 Agent 系统</title>
  <desc id="fig-desc">代码驱动的法官位于中心，掌握游戏状态、阶段控制和信息分发；周围是狼人 1、狼人 2、预言家、女巫、两名村民和一名真人玩家；狼人之间互知身份，预言家向法官提交验人结果；法官按角色只传递其应见的私有信息与公开发言</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><line x1="390" y1="247.5" x2="120" y2="170.15625" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="390" y1="247.5" x2="660" y2="170.15625" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="120" y1="170.15625" x2="660" y2="170.15625" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="390" y1="247.5" x2="80" y2="290.46875" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="290.46875" x2="390" y2="247.5" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="390" y1="247.5" x2="700" y2="290.46875" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="390" y1="247.5" x2="390" y2="385" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><line x1="390" y1="247.5" x2="390" y2="110" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="223.5" width="100" height="48" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="390" y="237.875" font-size="11" fill="var(--on-blue)" font-weight="700" text-anchor="middle">法官</text>
  <text x="390" y="251.625" font-size="10" fill="var(--on-blue)" font-weight="400" text-anchor="middle">代码驱动 · 状态</text><text x="390" y="265.125" font-size="10" fill="var(--on-blue)" font-weight="400" text-anchor="middle">· 阶段 · 分发</text><rect x="70" y="146.15625" width="100" height="48" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="120" y="160.53125" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">狼人 1</text>
  <text x="120" y="174.28125" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">伪装村民 · 选择</text><text x="120" y="187.78125" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">目标</text><rect x="610" y="146.15625" width="100" height="48" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="660" y="160.53125" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">狼人 2</text>
  <text x="660" y="174.28125" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">跟票保护 · 协商</text><text x="660" y="187.78125" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">目标</text><rect x="30" y="266.46875" width="100" height="48" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="80" y="280.84375" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">预言家</text>
  <text x="80" y="294.59375" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">择机跳出 · 查验</text><text x="80" y="308.09375" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">1 人</text><rect x="650" y="266.46875" width="100" height="48" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="700" y="280.84375" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">女巫</text>
  <text x="700" y="294.59375" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">保药/解药 · 救/</text><text x="700" y="308.09375" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">毒 1 人</text><rect x="340" y="361" width="100" height="48" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="390" y="375.375" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">村民 ×2</text>
  <text x="390" y="389.125" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">逻辑推理 · 分析</text><text x="390" y="402.625" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">发言</text><rect x="340" y="86" width="100" height="48" rx="8" fill="var(--line-soft)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="390" y="100.375" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">真人玩家</text>
  <text x="390" y="114.125" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">随机角色 · 语音</text><text x="390" y="127.625" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">投票</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">狼人看到同伴身份与夜晚商议；预言家只看到自己的验人结果；女巫看到当晚死亡者和药水状态；村民只有公开发言与投票记录。</text>
</svg>