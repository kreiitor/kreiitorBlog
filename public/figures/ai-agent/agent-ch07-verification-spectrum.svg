<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 64 800 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">验证方式的四档谱系</title>
  <desc id="fig-desc">从左到右四档：确定性验证器只判通过或不通过；检查项清单做多项确定性检查并按口径聚合；Rubric + LLM 评判分维度打分；配对比较只判 A 与 B 孰优</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="34" y="92" width="172.5" height="300" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="120.25" y="118" font-size="14" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">确定性验证器</text><text x="120.25" y="136" font-size="10.5" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">终态唯一可查</text><text x="46" y="174" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="start">只判通过 / 不通过</text><text x="46" y="195.95" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="start">例：SWE-bench 跑测试</text><rect x="220.5" y="92" width="172.5" height="300" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="306.75" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">检查项清单</text><text x="306.75" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">多项确定性检查</text><text x="232.5" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">按声明的口径聚合</text><text x="232.5" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">例：τ²-bench 四层验证</text><rect x="407" y="92" width="172.5" height="300" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/><text x="493.25" y="118" font-size="14" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">Rubric + LLM 评判</text><text x="493.25" y="136" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">维度可拆但无法机械判定</text><text x="419" y="174" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">分维度打分并说明理由</text><text x="419" y="195.95" font-size="12" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="431" y="195.95" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="start">例：客服质量、报告撰写</text><rect x="593.5" y="92" width="172.5" height="300" rx="8" fill="var(--yellow,#f5d75f)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/><text x="679.75" y="118" font-size="14" fill="var(--on-yellow,#3b3024)" font-weight="700" text-anchor="middle">配对比较</text><text x="679.75" y="136" font-size="10.5" fill="var(--on-yellow,#3b3024)" font-weight="400" text-anchor="middle">连维度都难以写出</text><text x="605.5" y="174" font-size="12" fill="var(--on-yellow,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="174" font-size="11.5" fill="var(--on-yellow,#3b3024)" font-weight="400" text-anchor="start">只判 A 与 B 孰优</text><text x="605.5" y="195.95" font-size="12" fill="var(--on-yellow,#3b3024)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="195.95" font-size="11.5" fill="var(--on-yellow,#3b3024)" font-weight="400" text-anchor="start">例：Chatbot Arena</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line,#c9b49c)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="start">高：可机械验证</text><text x="730" y="400" font-size="10" fill="var(--muted,#5f4f3c)" font-weight="600" text-anchor="end">低：依赖判断</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">左端结果完全可复现、可纳入持续集成、成本低，代价是只回答对错；右端可拆出诊断维度，代价是引入评判偏差与波动、成本更高。</text>
</svg>