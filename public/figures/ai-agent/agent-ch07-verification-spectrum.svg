<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">验证方式的四档谱系</title>
  <desc id="fig-desc">从左到右四档：确定性验证器只判通过或不通过；检查项清单做多项确定性检查并按口径聚合；Rubric + LLM 评判分维度打分；配对比较只判 A 与 B 孰优</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">验证方式的四档谱系</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">按任务的可机械验证程度，从确定性验证走向模型评判</text><rect x="34" y="92" width="172.5" height="300" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/><text x="120.25" y="118" font-size="14" fill="var(--on-blue)" font-weight="700" text-anchor="middle">确定性验证器</text><text x="120.25" y="136" font-size="10.5" fill="var(--on-blue)" font-weight="400" text-anchor="middle">终态唯一可查</text><text x="46" y="174" font-size="12" fill="var(--on-blue)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--on-blue)" font-weight="400" text-anchor="start">只判通过 / 不通过</text><text x="46" y="195.95" font-size="12" fill="var(--on-blue)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--on-blue)" font-weight="400" text-anchor="start">例：SWE-bench 跑测试</text><rect x="220.5" y="92" width="172.5" height="300" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="306.75" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">检查项清单</text><text x="306.75" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">多项确定性检查</text><text x="232.5" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">按声明的口径聚合</text><text x="232.5" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">例：τ²-bench 四层验证</text><rect x="407" y="92" width="172.5" height="300" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/><text x="493.25" y="118" font-size="14" fill="var(--ink)" font-weight="700" text-anchor="middle">Rubric + LLM 评判</text><text x="493.25" y="136" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">维度可拆但无法机械判定</text><text x="419" y="174" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">分维度打分并说明理由</text><text x="419" y="195.95" font-size="12" fill="var(--ink)" font-weight="700" text-anchor="start">•</text><text x="431" y="195.95" font-size="11.5" fill="var(--ink)" font-weight="400" text-anchor="start">例：客服质量、报告撰写</text><rect x="593.5" y="92" width="172.5" height="300" rx="8" fill="var(--yellow)" stroke="var(--yellow)" stroke-width="1.6"/><text x="679.75" y="118" font-size="14" fill="var(--on-yellow)" font-weight="700" text-anchor="middle">配对比较</text><text x="679.75" y="136" font-size="10.5" fill="var(--on-yellow)" font-weight="400" text-anchor="middle">连维度都难以写出</text><text x="605.5" y="174" font-size="12" fill="var(--on-yellow)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="174" font-size="11.5" fill="var(--on-yellow)" font-weight="400" text-anchor="start">只判 A 与 B 孰优</text><text x="605.5" y="195.95" font-size="12" fill="var(--on-yellow)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="195.95" font-size="11.5" fill="var(--on-yellow)" font-weight="400" text-anchor="start">例：Chatbot Arena</text><line x1="70" y1="408" x2="730" y2="408" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="70" y="400" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="start">高：可机械验证</text><text x="730" y="400" font-size="10" fill="var(--muted)" font-weight="600" text-anchor="end">低：依赖判断</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">左端结果完全可复现、可纳入持续集成、成本低，代价是只回答对错；右端可拆出诊断维度，代价是引入评判偏差与波动、成本更高。</text>
</svg>