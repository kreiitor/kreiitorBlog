<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Set-of-Mark 的标注与索引</title>
  <desc id="fig-desc">模拟网页截图：搜索框标 [1]、Submit 按钮标 [2]、姓名输入框标 [3]、Documentation 链接标 [4]；右侧列出四个 ID 对应的 HTML 片段。底部流程为 CDP 获取 DOM/A11y、可交互性检测、边界框与 ID 分配、截图标注、文本列表与截图送入模型。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="36" y="86" width="728" height="314" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.8"/><rect x="36" y="86" width="728" height="30" rx="10" fill="var(--line-soft)" stroke="var(--line)" stroke-width="1.2"/><rect x="36" y="106" width="728" height="10" fill="var(--line-soft)"/><text x="50" y="106" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="start">网页截图与元素索引</text><rect x="50.56" y="145.6" width="393.12" height="140.4" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/><text x="247.12" y="212.75" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">地址栏 www.example.com [1] 搜索框 [2] Submit [3] 姓名输入框 [4]</text><text x="247.12" y="227.6" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">Documentation</text><rect x="472.8" y="145.6" width="276.64" height="140.4" rx="6" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.4"/><text x="611.12" y="212.75" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">元素列表 [1] HTML 片段 [2] HTML 片段 [3]</text><text x="611.12" y="227.6" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">HTML 片段 [4] HTML 片段</text><rect x="50.56" y="296.8" width="698.88" height="75.60000000000001" rx="6" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.4"/><text x="400" y="337.6" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">SoM 流程 DOM/A11y → 可交互检测 → 边界框 + ID → 截图标注 → 模型</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">适用边界：网页与 Accessibility 接口等结构化界面适用；游戏与 Canvas 需回退纯视觉方法。</text>
</svg>