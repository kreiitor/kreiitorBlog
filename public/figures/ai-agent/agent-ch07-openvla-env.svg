<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">VLA 与物理引擎的闭环</title>
  <desc id="fig-desc">指令与三路 224×224 RGB 观测进入 VLA：SigLIP 视觉编码器、Llama 2 7B 语言模型、14 维动作解码器；动作送入 SAPIEN 双臂物理引擎，观测再返回模型形成闭环</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">VLA 与物理引擎的闭环</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">三路视觉与关节状态进入 VLA，动作回到仿真环境</text><rect x="47.66666666666667" y="104.5" width="210" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">指令</text>
  <text x="152.66666666666669" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">将罐子放入锅中</text><rect x="295.00000000000006" y="104.5" width="210" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="149.125" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">多模态观测</text>
  <text x="400.00000000000006" y="165.375" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">三路 224×224 RGB + 14 维关节状</text><text x="400.00000000000006" y="181.575" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">态</text><rect x="542.3333333333334" y="104.5" width="210" height="112" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="149.125" font-size="13" fill="var(--on-blue)" font-weight="700" text-anchor="middle">VLA 模型</text>
  <text x="647.3333333333334" y="165.375" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">SigLIP → Llama 2 7B → 14 维动</text><text x="647.3333333333334" y="181.575" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">作</text><rect x="47.66666666666667" y="267.5" width="210" height="112" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="320.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">SAPIEN 物理引擎</text>
  <text x="152.66666666666669" y="336.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">双臂各 7 自由度 · 随机化 · 碰撞</text><rect x="295.00000000000006" y="267.5" width="210" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="312.125" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">评估指标</text>
  <text x="400.00000000000006" y="328.375" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">成功率 · 完成时间 · 泛化 ·</text><text x="400.00000000000006" y="344.575" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">Sim-to-Real</text><path d="M257.6666666666667 160.5 L542.3333333333334 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 160.5 L542.3333333333334 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 216.5 L647.3333333333334 242 L152.66666666666669 242 L152.66666666666669 267.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M152.66666666666669 267.5 L152.66666666666669 242 L400.00000000000006 242 L400.00000000000006 216.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 323.5 L295.00000000000006 323.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">动作分块：1 次生成 25 个连续动作；完成时间按 25 步 × 25 动作 = 625 控制步计。环境随机化：位置 60 cm、朝向 ±22.5°。评估含成功率、完成时间、泛化与</text><text x="400" y="429.4" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">Sim-to-Real。</text>
</svg>