<svg xmlns="http://www.w3.org/2000/svg" width="800" height="278" viewBox="0 119 800 278" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">HNSW 的三层图索引</title>
  <desc id="fig-desc">自上而下三层：Layer 2 稀疏、节点最少、长程连接；Layer 1 中等密度；Layer 0 稠密、包含全部节点。搜索从顶层开始逐层向下精炼</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="40" y="147" width="720" height="58" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="54" y="172.1" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">Layer 2 · 稀疏 /</text><text x="54" y="187.625" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">长程连接</text><rect x="254" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="329" y="179" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">节点最少</text><rect x="532" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="607" y="179" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">远距离跳跃</text><rect x="40" y="213" width="720" height="58" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/><text x="54" y="245" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">Layer 1 · 中等密度</text><rect x="393" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="468" y="245" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">中间层</text><rect x="40" y="279" width="720" height="58" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="54" y="304.1" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">Layer 0 · 稠密 /</text><text x="54" y="319.625" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">全节点</text><rect x="254" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="329" y="311" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">包含全部节点</text><rect x="532" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="607" y="311" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">精确定位</text><text x="400" y="371" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">优点：支持增量更新、高召回率；查询复杂度 O(log N)。</text>
</svg>