<svg xmlns="http://www.w3.org/2000/svg" width="800" height="278" viewBox="0 119 800 278" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">HNSW 的三层图索引</title>
  <desc id="fig-desc">自上而下三层：Layer 2 稀疏、节点最少、长程连接；Layer 1 中等密度；Layer 0 稠密、包含全部节点。搜索从顶层开始逐层向下精炼</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="40" y="147" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="172.1" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">Layer 2 · 稀疏 /</text><text x="54" y="187.625" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">长程连接</text><rect x="254" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="329" y="179" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">节点最少</text><rect x="532" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="607" y="179" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">远距离跳跃</text><rect x="40" y="213" width="720" height="58" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="54" y="245" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">Layer 1 · 中等密度</text><rect x="393" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">中间层</text><rect x="40" y="279" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="304.1" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">Layer 0 · 稠密 /</text><text x="54" y="319.625" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">全节点</text><rect x="254" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="329" y="311" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">包含全部节点</text><rect x="532" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="607" y="311" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">精确定位</text><text x="400" y="371" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">优点：支持增量更新、高召回率；查询复杂度 O(log N)。</text>
</svg>