<svg xmlns="http://www.w3.org/2000/svg" width="800" height="369" viewBox="0 76 800 369" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">视觉语言模型的三段结构</title>
  <desc id="fig-desc">输入 224×224 图像先经 CLIP ViT 得到 196 个 768 维视觉 token，再由 Linear(768, 512) 投影层对齐到语言空间，最后 MiniMind 100M 生成描述；训练策略是先冻结语言模型只训投影层，再解冻做 SFT</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="45" y="104.5" width="153.5" height="112" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="121.75" y="149.125" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">输入图像</text>
  <text x="121.75" y="165.375" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">224×224 · 瀑布 / 城市</text><text x="121.75" y="181.575" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">/ 自然</text><rect x="230.5" y="104.5" width="153.5" height="112" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="307.25" y="149.125" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">视觉编码器</text>
  <text x="307.25" y="165.375" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">CLIP ViT · 固定 · 196</text><text x="307.25" y="181.575" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">token × 768</text><rect x="416" y="104.5" width="153.5" height="112" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="492.75" y="149.125" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">投影层</text>
  <text x="492.75" y="165.375" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">Linear(768, 512) · 约</text><text x="492.75" y="181.575" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">400K 参数</text><rect x="601.5" y="104.5" width="153.5" height="112" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="678.25" y="149.125" font-size="13" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">语言模型</text>
  <text x="678.25" y="165.375" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">MiniMind 100M ·</text><text x="678.25" y="181.575" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">hidden_dim = 512</text><rect x="45" y="267.5" width="153.5" height="112" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="121.75" y="320.25" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">输出描述</text>
  <text x="121.75" y="336.5" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">巨大的瀑布旁悬挂着彩虹</text><path d="M198.5 160.5 L230.5 160.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 160.5 L416 160.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M569.5 160.5 L601.5 160.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M678.25 216.5 L678.25 242 L121.75 242 L121.75 267.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">视觉编码器参数固定。投影层参数量约 400K，作用是对齐视觉与语言空间。语言模型 hidden_dim = 512，使用 Muon 优化器加速 3×。</text>
</svg>