<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">从论文到讲解视频</title>
  <desc id="fig-desc">阶段一从 paper.pdf 解析章节与图表，规划 10–20 页结构，生成 Slidev 代码，逐页渲染检查并迭代修复；阶段二逐页截图，生成口语化讲解稿，TTS 合成语音，用 ffmpeg 对齐音画，输出 5–15 分钟视频。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">从论文到讲解视频</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">PPT 生成与视频合成两阶段流水线</text><rect x="45" y="96" width="153.5" height="74.66666666666667" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="121.75" y="130.08333333333334" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">PDF 输入</text>
  <text x="121.75" y="146.33333333333334" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">paper.pdf · 章节结构</text><rect x="230.5" y="96" width="153.5" height="74.66666666666667" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="307.25" y="130.08333333333334" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">内容规划</text>
  <text x="307.25" y="146.33333333333334" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">10–20 页 · 图表分配</text><rect x="416" y="96" width="153.5" height="74.66666666666667" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="492.75" y="130.08333333333334" font-size="13" fill="var(--on-blue)" font-weight="700" text-anchor="middle">Slidev 生成</text>
  <text x="492.75" y="146.33333333333334" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">逐页生成代码</text><rect x="601.5" y="96" width="153.5" height="74.66666666666667" rx="8" fill="var(--yellow)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="678.25" y="130.08333333333334" font-size="13" fill="var(--on-yellow)" font-weight="700" text-anchor="middle">渲染检查</text>
  <text x="678.25" y="146.33333333333334" font-size="12" fill="var(--on-yellow)" font-weight="400" text-anchor="middle">逐页截图 · Vision 审查</text><rect x="45" y="204.66666666666669" width="153.5" height="74.66666666666667" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="121.75" y="238.75000000000003" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">迭代修复</text>
  <text x="121.75" y="255.00000000000003" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">修改代码后重渲染</text><rect x="230.5" y="204.66666666666669" width="153.5" height="74.66666666666667" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="307.25" y="238.75000000000003" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">PPT 完成</text>
  <text x="307.25" y="255.00000000000003" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">质量达标</text><rect x="416" y="204.66666666666669" width="153.5" height="74.66666666666667" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="492.75" y="238.75000000000003" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">逐页截图</text>
  <text x="492.75" y="255.00000000000003" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">slide-01.png …</text><rect x="601.5" y="204.66666666666669" width="153.5" height="74.66666666666667" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="678.25" y="238.75000000000003" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">讲解稿生成</text>
  <text x="678.25" y="255.00000000000003" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">口语化叙述</text><rect x="45" y="313.33333333333337" width="153.5" height="74.66666666666667" rx="8" fill="var(--yellow)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="121.75" y="347.4166666666667" font-size="13" fill="var(--on-yellow)" font-weight="700" text-anchor="middle">TTS 合成</text>
  <text x="121.75" y="363.6666666666667" font-size="12" fill="var(--on-yellow)" font-weight="400" text-anchor="middle">speech-01.mp3 …</text><rect x="230.5" y="313.33333333333337" width="153.5" height="74.66666666666667" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="307.25" y="347.4166666666667" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">音画同步</text>
  <text x="307.25" y="363.6666666666667" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">ffmpeg · 时长对齐</text><rect x="416" y="313.33333333333337" width="153.5" height="74.66666666666667" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="492.75" y="339.2916666666667" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">最终视频</text>
  <text x="492.75" y="355.5416666666667" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">output.mp4 · 5–15 分</text><text x="492.75" y="371.7416666666667" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">钟</text><path d="M198.5 133.33333333333334 L230.5 133.33333333333334" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 133.33333333333334 L416 133.33333333333334" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M569.5 133.33333333333334 L601.5 133.33333333333334" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M678.25 170.66666666666669 L678.25 187.66666666666669 L121.75 187.66666666666669 L121.75 204.66666666666669" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M121.75 204.66666666666669 L121.75 187.66666666666669 L492.75 187.66666666666669 L492.75 170.66666666666669" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M678.25 170.66666666666669 L678.25 187.66666666666669 L307.25 187.66666666666669 L307.25 204.66666666666669" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 242.00000000000003 L416 242.00000000000003" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M569.5 242.00000000000003 L601.5 242.00000000000003" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M678.25 279.33333333333337 L678.25 296.33333333333337 L121.75 296.33333333333337 L121.75 313.33333333333337" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M198.5 350.6666666666667 L230.5 350.6666666666667" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M384 350.6666666666667 L416 350.6666666666667" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">验收：PPT 10–20 页、覆盖主要贡献、至少 3 张原图表；渲染零文字溢出；视频 5–15 分钟、音画同步、叙述连贯。</text>
</svg>