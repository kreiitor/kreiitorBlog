<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">基于范例创建新 Agent</title>
  <desc id="fig-desc">四步流程：读取 agent.py、tools/*.py、system_prompt.md 与 config.yaml；复制 reference/ 到 new_agent/ 并保留循环框架与消息格式；修改提示词、新增退款工具；运行 agent.py 发测试消息验证。产出包含提示词、工具、框架与配置的新 Agent。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="47.66666666666667" y="104.5" width="210" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">用户需求</text>
  <text x="152.66666666666669" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">电商退款客服 Agent</text><rect x="295.00000000000006" y="104.5" width="210" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">阅读参考</text>
  <text x="400.00000000000006" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">agent.py · config</text><rect x="542.3333333333334" y="104.5" width="210" height="112" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="157.25" font-size="13" fill="var(--on-blue)" font-weight="700" text-anchor="middle">复制脚手架</text>
  <text x="647.3333333333334" y="173.5" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">复制到 new_agent/</text><rect x="47.66666666666667" y="267.5" width="210" height="112" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="320.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">定向修改</text>
  <text x="152.66666666666669" y="336.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">提示词 · 退款工具 · 配置</text><rect x="295.00000000000006" y="267.5" width="210" height="112" rx="8" fill="var(--yellow)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="320.25" font-size="13" fill="var(--on-yellow)" font-weight="700" text-anchor="middle">验证测试</text>
  <text x="400.00000000000006" y="336.5" font-size="12" fill="var(--on-yellow)" font-weight="400" text-anchor="middle">python agent.py</text><rect x="542.3333333333334" y="267.5" width="210" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="320.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">新 Agent</text>
  <text x="647.3333333333334" y="336.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">继承框架，替换角色</text><path d="M257.6666666666667 160.5 L295.00000000000006 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 160.5 L542.3333333333334 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 216.5 L647.3333333333334 242 L152.66666666666669 242 L152.66666666666669 267.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 323.5 L295.00000000000006 323.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 323.5 L542.3333333333334 323.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">两条路线对照：从零生成容易缺最佳实践；基于范例修改继承标准消息格式、规范工具设计与现代 API。</text>
</svg>