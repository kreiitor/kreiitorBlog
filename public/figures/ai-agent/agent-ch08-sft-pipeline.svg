<svg xmlns="http://www.w3.org/2000/svg" width="800" height="359" viewBox="0 86 800 359" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">SFT 的三段流程与固化协议</title>
  <desc id="fig-desc">三段流水线：数据准备输入输出对与三类来源；训练优化最大化条件对数似然，数千到数万条、数小时收敛；效果评估中格式、指令、风格通过而分布外泛化不通过；第四层列出四类被固化的协议</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="40" y="114" width="720" height="58" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="54" y="146" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">① 数据准备</text><rect x="194" y="123" width="131" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="259.5" y="146" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">输入-输出对 (x, y)</text><rect x="333" y="123" width="131" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="398.5" y="139.4" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">语音：参考音频 → 风</text><text x="398.5" y="154.25" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">格 token</text><rect x="472" y="123" width="131" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="537.5" y="139.4" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">蒸馏：教师输出 → 学</text><text x="537.5" y="154.25" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">生目标</text><rect x="611" y="123" width="131" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="676.5" y="146" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">多语言：思考模板示范</text><rect x="40" y="180" width="720" height="58" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/><text x="54" y="212" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">② 训练优化</text><rect x="194" y="189" width="131" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="259.5" y="205.4" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">损失 L = −Σ log P(</text><text x="259.5" y="220.25" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">y_i | x_i)</text><rect x="333" y="189" width="131" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="398.5" y="205.4" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">目标：最大化条件对数</text><text x="398.5" y="220.25" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">似然</text><rect x="472" y="189" width="131" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="537.5" y="205.4" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">规模：数千 ~ 数万条</text><text x="537.5" y="220.25" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">样例</text><rect x="611" y="189" width="131" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="676.5" y="212" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">耗时：数小时收敛</text><rect x="40" y="246" width="720" height="58" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/><text x="54" y="278" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">③ 效果评估</text><rect x="254" y="255" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="329" y="278" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">格式遵循 ✓ · 指令理解 ✓</text><rect x="532" y="255" width="150" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="607" y="271.4" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">风格一致 ✓ · 分布外泛化</text><text x="607" y="286.25" font-size="11" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">✗</text><rect x="40" y="312" width="720" height="58" rx="8" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/><text x="54" y="344" font-size="11.5" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">④ 固化的协议</text><rect x="194" y="321" width="131" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="259.5" y="338" font-size="10" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">语音 SFT → 风格控制协</text><text x="259.5" y="351.5" font-size="10" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">议（音色 + 副语言标记）</text><rect x="333" y="321" width="131" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="398.5" y="338.9" font-size="8.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">多语言 SFT → 思考组织模板</text><text x="398.5" y="350.375" font-size="8.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">（分析 → 假设 → 验证 → …</text><rect x="472" y="321" width="131" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="537.5" y="338.9" font-size="8.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">Prompt 蒸馏 → 教师输出映射</text><text x="537.5" y="350.375" font-size="8.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">（长提示 → 无提示直接输出）</text><rect x="611" y="321" width="131" height="40" rx="5" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1"/><text x="676.5" y="338.9" font-size="8.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">工具调用 SFT → 接口格式协</text><text x="676.5" y="350.375" font-size="8.5" fill="var(--ink,#202735)" font-weight="600" text-anchor="middle">议（JSON schema + 错误处…</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">损失 L = −Σ log P(y_i | x_i)，其中 i 为样本下标，x_i 是输入，y_i 是标注回答；它与逐 token 的负对数似然之和是同一个损失。</text>
</svg>