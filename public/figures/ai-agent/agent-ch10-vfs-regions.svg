  <text x="682.3529411764706" y="388.75" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">/skills ·</text><text x="682.3529411764706" y="402.25" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">全局只读</text><rect x="42" y="252.03508771929825" width="76" height="44" rx="8" fill="var(--line-soft)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="80" y="271.53508771929825" font-size="10" fill="var(--ink)" font-weight="700" text-anchor="middle">用户</text>
  <text x="80" y="284.03508771929825" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">上传 / 下载</text><rect x="682" y="252.03508771929825" width="76" height="44" rx="8" fill="var(--line-soft)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="720" y="265.28508771929825" font-size="10" fill="var(--ink)" font-weight="700" text-anchor="middle">外部数据源</text>
  <text x="720" y="277.78508771929825" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">Google</text><text x="720" y="291.28508771929825" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">Drive …</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">共享空间用乐观锁或 worktree 控制并发；外部挂载的权限、延迟与一致性由来源系统决定。</text>
</svg>