  <text x="127.05882352941177" y="376.25" font-size="10" fill="var(--ink)" font-weight="700" text-anchor="middle">专属工作区</text>
  <text x="127.05882352941177" y="388.75" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">/scratch/&lt;</text><text x="127.05882352941177" y="402.25" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">id&gt; · 私…</text><rect x="277.2941176470588" y="363" width="76" height="44" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="315.2941176470588" y="376.25" font-size="10" fill="var(--ink)" font-weight="700" text-anchor="middle">共享空间</text>
  <text x="315.2941176470588" y="388.75" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">/workspace/</text><text x="315.2941176470588" y="402.25" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">shared · …</text><rect x="465.52941176470586" y="363" width="76" height="44" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="503.52941176470586" y="376.25" font-size="10" fill="var(--ink)" font-weight="700" text-anchor="middle">外部挂载</text>
  <text x="503.52941176470586" y="388.75" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">/mnt/* · 多</text><text x="503.52941176470586" y="402.25" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">为只读</text><rect x="644.3529411764706" y="363" width="76" height="44" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
