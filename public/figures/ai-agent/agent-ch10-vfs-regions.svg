  <text x="400" y="183.26754385964912" font-size="10" fill="var(--on-blue)" font-weight="700" text-anchor="middle">统一接口</text>
  <text x="400" y="195.76754385964912" font-size="10" fill="var(--on-blue)" font-weight="400" text-anchor="middle">read_file ·</text><text x="400" y="209.26754385964912" font-size="10" fill="var(--on-blue)" font-weight="400" text-anchor="middle">write_fil…</text><rect x="362" y="252.03508771929825" width="76" height="44" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
