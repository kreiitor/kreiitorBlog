<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">双控环境与分层验证</title>
  <desc id="fig-desc">上层是用户模拟器与待评估 Agent 的多轮对话；中层是设备侧状态与运营商数据库两侧都能改写；下层是四层检查与只采信环境断言的聚合规则</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="40" y="147" width="720" height="58" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="179" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">对话层</text><rect x="254" y="156" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="329" y="173" font-size="10" fill="var(--ink)" font-weight="600" text-anchor="middle">用户模拟器：known_info ·</text><text x="329" y="186.5" font-size="10" fill="var(--ink)" font-weight="600" text-anchor="middle">渐进透露 · 情绪 · 事实锚定</text><rect x="532" y="156" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="607" y="172.4" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">Agent：工单 + 领域政策</text><text x="607" y="187.25" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">；看不到设备真实状态</text><rect x="40" y="213" width="720" height="58" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="54" y="245" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">共享环境（双控）</text><rect x="194" y="222" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="259.5" y="239.9" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">设备侧：飞行模式 ON · 数据</text><text x="259.5" y="251.375" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">漫游 OFF · 省流模式 · 剩…</text><rect x="333" y="222" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="398.5" y="239.9" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">用户工具：</text><text x="398.5" y="251.375" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">toggle_airplane_mode …</text><rect x="472" y="222" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="537.5" y="239.9" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">运营商侧：客户 C1001 · 线</text><text x="537.5" y="251.375" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">路 L1001/L1002/L1003 · …</text><rect x="611" y="222" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="676.5" y="239.9" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">Agent 工具：</text><text x="676.5" y="251.375" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">get_customer_by_phone …</text><rect x="40" y="279" width="720" height="58" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="311" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">验证层</text><rect x="194" y="288" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="259.5" y="305.9" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">env_assertions：移动数据可</text><text x="259.5" y="317.375" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">用；测速 ≥ 200 Mbps …</text><rect x="333" y="288" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="398.5" y="305.9" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">actions：</text><text x="398.5" y="317.375" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">toggle_airplane_mode…</text><rect x="472" y="288" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="537.5" y="305.9" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">communicate_info /</text><text x="537.5" y="317.375" font-size="8.5" fill="var(--ink)" font-weight="600" text-anchor="middle">nl_assertions：本题…</text><rect x="611" y="288" width="131" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="676.5" y="304.4" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">聚合：reward_basis</text><text x="676.5" y="319.25" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">= ENV_ASSERTION</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">本题 reward_basis = [&quot;ENV_ASSERTION&quot;]，其余各层照常记录但不计入奖励。设备侧初始为飞行模式 ON、数据漫游 OFF；测速需达到 200 Mbps 以上且评级 excellent</text><text x="400" y="429.4" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">。</text>
</svg>