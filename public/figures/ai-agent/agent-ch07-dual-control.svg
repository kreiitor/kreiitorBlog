<svg xmlns="http://www.w3.org/2000/svg" width="800" height="365" viewBox="0 36 800 365" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">τ²-bench 的双控结构与四层记录</title>
  <desc id="fig-desc">对话层是用户模拟器与 Agent 的多轮交互；中间是共享环境，用户侧与 Agent 侧各有工具，都能改写同一份状态；底层把终态、动作、信息与语言分四层记录，奖励只取环境断言这一层</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/>

  <text x="36" y="88" font-size="11" font-weight="600" fill="var(--ink,#202735)">对话层</text>
  <rect x="150" y="64" width="180" height="48" fill="var(--surface,#fffefa)" stroke="var(--blue,#2647d7)" stroke-width="1.2"/>
  <text x="240" y="94" text-anchor="middle" font-size="11.5" fill="var(--ink,#202735)">用户模拟器</text>
  <path d="M334 80 L466 80" stroke="var(--blue,#2647d7)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M466 98 L334 98" stroke="var(--blue,#2647d7)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="64" width="180" height="48" fill="var(--surface,#fffefa)" stroke="var(--blue,#2647d7)" stroke-width="1.2"/>
  <text x="560" y="94" text-anchor="middle" font-size="11.5" fill="var(--ink,#202735)">Agent</text>
  <text x="660" y="80" font-size="10.5" fill="var(--muted,#596171)">看不到设备真实状态</text>
  <text x="660" y="98" font-size="10.5" fill="var(--muted,#596171)">只能靠工具查询</text>

  <line x1="36" y1="140" x2="768" y2="140" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/>

  <text x="36" y="176" font-size="11" font-weight="600" fill="var(--ink,#202735)">共享环境</text>
  <path d="M240 112 L240 168" stroke="var(--blue,#2647d7)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560 112 L560 168" stroke="var(--blue,#2647d7)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="172" width="140" height="52" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.2"/>
  <text x="220" y="194" text-anchor="middle" font-size="11" fill="var(--ink,#202735)">设备侧状态</text>
  <text x="220" y="212" text-anchor="middle" font-size="10" fill="var(--muted,#596171)">飞行模式 / 漫游 / 制式</text>
  <rect x="307" y="172" width="140" height="52" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.2"/>
  <text x="377" y="194" text-anchor="middle" font-size="11" fill="var(--ink,#202735)">用户工具</text>
  <text x="377" y="212" text-anchor="middle" font-size="10" fill="var(--muted,#596171)" class="mono">toggle_*</text>
  <rect x="464" y="172" width="140" height="52" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.2"/>
  <text x="534" y="194" text-anchor="middle" font-size="11" fill="var(--ink,#202735)">运营商侧状态</text>
  <text x="534" y="212" text-anchor="middle" font-size="10" fill="var(--muted,#596171)">客户 / 线路 / 套餐</text>
  <rect x="621" y="172" width="140" height="52" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.2"/>
  <text x="691" y="194" text-anchor="middle" font-size="11" fill="var(--ink,#202735)">Agent 工具</text>
  <text x="691" y="212" text-anchor="middle" font-size="10" fill="var(--muted,#596171)" class="mono">get_customer_*</text>
  <text x="150" y="248" font-size="10.5" fill="var(--muted,#596171)">两侧工具改的是同一份状态，Agent 必须重新查询才看得到用户侧的结果</text>

  <line x1="36" y1="266" x2="768" y2="266" stroke="var(--line-soft,#dce1e8)" stroke-width="1"/>

  <text x="36" y="302" font-size="11" font-weight="600" fill="var(--ink,#202735)">验证层</text>
  <path d="M377 252 L377 294" stroke="var(--blue,#2647d7)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="298" width="140" height="52" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.3"/>
  <text x="220" y="320" text-anchor="middle" font-size="11" fill="var(--ink,#202735)">环境断言</text>
  <text x="220" y="338" text-anchor="middle" font-size="10" fill="var(--muted,#596171)">数据可用 / 测速达标</text>
  <rect x="307" y="298" width="140" height="52" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.2"/>
  <text x="377" y="320" text-anchor="middle" font-size="11" fill="var(--ink,#202735)">动作</text>
  <text x="377" y="338" text-anchor="middle" font-size="10" fill="var(--muted,#596171)">调用序列</text>
  <rect x="464" y="298" width="140" height="52" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.2"/>
  <text x="534" y="320" text-anchor="middle" font-size="11" fill="var(--ink,#202735)">信息与语言</text>
  <text x="534" y="338" text-anchor="middle" font-size="10" fill="var(--muted,#596171)">必要信息是否说到</text>
  <rect x="621" y="298" width="140" height="52" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.2"/>
  <text x="691" y="320" text-anchor="middle" font-size="11" fill="var(--ink,#202735)">聚合</text>
  <text x="691" y="338" text-anchor="middle" font-size="10" fill="var(--muted,#596171)" class="mono">reward_basis</text>
  <text x="150" y="374" font-size="10.5" fill="var(--muted,#596171)">四层都记录，本题只把环境断言计入 reward</text>
</svg>
