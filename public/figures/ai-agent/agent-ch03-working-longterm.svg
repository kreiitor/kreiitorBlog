<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 158 800 200" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">工作记忆与长期记忆</title>
  <desc id="fig-desc">工作记忆在当前任务一侧，长期记忆在另一侧；向上箭头表示重要信息选择性转移到长期记忆，向下箭头表示相关长期记忆被激活加载进工作记忆。长期记忆包含情景、语义、程序三类</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="109.5" y="186" width="210" height="112" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="214.5" y="238.75" font-size="13" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">工作记忆</text>
  <text x="214.5" y="255" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">当前任务状态</text><rect x="480.5" y="186" width="210" height="112" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="585.5" y="238.75" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">长期记忆</text>
  <text x="585.5" y="255" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">情景 · 语义 · 程序</text><path d="M319.5 242 L480.5 242" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M480.5 242 L319.5 242" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="332" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">情景记忆带元数据的事件序列；语义记忆是抽象出的一般知识；程序记忆是可复用的行为流程。</text>
</svg>