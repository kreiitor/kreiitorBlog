<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Agent 与 Environment 的观察—行动闭环</title>
  <desc id="fig-desc">Agent 在边界内由 Model、上下文和 Harness 组成；Environment 在 Agent 之外。环境向 Agent 提供观察，Agent 向环境施加行动。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .title{font-size:28px;font-weight:700;fill:var(--ink)}
    .head{font-size:24px;font-weight:700;fill:var(--blue)}
    .sub{font-size:16px;fill:var(--muted)}
    .label{font-size:20px;font-weight:600;fill:var(--ink)}
    .small{font-size:15px;fill:var(--muted)}
    .on-blue{fill:var(--on-blue)}
    .on-yellow{fill:var(--on-yellow)}
    .arrow-blue{stroke:var(--blue);stroke-width:4;fill:none;marker-end:url(#arrow-blue)}
    .arrow-yellow{stroke:var(--yellow);stroke-width:4;fill:none;marker-end:url(#arrow-yellow)}
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--blue)"/></marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--yellow)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>

  <rect x="55" y="70" width="360" height="310" rx="14" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="2"/>
  <text x="235" y="102" text-anchor="middle" class="head">Agent</text>

  <rect x="85" y="145" width="300" height="58" rx="8" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1.5"/>
  <text x="235" y="170" text-anchor="middle" class="label">Harness</text>
  <text x="235" y="192" text-anchor="middle" class="small">循环 · 状态 · 权限 · 验证 · 纠正</text>

  <rect x="85" y="213" width="300" height="58" rx="8" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1.5"/>
  <text x="235" y="238" text-anchor="middle" class="label">上下文</text>
  <text x="235" y="260" text-anchor="middle" class="small">观察 · 历史 · 记忆 · 任务状态</text>

  <rect x="85" y="281" width="300" height="58" rx="8" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1.5"/>
  <text x="235" y="306" text-anchor="middle" class="label">Model</text>
  <text x="235" y="328" text-anchor="middle" class="small">理解 · 推理 · 选择行动</text>

  <text x="235" y="365" text-anchor="middle" class="small">工具与动作接口</text>

  <rect x="500" y="70" width="245" height="310" rx="14" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="622" y="102" text-anchor="middle" class="head">Environment</text>
  <text x="622" y="176" text-anchor="middle" class="small">文件系统 · 数据库</text>
  <text x="622" y="204" text-anchor="middle" class="small">网页 · API · 应用</text>
  <text x="622" y="232" text-anchor="middle" class="small">用户 · 其他 Agent</text>
  <text x="622" y="260" text-anchor="middle" class="small">仿真或物理世界</text>
  <rect x="545" y="300" width="155" height="42" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="2"/>
  <text x="622" y="326" text-anchor="middle" class="small on-yellow">真实状态</text>

  <path d="M500 190 H425" class="arrow-blue"/>
  <text x="462" y="176" text-anchor="middle" class="label" fill="var(--blue)">观察</text>
  <path d="M425 300 H500" class="arrow-yellow"/>
  <text x="462" y="324" text-anchor="middle" class="label" fill="var(--muted)">行动</text>

  <text x="400" y="425" text-anchor="middle" class="small">Agent 只能观察环境并施加行动；环境本身不属于 Agent。</text>
</svg>
