<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 64 800 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">端到端语音模型架构对比</title>
  <desc id="fig-desc">四栏卡片：OpenAI Realtime 用服务端 VAD 与轮次检测；Gemini Live 可配置 VAD 敏感度并保留已发信息；Qwen3-Omni 用 Thinker-Talker MoE，首包延迟 234ms；Step-Audio 2 用潜在音频编码与 RL，副语言理解 83.09%。底部指出多数方案仍依赖轮次检测。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="34" y="92" width="172.5" height="300" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/><text x="120.25" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">OpenAI Realtime</text><text x="120.25" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">gpt-realtime</text><text x="46" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">服务端 VAD + 轮次检测</text><text x="46" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">异步函数调用</text><text x="46" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">打断时停止生成</text><text x="46" y="239.84999999999997" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="58" y="239.84999999999997" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">仍属 VAD 框架</text><rect x="220.5" y="92" width="172.5" height="300" rx="8" fill="var(--blue-soft,#e9eefe)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/><text x="306.75" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">Gemini Live</text><text x="306.75" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">Gemini 2.0</text><text x="232.5" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">VAD 敏感度可配</text><text x="232.5" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">打断保留已发信息</text><text x="232.5" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">优化对话连贯性</text><text x="232.5" y="239.84999999999997" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="244.5" y="239.84999999999997" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">策略与 OpenAI 类似</text><rect x="407" y="92" width="172.5" height="300" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/><text x="493.25" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">Qwen3-Omni</text><text x="493.25" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">Thinker-Talker MoE</text><text x="419" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">理解与生成分工</text><text x="419" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">多码本语音编码</text><text x="419" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">首包延迟 234ms</text><text x="419" y="239.84999999999997" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="431" y="239.84999999999997" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">32/36 开源 SOTA</text><rect x="593.5" y="92" width="172.5" height="300" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/><text x="679.75" y="118" font-size="14" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">Step-Audio 2</text><text x="679.75" y="136" font-size="10.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">潜在音频编码 + RL</text><text x="605.5" y="174" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="174" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">端到端语音 token</text><text x="605.5" y="195.95" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="195.95" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">副语言理解 83.09%</text><text x="605.5" y="217.89999999999998" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="217.89999999999998" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">CoT + RAG + 工具</text><text x="605.5" y="239.84999999999997" font-size="12" fill="var(--ink,#202735)" font-weight="700" text-anchor="start">•</text><text x="617.5" y="239.84999999999997" font-size="11.5" fill="var(--ink,#202735)" font-weight="400" text-anchor="start">超越 44.18% 基线</text><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">Qwen3-Omni 32/36 项达开源 SOTA；Step-Audio 2 标注超越 Qwen2.5-Omni 的 44.18%；全双工 Moshi 用并行双音频流与内心独白文本流，无需 VAD。</text>
</svg>