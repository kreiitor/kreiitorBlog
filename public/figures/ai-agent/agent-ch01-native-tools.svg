<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">模型即 Agent：原生工具调用</title>
  <desc id="fig-desc">用户输入进入带原生工具的大模型，模型在 ReAct 循环中调用 web_search 与 code_interpreter，最后输出技术分析报告</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="52.66666666666667" y="104.5" width="200" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">用户输入</text>
  <text x="152.66666666666669" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">搜索最近一个月的比特币走势</text><rect x="300.00000000000006" y="104.5" width="200" height="112" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="149.125" font-size="13" fill="var(--on-blue)" font-weight="700" text-anchor="middle">LLM</text>
  <text x="400.00000000000006" y="165.375" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">Kimi K3 / GPT-5.6 · RL 训练</text><text x="400.00000000000006" y="181.575" font-size="12" fill="var(--on-blue)" font-weight="400" text-anchor="middle">后的原生 Agent 能力</text><rect x="547.3333333333334" y="104.5" width="200" height="112" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="149.125" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">原生工具</text>
  <text x="647.3333333333334" y="165.375" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">web_search ·</text><text x="647.3333333333334" y="181.575" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">code_interpreter · 更多工具</text><rect x="52.66666666666667" y="267.5" width="200" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="312.125" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">ReAct 循环</text>
  <text x="152.66666666666669" y="328.375" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">思考 → 调用工具 → 观察结果 →</text><text x="152.66666666666669" y="344.575" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">继续</text><rect x="300.00000000000006" y="267.5" width="200" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="320.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">最终输出</text>
  <text x="400.00000000000006" y="336.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">技术分析报告 + 可视化图表</text><path d="M252.66666666666669 160.5 L300.00000000000006 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M500.00000000000006 160.5 L547.3333333333334 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 216.5 L647.3333333333334 242 L152.66666666666669 242 L152.66666666666669 267.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M152.66666666666669 267.5 L152.66666666666669 242 L400.00000000000006 242 L400.00000000000006 216.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M252.66666666666669 323.5 L300.00000000000006 323.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">Responses API 路径把循环放在服务端；客户端驱动的路径仍由客户端安排循环。</text>
</svg>