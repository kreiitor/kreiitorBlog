<svg xmlns="http://www.w3.org/2000/svg" width="800" height="368" viewBox="0 76 800 368" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">模型即 Agent：原生工具调用</title>
  <desc id="fig-desc">用户输入进入带原生工具的大模型，模型在 ReAct 循环中调用 web_search 与 code_interpreter，最后输出技术分析报告</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="52.66666666666667" y="104.5" width="200" height="112" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="157.25" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">用户输入</text>
  <text x="152.66666666666669" y="173.5" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">搜索最近一个月的比特币走势</text><rect x="300.00000000000006" y="104.5" width="200" height="112" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="149.125" font-size="13" fill="var(--on-blue,#fffcf5)" font-weight="700" text-anchor="middle">LLM</text>
  <text x="400.00000000000006" y="165.375" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">Kimi K3 / GPT-5.6 · RL 训练</text><text x="400.00000000000006" y="181.575" font-size="12" fill="var(--on-blue,#fffcf5)" font-weight="400" text-anchor="middle">后的原生 Agent 能力</text><rect x="547.3333333333334" y="104.5" width="200" height="112" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="149.125" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">原生工具</text>
  <text x="647.3333333333334" y="165.375" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">web_search ·</text><text x="647.3333333333334" y="181.575" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">code_interpreter · 更多工具</text><rect x="52.66666666666667" y="267.5" width="200" height="112" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="312.125" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">ReAct 循环</text>
  <text x="152.66666666666669" y="328.375" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">思考 → 调用工具 → 观察结果 →</text><text x="152.66666666666669" y="344.575" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">继续</text><rect x="300.00000000000006" y="267.5" width="200" height="112" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="320.25" font-size="13" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="middle">最终输出</text>
  <text x="400.00000000000006" y="336.5" font-size="12" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">技术分析报告 + 可视化图表</text><path d="M252.66666666666669 160.5 L300.00000000000006 160.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M500.00000000000006 160.5 L547.3333333333334 160.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 216.5 L647.3333333333334 242 L152.66666666666669 242 L152.66666666666669 267.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M152.66666666666669 267.5 L152.66666666666669 242 L400.00000000000006 242 L400.00000000000006 216.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M252.66666666666669 323.5 L300.00000000000006 323.5" fill="none" stroke="var(--blue,#466b3f)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">Responses API 路径把循环放在服务端；客户端驱动的路径仍由客户端安排循环。</text>
</svg>