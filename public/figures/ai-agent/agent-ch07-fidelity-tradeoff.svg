ill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="632.7142857142857" y="234" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">116 个真实应用任务；UI Automator</text><rect x="38" y="252" width="142.21428571428572" height="42" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="109.10714285714286" y="276" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">Isaac Gym</text><rect x="180.21428571428572" y="252" width="168.07142857142856" height="42" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="264.25" y="276" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">GPU 并行</text><rect x="348.2857142857143" y="252" width="155.1428571428571" height="42" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="425.85714285714283" y="276" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">千级并行实例</text><rect x="503.4285714285714" y="252" width="258.57142857142856" height="42" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="632.7142857142857" y="276" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">精度略有妥协</text><rect x="38" y="294" width="142.21428571428572" height="42" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="109.10714285714286" y="318" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">RoboTwin2</text><rect x="180.21428571428572" y="294" width="168.07142857142856" height="42" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="264.25" y="318" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">物理引擎</text><rect x="348.2857142857143" y="294" width="155.1428571428571" height="42" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="425.85714285714283" y="318" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">单实例 CPU</text><rect x="503.4285714285714" y="294" width="258.57142857142856" height="42" fill="var(--paper)" stroke="var(--line-soft)" stroke-width="1"/><text x="632.7142857142857" y="318" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">高精度碰撞</text><rect x="38" y="336" width="142.21428571428572" height="42" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="109.10714285714286" y="360" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">真实世界</text><rect x="180.21428571428572" y="336" width="168.07142857142856" height="42" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="264.25" y="360" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">完美保真度</text><rect x="348.2857142857143" y="336" width="155.1428571428571" height="42" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="425.85714285714283" y="360" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">不可重置</text><rect x="503.4285714285714" y="336" width="258.57142857142856" height="42" fill="var(--surface)" stroke="var(--line-soft)" stroke-width="1"/><text x="632.7142857142857" y="360" font-size="10.5" fill="var(--ink)" font-weight="400" text-anchor="middle">无法支撑百万次训练</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">AWorld 的 525 秒是单轮耗时；分布式与无状态设计让实例可以独立并行。RoboTwin2 依赖物理引擎与高精度碰撞，通常按单实例 CPU 运行。</text>
