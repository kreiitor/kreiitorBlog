<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Agent 与环境的交互循环</title>
  <desc id="fig-desc">左侧 Agent 用 ε-贪婪策略选择动作，右侧迷宫环境有 5 个房间与钥匙、门、守卫；动作向东移动送入环境，环境返回新状态与奖励；示例轨迹为入口大厅、向东、奖励 0、储藏室、拿钥匙、奖励 +5，直到攻击守卫奖励 +50</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><path d="M400 130 Q525 190 650 250" fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><path d="M650 250 Q525 310 400 370" fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 370 Q275 310 150 250.00000000000003" fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><path d="M150 250.00000000000003 Q275 190 400 130" fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="102" width="132" height="56" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="400" y="120.375" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">① 观察 S(t)</text>
  <text x="400" y="134.125" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">入口大厅 → 储藏室 → 守</text><text x="400" y="147.625" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">卫室</text><rect x="584" y="222" width="132" height="56" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="650" y="240.375" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">② 选择 A(t)</text>
  <text x="650" y="254.125" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">向东 → 拿钥匙 → 向北 →</text><text x="650" y="267.625" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">合成银剑 → 攻击</text><rect x="334" y="342" width="132" height="56" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="400" y="360.375" font-size="11" fill="var(--ink)" font-weight="700" text-anchor="middle">③ 环境转移</text>
  <text x="400" y="374.125" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">5 个房间 · 钥匙 / 门 /</text><text x="400" y="387.625" font-size="10" fill="var(--ink)" font-weight="400" text-anchor="middle">守卫 · 确定性转移</text><rect x="84" y="222.00000000000003" width="132" height="56" rx="8" fill="var(--blue)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="150" y="240.37500000000003" font-size="11" fill="var(--on-blue)" font-weight="700" text-anchor="middle">④ 返回 R(t+1)</text>
  <text x="150" y="254.12500000000003" font-size="10" fill="var(--on-blue)" font-weight="400" text-anchor="middle">0 → +5 → 0 → +10 →</text><text x="150" y="267.625" font-size="10" fill="var(--on-blue)" font-weight="400" text-anchor="middle">+50</text><text x="400" y="235.6" font-size="12" fill="var(--muted)" font-weight="600" text-anchor="middle">折扣累积奖励 G = R(1) +</text><text x="400" y="251.8" font-size="12" fill="var(--muted)" font-weight="600" text-anchor="middle">γR(2) + γ²R(3) + … γ =</text><text x="400" y="268" font-size="12" fill="var(--muted)" font-weight="600" text-anchor="middle">0.99</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">轨迹通式：S(0), A(0), R(1), S(1), A(1), R(2), …。示例奖励依次为 0、+5、0、+10、+50。折扣累积奖励 G = R(1) + γR(2) + γ²R(3) + …，γ = 0.99。</text>
</svg>