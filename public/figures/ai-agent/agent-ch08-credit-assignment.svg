<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">多轮导航中的信用分配</title>
  <desc id="fig-desc">五步轨迹：观察前方后左转得 +1，识别路牌后确认方向得 +1，错过路口继续直行得 −1，发现错误后调头返回得 0，到达目标得 +10；归因结论是步骤 4 的纠错比步骤 1–2 的正确更关键</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="47.66666666666667" y="104.5" width="210" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">步骤 1</text>
  <text x="152.66666666666669" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">观察前方 → 选择左转 · R = +1</text><rect x="295.00000000000006" y="104.5" width="210" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">步骤 2</text>
  <text x="400.00000000000006" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">识别路牌 → 确认方向 · R = +1</text><rect x="542.3333333333334" y="104.5" width="210" height="112" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">步骤 3</text>
  <text x="647.3333333333334" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">错过路口 → 继续直行 · R = −1</text><rect x="47.66666666666667" y="267.5" width="210" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="320.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">步骤 4</text>
  <text x="152.66666666666669" y="336.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">发现错误 → 调头返回 · R = 0</text><rect x="295.00000000000006" y="267.5" width="210" height="112" rx="8" fill="var(--yellow)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="320.25" font-size="13" fill="var(--on-yellow)" font-weight="700" text-anchor="middle">步骤 5</text>
  <text x="400.00000000000006" y="336.5" font-size="12" fill="var(--on-yellow)" font-weight="400" text-anchor="middle">到达目标 → 任务完成 · R = +10</text><rect x="542.3333333333334" y="267.5" width="210" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="312.125" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">信用归因</text>
  <text x="647.3333333333334" y="328.375" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">步骤 4 的纠错比步骤 1–2 的正确</text><text x="647.3333333333334" y="344.575" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">更关键</text><path d="M257.6666666666667 160.5 L295.00000000000006 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 160.5 L542.3333333333334 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 216.5 L647.3333333333334 242 L152.66666666666669 242 L152.66666666666669 267.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 323.5 L295.00000000000006 323.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M505.00000000000006 323.5 L542.3333333333334 323.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">过程奖励（V-IRL 导航）：每步即时反馈，对 +1 / 错 −1；优点是降低信用分配难度，缺点是可能限制探索。结果奖励（SimpleVLA-RL）：仅终点反馈，成功 1 / 失败 0</text><text x="400" y="429.4" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">；优点是最大探索自由度，缺点是训练更困难。</text>
</svg>