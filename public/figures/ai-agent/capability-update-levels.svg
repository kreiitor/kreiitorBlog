<svg xmlns="http://www.w3.org/2000/svg" width="800" height="404" viewBox="0 46 800 404" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Agent 能力更新的三个层次</title>
  <desc id="fig-desc">Agent 的行为改变可以发生在上下文、外部制品与模型参数三个位置，分别对应任务内、跨任务与训练周期三种时间尺度。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#202735)}
    .sub{font-size:14px;fill:var(--muted,#596171)}
    .head{font-size:18px;font-weight:700;fill:var(--ink,#202735)}
    .lab{font-size:14px;font-weight:600;fill:var(--ink,#202735)}
    .small{font-size:13px;fill:var(--muted,#596171)}
    .tiny{font-size:12px;fill:var(--muted,#596171)}
    .onblue{fill:var(--on-blue,#fffefa)}
    .onyellow{fill:var(--on-yellow,#202735)}
  </style>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/>

  <text x="150" y="86" text-anchor="middle" class="tiny">秒 — 分钟</text>
  <text x="400" y="86" text-anchor="middle" class="tiny">天 — 周</text>
  <text x="650" y="86" text-anchor="middle" class="tiny">训练周期</text>

  <rect x="40" y="98" width="220" height="270" rx="10" fill="var(--blue-soft,#f2f5fc)" stroke="var(--blue,#2647d7)" stroke-width="2"/>
  <rect x="40" y="98" width="220" height="46" rx="10" fill="var(--blue,#2647d7)"/>
  <rect x="40" y="130" width="220" height="14" fill="var(--blue,#2647d7)"/>
  <text x="150" y="119" text-anchor="middle" class="head onblue">任务内适应</text>
  <text x="150" y="138" text-anchor="middle" class="tiny onblue">Context adaptation</text>

  <text x="60" y="175" class="small">主要载体</text>
  <text x="60" y="197" class="lab">当前上下文</text>
  <text x="60" y="217" class="small">示例 · 状态 · 记忆</text>
  <text x="60" y="249" class="small">更新特性</text>
  <text x="60" y="271" class="lab">即时、低成本</text>
  <text x="60" y="291" class="small">任务结束后不自动保留</text>
  <line x1="60" y1="311" x2="240" y2="311" stroke="var(--blue,#2647d7)" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="60" y="333" class="small">判据</text>
  <text x="60" y="354" class="lab">任务内能解决</text>

  <rect x="290" y="98" width="220" height="270" rx="10" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="2"/>
  <rect x="290" y="98" width="220" height="46" rx="10" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="2"/>
  <rect x="290" y="130" width="220" height="14" fill="var(--surface,#fffefa)"/>
  <text x="400" y="119" text-anchor="middle" class="head">外部制品更新</text>
  <text x="400" y="138" text-anchor="middle" class="tiny">External artifacts</text>

  <text x="310" y="175" class="small">主要载体</text>
  <text x="310" y="197" class="lab">知识 · 指令 · 程序</text>
  <text x="310" y="217" class="small">文档 · Prompt/Skill · Harness</text>
  <text x="310" y="249" class="small">更新特性</text>
  <text x="310" y="271" class="lab">跨任务持久、可审计</text>
  <text x="310" y="291" class="small">依赖检索或工具调用</text>
  <line x1="310" y1="311" x2="490" y2="311" stroke="var(--line,#a2aec1)" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="310" y="333" class="small">判据</text>
  <text x="310" y="354" class="lab">可语言化、需审计</text>

  <rect x="540" y="98" width="220" height="270" rx="10" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="2"/>
  <rect x="540" y="98" width="220" height="46" rx="10" fill="var(--yellow,#ffe04b)"/>
  <rect x="540" y="130" width="220" height="14" fill="var(--yellow,#ffe04b)"/>
  <text x="650" y="119" text-anchor="middle" class="head onyellow">模型参数更新</text>
  <text x="650" y="138" text-anchor="middle" class="tiny onyellow">Parameter update</text>

  <text x="560" y="175" class="small">主要载体</text>
  <text x="560" y="197" class="lab">模型权重</text>
  <text x="560" y="217" class="small">SFT · 偏好训练 · RL</text>
  <text x="560" y="249" class="small">更新特性</text>
  <text x="560" y="271" class="lab">高维能力、广泛泛化</text>
  <text x="560" y="291" class="small">训练与回归成本较高</text>
  <line x1="560" y1="311" x2="740" y2="311" stroke="var(--yellow,#ffe04b)" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="560" y="333" class="small">判据</text>
  <text x="560" y="354" class="lab">难以显式表达</text>

  <rect x="40" y="392" width="720" height="36" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1.5"/>
  <text x="400" y="415" text-anchor="middle" class="lab">三者协同：临场适应 · 可控积累 · 能力内化</text>
</svg>
