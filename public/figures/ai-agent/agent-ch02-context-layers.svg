<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">每次调用的上下文构成</title>
  <desc id="fig-desc">上层静态前缀包含 System Prompt 与 Tool Definitions；下层轨迹由 user、assistant、tool 结果、user 依次向右延伸</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">每次调用的上下文构成</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="var(--muted)">静态前缀保持稳定，轨迹持续向右增长</text><rect x="40" y="180" width="720" height="58" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="205.1" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">静态前缀（每一轮都</text><text x="54" y="220.625" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">不变）</text><rect x="254" y="189" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="329" y="212" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">System Prompt</text><rect x="532" y="189" width="150" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="607" y="212" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">Tool Definitions</text><rect x="40" y="246" width="720" height="58" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/><text x="54" y="271.1" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">对话历史 / 轨迹（随</text><text x="54" y="286.625" font-size="11.5" fill="var(--ink)" font-weight="700" text-anchor="start">交互增长 →）</text><rect x="194" y="255" width="103.2" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="245.6" y="278" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">user</text><rect x="305.2" y="255" width="103.2" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="356.8" y="278" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">assistant</text><rect x="416.4" y="255" width="103.2" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="468" y="278" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">tool 结果</text><rect x="527.6" y="255" width="103.2" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="579.2" y="278" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">user</text><rect x="638.8" y="255" width="103.2" height="40" rx="5" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/><text x="690.4" y="278" font-size="11" fill="var(--ink)" font-weight="600" text-anchor="middle">……</text><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">前缀不能动（利于 KV Cache），轨迹可压缩。</text>
</svg>