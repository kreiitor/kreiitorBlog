<svg xmlns="http://www.w3.org/2000/svg" width="800" height="212" viewBox="0 152 800 212" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">每次调用的上下文构成</title>
  <desc id="fig-desc">上层静态前缀包含 System Prompt 与 Tool Definitions；下层轨迹由 user、assistant、tool 结果、user 依次向右延伸</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="40" y="180" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="205.1" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">静态前缀（每一轮都</text><text x="54" y="220.625" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">不变）</text><rect x="254" y="189" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="329" y="212" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">System Prompt</text><rect x="532" y="189" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="607" y="212" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">Tool Definitions</text><rect x="40" y="246" width="720" height="58" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="54" y="271.1" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">对话历史 / 轨迹（随</text><text x="54" y="286.625" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">交互增长 →）</text><rect x="194" y="255" width="103.2" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="245.6" y="278" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">user</text><rect x="305.2" y="255" width="103.2" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="356.8" y="278" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">assistant</text><rect x="416.4" y="255" width="103.2" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468" y="278" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">tool 结果</text><rect x="527.6" y="255" width="103.2" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="579.2" y="278" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">user</text><rect x="638.8" y="255" width="103.2" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="690.4" y="278" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">……</text><text x="400" y="338" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">前缀不能动（利于 KV Cache），轨迹可压缩。</text>
</svg>