<svg xmlns="http://www.w3.org/2000/svg" width="800" height="412" viewBox="0 38 800 412" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">工具调用强化学习的闭环</title>
  <desc id="fig-desc">策略模型生成思考与工具调用，工具执行并解析结果，奖励计算后更新策略；环境返回的 token 在计算梯度时被屏蔽。</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#202735)}
    .sub{font-size:14px;fill:var(--muted,#596171)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#202735)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#202735)}
    .s{font-size:12px;fill:var(--muted,#596171)}
    .tiny{font-size:11px;fill:var(--muted,#596171)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/>

  <rect x="42" y="184" width="142" height="68" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.5"/>
  <text x="113" y="210" text-anchor="middle" class="b" fill="var(--on-blue,#fffefa)">策略模型 πθ</text>
  <text x="113" y="234" text-anchor="middle" class="tiny" fill="var(--on-blue,#fffefa)">当前上下文</text>

  <rect x="242" y="80" width="160" height="68" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.8"/>
  <text x="322" y="106" text-anchor="middle" class="b">生成动作</text>
  <text x="322" y="130" text-anchor="middle" class="tiny">思考 · 搜索 · 代码</text>

  <rect x="456" y="80" width="150" height="68" rx="8" fill="var(--surface,#fffefa)" stroke="var(--blue,#2647d7)" stroke-width="1.8"/>
  <text x="531" y="106" text-anchor="middle" class="b">工具执行</text>
  <text x="531" y="130" text-anchor="middle" class="tiny">API · 代码沙箱</text>

  <rect x="650" y="184" width="120" height="68" rx="8" fill="var(--surface,#fffefa)" stroke="var(--blue,#2647d7)" stroke-width="1.8"/>
  <text x="710" y="210" text-anchor="middle" class="b">结果解析</text>
  <text x="710" y="234" text-anchor="middle" class="tiny">成功 · 报错</text>

  <rect x="456" y="306" width="150" height="68" rx="8" fill="var(--yellow-soft,#fff5b7)" stroke="var(--yellow,#ffe04b)" stroke-width="1.8"/>
  <text x="531" y="332" text-anchor="middle" class="b">奖励计算</text>
  <text x="531" y="356" text-anchor="middle" class="tiny">正确 +1 · 错误 −1</text>

  <rect x="242" y="306" width="160" height="68" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.5"/>
  <text x="322" y="332" text-anchor="middle" class="b" fill="var(--on-blue,#fffefa)">策略梯度更新</text>
  <text x="322" y="356" text-anchor="middle" class="tiny" fill="var(--on-blue,#fffefa)">只更新策略侧 token</text>

  <path d="M184 198 L212 198 L212 114 L242 114" stroke="var(--blue,#2647d7)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M402 114 L456 114" stroke="var(--blue,#2647d7)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M606 114 L682 114 L682 184" stroke="var(--blue,#2647d7)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M710 252 L710 340 L606 340" stroke="var(--blue,#2647d7)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M456 340 L402 340" stroke="var(--blue,#2647d7)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M322 306 L322 280 L113 280 L113 252" stroke="var(--blue,#2647d7)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>

  <rect x="430" y="66" width="360" height="206" rx="8" fill="none" stroke="var(--line,#a2aec1)" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="610" y="288" text-anchor="middle" class="tiny">环境侧：返回的 token 屏蔽梯度</text>

  <text x="42" y="300" class="s">奖励来自验证结果，</text>
  <text x="42" y="320" class="s">不是来自模型自评。</text>

  <rect x="30" y="398" width="740" height="34" rx="7" fill="var(--surface,#fffefa)" stroke="var(--line-soft,#dce1e8)" stroke-width="1.5"/>
  <text x="400" y="420" text-anchor="middle" class="tiny">若对沙箱输出也算梯度，模型会被训练去预测具体结果，而不是学会何时调用、如何调用工具。</text>
</svg>
