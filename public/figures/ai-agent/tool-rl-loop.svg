<svg xmlns="http://www.w3.org/2000/svg" width="800" height="412" viewBox="0 38 800 412" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">工具调用强化学习的闭环</title>
  <desc id="fig-desc">策略模型生成思考与工具调用，工具执行并解析结果，奖励计算后更新策略；环境返回的 token 在计算梯度时被屏蔽。</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .title{font-size:26px;font-weight:700;fill:var(--ink,#3b3024)}
    .sub{font-size:14px;fill:var(--muted,#5f4f3c)}
    .h{font-size:16px;font-weight:700;fill:var(--ink,#3b3024)}
    .b{font-size:13px;font-weight:600;fill:var(--ink,#3b3024)}
    .s{font-size:12px;fill:var(--muted,#5f4f3c)}
    .tiny{font-size:11px;fill:var(--muted,#5f4f3c)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <rect x="42" y="184" width="142" height="68" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="113" y="210" text-anchor="middle" class="b" fill="var(--on-blue,#fffcf5)">策略模型 πθ</text>
  <text x="113" y="234" text-anchor="middle" class="tiny" fill="var(--on-blue,#fffcf5)">当前上下文</text>

  <rect x="242" y="80" width="160" height="68" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.8"/>
  <text x="322" y="106" text-anchor="middle" class="b">生成动作</text>
  <text x="322" y="130" text-anchor="middle" class="tiny">思考 · 搜索 · 代码</text>

  <rect x="456" y="80" width="150" height="68" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.8"/>
  <text x="531" y="106" text-anchor="middle" class="b">工具执行</text>
  <text x="531" y="130" text-anchor="middle" class="tiny">API · 代码沙箱</text>

  <rect x="650" y="184" width="120" height="68" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--blue,#466b3f)" stroke-width="1.8"/>
  <text x="710" y="210" text-anchor="middle" class="b">结果解析</text>
  <text x="710" y="234" text-anchor="middle" class="tiny">成功 · 报错</text>

  <rect x="456" y="306" width="150" height="68" rx="8" fill="var(--yellow-soft,#fbf3d9)" stroke="var(--yellow,#f5d75f)" stroke-width="1.8"/>
  <text x="531" y="332" text-anchor="middle" class="b">奖励计算</text>
  <text x="531" y="356" text-anchor="middle" class="tiny">正确 +1 · 错误 −1</text>

  <rect x="242" y="306" width="160" height="68" rx="8" fill="var(--blue,#466b3f)" stroke="var(--blue,#466b3f)" stroke-width="1.5"/>
  <text x="322" y="332" text-anchor="middle" class="b" fill="var(--on-blue,#fffcf5)">策略梯度更新</text>
  <text x="322" y="356" text-anchor="middle" class="tiny" fill="var(--on-blue,#fffcf5)">只更新策略侧 token</text>

  <path d="M184 198 L212 198 L212 114 L242 114" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M402 114 L456 114" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M606 114 L682 114 L682 184" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M710 252 L710 340 L606 340" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M456 340 L402 340" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M322 306 L322 280 L113 280 L113 252" stroke="var(--blue,#466b3f)" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>

  <rect x="430" y="66" width="360" height="206" rx="8" fill="none" stroke="var(--line,#c9b49c)" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="610" y="288" text-anchor="middle" class="tiny">环境侧：返回的 token 屏蔽梯度</text>

  <text x="42" y="300" class="s">奖励来自验证结果，</text>
  <text x="42" y="320" class="s">不是来自模型自评。</text>

  <rect x="30" y="398" width="740" height="34" rx="7" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1.5"/>
  <text x="400" y="420" text-anchor="middle" class="tiny">若对沙箱输出也算梯度，模型会被训练去预测具体结果，而不是学会何时调用、如何调用工具。</text>
</svg>
