-weight="400" text-anchor="middle">小模型应用差异</text><rect x="325.30158730158735" y="126" width="137.9047619047619" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="394.2539682539683" y="150" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">关注点分离</text><rect x="463.2063492063493" y="126" width="160.88888888888889" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="543.6507936507937" y="150" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">微小偏差致错位</text><rect x="624.0952380952382" y="126" width="137.9047619047619" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="693.0476190476192" y="150" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">Cursor 曾用</text><rect x="38" y="168" width="126.41269841269843" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="101.20634920634922" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">Old → New</text><rect x="164.41269841269843" y="168" width="160.88888888888889" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="244.8571428571429" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">字符串精确替换</text><rect x="325.30158730158735" y="168" width="137.9047619047619" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="394.2539682539683" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">可预测、无歧义</text><rect x="463.2063492063493" y="168" width="160.88888888888889" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="543.6507936507937" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">大段删除需全输出</text><rect x="624.0952380952382" y="168" width="137.9047619047619" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="693.0476190476192" y="192" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">Claude Code</text><rect x="38" y="210" width="126.41269841269843" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="101.20634920634922" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">行号定位</text><rect x="164.41269841269843" y="210" width="160.88888888888889" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="244.8571428571429" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">指定行号范围</text><rect x="325.30158730158735" y="210" width="137.9047619047619" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="394.2539682539683" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">大段操作高效</text><rect x="463.2063492063493" y="210" width="160.88888888888889" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="543.6507936507937" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">长文件行号易错</text><rect x="624.0952380952382" y="210" width="137.9047619047619" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="693.0476190476192" y="234" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">IDE 深集成</text><rect x="38" y="252" width="126.41269841269843" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="101.20634920634922" y="276" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">类 Vim 命令</text><rect x="164.41269841269843" y="252" width="160.88888888888889" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="244.8571428571429" y="276" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">命令式编辑语义</text><rect x="325.30158730158735" y="252" width="137.9047619047619" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="394.2539682539683" y="276" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">移动 / 重组高效</text><rect x="463.2063492063493" y="252" width="160.88888888888889" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="543.6507936507937" y="276" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">弱模型出错多</text><rect x="624.0952380952382" y="252" width="137.9047619047619" height="42" fill="var(--surface,#fffcf5)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="693.0476190476192" y="276" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">实验性</text><rect x="38" y="294" width="126.41269841269843" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="101.20634920634922" y="318" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">首尾匹配</text><rect x="164.41269841269843" y="294" width="160.88888888888889" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="244.8571428571429" y="318" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">只给首尾边界</text><rect x="325.30158730158735" y="294" width="137.9047619047619" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="394.2539682539683" y="318" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">大段删除免全输出</text><rect x="463.2063492063493" y="294" width="160.88888888888889" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="543.6507936507937" y="318" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">需边界组合唯一</text><rect x="624.0952380952382" y="294" width="137.9047619047619" height="42" fill="var(--paper,#faf6f0)" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/><text x="693.0476190476192" y="318" font-size="10.5" fill="var(--ink,#3b3024)" font-weight="400" text-anchor="middle">部分定制方案</text><text x="400" y="370" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">实际采用：Old→New 用于 Claude Code；行号定位用于 IDE 深度集成；Diff + Apply 曾用于 Cursor；首尾匹配用于部分定制方案；Vim 命令属于实验性方案。</text>
