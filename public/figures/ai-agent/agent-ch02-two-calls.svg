<svg xmlns="http://www.w3.org/2000/svg" width="800" height="383" viewBox="0 61 800 383" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">两次模型调用的交互序列</title>
  <desc id="fig-desc">第一次调用携带 system、user 与两个工具定义，模型返回两个可并行的 tool_calls；工具结果作为 tool 消息追加后发起第二次调用，模型返回最终回复</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#f2f5fc;--yellow:#ffe04b;--yellow-soft:#fdf9e8;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#2647d7)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#f9faf7)"/><rect x="295" y="96" width="210" height="20.333333333333332" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="400" y="102.91666666666667" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">用户提问</text>
  <text x="400" y="119.16666666666667" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">时间与天气 · 温哥华</text><rect x="295" y="150.33333333333331" width="210" height="20.333333333333332" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="400" y="157.24999999999997" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">第 1 次调用</text>
  <text x="400" y="173.49999999999997" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">tools：时间 · 天气</text><rect x="295" y="204.66666666666666" width="210" height="20.333333333333332" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="400" y="211.58333333333331" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">返回两个调用</text>
  <text x="400" y="227.83333333333331" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">tool_calls 可并行</text><rect x="295" y="259" width="210" height="20.333333333333332" rx="8" fill="var(--yellow-soft,#fdf9e8)" stroke="var(--yellow,#ffe04b)" stroke-width="1.6"/>
  <text x="400" y="265.9166666666667" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">执行工具</text>
  <text x="400" y="282.1666666666667" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">时间 · 天气</text><rect x="295" y="313.3333333333333" width="210" height="20.333333333333332" rx="8" fill="var(--blue,#2647d7)" stroke="var(--blue,#2647d7)" stroke-width="1.6"/>
  <text x="400" y="320.25" font-size="13" fill="var(--on-blue,#fffefa)" font-weight="700" text-anchor="middle">第 2 次调用</text>
  <text x="400" y="336.5" font-size="12" fill="var(--on-blue,#fffefa)" font-weight="400" text-anchor="middle">追加 tool 结果</text><rect x="295" y="367.66666666666663" width="210" height="20.333333333333332" rx="8" fill="var(--surface,#fffefa)" stroke="var(--line,#a2aec1)" stroke-width="1.6"/>
  <text x="400" y="374.5833333333333" font-size="13" fill="var(--ink,#202735)" font-weight="700" text-anchor="middle">最终回复</text>
  <text x="400" y="390.8333333333333" font-size="12" fill="var(--ink,#202735)" font-weight="400" text-anchor="middle">无工具调用</text><path d="M400 116.33333333333333 L400 133.33333333333331 L400 133.33333333333331 L400 150.33333333333331" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M400 170.66666666666666 L400 187.66666666666666 L400 187.66666666666666 L400 204.66666666666666" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M400 225 L400 242 L400 242 L400 259" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M400 279.3333333333333 L400 296.3333333333333 L400 296.3333333333333 L400 313.3333333333333" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M400 333.66666666666663 L400 350.66666666666663 L400 350.66666666666663 L400 367.66666666666663" fill="none" stroke="var(--blue,#2647d7)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted,#596171)" font-weight="400" text-anchor="middle">无状态 API 下，每一轮都要把完整消息历史重新发送给模型。</text>
</svg>