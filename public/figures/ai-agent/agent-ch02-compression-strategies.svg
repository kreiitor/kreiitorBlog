<svg xmlns="http://www.w3.org/2000/svg" width="800" height="352" viewBox="0 37 800 352" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">六种压缩策略的处理方式与代价</title>
  <desc id="fig-desc">每次搜索约 52K 字符进入六条路线：无压缩累计 166K 并在第 5 轮失败，个体摘要 277K，组合摘要 93K，上下文感知 40K 且迭代最少，感知加引用 223K 换取可溯源，自适应窗口 175K 换取前期完整</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/>

  <text x="196" y="76" font-size="10.5" fill="var(--muted,#5f4f3c)">处理方式</text>
  <text x="520" y="76" font-size="10.5" fill="var(--muted,#5f4f3c)">累计 token</text>
  <text x="630" y="76" font-size="10.5" fill="var(--muted,#5f4f3c)">压缩率</text>
  <text x="690" y="76" font-size="10.5" fill="var(--muted,#5f4f3c)">迭代</text>

  <text x="40" y="106" font-size="11" fill="var(--muted,#5f4f3c)">每次搜索</text>
  <text x="40" y="124" font-size="11" fill="var(--muted,#5f4f3c)">约 52K 字符</text>

  <line x1="196" y1="90" x2="760" y2="90" stroke="var(--line,#c9b49c)" stroke-width="1"/>

  <text x="196" y="118" font-size="11.5" fill="var(--ink,#3b3024)">① 无压缩：完整结果全部保留</text>
  <text x="520" y="118" font-size="11.5" fill="var(--ink,#3b3024)" class="mono">166K</text>
  <text x="630" y="118" font-size="11.5" fill="var(--ink,#3b3024)" class="mono">102.1%</text>
  <text x="690" y="118" font-size="11.5" fill="var(--ink,#3b3024)" class="mono">5 轮 · 失败</text>
  <line x1="196" y1="130" x2="760" y2="130" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>

  <text x="196" y="158" font-size="11.5" fill="var(--ink,#3b3024)">② 个体摘要：每个结果独立压缩</text>
  <text x="520" y="158" font-size="11.5" fill="var(--ink,#3b3024)" class="mono">277K</text>
  <text x="630" y="158" font-size="11.5" fill="var(--ink,#3b3024)" class="mono">10.9%</text>
  <text x="690" y="158" font-size="11.5" fill="var(--ink,#3b3024)" class="mono">12 轮</text>
  <line x1="196" y1="170" x2="760" y2="170" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>

  <text x="196" y="198" font-size="11.5" fill="var(--ink,#3b3024)">③ 组合摘要：拼接后统一压缩，超长截断</text>
  <text x="520" y="198" font-size="11.5" fill="var(--ink,#3b3024)" class="mono">93K</text>
  <text x="630" y="198" font-size="11.5" fill="var(--ink,#3b3024)" class="mono">4.3%</text>
  <text x="690" y="198" font-size="11.5" fill="var(--ink,#3b3024)" class="mono">10 轮</text>
  <line x1="196" y1="210" x2="760" y2="210" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>

  <rect x="188" y="216" width="580" height="40" fill="var(--blue-soft,#e8f0e2)"/>
  <text x="196" y="241" font-size="11.5" font-weight="600" fill="var(--ink,#3b3024)">④ 上下文感知：带查询与已有信息做针对性压缩</text>
  <text x="520" y="241" font-size="11.5" font-weight="600" fill="var(--ink,#3b3024)" class="mono">40K</text>
  <text x="630" y="241" font-size="11.5" font-weight="600" fill="var(--ink,#3b3024)" class="mono">3.0%</text>
  <text x="690" y="241" font-size="11.5" font-weight="600" fill="var(--ink,#3b3024)" class="mono">7 轮</text>
  <line x1="196" y1="256" x2="760" y2="256" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>

  <text x="196" y="284" font-size="11.5" fill="var(--ink,#3b3024)">⑤ 感知＋引用：压缩内容保留来源 URL</text>
  <text x="520" y="284" font-size="11.5" fill="var(--ink,#3b3024)" class="mono">223K</text>
  <text x="630" y="284" font-size="11.5" fill="var(--ink,#3b3024)" class="mono">4.1%</text>
  <text x="690" y="284" font-size="11.5" fill="var(--ink,#3b3024)" class="mono">10 轮</text>
  <line x1="196" y1="296" x2="760" y2="296" stroke="var(--line-soft,#e4d6c5)" stroke-width="1"/>

  <text x="196" y="324" font-size="11.5" fill="var(--ink,#3b3024)">⑥ 自适应窗口：低于 80% 不压，越线批量压</text>
  <text x="520" y="324" font-size="11.5" fill="var(--ink,#3b3024)" class="mono">175K</text>
  <text x="630" y="324" font-size="11.5" fill="var(--ink,#3b3024)" class="mono">102.4%</text>
  <text x="690" y="324" font-size="11.5" fill="var(--ink,#3b3024)" class="mono">7 轮</text>
  <line x1="196" y1="336" x2="760" y2="336" stroke="var(--line,#c9b49c)" stroke-width="1"/>

  <text x="196" y="362" font-size="10.5" fill="var(--muted,#5f4f3c)">压缩率按压缩后体积占原始内容的比例计，超过 100% 说明没压，反而多背了对话与工具调用</text>
</svg>
