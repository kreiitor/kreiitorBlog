<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">BM25 评分的三个机制</title>
  <desc id="fig-desc">顶部是 BM25 完整公式；公式拆成词频饱和、逆文档频率、长度归一化三个并列方框；底部汇总为最终得分等于 IDF 乘以经长度归一化的饱和 TF</desc>
  <style>
    :root{--paper:#f9faf7;--surface:#fffefa;--blue:#2647d7;--blue-soft:#e9eefe;--yellow:#ffe04b;--yellow-soft:#fff5b7;--ink:#202735;--muted:#596171;--line:#a2aec1;--line-soft:#dce1e8;--on-blue:#fffefa;--on-yellow:#202735}
    @media (prefers-color-scheme: dark){:root{--paper:#161d2c;--surface:#222e43;--blue:#8ba3ff;--blue-soft:#2b406b;--yellow:#f0cd42;--yellow-soft:#3b3c23;--ink:#eff3f9;--muted:#cbd3e2;--line:#758ba8;--line-soft:#3b4b65;--on-blue:#161d2c;--on-yellow:#eff3f9}}
    text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper)"/><rect x="47.66666666666667" y="104.5" width="210" height="112" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">BM25 公式</text>
  <text x="152.66666666666669" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">Score(Q,D) = Σ IDF × TF</text><rect x="295.00000000000006" y="104.5" width="210" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">词频饱和</text>
  <text x="400.00000000000006" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">k1 控制饱和速度</text><rect x="542.3333333333334" y="104.5" width="210" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="647.3333333333334" y="157.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">逆文档频率</text>
  <text x="647.3333333333334" y="173.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">「的」≈0 · 「量刑」≈5.2</text><rect x="47.66666666666667" y="267.5" width="210" height="112" rx="8" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"/>
  <text x="152.66666666666669" y="320.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">长度归一化</text>
  <text x="152.66666666666669" y="336.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">b 控制归一化强度</text><rect x="295.00000000000006" y="267.5" width="210" height="112" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.6"/>
  <text x="400.00000000000006" y="320.25" font-size="13" fill="var(--ink)" font-weight="700" text-anchor="middle">最终得分</text>
  <text x="400.00000000000006" y="336.5" font-size="12" fill="var(--ink)" font-weight="400" text-anchor="middle">IDF × 饱和 TF</text><path d="M257.6666666666667 160.5 L295.00000000000006 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 160.5 L542.3333333333334 160.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M152.66666666666669 216.5 L152.66666666666669 242 L152.66666666666669 242 L152.66666666666669 267.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M400.00000000000006 216.5 L400.00000000000006 242 L400.00000000000006 242 L400.00000000000006 267.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M647.3333333333334 216.5 L647.3333333333334 242 L400.00000000000006 242 L400.00000000000006 267.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M257.6666666666667 323.5 L295.00000000000006 323.5" fill="none" stroke="var(--blue)" stroke-width="2.1" marker-end="url(#arrow)"/><text x="400" y="418" font-size="9.5" fill="var(--muted)" font-weight="400" text-anchor="middle">词频饱和由 k1 控制；长度归一化由 b 控制，b=0 不看长度，b=1 完全归一化。</text>
</svg>