<svg xmlns="http://www.w3.org/2000/svg" width="800" height="278" viewBox="0 119 800 278" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">智能体化 RAG 的系统架构</title>
  <desc id="fig-desc">最上层是 Agent 的 ReAct 循环，包含思考、行动、观察，循环直到信息充分；第二层是工具层，包含知识库检索、网页搜索、代码解释器；第三层是可切换的知识库后端，包括混合检索、结构化索引与上下文感知检索</desc>
  <style>
    :root{--paper:#faf6f0;--surface:#fffcf5;--blue:#466b3f;--blue-soft:#e8f0e2;--yellow:#f5d75f;--yellow-soft:#fbf3d9;--ink:#3b3024;--muted:#5f4f3c;--line:#c9b49c;--line-soft:#e4d6c5;--on-blue:#fffcf5;--on-yellow:#3b3024}
    @media (prefers-color-scheme: dark){:root{--paper:#211c16;--surface:#2c251d;--blue:#a9c89a;--blue-soft:#34412c;--yellow:#e7c96b;--yellow-soft:#3b3623;--ink:#f4ebdc;--muted:#d8c8b2;--line:#7b6a55;--line-soft:#4b3f32;--on-blue:#211c16;--on-yellow:#f4ebdc}}
    text{font-family:'Source Serif 4 Variable','Journal Serif SC',Georgia,serif}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--blue,#466b3f)"/></marker>
  </defs>
  <rect width="800" height="450" fill="var(--paper,#faf6f0)"/><rect x="40" y="147" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="172.1" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">Agent（ReAct 循环</text><text x="54" y="187.625" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">）</text><rect x="207.66666666666669" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="282.6666666666667" y="172.4" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">① 思考 → ② 行动 → ③ 观</text><text x="282.6666666666667" y="187.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">察</text><rect x="393.00000000000006" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468.00000000000006" y="179" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">循环直到信息充分</text><rect x="578.3333333333334" y="156" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="653.3333333333334" y="172.4" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">用户查询进入 · 最终回答</text><text x="653.3333333333334" y="187.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">输出</text><rect x="40" y="213" width="720" height="58" rx="8" fill="var(--blue-soft,#e8f0e2)" stroke="var(--blue,#466b3f)" stroke-width="1.6"/><text x="54" y="245" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">工具层</text><rect x="207.66666666666669" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="282.6666666666667" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">knowledge_base_search</text><rect x="393.00000000000006" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468.00000000000006" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">web_search</text><rect x="578.3333333333334" y="222" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="653.3333333333334" y="245" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">code_interpreter</text><rect x="40" y="279" width="720" height="58" rx="8" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1.6"/><text x="54" y="304.1" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">知识库后端（可切换</text><text x="54" y="319.625" font-size="11.5" fill="var(--ink,#3b3024)" font-weight="700" text-anchor="start">）</text><rect x="207.66666666666669" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="282.6666666666667" y="304.4" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">retrieval-pipeline（混</text><text x="282.6666666666667" y="319.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">合检索）</text><rect x="393.00000000000006" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="468.00000000000006" y="304.4" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">structured-index（</text><text x="468.00000000000006" y="319.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">RAPTOR / GraphRAG）</text><rect x="578.3333333333334" y="288" width="150" height="40" rx="5" fill="var(--surface,#fffcf5)" stroke="var(--line,#c9b49c)" stroke-width="1"/><text x="653.3333333333334" y="304.4" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">contextual-retrieval（</text><text x="653.3333333333334" y="319.25" font-size="11" fill="var(--ink,#3b3024)" font-weight="600" text-anchor="middle">上下文感知）</text><text x="400" y="371" font-size="9.5" fill="var(--muted,#5f4f3c)" font-weight="400" text-anchor="middle">知识库后端包括 retrieval-pipeline（混合检索）、structured-index（RAPTOR / GraphRAG）、contextual-retrieval（上下文感知）。</text>
</svg>