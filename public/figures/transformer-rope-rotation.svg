<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="'DM Sans Variable','PingFang SC','Microsoft YaHei',sans-serif">
  <title>RoPE 二维旋转平面与多频波长分布</title>
  <desc>左侧展示位置 m 与 n 的向量在同一二维平面分别旋转 m*theta 与 n*theta，使夹角只依赖于相对距离 n-m；右侧展示随子空间序号增长，频率几何递减、波长拉长。</desc>
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#18181b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#2f5268" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="278" rx="12" fill="#faf9f6" stroke="#e4e2db" stroke-width="1"/>

  <!-- Left panel: 2D phase rotation -->
  <text x="28" y="34" font-size="12.5" font-weight="600" fill="#18181b">二维子空间的几何旋转</text>

  <!-- Coordinate circle centered at (168, 174), r=76 -> y spans 98..250 -->
  <circle cx="168" cy="174" r="76" fill="#ffffff" stroke="#e4e2db" stroke-width="1.1"/>
  <path d="M 78 174 L 260 174 M 168 84 L 168 256" fill="none" stroke="#d4d1c8" stroke-width="1"/>
  <text x="266" y="177" font-size="9.5" fill="#71717a">x₂ᵢ</text>
  <text x="136" y="88" font-size="9.5" fill="#71717a">x₂ᵢ₊₁</text>

  <!-- Base q vector -->
  <path d="M 168 174 L 240 154" fill="none" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-dark)"/>
  <text x="246" y="157" font-size="9.5" fill="#57575e">q (未旋转)</text>

  <!-- Relative angle sector highlighted in #2f5268 -->
  <path d="M 168 174 L 222 120 A 76 76 0 0 0 184 99 Z" fill="#2f5268" fill-opacity="0.14"/>
  <!-- Rotation arc from q_m to k_n -->
  <path d="M 206 136 A 54 54 0 0 0 179 121" fill="none" stroke="#2f5268" stroke-width="1.8"/>

  <!-- q_m vector -->
  <path d="M 168 174 L 222 120" fill="none" stroke="#2f5268" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <text x="232" y="128" font-size="10.5" font-weight="600" fill="#2f5268">R(mθ)q</text>

  <!-- k_n vector -->
  <path d="M 168 174 L 184 99" fill="none" stroke="#18181b" stroke-width="1.8" marker-end="url(#arr-dark)"/>
  <text x="184" y="88" font-size="10.5" font-weight="600" fill="#18181b">R(nθ)k</text>

  <!-- Clean leader routed around the right of R(nθ)k / above R(mθ)q without crossing either shaft -->
  <path d="M 196 123 C 228 84, 246 68, 278 68" fill="none" stroke="#2f5268" stroke-width="1.1" stroke-dasharray="3 2"/>
  <text x="284" y="68" font-size="10.5" font-weight="600" fill="#2f5268">内积只取决于 (n−m)θ</text>
  <text x="284" y="84" font-size="9.5" fill="#57575e">绝对位置相消，模长不变</text>

  <!-- Divider -->
  <line x1="454" y1="26" x2="454" y2="246" stroke="#e4e2db" stroke-width="1"/>

  <!-- Right panel: Multi-frequency spectrum -->
  <text x="480" y="34" font-size="12.5" font-weight="600" fill="#18181b">多组频率从快到慢分工</text>

  <!-- High freq wave (i = 0): exact span 480..760 (7 periods of 40px) -->
  <text x="480" y="72" font-size="10.5" fill="#2f5268" font-weight="600">i=0 高频（近距离变化敏感）</text>
  <line x1="480" y1="96" x2="760" y2="96" stroke="#e4e2db" stroke-width="1"/>
  <path d="M 480 96 Q 490 78 500 96 T 520 96 T 540 96 T 560 96 T 580 96 T 600 96 T 620 96 T 640 96 T 660 96 T 680 96 T 700 96 T 720 96 T 740 96 T 760 96" fill="none" stroke="#2f5268" stroke-width="1.6"/>

  <!-- Mid freq wave (i = d/4): exact span 480..760 -->
  <text x="480" y="142" font-size="10.5" fill="#18181b">i=d/4 中频（段落尺度关系）</text>
  <line x1="480" y1="166" x2="760" y2="166" stroke="#e4e2db" stroke-width="1"/>
  <path d="M 480 166 Q 515 144 550 166 T 620 166 T 690 166 T 760 166" fill="none" stroke="#57575e" stroke-width="1.4"/>

  <!-- Low freq wave (i = d/2 - 1): exact span 480..760 -->
  <text x="480" y="212" font-size="10.5" fill="#18181b">i=d/2-1 低频（长距离依赖）</text>
  <line x1="480" y1="236" x2="760" y2="236" stroke="#e4e2db" stroke-width="1"/>
  <path d="M 480 236 Q 620 206 760 236" fill="none" stroke="#71717a" stroke-width="1.4"/>
</svg>
