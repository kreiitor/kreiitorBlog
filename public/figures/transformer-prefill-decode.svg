<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="'DM Sans Variable','PingFang SC','Microsoft YaHei',sans-serif">
  <title>Prefill 与 Decode 两阶段计算形态对比</title>
  <desc>左侧 Prefill 对全部 Prompt Token 并行执行矩阵乘并写入初始 KV Cache；右侧 Decode 每步只用单个 Query 向量读取整块递增的 KV Cache。</desc>
  <defs>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#57575e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="258" rx="12" fill="#faf9f6" stroke="#e4e2db" stroke-width="1"/>

  <!-- Left Half: Prefill (Compute-bound) -->
  <text x="28" y="34" font-size="12.5" font-weight="600" fill="#18181b">Prefill · 并行矩阵乘法（Compute Bound）</text>
  <rect x="34" y="64" width="66" height="86" rx="4" fill="#ffffff" stroke="#18181b" stroke-width="1.2"/>
  <path d="M34 86H100M34 108H100M34 130H100" stroke="#e4e2db" stroke-width="1"/>
  <text x="67" y="170" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono Variable',monospace" fill="#18181b">Q (N×d)</text>

  <text x="116" y="112" text-anchor="middle" font-size="12.5" fill="#57575e">×</text>

  <rect x="132" y="74" width="90" height="66" rx="4" fill="#eaf0f4" stroke="#2f5268" stroke-width="1.3"/>
  <path d="M154 74V140M176 74V140M198 74V140" stroke="#b4d2e3" stroke-width="1"/>
  <text x="177" y="170" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono Variable',monospace" fill="#2f5268">Kᵀ (d×N)</text>

  <path d="M 228 107 L 250 107" fill="none" stroke="#57575e" stroke-width="1.4" marker-end="url(#arr-p)"/>

  <rect x="256" y="64" width="86" height="86" rx="4" fill="#ffffff" stroke="#d4d1c8" stroke-width="1.2"/>
  <polygon points="258,66 258,148 340,148" fill="#2f5268" fill-opacity="0.18"/>
  <path d="M258 86H278M258 108H300M258 130H322" stroke="#2f5268" stroke-opacity="0.25" stroke-width="1"/>
  <text x="299" y="170" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono Variable',monospace" fill="#18181b">N×N 因果阵</text>

  <text x="28" y="206" font-size="10.5" fill="#57575e">一次并行算完 Prompt，计算核心高饱和，决定 TTFT</text>

  <!-- Divider -->
  <line x1="398" y1="24" x2="398" y2="232" stroke="#e4e2db" stroke-width="1"/>

  <!-- Right Half: Decode (Memory-bound) -->
  <text x="424" y="34" font-size="12.5" font-weight="600" fill="#2f5268">Decode · 逐词搬运全缓存（Memory Bound）</text>

  <rect x="426" y="98" width="66" height="18" rx="3" fill="#ffffff" stroke="#18181b" stroke-width="1.3"/>
  <text x="459" y="170" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono Variable',monospace" fill="#18181b">qₜ (1×d)</text>

  <text x="508" y="111" text-anchor="middle" font-size="12.5" fill="#57575e">×</text>

  <rect x="524" y="68" width="90" height="72" rx="4" fill="#eaf0f4" stroke="#2f5268" stroke-width="1.4"/>
  <rect x="614" y="68" width="16" height="72" rx="2" fill="#2f5268" fill-opacity="0.28" stroke="#2f5268" stroke-width="1.4"/>
  <text x="577" y="170" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono Variable',monospace" fill="#2f5268">KV Cache (N+t)</text>

  <path d="M 636 107 L 658 107" fill="none" stroke="#57575e" stroke-width="1.4" marker-end="url(#arr-p)"/>

  <rect x="664" y="98" width="106" height="18" rx="3" fill="#ffffff" stroke="#d4d1c8" stroke-width="1.2"/>
  <rect x="754" y="98" width="16" height="18" rx="2" fill="#2f5268" fill-opacity="0.35"/>
  <text x="717" y="170" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono Variable',monospace" fill="#18181b">单词输出 +1</text>

  <text x="424" y="206" font-size="10.5" fill="#57575e">每步仅算 1 个新向量，却要重读全部 KV，带宽受限，决定 TPOT</text>
</svg>
