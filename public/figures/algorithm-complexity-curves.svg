<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" font-family="'DM Sans Variable','PingFang SC','Microsoft YaHei',sans-serif">
  <title>常见算法时间复杂度增长阶与 1 秒数据规模上限</title>
  <desc>在统一横纵尺度下对比七种常见增长阶随输入规模 n 的增长斜率，并标出单核每秒约一亿次运算阈值下各类复杂度可承受的 n 上限。</desc>
  <rect x="1" y="1" width="798" height="288" rx="12" fill="#faf9f6" stroke="#e4e2db" stroke-width="1"/>

  <text x="28" y="34" font-size="12.5" font-weight="600" fill="#18181b">渐近增长曲线与 1 秒运算阈值（C++ 单组数据量级）</text>

  <!-- Plot canvas -->
  <rect x="74" y="54" width="530" height="180" rx="4" fill="#ffffff" stroke="#e4e2db" stroke-width="1"/>
  <!-- Axes -->
  <path d="M 74 54 L 74 234 L 604 234" fill="none" stroke="#18181b" stroke-width="1.2"/>
  <text x="24" y="66" font-size="9.5" fill="#71717a">运算次数</text>
  <text x="24" y="80" font-size="9.5" fill="#71717a">（对数感）</text>
  <text x="546" y="252" font-size="9.5" fill="#71717a">输入规模 n 增大 →</text>

  <!-- 1-second hardware budget threshold line at y=106 -->
  <line x1="74" y1="106" x2="604" y2="106" stroke="#2f5268" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="616" y="102" font-size="10.5" font-weight="600" fill="#2f5268">~10⁸ 步/秒 阈值</text>
  <text x="616" y="117" font-size="9.5" fill="#57575e">线上评测 1 秒上限</text>

  <!-- O(1) -->
  <path d="M 80 222 L 598 222" fill="none" stroke="#a1a1aa" stroke-width="1.3"/>
  <text x="616" y="225" font-size="10.5" fill="#57575e">O(1) · 任意 n</text>

  <!-- O(log n) -->
  <path d="M 80 222 Q 210 198 598 192" fill="none" stroke="#71717a" stroke-width="1.4"/>
  <text x="616" y="196" font-size="10.5" fill="#57575e">O(log n) · n ≤ 10¹⁸</text>

  <!-- O(sqrt(n)) -->
  <path d="M 80 222 C 180 202, 340 170, 598 150" fill="none" stroke="#57575e" stroke-width="1.4"/>
  <text x="616" y="154" font-size="10.5" fill="#57575e">O(√n) · n ≈ 10¹²</text>

  <!-- O(n) crossing y=106 near x=508 -->
  <path d="M 80 222 C 215 194, 385 148, 560 72" fill="none" stroke="#18181b" stroke-width="1.5"/>
  <circle cx="496" cy="106" r="3" fill="#18181b"/>
  <text x="566" y="76" font-size="10.5" fill="#18181b">O(n) · 10⁷</text>

  <!-- O(n log n): accented engineering divide line, crossing y=106 near x=364 -->
  <path d="M 80 222 C 192 188, 304 140, 398 66" fill="none" stroke="#2f5268" stroke-width="2.2"/>
  <circle cx="352" cy="106" r="4" fill="#2f5268"/>
  <text x="394" y="50" font-size="10.5" font-weight="600" fill="#2f5268">O(n log n) · n ≤ 10⁶</text>

  <!-- O(n^2) crossing y=106 near x=230 -->
  <path d="M 80 222 C 164 186, 212 136, 256 66" fill="none" stroke="#18181b" stroke-width="1.4"/>
  <circle cx="229" cy="106" r="3" fill="#18181b"/>
  <text x="248" y="50" font-size="10.5" fill="#18181b">O(n²) · n ≤ 5000</text>

  <!-- O(2^n) vertical wall crossing y=106 near x=138 -->
  <path d="M 80 222 C 118 202, 134 146, 144 66" fill="none" stroke="#57575e" stroke-width="1.4"/>
  <circle cx="137" cy="106" r="3" fill="#57575e"/>
  <text x="116" y="50" font-size="10.5" fill="#18181b">O(2ⁿ) · n ≤ 25</text>

  <!-- Scale annotations on x-axis -->
  <line x1="137" y1="230" x2="137" y2="238" stroke="#d4d1c8" stroke-width="1"/>
  <text x="137" y="252" font-size="9.5" fill="#71717a" text-anchor="middle">25</text>
  <line x1="229" y1="230" x2="229" y2="238" stroke="#d4d1c8" stroke-width="1"/>
  <text x="229" y="252" font-size="9.5" fill="#71717a" text-anchor="middle">5×10³</text>
  <line x1="352" y1="230" x2="352" y2="238" stroke="#2f5268" stroke-width="1.2"/>
  <text x="352" y="252" font-size="9.5" fill="#2f5268" font-weight="600" text-anchor="middle">10⁶</text>
  <line x1="496" y1="230" x2="496" y2="238" stroke="#d4d1c8" stroke-width="1"/>
  <text x="496" y="252" font-size="9.5" fill="#71717a" text-anchor="middle">10⁷</text>
</svg>
